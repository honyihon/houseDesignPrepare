[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "house-design-prepare"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4==4.14.3",
  "reportlab==4.4.10",
  # 1.6 pulls rlPyCairo/pycairo, which has no cross-platform wheel for every
  # supported interpreter. 1.5.1 keeps SVG conversion pure Python in CI.
  "svglib==1.5.1",
]

[project.optional-dependencies]
drawings = [
  "PyMuPDF>=1.24,<2",
  "ezdxf>=1.3,<2",
  "ifcopenshell>=0.8,<1",
]
dev = [
  "pytest>=8.0,<9.0",
  "ruff==0.12.3",
]

[project.scripts]
house-design = "house_design.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [".worktrees", "structured"]

[tool.ruff.lint]
# Start with correctness rules. Formatting/import modernization can be enabled
# incrementally without forcing a repository-wide rewrite in this phase.
select = ["F"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["house_design*"]
