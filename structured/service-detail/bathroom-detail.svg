<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="950 10850 5200 5800" role="img" data-case="b32-rear" data-mode="daily-clear"><title>B32設備／座位研究，未採用；原拉門、照護、救援及搬轎未核</title><desc>80mm假設內縮；150cm轉位共用零門檻淋浴地面。日常停凳非坐席，祭祀時不走家務通道。</desc><rect x="2500" y="11370" width="1820" height="1600" fill="#fef3c7" stroke="#64748b" stroke-width="12" /><rect x="0" y="11370" width="1140" height="3900" fill="#dcfce7" stroke="#64748b" stroke-width="12" /><rect x="1140" y="11370" width="1360" height="1600" fill="#cffafe" stroke="#64748b" stroke-width="12" /><rect x="1140" y="12970" width="3180" height="1960" fill="#cffafe" stroke="#64748b" stroke-width="12" /><rect x="4320" y="11370" width="1680" height="2960" fill="#e2e8f0" stroke="#64748b" stroke-width="12" /><rect x="0" y="15270" width="2500" height="2360" fill="#f0fdf4" stroke="#64748b" stroke-width="12" /><rect x="4320" y="14330" width="1680" height="3300" fill="#e0e7ff" stroke="#64748b" stroke-width="12" /><rect x="2500" y="14930" width="1820" height="2700" fill="#e0e7ff" stroke="#64748b" stroke-width="12" /><rect x="1140" y="14930" width="1360" height="340" fill="#e0e7ff" stroke="#64748b" stroke-width="12" /><text x="2580" y="11700" font-size="150" font-family="sans-serif" fill="#0f172a">乾式神桌背牆不動</text><rect x="1255" y="13615" width="1200" height="1200" fill="#bae6fd" stroke="#64748b" stroke-width="12" /><path d="M 1655 13615 v 1200 M 1255 14015 h 1200" stroke="#7dd3fc" stroke-width="10" /><path d="M 2055 13615 v 1200 M 1255 14415 h 1200" stroke="#7dd3fc" stroke-width="10" /><text x="1270" y="13845" font-size="130" font-family="sans-serif" fill="#0f172a">120淋浴</text><rect x="3755" y="14115" width="450" height="700" fill="#ffffff" stroke="#64748b" stroke-width="12" /><ellipse cx="3980.0" cy="14465.0" rx="150" ry="220" fill="none" stroke="#64748b" stroke-width="12" /><text x="3770" y="14345" font-size="130" font-family="sans-serif" fill="#0f172a">馬桶</text><rect x="1255" y="11485" width="600" height="450" fill="#ffffff" stroke="#64748b" stroke-width="12" /><text x="1270" y="11715" font-size="130" font-family="sans-serif" fill="#0f172a">60洗手台</text><rect x="3755" y="13315" width="450" height="800" fill="none" stroke="#0891b2" stroke-width="12" stroke-dasharray="50 30" /><rect x="2855" y="13615" width="900" height="1200" fill="none" stroke="#0891b2" stroke-width="12" stroke-dasharray="50 30" /><rect x="1255" y="11935" width="900" height="800" fill="none" stroke="#0891b2" stroke-width="12" stroke-dasharray="50 30" /><circle cx="2455" cy="13950" r="750" fill="none" stroke="#0284c7" stroke-width="20" stroke-dasharray="50 30" /><text x="1835" y="14000" font-size="140" font-family="sans-serif" fill="#0f172a">150cm分時轉位＊</text><rect x="4290" y="13085.0" width="60" height="1130" fill="#ef4444" stroke="#64748b" stroke-width="12" /><text x="4450" y="13800" font-size="145" font-family="sans-serif" fill="#b91c1c">門型待解</text><text x="1150" y="11100" font-size="160" font-family="sans-serif" fill="#0f172a">設備細排｜未採用｜80mm是假設，不是完成面</text><text x="1200" y="15250" font-size="155" font-family="sans-serif" fill="#0f172a">＊轉位借零門檻淋浴地面，不可改固定玻璃間</text><text x="1200" y="15600" font-size="155" font-family="sans-serif" fill="#0f172a">門淨寬／拉門原目標保留；救援與產品未解</text><text x="1200" y="15950" font-size="150" font-family="sans-serif" fill="#0f172a">115mm假設下雙扇外開僅餘905mm，不予採用</text><text x="1200" y="16300" font-size="145" font-family="sans-serif" fill="#0f172a">便器側移、扶手、膝下、排氣與防水仍需專業確認</text></svg>