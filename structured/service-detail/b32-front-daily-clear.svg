<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1600" viewBox="-400 -1100 7200 19600" role="img" data-case="b32-front" data-mode="daily-clear"><title>B32設備／座位研究，未採用；原拉門、照護、救援及搬轎未核</title><desc>80mm假設內縮；150cm轉位共用零門檻淋浴地面。日常停凳非坐席，祭祀時不走家務通道。</desc><text x="0" y="-650" font-size="210" font-family="sans-serif" fill="#0f172a">B32 front｜daily-clear｜未採用</text><text x="0" y="-300" font-size="155" font-family="sans-serif" fill="#0f172a">設備不縮｜80mm假設｜不等於法規／風水／救援通過</text><rect x="0" y="0" width="6000" height="3900" fill="#f1f5f9" stroke="#64748b" stroke-width="12" /><text x="180" y="1700" font-size="190" font-family="sans-serif" fill="#0f172a">前3.9m騎樓／通行候選帶，不停車</text><rect x="0" y="3900" width="2400" height="5200" fill="#cbd5e1" stroke="#64748b" stroke-width="12" /><rect x="2400" y="3900" width="3600" height="5200" fill="#fef3c7" stroke="#64748b" stroke-width="12" /><rect x="0" y="9100" width="6000" height="2270" fill="#fef3c7" stroke="#64748b" stroke-width="12" /><text x="150" y="5500" font-size="175" font-family="sans-serif" fill="#0f172a">原樓梯不動</text><path d="M 150 6000 H 2200" stroke="#64748b" stroke-width="12" /><path d="M 150 6270 H 2200" stroke="#64748b" stroke-width="12" /><path d="M 150 6540 H 2200" stroke="#64748b" stroke-width="12" /><path d="M 150 6810 H 2200" stroke="#64748b" stroke-width="12" /><path d="M 150 7080 H 2200" stroke="#64748b" stroke-width="12" /><path d="M 150 7350 H 2200" stroke="#64748b" stroke-width="12" /><path d="M 150 7620 H 2200" stroke="#64748b" stroke-width="12" /><path d="M 150 7890 H 2200" stroke="#64748b" stroke-width="12" /><path d="M 150 8160 H 2200" stroke="#64748b" stroke-width="12" /><path d="M 150 8430 H 2200" stroke="#64748b" stroke-width="12" /><text x="2600" y="5100" font-size="175" font-family="sans-serif" fill="#0f172a">朝街中軸門／前廳</text><rect x="2500" y="3850" width="1800" height="100" fill="#16a34a" stroke="#64748b" stroke-width="12" /><path d="M 3400 4000 V 10690" stroke="#b45309" stroke-width="14" stroke-dasharray="60