<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 10600 6500 8100" width="900" height="1122" role="img"><title>B32家務機電分區比較，未採用，非完整HTML／3D圖</title><text x="0" y="10850" font-size="200" font-family="sans-serif">B32 分區研究｜未採用，不是施工／全功能圖</text><rect x="2500" y="11370" width="1820" height="1600" fill="#fef3c7" stroke="#334155" stroke-width="12" /><text x="2570" y="11600" font-size="145" font-family="sans-serif">乾式法器收納</text><rect x="0" y="11370" width="1140" height="3900" fill="#dcfce7" stroke="#334155" stroke-width="12" /><text x="70" y="11600" font-size="145" font-family="sans-serif">家務通道＊</text><rect x="1140" y="11370" width="1360" height="1600" fill="#cffafe" stroke="#334155" stroke-width="12" /><rect x="1140" y="12970" width="3180" height="1960" fill="#cffafe" stroke="#334155" stroke-width="12" /><text x="1210" y="13200" font-size="145" font-family="sans-serif">淋浴衛浴重排區＊</text><rect x="4320" y="11370" width="1680" height="2960" fill="#e2e8f0" stroke="#334155" stroke-width="12" /><text x="4390" y="11600" font-size="145" font-family="sans-serif">原搬轎側緣</text><rect x="0" y="15270" width="2500" height="2360" fill="#f0fdf4" stroke="#334155" stroke-width="12" /><text x="70" y="15500" font-size="145" font-family="sans-serif">後工作陽台候選＊</text><rect x="4320" y="14330" width="1680" height="3300" fill="#e0e7ff" stroke="#334155" stroke-width="12" /><rect x="2500" y="14930" width="1820" height="2700" fill="#e0e7ff" stroke="#334155" stroke-width="12" /><rect x="1140" y="14930" width="1360" height="340" fill="#e0e7ff" stroke="#334155" stroke-width="12" /><text x="4390" y="14560" font-size="145" font-family="sans-serif">武轎儲藏重排區＊</text><rect x="4560" y="15700" width="1200.0" height="1700.0" fill="#a5b4fc" stroke="#334155" stroke-width="12" /><text x="4600" y="16000" font-size="155" font-family="sans-serif">武轎本體</text><rect x="80" y="15900" width="650" height="650" fill="#94a3b8" stroke="#334155" stroke-width="12" /><text x="100" y="16200" font-size="130" font-family="sans-serif">洗衣機</text><rect x="80" y="16700" width="600" height="600" fill="#94a3b8" stroke="#334155" stroke-width="12" /><text x="100" y="17000" font-size="130" font-family="sans-serif">洗槽</text><rect x="730" y="15900" width="800" height="650" fill="none" stroke="#334155" stroke-width="12" stroke-dasharray="50 35" /><rect x="680" y="16700" width="800" height="600" fill="none" stroke="#334155" stroke-width="12" stroke-dasharray="50 35" /><text x="0" y="11200" font-size="165" font-family="sans-serif">通道起點在祭拜區：座位、連續動線與防火門須另排</text><text x="0" y="18000" font-size="175" font-family="sans-serif">＊衛浴設備／轉位／救援尚未重排，非照護已通過</text><text x="0" y="18300" font-size="165" font-family="sans-serif">外框不增；後窗／通行權、原廠、結構及專業條件仍未知</text></svg>