<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" width="1400" height="1100" role="img" aria-labelledby="title desc"><ns0:title id="title">B排濕深化02｜關門補氣：不只在門下留縫</ns0:title><ns0:desc id="desc">ABC獨立深化比較，未採用。毫米局部模型座標，道路在上方；完整門組、結構及專業核對未完成。</ns0:desc><ns0:style>text{font-family:system-ui,sans-serif;font-size:17px;fill:#263e49} .title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:650}.small{font-size:14px}.tiny{font-size:12px}</ns0:style><ns0:rect x="0" y="0" width="1400" height="1100" fill="#fafbf8" /><ns0:text x="30" y="42" class="title">B排濕深化02｜關門補氣：不只在門下留縫</ns0:text><ns0:text x="30" y="78">深化比較／未採用｜單位mm；來源是概念模型，梁柱、完成面、商品及實際路徑待核。</ns0:text><ns0:text x="30" y="1053" class="small">來源 bc1e2175f13cff04…｜本批 ac62ef01d0e24f07…</ns0:text><ns0:text x="30" y="1077" class="small">原ABC／目前3D及正式產品回覆保留。圖上名義尺寸與方塊試排，不等於施工、照護、風水或搬運核可。</ns0:text><ns0:metadata>{"source_sha256": "bc1e2175f13cff043deeb725e190a3b59908810f58661d9efadec05efbca9a5e", "report_hash": "ac62ef01d0e24f079ea9c74374c14b64d56ea4d97367797ebf52c49e2e3defc9", "adopted": false}</ns0:metadata><ns0:text x="30" y="116">以120m³/h作同條件比較；門縫、自由面積、阻視與聲學都沒有取得實物或實測。</ns0:text><ns0:text x="35" y="160" class="label">前牆立面示意：兩處候選擇一，不自動開洞</ns0:text><ns0:rect x="35" y="196.99999999999994" width="448.8" height="408.00000000000006" fill="#e9eee7" stroke="#85988b" /><ns0:rect x="259.4" y="248.0" width="192.10000000000002" height="357.0" fill="#d5ddd5" stroke="#72887b" /><ns0:rect x="171.0" y="537.0" width="68.0" height="34.0" fill="#477ca0" fill-opacity="0.65" stroke="#477ca0" stroke-width="2" /><ns0:rect x="321.45000000000005" y="537.0" width="68.0" height="34.0" fill="#a37649" fill-opacity="0.65" stroke="#a37649" stroke-width="2" /><ns0:text x="55" y="640" class="small">400×200牆旁候選</ns0:text><ns0:text x="260" y="665" class="small">原廠門片補氣候選</ns0:text><ns0:text x="35" y="745" class="small">上圖門高2100只為立面圖例，不是已選門組。</ns0:text><ns0:text x="35" y="777" class="small">名義門1130與900完成淨開口仍須門商整樘核圖。</ns0:text><ns0:text x="35" y="809" class="small">藍：牆旁低位消音補氣，先核RC／防火／牆厚。</ns0:text><ns0:text x="35" y="841" class="small">棕：原廠門片消音補氣，核重量、阻視、框軌與開啟。</ns0:text><ns0:text x="35" y="873" class="small">兩種都要有可清潔構造；不能用普通百葉當隔音保證。</ns0:text><ns0:text x="600" y="185" class="label">只靠900mm門底縫：理想平均速度</ns0:text><ns0:text x="600" y="240" class="small">10mm縫</ns0:text><ns0:rect x="720" y="220" width="333.3333333333333" height="28" fill="#c79b7b" /><ns0:text x="1100" y="240" class="small">3.70m/s</ns0:text><ns0:text x="600" y="325" class="small">15mm縫</ns0:text><ns0:rect x="720" y="305" width="222.2222222222222" height="28" fill="#c79b7b" /><ns0:text x="1100" y="325" class="small">2.47m/s</ns0:text><ns0:text x="600" y="410" class="small">20mm縫</ns0:text><ns0:rect x="720" y="390" width="166.66666666666666" height="28" fill="#c79b7b" /><ns0:text x="1100" y="410" class="small">1.85m/s</ns0:text><ns0:text x="600" y="560" class="small">400×200開口、自由面積45～60%假設：</ns0:text><ns0:text x="600" y="593" class="small">理想有效面積0.036～0.048㎡，</ns0:text><ns0:text x="600" y="626" class="small">同風量流速約0.69～0.93m/s。</ns0:text><ns0:text x="600" y="659" class="small">這不是噪音或壓損合格結論。</ns0:text><ns0:text x="600" y="692" class="small" /><ns0:text x="600" y="725" class="small">來源是一般公共乾區；其室外補氣尚未設計。</ns0:text><ns0:text x="600" y="758" class="small">不能從樓梯、獨立乾室或其他浴室串氣，</ns0:text><ns0:text x="600" y="791" class="small">也不能用開著大門才抽得動當交屋驗收。</ns0:text></ns0:svg>
