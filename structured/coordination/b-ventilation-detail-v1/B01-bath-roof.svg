<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" width="1400" height="1100" role="img" aria-labelledby="title desc"><ns0:title id="title">B排濕深化01｜濕區抽氣、浴室檢修與屋頂分開出管</ns0:title><ns0:desc id="desc">ABC獨立深化比較，未採用。毫米局部模型座標，道路在上方；完整門組、結構及專業核對未完成。</ns0:desc><ns0:style>text{font-family:system-ui,sans-serif;font-size:17px;fill:#263e49} .title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:650}.small{font-size:14px}.tiny{font-size:12px}</ns0:style><ns0:rect x="0" y="0" width="1400" height="1100" fill="#fafbf8" /><ns0:text x="30" y="42" class="title">B排濕深化01｜濕區抽氣、浴室檢修與屋頂分開出管</ns0:text><ns0:text x="30" y="78">深化比較／未採用｜單位mm；來源是概念模型，梁柱、完成面、商品及實際路徑待核。</ns0:text><ns0:text x="30" y="1053" class="small">來源 bc1e2175f13cff04…｜本批 ac62ef01d0e24f07…</ns0:text><ns0:text x="30" y="1077" class="small">原ABC／目前3D及正式產品回覆保留。圖上名義尺寸與方塊試排，不等於施工、照護、風水或搬運核可。</ns0:text><ns0:metadata>{"source_sha256": "bc1e2175f13cff043deeb725e190a3b59908810f58661d9efadec05efbca9a5e", "report_hash": "ac62ef01d0e24f079ea9c74374c14b64d56ea4d97367797ebf52c49e2e3defc9", "adopted": false}</ns0:metadata><ns0:text x="30" y="116">只深化二三樓一般公衛；床櫃、門窗、原房間邊界及主臥扣豎道20.0761㎡不再更動。</ns0:text><ns0:text x="35" y="160" class="label">公衛：抽氣移後，進氣／抽氣分開</ns0:text><ns0:polygon points="35.0,200.0 391.40000000000003,200.0 391.40000000000003,483.5 35.0,483.5" fill="#e1ecee" stroke="#819990" stroke-width="1" /><ns0:rect x="50.525" y="215.525" width="81.0" height="60.75000000000001" fill="#b9c9cc" stroke="#6e8c91" /><ns0:text x="55.25" y="245.225" class="tiny">盆</ns0:text><ns0:rect x="70.775" y="373.475" width="60.75000000000001" height="94.5" fill="#b9c9cc" stroke="#6e8c91" /><ns0:text x="75.5" y="403.175" class="tiny">WC</ns0:text><ns0:rect x="227.375" y="346.475" width="121.50000000000001" height="121.50000000000001" fill="#b9c9cc" stroke="#6e8c91" /><ns0:text x="232.10000000000002" y="376.175" class="tiny">900淋浴</ns0:text><ns0:line x1="213.20000000000002" y1="200.0" x2="365.75" y2="200.0" stroke="#388470" stroke-width="4" /><ns0:line x1="143.0" y1="200.0" x2="197.0" y2="200.0" stroke="#4d8b69" stroke-width="7" /><ns0:polyline points="170.0,183.8 170.0,312.05 190.25,413.3" fill="none" stroke="#4d8b69" stroke-width="3" stroke-dasharray="6 4" /><ns0:rect x="156.5" y="379.55" width="67.5" height="67.5" fill="none" stroke="#426e9c" stroke-width="2" stroke-dasharray="5 3" /><ns0:rect x="143.0" y="359.3" width="81.0" height="108.0" fill="#d8c2a8" fill-opacity="0.3" stroke="#a97c45" stroke-dasharray="4 3" /><ns0:text x="145.7" y="447.05" class="tiny">抽風／檢修</ns0:text><ns0:text x="35" y="565" class="small">風口中心由(1200,12000)改為(1150,12950)。</ns0:text><ns0:text x="35" y="597" class="small">綠線是補氣方向，不是CFD或短路氣流驗證。</ns0:text><ns0:text x="35" y="629" class="small">500×500檢修、600×800梯位為討論預留，</ns0:text><ns0:text x="35" y="661" class="small">平面避列明器具；實際商品拆換與安全架梯待核。</ns0:text><ns0:text x="35" y="693" class="small">風機留浴室可檢修區，不藏死在臥室天花。</ns0:text><ns0:text x="650" y="160" class="label">RF：兩個出口與檢修預留，中心相距1000</ns0:text><ns0:rect x="650.0" y="200.0" width="270.0" height="469.5" fill="#edf1e8" stroke="#7d988a" /><ns0:rect x="668.0" y="200.0" width="152.25" height="120.0" fill="#dae8d5" stroke="#789369" stroke-dasharray="5 3" /><ns0:rect x="732.5" y="371.0" width="52.5" height="52.5" fill="none" stroke="#4d82a4" stroke-dasharray="5 3" /><ns0:rect x="740.0" y="378.5" width="37.5" height="37.5" fill="#c2d5e0" stroke="#4d82a4" /><ns0:polyline points="783.125,342.5 783.125,397.25 758.75,397.25 758.75,397.25" fill="none" stroke="#4d82a4" stroke-width="2" /><ns0:text x="746.0" y="401.0" class="tiny">2F</ns0:text><ns0:rect x="807.5" y="371.0" width="52.5" height="52.5" fill="none" stroke="#946a9d" stroke-dasharray="5 3" /><ns0:rect x="815.0" y="378.5" width="37.5" height="37.5" fill="#d7c5da" stroke="#946a9d" /><ns0:polyline points="801.875,342.5 801.875,397.25 833.75,397.25 833.75,397.25" fill="none" stroke="#946a9d" stroke-width="2" /><ns0:text x="821.0" y="401.0" class="tiny">3F</ns0:text><ns0:text x="1005" y="200" class="small">原出管中心只隔250mm；</ns0:text><ns0:text x="1005" y="233" class="small">不能推定兩個風帽與維修可放下。</ns0:text><ns0:text x="1005" y="266" class="small" /><ns0:text x="1005" y="299" class="small">新圖每處500×500終端預留，</ns0:text><ns0:text x="1005" y="332" class="small">700×700局部服務預留，各自分開。</ns0:text><ns0:text x="1005" y="365" class="small">都是預留，不是已選商品尺寸，</ns0:text><ns0:text x="1005" y="398" class="small">1000mm也不是法定排放退距。</ns0:text><ns0:text x="1005" y="431" class="small" /><ns0:text x="1005" y="464" class="small">到屋頂完整安全路線、風帽</ns0:text><ns0:text x="1005" y="497" class="small">防雨防颱、進氣口與鄰房距離</ns0:text><ns0:text x="1005" y="530" class="small">及所有屋頂設備仍待核。</ns0:text><ns0:text x="30" y="895" class="small">包含屋頂外移後，二／三樓中心線估長 9.260／6.610m，各7處直角轉向；非等效管長。</ns0:text><ns0:text x="30" y="928" class="small">列明風管／終端預留避祭祀乾保護區、武轎庫投影與污水井；沒有核可穿梁、穿板或屋頂開孔。</ns0:text><ns0:text x="30" y="961" class="small">屋頂出口方向與補氣來源需一起驗證；不能只靠位置拉開，就宣稱沒有回吸或氣味問題。</ns0:text></ns0:svg>
