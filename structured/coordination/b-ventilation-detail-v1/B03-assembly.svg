<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" width="1400" height="1100" role="img" aria-labelledby="title desc"><ns0:title id="title">B排濕深化03｜管井包覆、天花與風量工作點</ns0:title><ns0:desc id="desc">ABC獨立深化比較，未採用。毫米局部模型座標，道路在上方；完整門組、結構及專業核對未完成。</ns0:desc><ns0:style>text{font-family:system-ui,sans-serif;font-size:17px;fill:#263e49} .title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:650}.small{font-size:14px}.tiny{font-size:12px}</ns0:style><ns0:rect x="0" y="0" width="1400" height="1100" fill="#fafbf8" /><ns0:text x="30" y="42" class="title">B排濕深化03｜管井包覆、天花與風量工作點</ns0:text><ns0:text x="30" y="78">深化比較／未採用｜單位mm；來源是概念模型，梁柱、完成面、商品及實際路徑待核。</ns0:text><ns0:text x="30" y="1053" class="small">來源 bc1e2175f13cff04…｜本批 ac62ef01d0e24f07…</ns0:text><ns0:text x="30" y="1077" class="small">原ABC／目前3D及正式產品回覆保留。圖上名義尺寸與方塊試排，不等於施工、照護、風水或搬運核可。</ns0:text><ns0:metadata>{"source_sha256": "bc1e2175f13cff043deeb725e190a3b59908810f58661d9efadec05efbca9a5e", "report_hash": "ac62ef01d0e24f079ea9c74374c14b64d56ea4d97367797ebf52c49e2e3defc9", "adopted": false}</ns0:metadata><ns0:text x="30" y="116">以下厚度、摩擦、彎頭阻力均為敏感度假設；實際結構、商品與施工工作點仍未核定。</ns0:text><ns0:text x="35" y="160" class="label">500×300外預留：兩條175外廓＋50間距</ns0:text><ns0:rect x="35" y="195" width="325.0" height="195.0" fill="#e4d4df" stroke="#8d617f" /><ns0:rect x="67.5" y="227.5" width="260.0" height="130.0" fill="#fafbf7" stroke="#a8849d" /><ns0:rect x="67.5" y="235.625" width="113.75" height="113.75" fill="#c4d7df" stroke="#5b8b9e" /><ns0:rect x="213.75" y="235.625" width="113.75" height="113.75" fill="#c4d7df" stroke="#5b8b9e" /><ns0:text x="35" y="445" class="small">若每側包覆50mm：內框400×200，</ns0:text><ns0:text x="35" y="477" class="small">兩管175＋175＋間隔50恰好400。</ns0:text><ns0:text x="35" y="509" class="small">沒有把檢修、套管或真正防火構造算成已放下。</ns0:text><ns0:text x="35" y="541" class="small">每側75mm時內深150，小於175外廓。</ns0:text><ns0:text x="35" y="635" class="label">尺寸加大仍需扣主臥，不偷借面積</ns0:text><ns0:text x="35" y="685" class="small">500×300 → 主臥 20.0761㎡</ns0:text><ns0:text x="35" y="727" class="small">550×350 → 主臥 20.0336㎡</ns0:text><ns0:text x="35" y="769" class="small">600×400 → 主臥 19.9861㎡　低於20</ns0:text><ns0:text x="650" y="160" class="label">2.4m天花與管心2.55m：標高預算</ns0:text><ns0:line x1="650" y1="520" x2="1260" y2="520" stroke="#8b9a90" stroke-width="3" /><ns0:text x="650" y="555" class="small">假設完成天花 +2400</ns0:text><ns0:rect x="680" y="377.5" width="400" height="105.0" fill="#bdd5df" stroke="#58839a" /><ns0:text x="685" y="355" class="small">外廓下2462.5／上2637.5</ns0:text><ns0:text x="650" y="600" class="small">上方62.5mm只是本條直管預算</ns0:text><ns0:text x="650" y="650" class="small">若梁從上層地坪向下400mm，梁底+2600，</ns0:text><ns0:text x="650" y="679" class="small">與管頂預算重疊37.5mm（只有梁真跨此處才成立）。</ns0:text><ns0:text x="650" y="708" class="small">不能鑽梁或假裝梁不存在；應改線或局部降頂再核。</ns0:text><ns0:text x="650" y="737" class="small">風機預留高度250mm比直管更大，另核風機上方。</ns0:text><ns0:text x="650" y="766" class="small" /><ns0:text x="650" y="795" class="small">兩層均有7處直角轉向；依選定假設算壓損，</ns0:text><ns0:text x="650" y="824" class="small">再請廠商提供P-Q曲線及安裝後風量，</ns0:text><ns0:text x="650" y="853" class="small">不是看最大無管風量就可選機。</ns0:text><ns0:text x="30" y="985" class="small">豎道檢修預留暫占房內路徑0.210㎡，維修與居住分時；完整拆換與安全登高未核。</ns0:text></ns0:svg>
