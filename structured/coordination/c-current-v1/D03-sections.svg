<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1300 1200" width="1300" height="1200" role="img" aria-labelledby="title desc"><ns0:title id="title">C合圖 D03｜穿孔、樓高、門窗與降板</ns0:title><ns0:desc id="desc">C概念套繪，尺寸mm，共同座標未實測。結構與排水終端缺資料，禁止據此鑽孔施工。</ns0:desc><ns0:style>text{font-family:system-ui,sans-serif;fill:#253c47;font-size:17px} .title{font-size:25px;font-weight:700} .small{font-size:13px} .label{font-size:14px;font-weight:650} .pipe{fill:none;stroke:#216f91;stroke-width:3} .pending{fill:#9c5424}</ns0:style><ns0:rect x="0" y="0" width="1300" height="1200" fill="#f8faf8" /><ns0:text x="30" y="43" class="title">C合圖 D03｜穿孔、樓高、門窗與降板</ns0:text><ns0:text x="30" y="80">概念合圖／未核施工｜x向右、y向屋後、z向上；mm；道路在平面上方。</ns0:text><ns0:text x="30" y="111">建築與機電：現有配置　　結構：尚無正式圖　　排水：只有待核方向／終端未定</ns0:text><ns0:text x="30" y="1146" class="small">來源 bc1e2175f13cff043dee…｜合圖 73248711cdc20f6e…</ns0:text><ns0:text x="30" y="1172" class="small">梁板、完成面、穿孔、機型、樹冠及實際淨空待合圖；所有尺寸為來源模型或明列假設。</ns0:text><ns0:metadata data-coordination-metadata="1">{"source_report_sha256":"bc1e2175f13cff043deeb725e190a3b59908810f58661d9efadec05efbca9a5e","coordination_report_hash":"73248711cdc20f6efe48c760dc1fe68d85808eae0d41bb81435a51cf63c54bc3","status":"concept-overlay-awaiting-discipline-drawings","construction_ready":false}</ns0:metadata><ns0:text x="35" y="154" class="label">A｜y-z投影：X向折線省略；水平／垂直比例不同</ns0:text><ns0:line x1="45" y1="730.0" x2="730" y2="730.0" stroke="#a3afad" stroke-dasharray="5 4" /><ns0:text x="45" y="722.0" class="small">1F模型基準</ns0:text><ns0:line x1="45" y1="506.0" x2="730" y2="506.0" stroke="#a3afad" stroke-dasharray="5 4" /><ns0:text x="45" y="498.0" class="small">3500協調線</ns0:text><ns0:line x1="45" y1="474.0" x2="730" y2="474.0" stroke="#a3afad" stroke-dasharray="5 4" /><ns0:text x="45" y="466.0" class="small">2F +4000</ns0:text><ns0:line x1="45" y1="282.0" x2="730" y2="282.0" stroke="#a3afad" stroke-dasharray="5 4" /><ns0:text x="45" y="274.0" class="small">3F +7000</ns0:text><ns0:rect x="45" y="506.0" width="292.5" height="224.0" fill="#f2e6c1" fill-opacity="0.55" /><ns0:polyline points="532.5,579.6 532.5,506.0 532.5,506.0 420.0,506.0 420.0,323.59999999999997 337.5,323.59999999999997 65.625,323.59999999999997 65.625,323.59999999999997 65.625,442.0" class="pipe" /><ns0:circle cx="472.5" cy="506.0" r="6" fill="#a85b23" stroke="white" stroke-width="2" /><ns0:text x="482.5" y="499.0" class="label" fill="#a85b23">P01</ns0:text><ns0:circle cx="420.0" cy="474.0" r="6" fill="#a85b23" stroke="white" stroke-width="2" /><ns0:text x="430.0" y="467.0" class="label" fill="#a85b23">P02</ns0:text><ns0:circle cx="337.5" cy="323.59999999999997" r="6" fill="#a85b23" stroke="white" stroke-width="2" /><ns0:text x="347.5" y="316.59999999999997" class="label" fill="#a85b23">P03</ns0:text><ns0:text x="110" y="710">騎樓投影</ns0:text><ns0:text x="35" y="790" class="small">樓層線只標基準，沒有假設梁底。</ns0:text><ns0:text x="780" y="154" class="label">B｜2F前牆立面局部（名義開口）</ns0:text><ns0:rect x="790.0" y="214.99999999999994" width="448.00000000000006" height="420.00000000000006" fill="#edf1ed" stroke="#889b93" /><ns0:rect x="818.0" y="341.0" width="168.00000000000003" height="168.00000000000003" fill="#b9d6e1" stroke="#597d8b" /><ns0:rect x="1063.0" y="341.0" width="126.00000000000001" height="294.0" fill="#d6d6bf" stroke="#69806b" /><ns0:rect x="1010.5" y="295.49999999999994" width="21.000000000000004" height="21.000000000000004" fill="#c8914e" stroke="#87602f" /><ns0:circle cx="1021.0" cy="305.99999999999994" r="6" fill="#a85b23" stroke="white" stroke-width="2" /><ns0:text x="1031.0" y="298.99999999999994" class="label" fill="#a85b23">P03</ns0:text><ns0:text x="780" y="685" class="small">窗：x3000～4200；門：4750～5650。</ns0:text><ns0:text x="780" y="714" class="small">包束到窗／門側175／225mm。</ns0:text><ns0:text x="780" y="743" class="small">包束下緣+6275，名義窗頂+6100。</ns0:text><ns0:text x="780" y="772" class="small">包束上緣+6425，到3F基準餘575mm。</ns0:text><ns0:text x="780" y="801" class="small">575mm包含尚未知的板、梁、天花等。</ns0:text><ns0:text x="780" y="830" class="small">門高2100是展示預算，非選定門組。</ns0:text><ns0:text x="35" y="856" class="label">C｜景觀土層／板與騎樓高度敏感度</ns0:text><ns0:text x="35" y="888">假設土面+4000、板150、其他50；地面高程及梁深未知，未選土深。</ns0:text><ns0:text x="50" y="930">土300mm → 名義底+3500mm；對3500協調線餘+0mm</ns0:text><ns0:text x="50" y="977">土450mm → 名義底+3350mm；對3500協調線餘-150mm</ns0:text><ns0:text x="50" y="1024">土600mm → 名義底+3200mm；對3500協調線餘-300mm</ns0:text><ns0:text x="35" y="1080" class="small">土300案例零餘量，不能視為剖面成立；3500是協調目標，適用法規與測量基準另核。</ns0:text></ns0:svg>
