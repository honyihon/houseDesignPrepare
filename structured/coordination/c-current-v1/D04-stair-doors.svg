<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-labelledby="title desc"><ns0:title id="title">C合圖 D04｜樓梯、前置門與機電保留區</ns0:title><ns0:desc id="desc">C概念套繪，尺寸mm，共同座標未實測。結構與排水終端缺資料，禁止據此鑽孔施工。</ns0:desc><ns0:style>text{font-family:system-ui,sans-serif;fill:#253c47;font-size:17px} .title{font-size:25px;font-weight:700} .small{font-size:13px} .label{font-size:14px;font-weight:650} .pipe{fill:none;stroke:#216f91;stroke-width:3} .pending{fill:#9c5424}</ns0:style><ns0:rect x="0" y="0" width="1200" height="1200" fill="#f8faf8" /><ns0:text x="30" y="43" class="title">C合圖 D04｜樓梯、前置門與機電保留區</ns0:text><ns0:text x="30" y="80">概念合圖／未核施工｜x向右、y向屋後、z向上；mm；道路在平面上方。</ns0:text><ns0:text x="30" y="111">建築與機電：現有配置　　結構：尚無正式圖　　排水：只有待核方向／終端未定</ns0:text><ns0:text x="30" y="1146" class="small">來源 bc1e2175f13cff043dee…｜合圖 73248711cdc20f6e…</ns0:text><ns0:text x="30" y="1172" class="small">梁板、完成面、穿孔、機型、樹冠及實際淨空待合圖；所有尺寸為來源模型或明列假設。</ns0:text><ns0:metadata data-coordination-metadata="1">{"source_report_sha256":"bc1e2175f13cff043deeb725e190a3b59908810f58661d9efadec05efbca9a5e","coordination_report_hash":"73248711cdc20f6efe48c760dc1fe68d85808eae0d41bb81435a51cf63c54bc3","status":"concept-overlay-awaiting-discipline-drawings","construction_ready":false}</ns0:metadata><ns0:text x="45" y="160" class="label">1F：24級／踏面270</ns0:text><ns0:text x="635" y="160" class="label">2F：到達面分開、側門待選型</ns0:text><ns0:rect x="59.0" y="340.4" width="324.0" height="435.59999999999997" fill="none" stroke="#7e938b" stroke-width="2" /><ns0:rect x="177.8" y="412.4" width="198.0" height="363.59999999999997" fill="#abc8b4" stroke="#7b9697" /><ns0:rect x="375.8" y="340.4" width="7.199999999999999" height="435.59999999999997" fill="#abc8b4" stroke="#7b9697" /><ns0:rect x="59.0" y="340.4" width="118.8" height="435.59999999999997" fill="#abc8b4" stroke="#7b9697" /><ns0:rect x="177.8" y="679.7" width="198.0" height="90.0" fill="#abc8b4" stroke="#7b9697" /><ns0:rect x="177.8" 