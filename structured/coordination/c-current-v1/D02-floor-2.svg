<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1200 1300" width="1200" height="1300" role="img" aria-labelledby="title desc"><ns0:title id="title">C合圖 D02｜二樓家務／景觀／立管</ns0:title><ns0:desc id="desc">C概念套繪，尺寸mm，共同座標未實測。結構與排水終端缺資料，禁止據此鑽孔施工。</ns0:desc><ns0:style>text{font-family:system-ui,sans-serif;fill:#253c47;font-size:17px} .title{font-size:25px;font-weight:700} .small{font-size:13px} .label{font-size:14px;font-weight:650} .pipe{fill:none;stroke:#216f91;stroke-width:3} .pending{fill:#9c5424}</ns0:style><ns0:rect x="0" y="0" width="1200" height="1300" fill="#f8faf8" /><ns0:text x="30" y="43" class="title">C合圖 D02｜二樓家務／景觀／立管</ns0:text><ns0:text x="30" y="80">概念合圖／未核施工｜x向右、y向屋後、z向上；mm；道路在平面上方。</ns0:text><ns0:text x="30" y="111">建築與機電：現有配置　　結構：尚無正式圖　　排水：只有待核方向／終端未定</ns0:text><ns0:text x="30" y="1246" class="small">來源 bc1e2175f13cff043dee…｜合圖 73248711cdc20f6e…</ns0:text><ns0:text x="30" y="1272" class="small">梁板、完成面、穿孔、機型、樹冠及實際淨空待合圖；所有尺寸為來源模型或明列假設。</ns0:text><ns0:metadata data-coordination-metadata="1">{"source_report_sha256":"bc1e2175f13cff043deeb725e190a3b59908810f58661d9efadec05efbca9a5e","coordination_report_hash":"73248711cdc20f6efe48c760dc1fe68d85808eae0d41bb81435a51cf63c54bc3","status":"concept-overlay-awaiting-discipline-drawings","construction_ready":false}</ns0:metadata><ns0:text x="45" y="158">2F 公共×客房｜基準 +4000mm；前段套繪</ns0:text><ns0:text x="580" y="158" class="small">平面取至y=9200；其後樓梯／孝親空間見D04及原平面。</ns0:text><ns0:defs><ns0:clipPath id="front-clip"><ns0:rect x="45" y="190" width="480.0" height="736.0" /></ns0:clipPath></ns0:defs><ns0:g clip-path="url(#front-clip)"><ns0:rect x="45.0" y="190.0" width="480.0" height="312.0" fill="#efe8ce" stroke="#96a7a5" stroke-width="1" /><ns0:text x="53.0" y="213.2" class="label">1</ns0:text><ns0:rect x="205.0" y="322.0" width="320.0" height="180.0" fill="#dcebd5" fill-opacity="0.7" stroke="#608c5b" stroke-dasharray="5 3" /><ns0:rect x="214.20000000000002" y="331.20000000000005" width="301.6" height="72.0" fill="#bfd5b6" stroke="#6e8e67" /><ns0:circle cx="252.20000000000002" cy="367.20000000000005" r="6" fill="#4b754a" /><ns0:text x="243.4" y="351.20000000000005" class="small">T1</ns0:text><ns0:circle cx="327.40000000000003" cy="367.20000000000005" r="6" fill="#4b754a" /><ns0:text x="318.6" y="351.20000000000005" class="small">T2</ns0:text><ns0:circle cx="402.6" cy="367.20000000000005" r="6" fill="#4b754a" /><ns0:text x="393.8" y="351.20000000000005" class="small">T3</ns0:text><ns0:circle cx="477.8" cy="367.20000000000005" r="6" fill="#4b754a" /><ns0:text x="469.0" y="351.20000000000005" class="small">T4</ns0:text><ns0:rect x="109.0" y="199.2" width="52.0" height="52.0" fill="#c7cecb" stroke="#8b9894" /><ns0:rect x="109.0" y="251.2" width="52.0" height="48.0" fill="none" stroke="#bc9858" stroke-width="1" stroke-dasharray="4 3" /><ns0:rect x="54.2" y="300.8" width="48.0" height="192.0" fill="#c7cecb" stroke="#8b9894" /><ns0:rect x="102.2" y="300.8" width="72.0" height="192.0" fill="none" stroke="#bc9858" stroke-width="1" stroke-dasharray="4 3" /><ns0:rect x="165.0" y="199.2" width="48.0" height="48.0" fill="#c7cecb" stroke="#8b9894" /><ns0:rect x="165.0" y="247.2" width="48.0" height="64.0" fill="none" stroke="#bc9858" stroke-width="1" stroke-dasharray="4 3" /><ns0:rect x="217.0" y="199.2" width="48.0" height="36.0" fill="#c7cecb" stroke="#8b9894" /><ns0:rect x="217.0" y="235.2" width="48.0" height="48.0" fill="none" stroke="#bc9858" stroke-width="1" stroke-dasharray="4 3" /><ns0:line x1="425.00016" y1="502.0" x2="497.00016" y2="502.0" stroke="#39786a" stroke-width="4" /><ns0:rect x="446.6" y="198.0" width="72.0" height="28.0" fill="#81abbc" stroke="#466e85" /><ns0:rect x="273.0" y="198.0" width="72.0" height="28.0" fill="#81abbc" stroke="#466e85" /><ns0:rect x="353.0" y="198.0" width="72.0" height="28.0" fill="#81abbc" stroke="#466e85" /><ns0:rect x="446.6" y="198.0" width="72.0" height="108.0" fill="none" stroke="#bc9858" stroke-dasharray="4 3" /><ns0:rect x="273.0" y="198.0" width="72.0" height="108.0" fill="none" stroke="#bc9858" stroke-dasharray="4 3" /><ns0:rect x="353.0" y="198.0" width="72.0" height="108.0" fill="none" stroke="#bc9858" stroke-dasharray="4 3" /><ns0:rect x="269.0" y="502.0" width="256.0" height="404.8" fill="#edf2ed" stroke="#96a7a5" stroke-width="1" /><ns0:text x="277.0" y="525.2" class="label">2</ns0:text><ns0:rect x="446.6" y="634.8" width="72.0" height="192.0" fill="#c7cecb" stroke="#8b9894" /><ns0:rect x="414.6" y="634.8" width="32.0" height="192.0" fill="none" stroke="#bc9858" stroke-width="1" stroke-dasharray="4 3" /><ns0:rect x="275.4" y="646.0" width="36.0" height="144.0" fill="#c7cecb" stroke="#8b9894" /><ns0:rect x="311.4" y="646.0" width="48.0" height="144.0" fill="none" stroke="#bc9858" stroke-width="1" stroke-dasharray="4 3" /><ns0:rect x="365.0" y="686.8" width="48.0" height="88.0" fill="#c7cecb" stroke="#8b9894" /><ns0:line x1="269.0" y1="530.0000944000001" x2="269.0" y2="602.0000944000001" stroke="#39786a" stroke-width="4" /><ns0:line x1="425.0" y1="502.0" x2="497.0" y2="502.0" stroke="#39786a" stroke-width="4" /><ns0:line x1="285.0" y1="502.0" x2="381.0" y2="502.0" stroke="#5b8da3" stroke-width="5" /><ns0:rect x="307.8" y="502.8" width="76.0" height="22.400000000000002" fill="#81abbc" stroke="#466e85" /><ns0:rect x="45.0" y="502.0" width="224.0" height="296.0" fill="#edf2ed" stroke="#96a7a5" stroke-width="1" /><ns0:text x="53.0" y="525.2" class="label">3</ns0:text><ns0:rect x="51.4" y="508.40000000000003" width="84.0" height="150.4" fill="#c7cecb" stroke="#8b9894" /><ns0:rect x="51.4" y="658.8" width="84.0" height="48.0" fill="none" stroke="#bc9858" stroke-width="1" stroke-dasharray="4 3" /><ns0:rect x="206.6" y="627.6" width="56.0" height="112.0" fill="#c7cecb" stroke="#8b9894" /><ns0:rect x="150.60000000000002" y="627.6" width="56.0" height="112.0" fill="none" stroke="#bc9858" stroke-width="1" stroke-dasharray="4 3" /><ns0:rect x="51.4" y="743.6" width="144.0" height="48.0" fill="#c7cecb" stroke="#8b9894" /><ns0:rect x="51.4" y="695.6" width="144.0" height="48.0" fill="none" stroke="#bc9858" stroke-width="1" stroke-dasharray="4 3" /><ns0:line x1="269.0" y1="529.999936" x2="269.0" y2="601.999936" stroke="#39786a" stroke-width="4" /><ns0:line x1="157.0" y1="502.0" x2="253.0" y2="502.0" stroke="#5b8da3" stroke-width="5" /><ns0:rect x="163.79999999999998" y="774.8000000000001" width="76.00000000000001" height="22.400000000000002" fill="#81abbc" stroke="#466e85" /><ns0:rect x="74.2" y="502.8" width="76.0" height="22.400000000000002" fill="#81abbc" stroke="#466e85" /><ns0:rect x="237.0" y="906.8000000000001" width="288.0" height="387.2" fill="#edf2ed" stroke="#96a7a5" stroke-width="1" /><ns0:text x="245.0" y="918.0" class="label">4</ns0:text><ns0:line x1="237.0" y1="914.7998592000001" x2="237.0" y2="986.7998592000001" stroke="#39786a" stroke-width="4" /><ns0:rect x="237.0" y="870.0" width="64.0" height="8.0" fill="#6c8078" fill-opacity="0.6" /><ns0:rect x="397.0" y="870.0" width="128.0" height="8.0" fill="#6c8078" fill-opacity="0.6" /><ns0:rect x="233.0" y="878.0" width="8.0" height="28.8" fill="#6c8078" fill-opacity="0.6" /><ns0:rect x="301.0" y="878.0" width="96.0" height="8.0" fill="none" stroke="#947749" stroke-dasharray="4 3" /><ns0:rect x="45.0" y="798.0" width="224.0" height="108.8" fill="#edf2ed" stroke="#96a7a5" stroke-width="1" /><ns0:text x="53.0" y="821.2" class="label">5</ns0:text><ns0:rect x="45.0" y="906.8000000000001" width="192.0" height="387.2" fill="#edf2ed" stroke="#96a7a5" stroke-width="1" /><ns0:text x="53.0" y="918.0" class="label">6</ns0:text><ns0:line x1="237.0" y1="914.7998592000001" x2="237.0" y2="986.7998592000001" stroke="#39786a" stroke-width="4" /><ns0:polyline points="401.0,590.0 401.0,502.0 401.0,212.0 482.6,212.0 482.6,212.0" class="pipe" /><ns0:rect x="393.0" y="582.0" width="16.0" height="16.0" fill="#e5c397" stroke="#a56d28" stroke-width="2" /></ns0:g><ns0:circle cx="401.0" cy="590.0" r="6" fill="#a85b23" stroke="white" stroke-width="2" /><ns0:text x="411.0" y="583.0" class="label" fill="#a85b23">P02</ns0:text><ns0:circle cx="401.0" cy="502.0" r="6" fill="#a85b23" stroke="white" stroke-width="2" /><ns0:text x="411.0" y="495.0" class="label" fill="#a85b23">P03</ns0:text><ns0:text x="580" y="210">P02：200×200立管候選占0.04㎡。</ns0:text><ns0:text x="580" y="247">到原沙發投影：Y向460、X向470mm。</ns0:text><ns0:text x="580" y="284">P03：x4450、y3900、z6350，前牆穿出。</ns0:text><ns0:text x="580" y="321">150包束到名義窗／門：175／225mm。</ns0:text><ns0:text x="580" y="358">冷媒高位線投影近第3株T3中心20mm。</ns0:text><ns0:text x="580" y="395">成熟冠幅及固定面未定，須同步調整。</ns0:text><ns0:text x="580" y="432">洗衣機一台、原洗槽、240cm晾衣架保留。</ns0:text><ns0:text x="580" y="469">3台室外機原機位保留，散熱需原廠圖。</ns0:text><ns0:text x="580" y="506">家具／設備灰藍塊為原尺寸投影。</ns0:text><ns0:text x="580" y="543">橘虛框：操作或維修預算，非通行證明。</ns0:text><ns0:text x="580" y="645" class="label">平面索引（數字只定位，不另算房間面積）</ns0:text><ns0:text x="580" y="708" class="small">1　前側陽台／空調維修候選區</ns0:text><ns0:text x="580" y="736" class="small">2　二樓起居／前置門前室共用</ns0:text><ns0:text x="580" y="764" class="small">3　前左有窗客房</ns0:text><ns0:text x="580" y="792" class="small">4　同軸樓梯／公共到達</ns0:text><ns0:text x="580" y="820" class="small">5　開放起居延伸／通行</ns0:text><ns0:text x="580" y="848" class="small">6　乾式彈性預留</ns0:text><ns0:text x="45" y="1020">藍線：冷媒中心線投影，並非地面管線。</ns0:text><ns0:text x="45" y="1058">橘實框：未核立管協調帶；綠線：名義門洞。</ns0:text><ns0:text x="45" y="1096">細分區線非施工牆；結構梁柱未提供。</ns0:text><ns0:text x="45" y="1134">完整後段、照護動線及屋頂工程另待整棟合圖。</ns0:text><ns0:line x1="45" y1="926.0" x2="525.0" y2="926.0" stroke="#7e938b" stroke-dasharray="5 3" /><ns0:text x="45" y="958.0" class="small">y=9200截斷；後段續D04及原整層圖。</ns0:text></ns0:svg>
