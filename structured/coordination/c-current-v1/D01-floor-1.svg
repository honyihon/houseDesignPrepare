ns0:rect x="102.2" y="953.6" width="72.0" height="192.0" fill="none" stroke="#bc9858" stroke-width="1" stroke-dasharray="4 3" /><ns0:rect x="159.8" y="893.6" width="60.0" height="56.0" fill="#c7cecb" stroke="#8b9894" /><ns0:rect x="159.8" y="949.6" width="60.0" height="48.0" fill="none" stroke="#bc9858" stroke-width="1" stroke-dasharray="4 3" /><ns0:line x1="237.0" y1="980.8000000000001" x2="237.0" y2="1071.2" stroke="#39786a" stroke-width="4" /><ns0:rect x="237.0" y="906.8000000000001" width="288.0" height="387.2" fill="#edf2ed" stroke="#96a7a5" stroke-width="1" /><ns0:text x="245.0" y="918.0" class="label">6</ns0:text><ns0:line x1="237.0" y1="980.7999072" x2="237.0" y2="1071.1999071999999" stroke="#39786a" stroke-width="4" /><ns0:line x1="245.000096" y1="1294.0" x2="325.00009600000004" y2="1294.0" stroke="#39786a" stroke-width="4" /><ns0:rect x="237.0" y="870.0" width="40.0" height="8.0" fill="#6c8078" fill-opacity="0.6" /><ns0:rect x="373.0" y="870.0" width="152.0" height="8.0" fill="#6c8078" fill-opacity="0.6" /><ns0:rect x="233.0" y="878.0" width="8.0" height="28.8" fill="#6c8078" fill-opacity="0.6" /><ns0:rect x="277.0" y="878.0" width="96.0" height="8.0" fill="none" stroke="#947749" stroke-dasharray="4 3" /><ns0:rect x="365.0" y="502.0" width="160.0" height="144.0" fill="#edf2ed" stroke="#96a7a5" stroke-width="1" /><ns0:text x="373.0" y="525.2" class="label">7</ns0:text><ns0:rect x="462.6" y="603.6" width="56.0" height="36.0" fill="#c7cecb" stroke="#8b9894" /><ns0:rect x="406.6" y="603.6" width="56.0" height="36.0" fill="none" stroke="#bc9858" stroke-width="1" stroke-dasharray="4 3" /><ns0:rect x="482.6" y="514.0" width="36.0" height="48.0" fill="#c7cecb" stroke="#8b9894" /><ns0:rect x="426.6" y="514.0" width="56.0" height="48.0" fill="none" stroke="#bc9858" stroke-width="1" stroke-dasharray="4 3" /><ns0:line x1="373.0" y1="646.0" x2="445.0" y2="646.0" stroke="#39786a" stroke-width="4" /><ns0:line x1="421.0" y1="502.0" x2="469.0" y2="502.0" stroke="#5b8da3" stroke-width="5" /><ns0:rect x="237.0" y="758.0" width="128.0" height="148.8" fill="#edf2ed" stroke="#96a7a5" stroke-width="1" /><ns0:text x="245.0" y="781.2" class="label">8</ns0:text><ns0:rect x="365.0" y="790.0" width="160.0" height="116.8" fill="#edf2ed" stroke="#96a7a5" stroke-width="1" /><ns0:text x="373.0" y="813.2" class="label">9</ns0:text><ns0:polyline points="513.0,710.0 513.0,710.0 401.0,710.0 401.0,590.0" class="pipe" /><ns0:rect x="393.0" y="582.0" width="16.0" height="16.0" fill="#e5c397" stroke="#a56d28" stroke-width="2" /><ns0:line x1="513.0" y1="710.0" x2="513.0" y2="646.0" stroke="#985d9e" stroke-width="3" stroke-dasharray="6 4" /></ns0:g><ns0:circle cx="401.0" cy="646.0" r="6" fill="#a85b23" stroke="white" stroke-width="2" /><ns0:text x="411.0" y="639.0" class="label" fill="#a85b23">P01</ns0:text><ns0:circle cx="401.0" cy="590.0" r="6" fill="#a85b23" stroke="white" stroke-width="2" /><ns0:text x="411.0" y="583.0" class="label" fill="#a85b23">P02</ns0:text><ns0:circle cx="513.0" cy="646.0" r="6" fill="#985d9e" stroke="white" stroke-width="2" /><ns0:text x="523.0" y="639.0" class="label" fill="#985d9e">D01</ns0:text><ns0:text x="580" y="210">P01：隔牆穿越 x4450、y5700、z3500。</ns0:text><ns0:text x="580" y="247">投影落公衛門範圍上方，須核門楣。</ns0:text><ns0:text x="580" y="284">P02：穿2F樓板 x4450、y5000、z4000。</ns0:text><ns0:text x="580" y="321">150管束／200立管帶均為預算，孔徑未定。</ns0:text><ns0:text x="580" y="358">室內機：乾式前室右壁；底+2350。</ns0:text><ns0:text x="580" y="395">機身與前置牆已避開；維修／送風待選型。</ns0:text><ns0:text x="580" y="432">D01：紫線只到公衛後界，非完整排水線。</ns0:text><ns0:text x="580" y="469">800mm敏感度：1／1.5／2%→8／12／16mm。</ns0:text><ns0:text x="580" y="506">冷凝水不隨冷媒升到二樓，接管點未知。</ns0:text><ns0:text x="580" y="543">污水、雨水、冷凝水及排氣須分別設計。</ns0:text><ns0:text x="580" y="645" class="label">平面索引（數字只定位，不另算房間面積）</ns0:text><ns0:text x="580" y="708" class="small">1　前緣通行／接送</ns0:text><ns0:text x="580" y="736" class="small">2　乾式前室／鞋櫃</ns0:text><ns0:text x="580" y="764" class="small">3　開放客餐｜沙發電視區</ns0:text><ns0:text x="580" y="792" class="small">4　開放客餐廳｜四人餐桌區</ns0:text><ns0:text x="580" y="820" class="small">5　一字廚房／前置冰箱</ns0:text><ns0:text x="580" y="848" class="small">6　正式樓梯／乾式通道</ns0:text><ns0:text x="580" y="876" class="small">7　有可開高窗的訪客公衛</ns0:text><ns0:text x="580" y="904" class="small">8　客餐通行／前置門前室共用</ns0:text><ns0:text x="580" y="932" class="small">9　前置門側共用前室</ns0:text><ns0:text x="45" y="1020">藍線：冷媒中心線投影，並非地面管線。</ns0:text><ns0:text x="45" y="1058">橘實框：未核立管協調帶；綠線：名義門洞。</ns0:text><ns0:text x="45" y="1096">細分區線非施工牆；結構梁柱未提供。</ns0:text><ns0:text x="45" y="1134">完整後段、照護動線及屋頂工程另待整棟合圖。</ns0:text><ns0:line x1="45" y1="926.0" x2="525.0" y2="926.0" stroke="#7e938b" stroke-dasharray="5 3" /><ns0:text x="45" y="958.0" class="small">y=9200截斷；後段續D04及原整層圖。</ns0:text></ns0:svg>
