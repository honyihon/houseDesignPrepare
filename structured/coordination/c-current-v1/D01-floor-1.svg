<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1200 1300" width="1200" height="1300" role="img" aria-labelledby="title desc"><ns0:title id="title">C合圖 D01｜一樓建築／冷氣／排水</ns0:title><ns0:desc id="desc">C概念套繪，尺寸mm，共同座標未實測。結構與排水終端缺資料，禁止據此鑽孔施工。</ns0:desc><ns0:style>text{font-family:system-ui,sans-serif;fill:#253c47;font-size:17px} .title{font-size:25px;font-weight:700} .small{font-size:13px} .label{font-size:14px;font-weight:650} .pipe{fill:none;stroke:#216f91;stroke-width:3} .pending{fill:#9c5424}</ns0:style><ns0:rect x="0" y="0" width="1200" height="1300" fill="#f8faf8" /><ns0:text x="30" y="43" class="title">C合圖 D01｜一樓建築／冷氣／排水</ns0:text><ns0:text x="30" y="80">概念合圖／未核施工｜x向右、y向屋後、z向上；mm；道路在平面上方。</ns0:text><ns0:text x="30" y="111">建築與機電：現有配置　　結構：尚無正式圖　　排水：只有待核方向／終端未定</ns0:text><ns0:text x="30" y="1246" class="small">來源 bc1e2175f13cff043dee…｜合圖 73248711cdc20f6e…</ns0:text><ns0:text x="30" y="1272" class="small">梁板、完成面、穿孔、機型、樹冠及實際淨空待合圖；所有尺寸為來源模型或明列假設。</ns0:text><ns0:metadata data-coordination-metadata="1">{"source_report_sha256":"bc1e2175f13cff043deeb725e190a3b59908810f58661d9efadec05efbca9a5e","coordination_report_hash":"73248711cdc20f6efe48c760dc1fe68d85808eae0d41bb81435a51cf63c54bc3","status":"concept-overlay-awaiting-discipline-drawings","construction_ready":false}</ns0:metadata><ns0:text x="45" y="158">1F IDF×孝親｜基準 +0mm；前段套繪</ns0:text><ns0:text x="580" y="158" class="small">平面取至y=9200；其後樓梯／孝親空間見D04及原平面。</ns0:text><ns0:defs><ns0:clipPath id="front-clip"><ns0:rect x="45" y="190" width="480.0" height="736.0" /></ns0:clipPath></ns0:defs><ns0:g clip-path="url(#front-clip)"><ns0:rect x="45.0" y="190.0" width="480.0" height="312.0" fill="#efe8ce" stroke="#96a7a5" stroke-width="1" /><ns0:text x="53.0" y="213.2" class="label">1</ns0:text><ns0:rect x="365.0" y="646.0" width="160.0" height="144.0" fill="#edf2ed" stroke="#96a7a5" stroke-width="1" /><ns0:text x="373.0" y="669.2" class="label">2</ns0:text><ns0:rect x="490.6" y="726.0" width="28.0" height="96.0" fill="#c