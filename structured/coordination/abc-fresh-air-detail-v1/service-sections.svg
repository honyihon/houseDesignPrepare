<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" width="1400" height="1100" role="img" aria-labelledby="title desc"><ns0:title id="title">新風四管／天花／檢修拆換剖面比較</ns0:title><ns0:desc id="desc">ABC獨立深化比較，未採用。毫米局部模型座標，道路在上方；完整門組、結構及專業核對未完成。</ns0:desc><ns0:style>text{font-family:system-ui,sans-serif;font-size:17px;fill:#263e49} .title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:650}.small{font-size:14px}.tiny{font-size:12px}</ns0:style><ns0:rect x="0" y="0" width="1400" height="1100" fill="#fafbf8" /><ns0:text x="30" y="42" class="title">新風四管／天花／檢修拆換剖面比較</ns0:text><ns0:text x="30" y="78">深化比較／未採用｜單位mm；來源是概念模型，梁柱、完成面、商品及實際路徑待核。</ns0:text><ns0:text x="30" y="1053" class="small">來源 bc1e2175f13cff04…｜本批 0c182bc92fb2914a…</ns0:text><ns0:text x="30" y="1077" class="small">原ABC／目前3D及正式產品回覆保留。圖上名義尺寸與方塊試排，不等於施工、照護、風水或搬運核可。</ns0:text><ns0:metadata>{"source_sha256": "bc1e2175f13cff043deeb725e190a3b59908810f58661d9efadec05efbca9a5e", "report_hash": "0c182bc92fb2914abcc417609931a21b04db5df5b5c64b14573992159a9d4391", "adopted": false}</ns0:metadata><ns0:text x="30" y="125">兩支Ø125＋各側25保溫＝外徑175；管間50、邊界各50，均為未選型研究預算。</ns0:text><ns0:text x="30" y="153">四管不能重用500×300雙管帶；這不是產品／防火／消音最小安裝尺寸。</ns0:text><ns0:text x="30" y="210" class="label">四管橫排：比較950×300</ns0:text><ns0:rect x="30" y="230" width="475.0" height="150.0" fill="#edf3f5" stroke="#4d7c88" stroke-width="1.5" /><ns0:circle cx="98.75" cy="298.75" r="43.75" fill="#9bc2d0" stroke="#3c7284" /><ns0:circle cx="211.25" cy="298.75" r="43.75" fill="#9bc2d0" stroke="#3c7284" /><ns0:circle cx="323.75" cy="298.75" r="43.75" fill="#9bc2d0" stroke="#3c7284" /><ns0:circle cx="436.25" cy="298.75" r="43.75" fill="#9bc2d0" stroke="#3c7284" /><ns0:text x="30" y="520">所需寬／高 [950, 275] mm</ns0:text><ns0:text x="750" y="210" class="label">四管雙層：比較500×500</ns0:text><ns0:rect x="750" y="230" width="250.0" height="250.0" fill="#edf3f5" stroke="#4d7c88" stroke-width="1.5" /><ns0:circle cx="818.75" cy="298.75" r="43.75" fill="#9bc2d0" stroke="#3c7284" /><ns0:circle cx="931.25" cy="298.75" r="43.75" fill="#9bc2d0" stroke="#3c7284" /><ns0:circle cx="818.75" cy="411.25" r="43.75" fill="#9bc2d0" stroke="#3c7284" /><ns0:circle cx="931.25" cy="411.25" r="43.75" fill="#9bc2d0" stroke="#3c7284" /><ns0:text x="750" y="520">所需寬／高 [500, 500] mm</ns0:text><ns0:text x="30" y="565">完成天花高度僅敏感度；實際梁底、板厚、管口及冷媒交叉未提供。</ns0:text><ns0:text x="30" y="593">假設板下2600mm：橫排＋450機位＋50吊掛公差 → 最多2100mm；雙層 → 2050mm。</ns0:text><ns0:text x="30" y="621">以上不是現場層高、法定淨高或已接受低天花；不指示鑽梁。</ns0:text><ns0:text x="30" y="685" class="label">名義可拆板≠完成淨口≠全機運出</ns0:text><ns0:text x="30" y="730">名義 [1260, 700] − 各側25框料 → 淨口 [1210, 650]</ns0:text><ns0:text x="30" y="762">參考外形1230×637＋各側50手部 → 需1330×737；餘量 [-120, -87] mm</ns0:text><ns0:text x="30" y="794" fill="#a23b34">直向平面預算不足，不當合格開口</ns0:text><ns0:text x="30" y="840">名義 [1600, 1000] − 各側25框料 → 淨口 [1550, 950]</ns0:text><ns0:text x="30" y="872">參考外形1230×637＋各側50手部 → 需1330×737；餘量 [220, 213] mm</ns0:text><ns0:text x="30" y="904" fill="#a23b34">直向平面預算容得下；仍非全機可換</ns0:text><ns0:text x="30" y="965">原廠日常濾網側孔與抽芯區另核；本案600側條帶是假設，不能從600方孔推導抽拉長度。</ns0:text><ns0:text x="30" y="993">還要核吊架／接口斷開、重量落機、架梯與照護／逃生、門轉角及全程運出；一項未核就不宣稱完成。</ns0:text></ns0:svg>
