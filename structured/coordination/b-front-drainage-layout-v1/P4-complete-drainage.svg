<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="P4｜同井完整支管比較，最緊只多4.4mm"><title>P4｜同井完整支管比較，最緊只多4.4mm</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}.room{font-size:13px;font-weight:650}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">P4｜同井完整支管比較，最緊只多4.4mm</text><text x="28" y="76">P4僅2F前段獨立比較／未採用｜不改房界、井位與其他房間，不併原ABC／3D；排水及消防待核。</text><text x="28" y="1158" class="small">本批 7942e22e54fc8e0c33b7de181765634eb0ab7fa4bf52900f055cb85f73d7c4e7</text><text x="28" y="1182" class="small">指定靜態幾何／假設剖面不是法規、風水、結構、產品、照護或施工核可；未跑瀏覽器及轉圖。</text><text x="35" y="137">同口徑：器具本體中心代排口，先橫後縱＋2235mm偏移；統一1:50為假設，不是實際管線或法定坡度。</text><text x="40" y="195">器具</text><text x="230" y="195">P3完整線mm</text><text x="465" y="195">P4完整線mm</text><text x="700" y="195">增減mm</text><text x="900" y="195">P4假坡降</text><text x="1110" y="195">最有利剖面</text><text x="40" y="245">馬桶</text><text x="230" y="245">5065</text><text x="465" y="245">4025</text><text x="700" y="245">-1040</text><text x="900" y="245">80.5mm</text><text x="1110" y="245">3519.5mm</text><text x="40" y="300">面盆</text><text x="230" y="300">6415</text><text x="465" y="300">2815</text><text x="700" y="300">-3600</text><text x="900" y="300">56.3mm</text><text x="1110" y="300">3543.7mm</text><text x="40" y="355">茶水槽候選</text><text x="230" y="355">5680</text><text x="465" y="355">4780</text><text x="700" y="355">-900</text><text x="900" y="355">95.6mm</text><text x="1110" y="355">3504.4mm</text><text x="40" y="410">淋浴</text><text x="230" y="410">3900</text><text x="465" y="410">4610</text><text x="700" y="410">+710</text><text x="900" y="410">92.2mm</text><text x="1110" y="410">3507.8mm</text><text x="40" y="495">最有利例：4000－結構200－管含支撐150－假坡降－檢修50。P3最小3471.7，P4最小3504.4mm，但不是實際只差4.4mm。</text><text x="40" y="531">同口徑四線都達3500比較值的只有結構200＋管預留150且無額外深度這一例；再需25mm便降至3479.4mm，其他梁板／管徑案例也失守。</text><text x="40" y="567">不能選薄梁、變小排水管或較平坡度湊綠色結果。實際排出口、存水彎、彎頭與接入高程可能不同，必須分段出同版剖面。</text><text x="40" y="603">1F落水候選仍占原梯核0.16㎡；無證據就是未知，不能直落騎樓或借神明堂／乾背／武轎庫。兩種搬轎入口及24級梯本體都未改。</text><text x="40" y="639">3F支管、立管同時匯流／通氣、井內容量、清掃、防火及合法終端仍未完成。維持Q3井投影不等於整棟排水、聲學或風水通過。</text><text x="40" y="1065">原室內量體、RF24㎡、天井防水及Q3樓梯／KTV工程缺口不因P4而解除。</text></svg>
