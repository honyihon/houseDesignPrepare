<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="B Q3：RF前室／機器向下投影與高度預算"><title>B Q3：RF前室／機器向下投影與高度預算</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}.room{font-size:14px;font-weight:650}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">B Q3：RF前室／機器向下投影與高度預算</text><text x="28" y="76">Q3／RF同版工程接口｜未採用，原格局與主3D保留；高度及門寬僅列明預算，不是成品或施工核可。</text><text x="28" y="1158" class="small">本批 d9da1ea5deec1b4ae9d4ea42ce626b26339a4f1f92d1c930bde0263df985c698</text><text x="28" y="1182" class="small">未執行瀏覽器／轉圖；結構、聲學、風水、消防、照護、外吊及全程搬運均待核。</text><polygon points="375.0,374.5 375.0,160.0 45.0,160.0 45.0,374.5 45.0,418.5 177.0,418.5 177.0,374.5" fill="#e8dff2" stroke="#7f6b95" stroke-width="1" /><polygon points="114.575,368.175 114.575,380.825 51.325,380.825 51.325,422.35 49.4,422.35 49.4,477.35 170.4,477.35 170.4,423.175 183.325,423.175 183.325,380.825 170.675,380.825 170.4,380.825 164.075,380.825 164.075,368.175" fill="#b9d0b3" stroke="#4c7750" fill-opacity="0.7" /><polygon points="114.575,380.825 51.325,380.825 51.325,418.5 177.0,418.5 177.0,380.825 170.675,380.825 170.4,380.825 164.075,380.825 164.075,368.175 114.575,368.175" fill="#e1ae87" stroke="#a66f46" fill-opacity="0.9" /><rect x="51.325" y="166.325" width="110.0" height="68.75" fill="none" stroke="#a66f46" stroke-width="1.5" stroke-dasharray="5 3" /><rect x="224.85" y="166.325" width="49.5" height="19.25" fill="none" stroke="#a66f46" stroke-width="1.5" stroke-dasharray="5 3" /><rect x="319.175" y="166.325" width="49.5" height="19.25" fill="none" stroke="#a66f46" stroke-width="1.5" stroke-dasharray="5 3" /><text x="45" y="125" class="small">紫：3F KTV名義範圍；綠：RF候選地面</text><text x="45" y="515" class="small">橘色RF地面壓KTV名義 1.7722㎡</text><text x="45" y="541" class="small">對KTV內縮後地面 1.1329㎡</text><text x="45" y="567" class="small">虛框：S1熱泵／前冷氣代表位置，非型號實機</text><text x="45" y="607">投影只指出需核腳步、荷重、隔振與穿孔的位置。</text><text x="45" y="637">梁可能將振動傳到其他房間，不能只查正下方。</text><text x="465" y="145">RF新前室位在KTV左後入口凹部上方；到達板不壓踏步，不等於腳步或門振動已隔絕。</text><text x="465" y="180">S1前熱泵位於前KTV上方，另核基座／隔振／運轉及維修；S2後濕設備保留為備案，不因此解除後</text><text x="465" y="203">端緊餘量。</text><text x="465" y="238">概念基準為3F模型+7000、RF模型+10000；兩者暫按本圖構造帳解讀。這不是已知梁板或</text><text x="465" y="261">實際完成面。</text><text x="465" y="296">RF構造先向下占高度，再扣樓板、板底以外梁突出、最低結構下的吊頂服務帶及3F額外地坪；同一層</text><text x="465" y="319">厚不得重複扣。</text><text x="465" y="354">若RF完成面改上抬，須重算末級／門檻及整段樓梯；不能一面保原18級，一面無代價加厚。</text><text x="45" y="710">H0：剩餘高度預算 2400mm；非淨高通過</text><text x="45" y="746">H1：剩餘高度預算 2300mm；非淨高通過</text><text x="45" y="782">H2：剩餘高度預算 2100mm；非淨高通過</text><text x="45" y="818">H3：剩餘高度預算 1850mm；非淨高通過</text><rect x="645" y="725.0" width="400" height="12.0" fill="#bfd9dd" stroke="#64766b" /><text x="1057" y="749.0" class="small">RF防水／找坡等向下預算</text><rect x="645" y="737.0" width="400" height="24.0" fill="#a7b7ae" stroke="#64766b" /><text x="1057" y="773.0" class="small">候選樓板</text><rect x="645" y="761.0" width="400" height="30.0" fill="#dbd1e5" stroke="#64766b" /><text x="1057" y="803.0" class="small">吊頂／聲學／管線服務帶</text><line x1="625" y1="725.0" x2="1055" y2="725.0" stroke="#64766b" stroke-dasharray="4 3" /><text x="465" y="730.0" class="small">RF模型基準</text><line x1="625" y1="791.0" x2="1055" y2="791.0" stroke="#64766b" stroke-dasharray="4 3" /><text x="465" y="796.0" class="small">H0假設天花</text><line x1="625" y1="1079.0" x2="1055" y2="1079.0" stroke="#64766b" stroke-dasharray="4 3" /><text x="465" y="1084.0" class="small">H0假設KTV地坪</text><text x="650" y="1120" class="small">H0僅示層厚，非真實梁／防水／聲學剖面</text></svg>
