="middle">S1</text><text x="55" y="130" font-size="16">道路／前方 ↑</text><text x="55" y="1100" font-size="12">6000×17630mm研究框；不是可建量或地籍測量</text><text x="430" y="155" font-size="21" font-weight="700">S1｜公共安靜區側緣乾式雜物櫃</text><text x="430" y="186" font-size="16">櫃體平面 450×1200mm；高1800mm（提案）</text><text x="430" y="213" font-size="16">占地0.540㎡；額外占地0.540㎡</text><text x="430" y="244" font-size="16">同位置接Q3三樓完整圖，不占KTV聲學面積或設備機櫃，不把神桌乾背保護室拿來堆雜物；原K</text><text x="430" y="269" font-size="16">TV／RF缺口仍保留。</text><text x="430" y="350" font-size="20" font-weight="700">現有家具／設備名稱對照</text><text x="430" y="382" font-size="15">1｜原1800×900沙發｜平面900×1800mm</text><text x="430" y="407" font-size="15">2｜原1100×600茶几｜平面600×1100mm</text><text x="430" y="432" font-size="15">3｜原1000×80電視｜平面80×1000mm</text><text x="430" y="457" font-size="15">4｜原1800×900沙發保尺寸｜平面1800×900mm</text><text x="430" y="482" font-size="15">5｜原1200×600桌保尺寸｜平面1200×600mm</text><text x="430" y="507" font-size="15">6｜原1000×80螢幕內退100mm｜平面1000×80mm</text><text x="430" y="532" font-size="15">7｜600×900機櫃預留／非選機｜平面600×900mm</text><text x="430" y="557" font-size="15">8｜原1800×2000客床轉向／床頭靠左｜平面2000×1800mm</text><text x="430" y="582" font-size="15">9｜原1800×600櫃轉向｜平面600×1800mm</text><text x="430" y="607" font-size="15">10｜原600×450面盆轉右牆｜平面450×600mm</text><text x="430" y="632" font-size="15">11｜原450×700馬桶轉向左牆｜平面700×450mm</text><text x="430" y="657" font-size="15">12｜原900×900淋浴｜平面900×900mm</text><text x="430" y="682" font-size="15">管道井預留</text><text x="430" y="707" font-size="15">管道井預留</text><text x="430" y="732" font-size="15">原門活動包絡</text><text x="28" y="1210" font-size="14">列明本體／操作／通路2D篩檢無新增衝突；不是全路線、門扇、真人、風水或施工核可。</text><text x="28" y="1238" font-size="12">來源與本批：a011d8dc173c8c71b606b55284deb716533b7dfcf4593cd04828f95f8fa21981</text><text x="28" y="1262" font-size="13">RF只放耐候用品，不新增室內房間；B折衣檯收納沿原操作帶分時，不解除原RF24㎡缺口。</text></svg>
