x="430" y="582" font-size="15">9｜原1800×600衣櫃｜平面1800×600mm</text><text x="430" y="607" font-size="15">10｜原1200×500梳妝台轉向｜平面500×1200mm</text><text x="430" y="632" font-size="15">11｜原900×550盆櫃轉向｜平面550×900mm</text><text x="430" y="657" font-size="15">12｜原450×700馬桶轉向｜平面700×450mm</text><text x="430" y="682" font-size="15">13｜原900淋浴｜平面900×900mm</text><text x="430" y="707" font-size="15">管道井預留</text><text x="430" y="732" font-size="15">管道井預留</text><text x="430" y="757" font-size="15">管道井預留</text><text x="430" y="782" font-size="15">原門活動包絡</text><text x="430" y="807" font-size="15">原門活動包絡</text><text x="430" y="832" font-size="15">原門活動包絡</text><text x="430" y="857" font-size="15">原門活動包絡</text><text x="28" y="1210" font-size="14">列明本體／操作／通路2D篩檢無新增衝突；不是全路線、門扇、真人、風水或施工核可。</text><text x="28" y="1238" font-size="12">來源與本批：a011d8dc173c8c71b606b55284deb716533b7dfcf4593cd04828f95f8fa21981</text><text x="28" y="1262" font-size="13">RF只放耐候用品，不新增室內房間；B折衣檯收納沿原操作帶分時，不解除原RF24㎡缺口。</text></svg>
