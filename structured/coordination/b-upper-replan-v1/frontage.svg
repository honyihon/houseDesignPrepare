<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1120" width="1400" height="1120" role="img" aria-label="B前側代價｜P2室內／景觀／設備重新分區"><title>B前側代價｜P2室內／景觀／設備重新分區</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}.room{font-size:13px;font-weight:650}</style><rect x="0" y="0" width="1400" height="1120" fill="#fafbf8" /><text x="28" y="40" class="title">B前側代價｜P2室內／景觀／設備重新分區</text><text x="28" y="76">獨立重排比較／未採用｜mm座標；前陽台改室內為重大代價，須正式建築設計，不可自行封陽台。</text><text x="28" y="1078" class="small">來源 00baf0b3950e2593…｜本批 51f8f16f8f30c82b…</text><text x="28" y="1102" class="small">指定平面幾何不等於法規／風水／照護／搬運／產品或施工核可。前排水及結構未完成；原ABC／3D保留。</text><rect x="45.0" y="150.0" width="376.05" height="448.5" fill="#dceff4" stroke="#607c73" stroke-width="2" /><line x1="45.0" y1="377.70000000000005" x2="421.05" y2="377.70000000000005" stroke="#607c73" stroke-width="2" /><polygon points="421.05,316.75 524.55,316.75 524.55,253.5 622.3000000000001,253.5 622.3000000000001,316.75 735.0,316.75 735.0,598.5 421.05,598.5" fill="#e8efce" stroke="#708738" stroke-width="2" /><rect x="432.55" y="345.5" width="207.0" height="161.0" fill="#96b573" stroke="#708738" /><rect x="421.05" y="161.5" width="103.5" height="155.25" fill="none" stroke="#ba823e" stroke-dasharray="5 3" /><rect x="622.3000000000001" y="161.5" width="103.5" height="155.25" fill="none" stroke="#ba823e" stroke-dasharray="5 3" /><rect x="421.05" y="161.5" width="103.5" height="40.25" fill="#c7d4d6" stroke="#52676d" /><rect x="622.3000000000001" y="161.5" width="103.5" height="40.25" fill="#c7d4d6" stroke="#52676d" /><line x1="592.975" y1="667.5" x2="592.975" y2="558.25" stroke="#286a84" stroke-width="2" stroke-dasharray="5 3" /><line x1="592.975" y1="558.25" x2="689.0" y2="558.25" stroke="#286a84" stroke-width="2" stroke-dasharray="5 3" /><line x1="689.0" y1="558.25" x2="689.0" y2="276.5" stroke="#286a84" stroke-width="2" stroke-dasharray="5 3" /><line x1="689.0" y1="276.5" x2="472.8" y2="276.5" stroke="#286a84" stroke-width="2" stroke-dasharray="5 3" /><text x="90" y="265">公衛：5.1600㎡</text><text x="90" y="485">茶水前室：5.1376㎡</text><text x="840" y="185">設備與拆換不當綠化</text><text x="50" y="675">前室內新增名義12.753㎡／層</text><text x="820" y="235">景觀比較區7.156㎡，覆土投影2.52㎡，約35.22</text><text x="820" y="261">%；四株木本僅示意，土深／荷重／資格未核。</text><text x="820" y="299">兩台室外機數量／代表尺寸及原1350mm深維修預算保留；</text><text x="820" y="325">左機移到x3270，不借舊冷媒路線稱完成。</text><text x="820" y="363">700mm平面試線繞土區到設備，並非實際原廠維修／輪椅或</text><text x="820" y="389">熱回流驗證。</text><text x="820" y="427">新室內必須列入正式可建量和結構設計，不再享原陽台的面積計</text><text x="820" y="453">法；整體仍在約32地坪研究框內，不代表申照可建。</text><text x="50" y="735">1F仍保留6000×3900通行帶；不能用新增落地排水井擋騎樓。</text><text x="50" y="773">前公衛／茶水是否能落地排水是本案先決缺口，詳下一張剖面表，不因房間面積達標而略過。</text></svg>
