<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="B P4落水｜原候選占入口平台，四個位置各有衝突"><title>B P4落水｜原候選占入口平台，四個位置各有衝突</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}.room{font-size:14px;font-weight:650}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">B P4落水｜原候選占入口平台，四個位置各有衝突</text><text x="28" y="76">P4原1F落管位置的局部反例／未採用｜四位置均不直接套現行梯門；未改格局或併主3D。</text><text x="28" y="1158" class="small">本批 e2dc0bdd6cf5cc308c539d7a991cc72556502bf03a8ba4d8def11200cbc6249a</text><text x="28" y="1182" class="small">局部平台／踏步只作篩檢，非全域無解證明，亦非結構、風水、消防、搬轎、照護或施工核可。</text><rect x="45.0" y="232.0" width="312.0" height="676.0" fill="#edf0e9" stroke="#607c73" /><rect x="55.4" y="241.10000000000002" width="286.0" height="130.0" fill="#d9dfbf" stroke="#74803e" /><rect x="185.4" y="371.1" width="26.0" height="386.1" fill="#dae3e7" stroke="#75929d" stroke-dasharray="5 3" /><rect x="55.4" y="371.1" width="130.0" height="35.1" fill="#e2e6df" stroke="#7c9484" stroke-width="0.8" /><rect x="211.4" y="722.1" width="130.0" height="35.1" fill="#e2e6df" stroke="#7c9484" stroke-width="0.8" /><rect x="55.4" y="406.20000000000005" width="130.0" height="35.1" fill="#e2e6df" stroke="#7c9484" stroke-width="0.8" /><rect x="211.4" y="687.0" width="130.0" height="35.1" fill="#e2e6df" stroke="#7c9484" stroke-width="0.8" /><rect x="55.4" y="441.30000000000007" width="130.0" height="35.1" fill="#e2e6df" stroke="#7c9484" stroke-width="0.8" /><rect x="211.4" y="651.9" width="130.0" height="35.1" fill="#e2e6df" stroke="#7c9484" stroke-width="0.8" /><rect x="55.4" y="476.4" width="130.0" height="35.1" fill="#e2e6df" stroke="#7c9484" stroke-width="0.8" /><rect x="211.4" y="616.8000000000001" width="130.0" height="35.1" fill="#e2e6df" stroke="#7c9484" stroke-width="0.8" /><rect x="55.4" y="511.5" width="130.0" height="35.1" fill="#e2e6df" stroke="#7c9484" stroke-width="0.8" /><rect x="211.4" y="581.7" width="130.0" height="35.1" fill="#e2e6df" stroke="#7c9484" stroke-width="0.8" /><rect x="55.4" y="546.6" width="130.0" height="35.1" fill="#e2e6df" stroke="#7c9484" stroke-width="0.8" /><rect x="211.4" y="546.6" width="130.0" height="35.1" fill="#e2e6df" stroke="#7c9484" stroke-width="0.8" /><rect x="55.4" y="581.7" width="130.0" height="35.1" fill="#e2e6df" stroke="#7c9484" stroke-width="0.8" /><rect x="211.4" y="511.5" width="130.0" height="35.1" fill="#e2e6df" stroke="#7c9484" stroke-width="0.8" /><rect x="55.4" y="616.8000000000001" width="130.0" height="35.1" fill="#e2e6df" stroke="#7c9484" stroke-width="0.8" /><rect x="211.4" y="476.4" width="130.0" height="35.1" fill="#e2e6df" stroke="#7c9484" stroke-width="0.8" /><rect x="55.4" y="651.9" width="130.0" height="35.1" fill="#e2e6df" stroke="#7c9484" stroke-width="0.8" /><rect x="211.4" y="441.30000000000007" width="130.0" height="35.1" fill="#e2e6df" stroke="#7c9484" stroke-width="0.8" /><rect x="55.4" y="687.0" width="130.0" height="35.1" fill="#e2e6df" stroke="#7c9484" stroke-width="0.8" /><rect x="211.4" y="406.20000000000005" width="130.0" height="35.1" fill="#e2e6df" stroke="#7c9484" stroke-width="0.8" /><rect x="55.4" y="722.1" width="130.0" height="35.1" fill="#e2e6df" stroke="#7c9484" stroke-width="0.8" /><rect x="211.4" y="371.1" width="130.0" height="35.1" fill="#e2e6df" stroke="#7c9484" stroke-width="0.8" /><rect x="59.95" y="246.95000000000005" width="52.0" height="52.0" fill="#e6b2a3" fill-opacity="0.7" stroke="#b95142" stroke-width="2" /><text x="59.95" y="243.05000000000007" class="room">G0</text><rect x="289.4" y="246.95000000000005" width="52.0" height="52.0" fill="#e6b2a3" fill-opacity="0.7" stroke="#b95142" stroke-width="2" /><text x="289.4" y="243.05000000000007" class="room">G1</text><rect x="172.4" y="505.0" width="52.0" height="52.0" fill="#e6b2a3" fill-opacity="0.7" stroke="#b95142" stroke-width="2" /><text x="172.4" y="501.1" class="room">G2</text><rect x="59.95" y="440.0" width="52.0" height="52.0" fill="#e6b2a3" fill-opacity="0.7" stroke="#b95142" stroke-width="2" /><text x="59.95" y="436.1" class="room">G3</text><line x1="201.0" y1="297.0" x2="201.0" y2="306.1" stroke="#277c79" stroke-width="2" stroke-dasharray="4 3" /><line x1="201.0" y1="306.1" x2="120.4" y2="306.1" stroke="#277c79" stroke-width="2" stroke-dasharray="4 3" /><line x1="295.9" y1="297.0" x2="276.4" y2="297.0" stroke="#277c79" stroke-width="2" stroke-dasharray="4 3" /><line x1="276.4" y1="297.0" x2="120.4" y2="306.1" stroke="#277c79" stroke-width="2" stroke-dasharray="4 3" /><text x="45" y="175" class="small">街門名義中心x1200</text><text x="365" y="292" class="small">側門名義中心y4400 →</text><text x="45" y="960" class="small">兩條700局部試線；未模擬門片</text><text x="590" y="145">G0原400×400占完整入口平台0.16㎡。不是已留的免費空井；列明街門／側門至左跑</text><text x="590" y="169">的兩條局部方塊都被切到。</text><text x="590" y="205">G1右前角避街門那一條，仍碰側門內到達；不能只說家具沒撞就判一樓不受影響。</text><text x="590" y="241">G2想放中央，但兩跑各1000、總幅2200只剩200mm縫，400井超出縫並碰左右踏</text><text x="590" y="265">步投影。</text><text x="590" y="301">G3左跑下方的直立柱穿列明低踏步，不能把樓梯下方全部當垂直貫通空間。</text><text x="590" y="337">四位置都是反例，沒有找到可直接套用的落水。需重新整合井、平台與真實梁板；不宣稱所有建築</text><text x="590" y="361">解法無效。</text><text x="590" y="397">兩入口各三態原來源保留；只核G0與房界／器具及局部平台，沒有重演完整搬轎、門扇或照護路</text><text x="590" y="421">線。</text><text x="590" y="457">街／側門只有名義中心，700試線也不當法定寬、扶手後完成淨寬或逃生核可。原24級、踏面</text><text x="590" y="481">270及1000單跑不減。</text></svg>
