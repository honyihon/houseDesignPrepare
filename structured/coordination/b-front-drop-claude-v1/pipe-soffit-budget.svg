<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="G4／G4D／G5｜管頂與最不利後緣梯底分開列帳"><title>G4／G4D／G5｜管頂與最不利後緣梯底分開列帳</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}.room{font-size:14px;font-weight:650}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">G4／G4D／G5｜管頂與最不利後緣梯底分開列帳</text><text x="28" y="76">Claude第一輪交叉核對＋Codex條件提案／未採用｜G4D待第二輪，不是共識、施工或專業核可。</text><text x="28" y="1158" class="small">本批 ab6ef44605ff271d830d70ecf51fb451581cb3fb3fc5e30bfd12415e6f295c59</text><text x="28" y="1182" class="small">原ABC／3D及149控制保留；數值為列明模型，無實測、產品、風水、消防或搬運核可，未跑瀏覽器。</text><text x="40" y="130">樂觀鼻線平行梯底；未有真實階梯、梯板、梯梁／平台梁，不能當施工剖面。</text><text x="40" y="190">法向板厚例</text><text x="245" y="190">後緣假梯底</text><text x="510" y="190">G4上方餘量</text><text x="760" y="190">G4D上方餘量</text><text x="1050" y="190">G5上方餘量</text><text x="40" y="240">150mm</text><text x="245" y="240">3397.8mm</text><text x="510" y="240">-357.1mm</text><text x="760" y="240">142.9mm</text><text x="1050" y="240">-380.4mm</text><text x="40" y="288">200mm</text><text x="245" y="288">3339.0mm</text><text x="510" y="288">-415.9mm</text><text x="760" y="288">84.1mm</text><text x="1050" y="288">-439.2mm</text><text x="40" y="336">250mm</text><text x="245" y="336">3280.3mm</text><text x="510" y="336">-474.6mm</text><text x="760" y="336">25.4mm</text><text x="1050" y="336">-497.9mm</text><text x="40" y="384">300mm</text><text x="245" y="384">3221.5mm</text><text x="510" y="384">-533.4mm</text><text x="760" y="384">-33.4mm</text><text x="1050" y="384">-556.7mm</text><text x="40" y="465">表內已扣上方50安裝間隔，額外接頭0例；另有25／50例，並非產品不用接頭。</text><text x="40" y="525">200mm假板厚例：鼻線／假梯底與兩個管頂界</text><line x1="70" y1="759.4454399999998" x2="590" y2="890.3093299999998" stroke="#687d70" stroke-width="5" /><line x1="70" y1="696.4029999999999" x2="590" y2="696.4029999999999" stroke="#b95142" stroke-width="3" stroke-dasharray="5 3" /><text x="75" y="684.4029999999999" class="small">G4最高管頂界 3704.9</text><line x1="70" y1="961.4029999999999" x2="590" y2="961.4029999999999" stroke="#277c79" stroke-width="3" stroke-dasharray="5 3" /><text x="75" y="949.4029999999999" class="small">G4D最高管頂界 3204.9</text><text x="70" y="1110" class="small">前緣y4990 → 後緣y5390；後方梯底較低</text><text x="680" y="570">原G4和G5的高管位在列明厚度例都容不下；高回程下有地面空間，不等於進</text><text x="680" y="594">管高程也成立。</text><text x="680" y="630">G4D向下落500，最高管頂界約3204.9；在部分假設可避梯底，但3</text><text x="680" y="654">00mm例仍失守。250mm再多25接頭只餘約0.4，不能當穩定設計餘</text><text x="680" y="678">量。</text><text x="680" y="714">垂直落差降低室內包管；最小末端預算2961.6，不是已核室內淨高。各區</text><text x="680" y="738">淨高、防火、門上構造、水力、通氣及檢修全待核。</text><text x="680" y="774">鼻線減t／cos只是樂觀近似，不含真正台階構造、梯梁或平台梁。上方50</text><text x="680" y="798">與下方檢修50不同面，不互相抵用。</text></svg>
