<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="A後側候選｜直入共用洗衣陽台，外側通路待確認"><title>A後側候選｜直入共用洗衣陽台，外側通路待確認</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}.room{font-size:15px;font-weight:650}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">A後側候選｜直入共用洗衣陽台，外側通路待確認</text><text x="28" y="78">獨立到達研究／未採用｜mm座標；只核固定房界反例與基地內試線，未核門外動線、實際門組或照護。</text><text x="28" y="106">三棟共用一組；C2暫不用保空間、A2以上另留機位。A原室內分區及洗衣設備備位保留。</text><text x="28" y="1157" class="small">本批 cccb8e77b8ff54e162bc27746b1cef493f02e6fd53d43bb19ffe49e41db18730</text><text x="28" y="1183" class="small">原3D與已驗ZIP不改；無新瀏覽器／WebGL或專業驗收。圖上空白與模型餘量不能當實測或商品安全距離。</text><rect x="65.0" y="233.7" width="1140.0" height="342.0" fill="#edf0e9" stroke="#6b8779" stroke-width="1" /><rect x="914.3" y="300.2" width="171.0" height="256.5" fill="#c9d5ce" stroke="#738577" stroke-dasharray="5 3" stroke-width="1" /><text x="999.8" y="428.45" text-anchor="middle" class="small">冷氣維修</text><rect x="293.0" y="233.7" width="209.0" height="171.0" fill="none" stroke="#738577" stroke-dasharray="5 3" stroke-width="1" /><text x="397.5" y="319.2" text-anchor="middle" class="small">原廚房門前</text><rect x="80.2" y="248.9" width="171.0" height="123.5" fill="#c9d5ce" stroke="#738577" stroke-dasharray="5 3" stroke-width="1" /><text x="165.7" y="310.65" text-anchor="middle" class="small">原淨軟水</text><rect x="701.5" y="255.55" width="161.5" height="142.5" fill="#f2b668" stroke="#986a36" /><text x="782.25" y="326.8" text-anchor="middle" class="small">共用洗衣備位</text><rect x="701.5" y="411.35" width="161.5" height="142.5" fill="#f2b668" stroke="#986a36" /><text x="782.25" y="482.6" text-anchor="middle" class="small">可選乾衣備位</text><rect x="255.0" y="449.35" width="228.0" height="95.0" fill="#cce5c4" stroke="#986a36" /><text x="369.0" y="496.85" text-anchor="middle" class="small">降下晾衣外廓</text><rect x="492.5" y="255.55" width="209.0" height="171.0" fill="none" stroke="#a86e39" stroke-dasharray="6 4" /><rect x="492.5" y="382.85" width="209.0" height="171.0" fill="none" stroke="#a86e39" stroke-dasharray="6 4" /><rect x="255.0" y="297.35" width="228.0" height="152.0" fill="none" stroke="#a86e39" stroke-dasharray="6 4" /><path d="M682.5,256.5 L511.5,256.5 L511.5,575.7 L682.5,575.7 L682.5,342.0 L682.5,256.5 Z" fill-rule="evenodd" fill="#9dc9e2" fill-opacity="0.45" stroke="#367c9c" stroke-dasharray="6 3" /><path d="M511.5,623.2 L511.5,708.7 L682.5,708.7 L682.5,575.7 L511.5,575.7 L511.5,623.2 Z" fill-rule="evenodd" fill="#e6d9f0" fill-opacity="0.6" stroke="#886c9b" stroke-dasharray="6 4" /><rect x="237.9" y="557.65" width="478.8" height="18.05" fill="none" stroke="#a54c37" stroke-dasharray="5 3" stroke-width="1.5" /><rect x="237.9" y="557.65" width="239.4" height="18.05" fill="#b99374" stroke="#67472e" stroke-width="1.2" /><line x1="483.0" y1="575.7" x2="711.0" y2="575.7" stroke="#2f86a0" stroke-width="3" /><text x="65" y="160">後門名義1200 → 扣總框230預算970；藍色只核基地內900試線</text><text x="65" y="755">棕色：全開門板；紅虛線：完整滑動包絡。移動時人與推車退出行程。</text><text x="45" y="820">紫色門外引線是未建模範圍，不表示共同後巷已連通；A／C合法接入、轉向、高差、雨棚及防滑都待資料。B有後巷不能推定A也能開門。</text><text x="45" y="856">陽台與原室內分區不減，衣物取送可在後口成立時避開A廚房及室內私領域。試線與洗／乾操作帶重疊，須先到達停妥再操作，不能同時穿越。</text><text x="45" y="892">門片包絡到乾衣備位20mm、到衣物外廓70mm，僅模型餘量。產品五金、接管、風雨、防盜、消防及平門檻／排水需同版核，未選門或機型。</text><text x="45" y="928">原小晾架容量、降下占1500轉位、設備完成面／完整維修、噪音振動與雨天排濕仍待核；新增後口不會自動解決。</text></svg>
