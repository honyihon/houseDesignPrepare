<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="Q2｜前側娛樂、後客房／公衛與工作天井"><title>Q2｜前側娛樂、後客房／公衛與工作天井</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}.room{font-size:13px;font-weight:650}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">Q2｜前側娛樂、後客房／公衛與工作天井</text><text x="28" y="76">獨立比較／未採用｜前量體、隔音、新風、RF天井與機位未核；原ABC／3D及P1／P2／P3保留。</text><text x="28" y="1158" class="small">本批來源 73787cd11a2b56a9db15bcef7082d1a233940d104c5ff5976108a68128bc8e5c</text><text x="28" y="1182" class="small">僅指定模型的幾何／算式，不代表聲學、產品、法規、風水、消防、搬運或施工核可。</text><polygon points="169.8,347.79999999999995 169.8,618.2 45.0,618.2 45.0,347.79999999999995" fill="#edf0e9" stroke="#607c73" stroke-width="0.8" /><text x="107.4" y="483.0" text-anchor="middle" class="room">原梯核</text><polygon points="357.0,347.79999999999995 169.8,347.79999999999995 169.8,618.2 45.0,618.2 45.0,736.24 357.0,736.24 357.0,618.2" fill="#edf0e9" stroke="#607c73" stroke-width="0.8" /><text x="263.4" y="483.0" text-anchor="middle" class="room">安靜起居／通行</text><rect x="302.4" y="441.4" width="46.8" height="93.6" fill="#b9c9be" stroke="#3c6355" stroke-width="0.7" /><rect x="232.2" y="459.59999999999997" width="31.2" height="57.199999999999996" fill="#b9c9be" stroke="#3c6355" stroke-width="0.7" /><rect x="177.6" y="467.4" width="4.16" height="52.0" fill="#b9c9be" stroke="#3c6355" stroke-width="0.7" /><polygon points="287.84,736.24 287.84,819.4399999999999 182.28,819.4399999999999 182.28,736.24" fill="#edf0e9" stroke="#607c73" stroke-width="0.8" /><text x="235.06" y="777.8399999999999" text-anchor="middle" class="room">完整乾保護室</text><line x1="193.2" y1="736.24" x2="251.95999999999998" y2="736.24" stroke="#fafbf8" stroke-width="3" /><polygon points="190.73,795.0 195.67,795.0 195.67,736.24 190.73,736.24 190.73,795.0" fill="#bb9474" stroke="#805534" stroke-width="