dth="36.4" height="23.4" fill="#b9c9be" stroke="#3c6355" stroke-width="0.7" /><rect x="304.21999999999997" y="1008.9799999999999" width="46.8" height="46.8" fill="#b9c9be" stroke="#3c6355" stroke-width="0.7" /><rect x="330.21999999999997" y="961.4" width="20.8" height="20.8" fill="#ca9d8b" stroke="#9c4634" /><line x1="292.0" y1="1061.76" x2="338.8" y2="1061.76" stroke="#168cae" stroke-width="3" /><polygon points="169.8,736.24 169.8,847.0 45.0,847.0 45.0,736.24" fill="#dceff4" stroke="#607c73" stroke-width="0.8" /><text x="107.4" y="791.62" text-anchor="middle" class="room">工作天井候選</text><line x1="104.8" y1="736.24" x2="163.56" y2="736.24" stroke="#fafbf8" stroke-width="3" /><polygon points="102.33,795.0 107.27,795.0 107.27,736.24 102.33,736.24 102.33,795.0" fill="#bb9474" stroke="#805534" stroke-width="0.6" /><polygon points="357.0,736.24 287.84,736.24 287.84,819.4399999999999 182.28,819.4399999999999 182.28,736.24 169.8,736.24 169.8,847.0 169.8,878.1999999999999 232.2,878.1999999999999 232.2,899.0 357.0,899.0" fill="#edf0e9" stroke="#607c73" stroke-width="0.8" /><text x="322.41999999999996" y="777.8399999999999" text-anchor="middle" class="room">公共到達</text><line x1="134.18" y1="373.79999999999995" x2="134.18" y2="262.0" stroke="#277c79" stroke-width="1.5" stroke-dasharray="4 3" /><line x1="134.18" y1="262.0" x2="227.0" y2="262.0" stroke="#277c79" stroke-width="1.5" stroke-dasharray="4 3" /><line x1="322.41999999999996" y1="706.6" x2="322.41999999999996" y2="783.04" stroke="#277c79" stroke-width="1.5" stroke-dasharray="4 3" /><line x1="322.41999999999996" y1="783.04" x2="322.41999999999996" y2="848.8199999999999" stroke="#277c79" stroke-width="1.5" stroke-dasharray="4 3" /><line x1="322.41999999999996" y1="848.8199999999999" x2="200.22" y2="848.8199999999999" stroke="#277c79" stroke-width="1.5" stroke-dasharray="4 3" /><line x1="200.22" y1="848.8199999999999" x2="200.22" y2="930.1999999999999" stroke="#277c79" stroke-width="1.5" stroke-dasharray="4 3" /><line x1="200.22" y1="930.1999999999999" x2="180.2" y2="930.1999999999999" stroke="#277c79" stroke-width="1.5" stroke-dasharray="4 3" /><line x1="180.2" y1="930.1999999999999" x2="180.2" y2="1000.4" stroke="#277c79" stroke-width="1.5" stroke-dasharray="4 3" /><line x1="200.22" y1="930.1999999999999" x2="138.6" y2="930.1999999999999" stroke="#277c79" stroke-width="1.5" stroke-dasharray="4 3" /><line x1="138.6" y1="930.1999999999999" x2="138.6" y2="928.38" stroke="#277c79" stroke-width="1.5" stroke-dasharray="4 3" /><line x1="138.6" y1="928.38" x2="100.38" y2="928.38" stroke="#277c79" stroke-width="1.5" stroke-dasharray="4 3" /><line x1="322.41999999999996" y1="706.6" x2="322.41999999999996" y2="869.62" stroke="#277c79" stroke-width="1.5" stroke-dasharray="4 3" /><line x1="322.41999999999996" y1="869.62" x2="305.0" y2="869.62" stroke="#277c79" stroke-width="1.5" stroke-dasharray="4 3" /><line x1="305.0" y1="869.62" x2="305.0" y2="941.9" stroke="#277c79" stroke-width="1.5" stroke-dasharray="4 3" /><line x1="305.0" y1="941.9" x2="305.0" y2="990.78" stroke="#277c79" stroke-width="1.5" stroke-dasharray="4 3" /><line x1="305.0" y1="990.78" x2="286.02" y2="990.78" stroke="#277c79" stroke-width="1.5" stroke-dasharray="4 3" /><line x1="286.02" y1="990.78" x2="286.02" y2="1032.38" stroke="#277c79" stroke-width="1.5" stroke-dasharray="4 3" /><line x1="134.18" y1="706.6" x2="134.18" y2="810.6" stroke="#277c79" stroke-width="1.5" stroke-dasharray="4 3" /><line x1="170.83999999999997" y1="878.1999999999999" x2="229.6" y2="878.1999999999999" stroke="#fafbf8" stroke-width="3" /><rect x="133.92000000000002" y="884.18" width="34.32" height="2.34" fill="#bb9474" stroke="#805534" stroke-width="0.6" /><rect x="133.92000000000002" y="888.5999999999999" width="34.32" height="2.34" fill="#bb9474" stroke="#805534" stroke-width="0.6" /><line x1="275.62" y1="899.0" x2="334.38" y2="899.0" stroke="#fafbf8" stroke-width="3" /><rect x="238.7" y="891.4599999999999" width="34.32" height="2.34" fill="#bb9474" stroke="#805534" stroke-width="0.6" /><rect x="238.7" y="895.88" width="34.32" height="2.34" fill="#bb9474" stroke="#805534" stroke-width="0.6" /><line x1="293.03999999999996" y1="736.24" x2="351.8" y2="736.24" stroke="#fafbf8" stroke-width="3" /><text x="45" y="120" class="small">前方道路／1F騎樓在此下方</text><text x="45" y="1090" class="small">6×17.63m研究框，約32地坪；不是可建量核定</text><text x="445" y="145">前娛樂基準扣井21.0159㎡；再加100mm／面空間預算後19.2079㎡，未達20目標；14</text><text x="445" y="169">下限不等於屋主已接受縮房。</text><text x="445" y="205">客房12.423、公衛6.133、工作天井115輪廓4.123㎡；公衛對齊2F套衛，前彈性／安靜</text><text x="445" y="229">區29.2948㎡仍保護祭祀投影。</text><text x="445" y="265">前側室內23.400㎡，較P3多10.647㎡；原前景觀／設備位置被取代，全部須納入正式量體與結</text><text x="445" y="289">構設計。</text><text x="445" y="325">2F前井400×400仍穿娛樂室；3F浴室移後不代表P3騎樓／梯核排水缺口解除。</text><text x="445" y="361">取消原露台門作固定分隔，娛樂先由梯核進；原梯段、側門／平台與新聲學門組未核，不宣稱消防成立。</text><text x="445" y="397">後客房原雙人床與櫃保尺寸；偏位門中軸避床體，沒有完整家規或照護核可。</text><text x="445" y="433">四組門各三態共81組；天井由公共起居直達，不穿客房。全開才通相關700方塊，門淨寬、門檻防雨與救</text><text x="445" y="457">援未知。</text><text x="445" y="493">天井在2F部分梳妝更衣乾區上方，防水與漏水維護未核；需RF板洞及另圖機位／護欄／繞行，不當已核陽</text><text x="445" y="517">台。</text><text x="445" y="553">前側位置較少壓樓下睡眠區；窗門、風管、樓板和機位仍傳聲，沒有dB或夜間使用承諾。</text></svg>
