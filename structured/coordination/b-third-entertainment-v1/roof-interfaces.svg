<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="Q2必要代價｜RF代表機位、工作天井板洞與繞行"><title>Q2必要代價｜RF代表機位、工作天井板洞與繞行</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}.room{font-size:13px;font-weight:650}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">Q2必要代價｜RF代表機位、工作天井板洞與繞行</text><text x="28" y="76">獨立比較／未採用｜前量體、隔音、新風、RF天井與機位未核；原ABC／3D及P1／P2／P3保留。</text><text x="28" y="1158" class="small">本批來源 73787cd11a2b56a9db15bcef7082d1a233940d104c5ff5976108a68128bc8e5c</text><text x="28" y="1182" class="small">僅指定模型的幾何／算式，不代表聲學、產品、法規、風水、消防、搬運或施工核可。</text><rect x="45.0" y="145.0" width="312.0" height="916.76" fill="#eef0e7" stroke="#607c73" /><polygon points="357.0,347.79999999999995 169.8,347.79999999999995 169.8,618.2 45.0,618.2 45.0,736.24 357.0,736.24 357.0,618.2" fill="#f1ded6" stroke="#b88b7a" fill-opacity="0.65" /><polygon points="287.84,736.24 287.84,819.4399999999999 182.28,819.4399999999999 182.28,736.24" fill="#f1ded6" stroke="#b88b7a" fill-opacity="0.65" /><rect x="45.0" y="347.79999999999995" width="124.8" height="270.4" fill="#d2d9e0" stroke="#66758b" /><rect x="45.0" y="736.24" width="124.8" height="110.75999999999999" fill="#c8dce4" stroke="#497589" stroke-width="2" /><rect x="215.04" y="150.2" width="46.8" height="70.2" fill="none" stroke="#b78447" stroke-dasharray="4 3" /><rect x="215.04" y="150.2" width="46.8" height="18.2" fill="#c2ccd6" stroke="#536b80" /><rect x="306.03999999999996" y="150.2" width="46.8" height="70.2" fill="none" stroke="#b78447" stroke-dasharray="4 3" /><rect x="306.03999999999996" y="150.2" width="46.8" height="18.2" fill="#c2ccd6" stroke="#536b80" /><rect x="118.84" y="1038.3600000000001" width="46.8" height="18.2" fill="#b2c6b7" stroke="#486650" /><rect x="49.16" y="1038.3600000000001" width="46.8" height="18.2" fill="#b2c6b7" stroke="#486650" /><line x1="193.2" y1="373.79999999999995" x2="323.2" y2="373.79999999999995" stroke="#277c79" stroke-width="1.8" stroke-dasharray="4 3" /><line x1="323.2" y1="373.79999999999995" x2="323.2" y2="202.2" stroke="#277c79" stroke-width="1.8" stroke-dasharray="4 3" /><line x1="323.2" y1="202.2" x2="238.44" y2="202.2" stroke="#277c79" stroke-width="1.8" stroke-dasharray="4 3" /><line x1="193.2" y1="373.79999999999995" x2="323.2" y2="373.79999999999995" stroke="#277c79" stroke-width="1.8" stroke-dasharray="4 3" /><line x1="323.2" y1="373.79999999999995" x2="323.2" y2="873.0" stroke="#277c79" stroke-width="1.8" stroke-dasharray="4 3" /><line x1="323.2" y1="873.0" x2="142.24" y2="873.0" stroke="#277c79" stroke-width="1.8" stroke-dasharray="4 3" /><line x1="142.24" y1="873.0" x2="142.24" y2="1018.5999999999999" stroke="#277c79" stroke-width="1.8" stroke-dasharray="4 3" /><line x1="193.2" y1="373.79999999999995" x2="323.2" y2="373.79999999999995" stroke="#277c79" stroke-width="1.8" stroke-dasharray="4 3" /><line x1="323.2" y1="373.79999999999995" x2="323.2" y2="873.0" stroke="#277c79" stroke-width="1.8" stroke-dasharray="4 3" /><line x1="323.2" y1="873.0" x2="72.56" y2="873.0" stroke="#277c79" stroke-width="1.8" stroke-dasharray="4 3" /><line x1="72.56" y1="873.0" x2="72.56" y2="1018.5999999999999" stroke="#277c79" stroke-width="1.8" stroke-dasharray="4 3" /><text x="45" y="130" class="small">RF前側：兩個替代代表機位</text><text x="48" y="780" class="room">天井需RF板洞</text><text x="50" y="1090" class="small">原B-AC03／04保留</text><text x="445" y="145">本圖是Q2所需的RF介面比較，原屋頂快照沒有修改；不是原RF不需調整的方案。</text><text x="445" y="181">兩個900×350代表位置及1350深維修預算由三樓前帶轉到RF前側比較；身分／服務範圍未定，不</text><text x="445" y="205">能當兩台新機或重複加購。</text><text x="445" y="241">原B-AC03／04後機位保持來源位置。屋頂其他水塔／熱泵／新風與結構需求仍保留，空白不當可任意</text><text x="445" y="265">放設備。</text><text x="445" y="301">工作天井板洞5.112㎡占原後機位區前端，原直走入口被截斷。虛線從RF側門外指定點繞右側、再從天</text><text x="445" y="325">井後緣繞回。</text><text x="445" y="361">700方塊只比列明平面，另留100護欄預算；實際屋突門、梯段、護欄、雨天防滑、設備拆運與承重／防</text><text x="445" y="385">颱均未核。</text><text x="445" y="421">機位與新板洞避名義祭祀保護／列明機身，但管線、排水、穿孔及振動沒有因此取得家規或工程核可。</text><text x="445" y="457">新冷媒／冷凝水與天井雨水、生活污廢水分系統重排；不借舊機位路線或400井預算稱容量足。</text><text x="445" y="493">若合法量體、RF開口或機位不成立，Q2不能整套採用；Q1和所有原功能目標繼續保留。</text></svg>
