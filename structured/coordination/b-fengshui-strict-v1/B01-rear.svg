 fill-opacity="0.55" stroke="#548451" stroke-dasharray="5 3" /><ns0:polygon points="1219.05,705.215 1302.0,705.215 1302.0,796.065 1219.05,796.065" fill="#ddb486" fill-opacity="0.65" stroke="#a16b35" /><ns0:polygon points="1219.05,796.065 1302.0,796.065 1302.0,881.385 1219.05,881.385" fill="#ddb486" fill-opacity="0.65" stroke="#a16b35" /><ns0:rect x="1065.0" y="757.75" width="131.535" height="123.635" fill="none" stroke="#5e83a0" stroke-width="2" /><ns0:rect x="1169.28" y="634.115" width="80.185" height="63.2" fill="none" stroke="#b45751" stroke-width="2" stroke-dasharray="5 3" /><ns0:text x="30" y="937" class="small">綠色完整保護區：神明堂＋神桌乾背櫃；橘色：新上層浴廁；藍框：後左武轎庫。名義投影不重疊。</ns0:text><ns0:text x="30" y="969" class="small">不是只移床：背櫃正上方改成獨立乾室，整間L房也退出保護區；後窗2400保留、機位移回臥室。</ns0:text><ns0:text x="30" y="1001" class="small">代價：套衛115假設內縮僅3.6091㎡，未達原4.5㎡下限；主臥20.1141㎡餘量薄。本案未採用。</ns0:text></ns0:svg>
