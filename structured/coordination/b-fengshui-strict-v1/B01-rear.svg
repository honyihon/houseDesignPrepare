<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" width="1400" height="1100" role="img" aria-labelledby="title desc"><ns0:title id="title">B嚴格01｜後門優先／前門備案保留</ns0:title><ns0:desc id="desc">ABC獨立深化比較，未採用。毫米局部模型座標，道路在上方；完整門組、結構及專業核對未完成。</ns0:desc><ns0:style>text{font-family:system-ui,sans-serif;font-size:17px;fill:#263e49} .title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:650}.small{font-size:14px}.tiny{font-size:12px}</ns0:style><ns0:rect x="0" y="0" width="1400" height="1100" fill="#fafbf8" /><ns0:text x="30" y="42" class="title">B嚴格01｜後門優先／前門備案保留</ns0:text><ns0:text x="30" y="78">深化比較／未採用｜單位mm；來源是概念模型，梁柱、完成面、商品及實際路徑待核。</ns0:text><ns0:text x="30" y="1053" class="small">來源 bc1e2175f13cff04…｜本批 f4f39d210d8d8dbf…</ns0:text><ns0:text x="30" y="1077" class="small">原ABC／目前3D及正式產品回覆保留。圖上名義尺寸與方塊試排，不等於施工、照護、風水或搬運核可。</ns0:text><ns0:metadata>{"source_sha256": "bc1e2175f13cff043deeb725e190a3b59908810f58661d9efadec05efbca9a5e", "report_hash": "f4f39d210d8d8dbf13eac4df333e2726139b045d69ad64bacf2069844929f767", "adopted": false}</ns0:metadata><ns0:text x="30" y="117">獨立比較：一樓只右移255；二三樓以L房避完整背櫃，後右濕區避神明堂與後左武轎庫。</ns0:text><ns0:text x="30" y="158" class="label">1F 日常</ns0:text><ns0:rect x="30.0" y="185.0" width="237.0" height="154.05" fill="#eee9d8" stroke="#9bada6" stroke-width="0.8" /><ns0:rect x="30.0" y="339.05" width="94.8" height="205.4" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:line x1="124.8" y1="339.0500316" x2="124.8" y2="378.5500316" stroke="#397e70" stroke-width="3" /><ns0:line x1="57.65" y1="339.05" x2="97.15" y2="339.05" stroke="#397e70" stroke-width="3" /><ns0:rect x="30.0" y="544.45" width="237.0" height="89.665" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:rect x="138.8225" y="607.255" width="71.1" height="23.7" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:rect x="150.6725" y="587.505" width="47.4" height="19.75" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:rect x="72.66" 