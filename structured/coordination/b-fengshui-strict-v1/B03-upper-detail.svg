<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" width="1400" height="1100" role="img" aria-labelledby="title desc"><ns0:title id="title">B嚴格03｜L形主臥與兩衛浴：原尺寸／門前／操作</ns0:title><ns0:desc id="desc">ABC獨立深化比較，未採用。毫米局部模型座標，道路在上方；完整門組、結構及專業核對未完成。</ns0:desc><ns0:style>text{font-family:system-ui,sans-serif;font-size:17px;fill:#263e49} .title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:650}.small{font-size:14px}.tiny{font-size:12px}</ns0:style><ns0:rect x="0" y="0" width="1400" height="1100" fill="#fafbf8" /><ns0:text x="30" y="42" class="title">B嚴格03｜L形主臥與兩衛浴：原尺寸／門前／操作</ns0:text><ns0:text x="30" y="78">深化比較／未採用｜單位mm；來源是概念模型，梁柱、完成面、商品及實際路徑待核。</ns0:text><ns0:text x="30" y="1053" class="small">來源 bc1e2175f13cff04…｜本批 f4f39d210d8d8dbf…</ns0:text><ns0:text x="30" y="1077" class="small">原ABC／目前3D及正式產品回覆保留。圖上名義尺寸與方塊試排，不等於施工、照護、風水或搬運核可。</ns0:text><ns0:metadata>{"source_sha256": "bc1e2175f13cff043deeb725e190a3b59908810f58661d9efadec05efbca9a5e", "report_hash": "f4f39d210d8d8dbf13eac4df333e2726139b045d69ad64bacf2069844929f767", "adopted": false}</ns0:metadata><ns0:text x="30" y="115">每面115為假設；橘虛框為700操作帶，可分時共用，不能被另一固定本體占用。</ns0:text><ns0:polygon points="40.0,180.0 256.48,180.0 256.48,311.20000000000005 359.8,311.20000000000005 359.8,693.32 40.0,693.32" fill="#edf1ec" stroke="#819990" stroke-width="1" /><ns0:rect x="52.3" y="394.43" width="164.0" height="147.6" fill="#b9c9cc" stroke="#6e8c91" /><ns0:text x="55.17" y="412.47" class="tiny">床</ns0:text><ns0:rect x="216.3" y="394.43" width="49.2" height="147.6" fill="none" stroke="#ba9255" stroke-dasharray="4 3" /><ns0:rect x="301.17" y="320.63" width="49.2" height="147.6" fill="#b9c9cc" stroke="#6e8c91" /><ns0:text x="304.04" y="338.67" class="tiny">衣櫃</ns0:text><ns0:rect x="251.97" y="320.63" width="49.2" height="147.6" fill="none" stroke="#ba9255" stroke-dasharray="4 3" /><ns0:rect x="52.3" y="192.3" width="41.0" height="98.4" fill="#b9c9cc" stroke="#6e8c91" /><ns0:text x="55.17" y="210.34" class="tiny">梳妝台</ns0:text><ns0:rect x="93.30000000000001" y="192.3" width="57.400000000000006" height="98.4" fill="none" stroke="#ba9255" stroke-dasharray="4 3" /><ns0:line x1="148.24" y1="180.0" x2="240.9" y2="180.0" stroke="#388470" stroke-width="4" /><ns0:line x1="359.8" y1="586.72" x2="359.8" y2="679.38" stroke="#388470" stroke-width="4" /><ns0:line x1="101.5" y1="693.32" x2="298.3" y2="693.32" stroke="#53a5bc" stroke-width="5" /><ns0:rect x="247.05" y="669.54" width="77.9" height="22.96" fill="#76adc4" stroke="#477b90" /><ns0:polygon points="256.48,180.0 422.94,180.0 422.94,311.20000000000005 256.48,311.20000000000005" fill="#d6e7d7" stroke="#819990" stroke-width="1" /><ns0:line x1="422.94" y1="199.27" x2="422.94" y2="291.93" stroke="#388470" stroke-width="4" /><ns0:polygon points="422.94,180.0 532.0,180.0 532.0,327.6 359.8,327.6 359.8,311.20000000000005 422.94,311.20000000000005" fill="#edf1ec" stroke="#819990" stroke-width="1" /><ns0:polygon points="359.8,327.6 532.0,327.6 532.0,516.2 359.8,516.2" fill="#e1ecee" stroke="#819990" stroke-width="1" /><ns0:rect x="381.53000000000003" y="449.37" width="36.9" height="57.400000000000006" fill="#b9c9cc" stroke="#6e8c91" /><ns0:text x="384.40000000000003" y="467.41" class="tiny">WC</ns0:text><ns0:rect x="381.53000000000003" y="391.97" width="36.9" height="57.400000000000006" fill="none" stroke="#ba9255" stroke-dasharray="4 3" /><ns0:rect x="369.23" y="337.03" width="49.2" height="36.9" fill="#b9c9cc" stroke="#6e8c91" /><ns0:text x="372.1" y="355.07" class="tiny">盆</ns0:text><ns0:rect x="369.23" y="373.93" width="49.2" height="57.400000000000006" fill="none" stroke="#ba9255" stroke-dasharray="4 3" /><ns0:rect x="448.77000000000004" y="432.97" width="73.8" height="73.8" fill="#b9c9cc" stroke="#6e8c91" /><ns0:text x="451.64000000000004" y="451.01" class="tiny">900淋浴</ns0:text><ns0:rect x="448.77000000000004" y="375.57000000000005" width="73.8" height="57.400000000000006" fill="none" stroke="#ba9255" stroke-dasharray="4 3" /><ns0:line x1="422.94" y1="327.6" x2="515.6" y2="327.6" stroke="#388470" stroke-width="4" /><ns0:polygon points="359.8,516.2 532.0,516.2 532.0,693.32 359.8,693.32" fill="#e1ecee" stroke="#819990" stroke-width="1" /><ns0:rect x="381.53000000000003" y="525.63" width="36.9" height="57.400000000000006" fill="#b9c9cc" stroke="#6e8c91" /><ns0:text x="384.40000000000003" y="543.6700000000001" class="tiny">WC</ns0:text><ns0:rect x="381.53000000000003" y="583.03" width="36.9" height="57.400000000000006" fill="none" stroke="#ba9255" stroke-dasharray="4 3" /><ns0:rect x="477.47" y="525.63" width="45.1" height="73.8" fill="#b9c9cc" stroke="#6e8c91" /><ns0:text x="480.34000000000003" y="543.6700000000001" class="tiny">盆</ns0:text><ns0:rect x="420.07" y="525.63" width="57.400000000000006" height="73.8" fill="none" stroke="#ba9255" stroke-dasharray="4 3" /><ns0:rect x="448.77000000000004" y="610.09" width="73.8" height="73.8" fill="#b9c9cc" stroke="#6e8c91" /><ns0:text x="451.64000000000004" y="628.13" class="tiny">900淋浴</ns0:text><ns0:rect x="391.37" y="610.09" width="57.400000000000006" height="73.8" fill="none" stroke="#ba9255" stroke-dasharray="4 3" /><ns0:line x1="359.8" y1="586.72" x2="359.8" y2="679.38" stroke="#388470" stroke-width="4" /><ns0:line x1="429.5" y1="693.32" x2="503.3" y2="693.32" stroke="#53a5bc" stroke-width="5" /><ns0:circle cx="194.57" cy="253.8" r="3" fill="#4c8b54" /><ns0:circle cx="194.57" cy="357.53" r="3" fill="#4c8b54" /><ns0:circle cx="258.94" cy="357.53" r="3" fill="#4c8b54" /><ns0:circle cx="258.94" cy="571.96" r="3" fill="#4c8b54" /><ns0:circle cx="313.47" cy="571.96" r="3" fill="#4c8b54" /><ns0:circle cx="313.47" cy="633.46" r="3" fill="#4c8b54" /><ns0:polyline points="194.57,253.8 194.57,357.53 258.94,357.53 258.94,571.96 313.47,571.96 313.47,633.46" fill="none" stroke="#4c8b54" stroke-width="2" stroke-dasharray="5 4" /><ns0:rect x="267.14" y="671.59" width="92.66000000000001" height="7.79" fill="#ddbc8c" stroke="#9b6a38" /><ns0:rect x="507.81" y="234.94" width="7.79" height="92.66000000000001" fill="#ddbc8c" stroke="#9b6a38" /><ns0:rect x="432.37" y="337.03" width="73.8" height="73.8" fill="none" stroke="#549567" stroke-dasharray="6 3" /><ns0:rect x="267.14" y="671.59" width="92.66000000000001" height="7.79" fill="#ddbc8c" stroke="#9b6a38" /><ns0:rect x="369.23" y="596.1500000000001" width="73.8" height="73.8" fill="none" stroke="#549567" stroke-dasharray="6 3" /><ns0:text x="600" y="180">L房原尺寸：</ns0:text><ns0:text x="600" y="211">床1800×2000、衣櫃1800×600、</ns0:text><ns0:text x="600" y="242">梳妝台1200×500，均不縮。</ns0:text><ns0:text x="600" y="273">900方塊只驗房內若干直段；</ns0:text><ns0:text x="600" y="304">前臂轉彎已避床與固定衣櫃。</ns0:text><ns0:text x="600" y="335">衣櫃／梳妝與通行必須分時。</ns0:text><ns0:text x="600" y="366" /><ns0:text x="600" y="397">公衛前門從公共乾廳到達。</ns0:text><ns0:text x="600" y="428">套衛側門只通主臥，向房內外開。</ns0:text><ns0:text x="600" y="459">套衛採後鉸鏈，開到底的門片</ns0:text><ns0:text x="600" y="490">預算在到達後方，產品尚未核。</ns0:text><ns0:text x="600" y="521" /><ns0:text x="600" y="552">便器450×700、900淋浴不縮。</ns0:text><ns0:text x="600" y="583">公衛盆600×450；套衛保留</ns0:text><ns0:text x="600" y="614">原900×550盆櫃，轉右牆排列。</ns0:text><ns0:text x="600" y="645">兩衛浴均有700操作帶試排。</ns0:text><ns0:text x="600" y="775" class="small">不能直接定案：</ns0:text><ns0:text x="600" y="806" class="small">套衛名義4.536㎡，115假設後3.6091㎡；</ns0:text><ns0:text x="600" y="837" class="small">公衛名義4.83㎡，115假設後3.8709㎡。</ns0:text><ns0:text x="600" y="868" class="small">完成面、門組、角閥、馬桶管距、櫃門與</ns0:text><ns0:text x="600" y="899" class="small">排水坡／地漏及排氣均未知。</ns0:text><ns0:text x="600" y="930" class="small">不把本體放得下當面積要求已達標。</ns0:text><ns0:text x="30" y="930" class="small">床／浴廁門直角投影已錯開，梳妝台放前臂避床；完整鏡面、斜視線及坐向仍未核。</ns0:text><ns0:text x="30" y="963" class="small">普通兩衛浴不是1F照護衛浴；新後窗保留自然通風候選，不等開窗權利或排氣已核。</ns0:text></ns0:svg>
