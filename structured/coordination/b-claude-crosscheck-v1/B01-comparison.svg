<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" width="1400" height="1100" role="img" aria-labelledby="title desc"><ns0:title id="title">B-Claude01｜前案／Claude新案／Codex餘量比較</ns0:title><ns0:desc id="desc">ABC獨立深化比較，未採用。毫米局部模型座標，道路在上方；完整門組、結構及專業核對未完成。</ns0:desc><ns0:style>text{font-family:system-ui,sans-serif;font-size:17px;fill:#263e49} .title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:650}.small{font-size:14px}.tiny{font-size:12px}</ns0:style><ns0:rect x="0" y="0" width="1400" height="1100" fill="#fafbf8" /><ns0:text x="30" y="42" class="title">B-Claude01｜前案／Claude新案／Codex餘量比較</ns0:text><ns0:text x="30" y="78">深化比較／未採用｜單位mm；來源是概念模型，梁柱、完成面、商品及實際路徑待核。</ns0:text><ns0:text x="30" y="1053" class="small">來源 bc1e2175f13cff04…｜本批 8e4b37a7aad8eccd…</ns0:text><ns0:text x="30" y="1077" class="small">原ABC／目前3D及正式產品回覆保留。圖上名義尺寸與方塊試排，不等於施工、照護、風水或搬運核可。</ns0:text><ns0:metadata>{"source_sha256": "bc1e2175f13cff043deeb725e190a3b59908810f58661d9efadec05efbca9a5e", "report_hash": "8e4b37a7aad8eccd78752c16372ec92a3fa5158d4723d7c6dde49a2486db1656", "adopted": false}</ns0:metadata><ns0:text x="30" y="116">三案保持一樓同軸祭祀門、獨立乾背櫃與前後搬轎兩版；本張只比較二樓後段。</ns0:text><ns0:text x="30" y="158" class="label">前案：公衛與套衛均在後右</ns0:text><ns0:polygon points="30.0,195.0 193.68,195.0 193.68,294.2 271.8,294.2 271.8,583.12 30.0,583.12" fill="#edf1ec" stroke="#819990" stroke-width="1" /><ns0:rect x="39.3" y="357.13" width="124.0" height="111.6" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="227.47" y="301.33" width="37.2" height="111.6" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="39.3" y="204.3" width="31.0" height="74.4" fill="#b9c9cc" stroke="#6e8c91" /><ns0:line x1="111.84" y1="195.0" x2="181.9" y2="195.0" stroke="#388470" stroke-width="4" /><ns0:line x1="271.8" y1="502.52" x2="271.8" y2="572.5799999999999" stroke="#388470" stroke-width="4" /><ns0:line x1="76.5" y1="583.12" x2="225.3" y2="583.12" stroke="#53a5bc" stroke-width="5" /><ns0:rect x="186.55" y="565.14" width="58.9" height="17.36" fill="#76adc4" stroke="#477b90" /><ns0:polygon points="193.68,195.0 319.54,195.0 319.54,294.2 193.68,294.2" fill="#d6e7d7" stroke="#819990" stroke-width="1" /><ns0:line x1="319.54" y1="209.57" x2="319.54" y2="279.63" stroke="#388470" stroke-width="4" /><ns0:polygon points="319.54,195.0 402.0,195.0 402.0,306.6 271.8,306.6 271.8,294.2 319.54,294.2" fill="#edf1ec" stroke="#819990" stroke-width="1" /><ns0:polygon points="271.8,306.6 402.0,306.6 402.0,449.2 271.8,449.2" fill="#e1ecee" stroke="#819990" stroke-width="1" /><ns0:rect x="288.23" y="398.66999999999996" width="27.9" height="43.4" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="278.93" y="313.73" width="37.2" height="27.9" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="339.07" y="386.27" width="55.8" height="55.8" fill="#b9c9cc" stroke="#6e8c91" /><ns0:line x1="319.54" y1="306.6" x2="389.6" y2="306.6" stroke="#388470" stroke-width="4" /><ns0:polygon points="271.8,449.2 402.0,449.2 402.0,583.12 271.8,583.12" fill="#e1ecee" stroke="#819990" stroke-width="1" /><ns0:rect x="288.23" y="456.33" width="27.9" height="43.4" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="360.77" y="456.33" width="34.1" height="55.8" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="339.07" y="520.19" width="55.8" height="55.8" fill="#b9c9cc" stroke="#6e8c91" /><ns0:line x1="271.8" y1="502.52" x2="271.8" y2="572.5799999999999" stroke="#388470" stroke-width="4" /><ns0:line x1="324.5" y1="583.12" x2="380.3" y2="583.12" stroke="#53a5bc" stroke-width="5" /><ns0:text x="30" y="635" class="small">每面115mm假設內縮：</ns0:text><ns0:text x="30" y="667" class="small">主臥 20.1141㎡</ns0:text><ns0:text x="30" y="699" class="small">公衛 3.8709㎡</ns0:text><ns0:text x="30" y="731" class="small">套衛 3.6091㎡</ns0:text><ns0:text x="30" y="763" class="small">套衛未達原4.5㎡下限。</ns0:text><ns0:text x="30" y="795" class="small">本案保留歷史比較。</ns0:text><ns0:text x="490" y="158" class="label">Claude：左前公衛、右後套衛</ns0:text><ns0:polygon points="779.54,195.0 862.0,195.0 862.0,406.41999999999996 731.8,406.41999999999996 731.8,583.12 490.0,583.12 490.0,325.2 653.6800000000001,325.2 653.6800000000001,294.2 779.54,294.2" fill="#edf1ec" stroke="#819990" stroke-width="1" /><ns0:rect x="499.3" y="454.16" width="124.0" height="111.6" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="499.3" y="334.5" width="37.2" height="111.6" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="660.81" y="303.5" width="74.4" height="31.0" fill="#b9c9cc" stroke="#6e8c91" /><ns0:line x1="785.74" y1="195.0" x2="855.8" y2="195.0" stroke="#388470" stroke-width="4" /><ns0:line x1="731.8" y1="502.52" x2="731.8" y2="572.5799999999999" stroke="#388470" stroke-width="4" /><ns0:line x1="536.5" y1="583.12" x2="685.3" y2="583.12" stroke="#53a5bc" stroke-width="5" /><ns0:rect x="646.55" y="558.01" width="58.9" height="17.36" fill="#76adc4" stroke="#477b90" /><ns0:polygon points="653.6800000000001,195.0 779.54,195.0 779.54,294.2 653.6800000000001,294.2" fill="#d6e7d7" stroke="#819990" stroke-width="1" /><ns0:line x1="666.7" y1="195.0" x2="736.76" y2="195.0" stroke="#388470" stroke-width="4" /><ns0:polygon points="490.0,195.0 653.6800000000001,195.0 653.6800000000001,325.2 490.0,325.2" fill="#e1ecee" stroke="#819990" stroke-width="1" /><ns0:rect x="497.13" y="202.13" width="37.2" height="27.9" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="497.13" y="274.67" width="27.9" height="43.4" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="590.75" y="262.27" width="55.8" height="55.8" fill="#b9c9cc" stroke="#6e8c91" /><ns0:line x1="571.84" y1="195.0" x2="641.9" y2="195.0" stroke="#388470" stroke-width="4" /><ns0:polygon points="731.8,406.41999999999996 862.0,406.41999999999996 862.0,583.12 731.8,583.12" fill="#e1ecee" stroke="#819990" stroke-width="1" /><ns0:rect x="748.23" y="413.55" width="27.9" height="43.4" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="820.77" y="413.55" width="34.1" height="55.8" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="799.0699999999999" y="477.41" width="55.8" height="55.8" fill="#b9c9cc" stroke="#6e8c91" /><ns0:line x1="731.8" y1="502.52" x2="731.8" y2="572.5799999999999" stroke="#388470" stroke-width="4" /><ns0:line x1="784.5" y1="583.12" x2="840.3" y2="583.12" stroke="#53a5bc" stroke-width="5" /><ns0:rect x="497.13" y="332.33000000000004" width="227.54" height="243.66" fill="none" stroke="#809a85" stroke-dasharray="5 4" /><ns0:polyline points="820.77,250.8 820.77,367.36 655.54,367.36 655.54,531.6600000000001 696.77,531.6600000000001 696.77,537.86" fill="none" stroke="#407d57" stroke-width="1.5" stroke-dasharray="5 4" /><ns0:text x="490" y="635" class="small">每面115mm假設內縮：</ns0:text><ns0:text x="490" y="667" class="small">主臥 20.0161㎡</ns0:text><ns0:text x="490" y="699" class="small">公衛 4.5067㎡</ns0:text><ns0:text x="490" y="731" class="small">套衛 4.8994㎡</ns0:text><ns0:text x="490" y="763" class="small">後段虛框可完整內接14.423㎡。</ns0:text><ns0:text x="490" y="795" class="small">主臥總面積含狹長入口與轉折。</ns0:text><ns0:text x="950" y="158" class="label">Codex：套衛前牆再後移100</ns0:text><ns0:polygon points="1239.54,195.0 1322.0,195.0 1322.0,412.62 1191.8,412.62 1191.8,583.12 950.0,583.12 950.0,325.2 1113.68,325.2 1113.68,294.2 1239.54,294.2" fill="#edf1ec" stroke="#819990" stroke-width="1" /><ns0:rect x="959.3" y="454.16" width="124.0" height="111.6" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="959.3" y="334.5" width="37.2" height="111.6" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="1120.81" y="303.5" width="74.4" height="31.0" fill="#b9c9cc" stroke="#6e8c91" /><ns0:line x1="1245.74" y1="195.0" x2="1315.8" y2="195.0" stroke="#388470" stroke-width="4" /><ns0:line x1="1191.8" y1="502.52" x2="1191.8" y2="572.5799999999999" stroke="#388470" stroke-width="4" /><ns0:line x1="996.5" y1="583.12" x2="1145.3" y2="583.12" stroke="#53a5bc" stroke-width="5" /><ns0:rect x="1106.55" y="558.01" width="58.9" height="17.36" fill="#76adc4" stroke="#477b90" /><ns0:polygon points="1113.68,195.0 1239.54,195.0 1239.54,294.2 1113.68,294.2" fill="#d6e7d7" stroke="#819990" stroke-width="1" /><ns0:line x1="1126.7" y1="195.0" x2="1196.76" y2="195.0" stroke="#388470" stroke-width="4" /><ns0:polygon points="950.0,195.0 1113.68,195.0 1113.68,325.2 950.0,325.2" fill="#e1ecee" stroke="#819990" stroke-width="1" /><ns0:rect x="957.13" y="202.13" width="37.2" height="27.9" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="957.13" y="274.67" width="27.9" height="43.4" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="1050.75" y="262.27" width="55.8" height="55.8" fill="#b9c9cc" stroke="#6e8c91" /><ns0:line x1="1031.84" y1="195.0" x2="1101.9" y2="195.0" stroke="#388470" stroke-width="4" /><ns0:polygon points="1191.8,412.62 1322.0,412.62 1322.0,583.12 1191.8,583.12" fill="#e1ecee" stroke="#819990" stroke-width="1" /><ns0:rect x="1208.23" y="419.75" width="27.9" height="43.4" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="1280.77" y="419.75" width="34.1" height="55.8" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="1259.07" y="483.61" width="55.8" height="55.8" fill="#b9c9cc" stroke="#6e8c91" /><ns0:line x1="1191.8" y1="502.52" x2="1191.8" y2="572.5799999999999" stroke="#388470" stroke-width="4" /><ns0:line x1="1244.5" y1="583.12" x2="1300.3" y2="583.12" stroke="#53a5bc" stroke-width="5" /><ns0:rect x="957.13" y="332.33000000000004" width="227.54" height="243.66" fill="none" stroke="#809a85" stroke-dasharray="5 4" /><ns0:polyline points="1280.77,250.8 1280.77,367.36 1115.54,367.36 1115.54,531.6600000000001 1156.77,531.6600000000001 1156.77,537.86" fill="none" stroke="#407d57" stroke-width="1.5" stroke-dasharray="5 4" /><ns0:text x="950" y="635" class="small">每面115mm假設內縮：</ns0:text><ns0:text x="950" y="667" class="small">主臥 20.2261㎡</ns0:text><ns0:text x="950" y="699" class="small">公衛 4.5067㎡</ns0:text><ns0:text x="950" y="731" class="small">套衛 4.7124㎡</ns0:text><ns0:text x="950" y="763" class="small">後段虛框可完整內接14.423㎡。</ns0:text><ns0:text x="950" y="795" class="small">主臥總面積含狹長入口與轉折。</ns0:text><ns0:text x="30" y="895" class="small">原面積目標仍保留：主臥20、公衛5、套衛6㎡；兩衛下限3.6／4.5㎡。Claude新案兩衛目標仍差1.5939㎡。</ns0:text><ns0:text x="30" y="932" class="small">Claude主臥115假設只餘0.0161㎡；每面多扣1mm即19.9925㎡。Codex100mm比較換到20.2261㎡，未經Claude確認。</ns0:text><ns0:text x="30" y="969" class="small">兩個新案的普通器具本體與700操作帶可試排；正式牆柱、完整門組、鏡面、排水與家規核可仍待資料。</ns0:text></ns0:svg>
