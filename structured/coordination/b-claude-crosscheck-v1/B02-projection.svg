相接，沒有前案200mm分區餘距；實際牆、防水與立管必須再合圖。</ns0:text><ns0:text x="30" y="1001" class="small">公衛從前方公共乾區直接進，不穿主臥；乾室有自己的前門，右後套衛僅通主臥。3F不新增第二衛浴。</ns0:text></ns0:svg>
