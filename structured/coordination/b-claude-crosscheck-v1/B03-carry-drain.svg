<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" width="1400" height="1100" role="img" aria-labelledby="title desc"><ns0:title id="title">B-Claude03｜搬轎與新公衛管道：兩版分開判斷</ns0:title><ns0:desc id="desc">ABC獨立深化比較，未採用。毫米局部模型座標，道路在上方；完整門組、結構及專業核對未完成。</ns0:desc><ns0:style>text{font-family:system-ui,sans-serif;font-size:17px;fill:#263e49} .title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:650}.small{font-size:14px}.tiny{font-size:12px}</ns0:style><ns0:rect x="0" y="0" width="1400" height="1100" fill="#fafbf8" /><ns0:text x="30" y="42" class="title">B-Claude03｜搬轎與新公衛管道：兩版分開判斷</ns0:text><ns0:text x="30" y="78">深化比較／未採用｜單位mm；來源是概念模型，梁柱、完成面、商品及實際路徑待核。</ns0:text><ns0:text x="30" y="1053" class="small">來源 bc1e2175f13cff04…｜本批 8e4b37a7aad8eccd…</ns0:text><ns0:text x="30" y="1077" class="small">原ABC／目前3D及正式產品回覆保留。圖上名義尺寸與方塊試排，不等於施工、照護、風水或搬運核可。</ns0:text><ns0:metadata>{"source_sha256": "bc1e2175f13cff043deeb725e190a3b59908810f58661d9efadec05efbca9a5e", "report_hash": "8e4b37a7aad8eccd78752c16372ec92a3fa5158d4723d7c6dde49a2486db1656", "adopted": false}</ns0:metadata><ns0:text x="30" y="116">上層公衛移左前，管道不能任意落在下層搬轎接段；尚無選定立管或排水終端。</ns0:text><ns0:text x="35" y="160" class="label">後門直接入庫</ns0:text><ns0:rect x="35.0" y="195.0" width="78.88000000000001" height="92.80000000000001" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:rect x="35.0" y="287.8" width="78.88000000000001" height="88.74000000000001" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:rect x="113.88000000000001" y="195.0" width="74.24000000000001" height="92.80000000000001" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:rect x="120.55000000000001" y="201.67" width="37.7" height="37.7" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:rect x="113.88000000000001" y="287.8" width="171.68" height="88.74000000000001" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:rect x="120.55000000000001" y="335.07" width="34.800000000000004" height="34.800000000000004" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:rect x="209.29000000000002" y="335.07" width="69.60000000000001" height="34.800000000000004" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:rect x="180.0" y="346.67" width="20.3" height="17.400000000000002" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:rect x="188.12" y="195.0" width="117.74000000000001" height="92.80000000000001" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:rect x="194.79000000000002" y="201.67" width="26.1" height="69.60000000000001" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:line x1="305.86" y1="208.63" x2="305.86" y2="274.17" stroke="#397e70" stroke-width="3" /><ns0:rect x="305.86" y="195.0" width="77.14" height="92.80000000000001" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:line x1="305.86" y1="208.63" x2="305.86" y2="274.17" stroke="#397e70" stroke-width="3" /><ns0:rect x="285.56" y="287.8" width="97.44000000000001" height="88.74000000000001" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:line x1="310.79" y1="376.54" x2="376.33000000000004" y2="376.54" stroke="#397e70" stroke-width="3" /><ns0:rect x="228.14000000000001" y="376.54" width="154.86" height="181.54000000000002" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:rect x="306.73" y="481.81" width="69.60000000000001" height="69.60000000000001" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:rect x="234.81" y="395.39" width="40.6" height="26.1" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:rect x="259.17" y="525.31" width="34.800000000000004" height="26.1" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:line x1="310.79" y1="376.54" x2="376.33000000000004" y2="376.54" stroke="#397e70" stroke-width="3" /><ns0:line x1="243.8" y1="558.08" x2="296.0" y2="558.08" stroke="#59a7c5" stroke-width="5" data-element-kind="candidate-window" /><ns0:rect x="35.0" y="376.54" width="193.14000000000001" height="181.54000000000002" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:rect x="58.2" y="446.14" width="69.60000000000001" height="98.60000000000001" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:line x1="44.86" y1="558.08" x2="158.54000000000002" y2="558.08" stroke="#397e70" stroke-width="3" /><ns0:rect x="35.0" y="195.0" width="153.12" height="121.80000000000001" fill="#dcb282" fill-opacity="0.25" stroke="#ad713b" stroke-dasharray="6 4" stroke-width="2" /><ns0:text x="43.7" y="222.84" class="small">上層新公衛投影</ns0:text><ns0:line x1="101.7" y1="558.08" x2="101.7" y2="446.14" stroke="#367896" stroke-width="3" /><ns0:text x="35" y="650" class="small">後門名義1960，直接入後左庫。</ns0:text><ns0:text x="35" y="685" class="small">1360接段不在此必經路線。</ns0:text><ns0:text x="35" y="720" class="small">若改經1360，必定不足1500目標。</ns0:text><ns0:text x="35" y="755" class="small">外巷、門框、抬桿及人員仍待演練。</ns0:text><ns0:text x="500" y="160" class="label">無後巷前門備案</ns0:text><ns0:rect x="500.0" y="195.0" width="153.12" height="17.400000000000002" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:rect x="500.0" y="212.4" width="101.5" height="75.4" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:line x1="500.58" y1="287.8" x2="600.92" y2="287.8" stroke="#397e70" stroke-width="3" /><ns0:rect x="500.0" y="287.8" width="101.5" height="88.74000000000001" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:line x1="500.58" y1="287.8" x2="600.92" y2="287.8" stroke="#397e70" stroke-width="3" /><ns0:rect x="601.5" y="212.4" width="51.620000000000005" height="75.4" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:rect x="601.5" y="287.8" width="174.0" height="88.74000000000001" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:rect x="608.17" y="294.47" width="37.7" height="37.7" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:rect x="611.07" y="335.07" width="34.800000000000004" height="34.800000000000004" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:line x1="775.5" y1="294.47" x2="775.5" y2="360.01" stroke="#397e70" stroke-width="3" /><ns0:rect x="653.12" y="195.0" width="117.74000000000001" height="92.80000000000001" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:rect x="659.79" y="201.67" width="26.1" height="69.60000000000001" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:line x1="770.86" y1="208.63" x2="770.86" y2="274.17" stroke="#397e70" stroke-width="3" /><ns0:rect x="770.86" y="195.0" width="77.14" height="92.80000000000001" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:line x1="770.86" y1="208.63" x2="770.86" y2="274.17" stroke="#397e70" stroke-width="3" /><ns0:rect x="775.5" y="287.8" width="72.5" height="88.74000000000001" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:line x1="778.98" y1="376.54" x2="844.52" y2="376.54" stroke="#397e70" stroke-width="3" /><ns0:line x1="775.5" y1="294.47" x2="775.5" y2="360.01" stroke="#397e70" stroke-width="3" /><ns0:rect x="693.14" y="376.54" width="154.86" height="181.54000000000002" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:rect x="771.73" y="481.81" width="69.60000000000001" height="69.60000000000001" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:rect x="699.81" y="395.39" width="40.6" height="26.1" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:rect x="724.1700000000001" y="525.31" width="34.800000000000004" height="26.1" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:line x1="778.98" y1="376.54" x2="844.52" y2="376.54" stroke="#397e70" stroke-width="3" /><ns0:line x1="708.8" y1="558.08" x2="761.0" y2="558.08" stroke="#59a7c5" stroke-width="5" data-element-kind="candidate-window" /><ns0:rect x="500.0" y="376.54" width="193.14000000000001" height="181.54000000000002" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:rect x="523.2" y="446.14" width="69.60000000000001" height="98.60000000000001" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:rect x="500.0" y="195.0" width="153.12" height="121.80000000000001" fill="#dcb282" fill-opacity="0.25" stroke="#ad713b" stroke-dasharray="6 4" stroke-width="2" /><ns0:text x="508.7" y="222.84" class="small">上層新公衛投影</ns0:text><ns0:line x1="550.75" y1="212.4" x2="550.75" y2="411.34000000000003" stroke="#367896" stroke-width="3" stroke-dasharray="5 4" /><ns0:text x="500" y="650" class="small">接段1750、寬門1730名義。</ns0:text><ns0:text x="500" y="685" class="small">門扣230假設後僅1500，零餘量。</ns0:text><ns0:text x="500" y="720" class="small">不能用後門版路線替它背書。</ns0:text><ns0:text x="500" y="755" class="small">搬轎分時整備條件保留。</ns0:text><ns0:text x="1000" y="195" class="small">新立管與檢修：</ns0:text><ns0:text x="1000" y="231" class="small">下方家務區可研究，</ns0:text><ns0:text x="1000" y="267" class="small">未指定可施工落點。</ns0:text><ns0:text x="1000" y="303" class="small">不得縮接段或穿保護區。</ns0:text><ns0:text x="1000" y="339" class="small">公衛沒有後外窗；</ns0:text><ns0:text x="1000" y="375" class="small">獨立排氣／補氣未核。</ns0:text><ns0:text x="1000" y="411" class="small">不拿側界假窗補通風。</ns0:text><ns0:text x="1000" y="447" class="small" /><ns0:text x="1000" y="483" class="small">門片與床：</ns0:text><ns0:text x="1000" y="519" class="small">套衛外開門全開預算</ns0:text><ns0:text x="1000" y="555" class="small">到原床後緣僅15mm。</ns0:text><ns0:text x="1000" y="591" class="small">薄餘量仍須門商合圖。</ns0:text><ns0:text x="1000" y="627" class="small">鏡面／斜視／梁未知。</ns0:text><ns0:text x="30" y="925" class="small">藍線只標必要路線方向；橘虛框是上層公衛投影，不等於下層新增浴室／管井或搬運掃掠。</ns0:text><ns0:text x="30" y="963" class="small">立管位置、尺寸與完成牆仍是unknown；不能因上層器具放下，就稱風水、消防或搬轎全部符合。</ns0:text></ns0:svg>
