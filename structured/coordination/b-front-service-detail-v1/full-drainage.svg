<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="P3｜排水支管＋偏移全長，不能只算短偏移"><title>P3｜排水支管＋偏移全長，不能只算短偏移</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}.room{font-size:13px;font-weight:650}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">P3｜排水支管＋偏移全長，不能只算短偏移</text><text x="28" y="76">獨立重排比較／未採用｜mm座標；前陽台改室內為重大代價，須正式建築設計，不可自行封陽台。</text><text x="28" y="1158" class="small">來源 38897b7ca1da091d…｜本批 d4a599ed36f47ded…</text><text x="28" y="1182" class="small">指定平面幾何不等於法規／風水／照護／搬運／產品或施工核可。前排水及結構未完成；原ABC／3D保留。</text><text x="35" y="137">以器具本體中心代排出口，折線長＋偏移；同起算高程、統一1:50敏感度，非真實管線／規定坡度。</text><text x="40" y="190">項目</text><text x="250" y="190">P2支管＋偏移</text><text x="535" y="190">P3支管＋偏移</text><text x="835" y="190">P3總坡降</text><text x="1060" y="190">最有利完整剖面</text><text x="40" y="245">馬桶</text><text x="250" y="245">1460＋3900＝5360</text><text x="535" y="245">2830＋2235＝5065</text><text x="835" y="245">101.3mm</text><text x="1060" y="245">3498.7mm</text><text x="40" y="302">面盆</text><text x="250" y="302">2565＋3900＝6465</text><text x="535" y="302">4180＋2235＝6415</text><text x="835" y="302">128.3mm</text><text x="1060" y="302">3471.7mm</text><text x="40" y="359">茶水槽候選</text><text x="250" y="359">2630＋3900＝6530</text><text x="535" y="359">3445＋2235＝5680</text><text x="835" y="359">113.6mm</text><text x="1060" y="359">3486.4mm</text><text x="40" y="416">淋浴</text><text x="250" y="416">1350＋3900＝5250</text><text x="535" y="416">1665＋2235＝3900</text><text x="835" y="416">78.0mm</text><text x="1060" y="416">3522.0mm</text><text x="35" y="483">僅P3偏移2235mm降44.7mm，最有利剖面看似3555.3mm；完整WC為3498.7、面盆3471.7、茶水3486.4mm，仍低於3500比較目標。</text><text x="35" y="519">假設式：2F +4000－結構200－管含支撐150－完整坡降－檢修50；另列200／300／500結構與150／200／250管包絡共72例於JSON。</text><text x="35" y="555">真實器具排出口、存水彎與接入標高各異，部分支管可能走不同高度；本式暴露風險，不代表實際一定只差1.3mm或已證明法規不能建。</text><text x="35" y="591">1F候選井仍在原梯核，400×400占0.16㎡；不是已留空洞。騎樓直落仍拒絕，不借神明堂／乾背櫃或武轎庫落管。</text><text x="35" y="627">中心折線避已列保護投影，管徑與彎頭包絡／梁板／消防、全程通氣及清掃終端仍未設計；不能當風水或重力排水全案通過。</text><text x="35" y="663">壓力泵／粉碎馬桶有供電、故障保養代價；抬地坪影響門檻／階差與梯段。均不作預設。</text><text x="35" y="699">下一份需同版帶標高梁板、騎樓／梯段剖面、逐器具接入高程及門產品包絡；配置可先留，前排水仍是採用前必解事項。</text></svg>
