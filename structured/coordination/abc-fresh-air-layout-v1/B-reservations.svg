<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" width="1400" height="1100" role="img" aria-labelledby="title desc"><ns0:title id="title">B棟｜新風機位／分層預留 vs 集中管井</ns0:title><ns0:desc id="desc">ABC獨立深化比較，未採用。毫米局部模型座標，道路在上方；完整門組、結構及專業核對未完成。</ns0:desc><ns0:style>text{font-family:system-ui,sans-serif;font-size:17px;fill:#263e49} .title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:650}.small{font-size:14px}.tiny{font-size:12px}</ns0:style><ns0:rect x="0" y="0" width="1400" height="1100" fill="#fafbf8" /><ns0:text x="30" y="42" class="title">B棟｜新風機位／分層預留 vs 集中管井</ns0:text><ns0:text x="30" y="78">深化比較／未採用｜單位mm；來源是概念模型，梁柱、完成面、商品及實際路徑待核。</ns0:text><ns0:text x="30" y="1053" class="small">來源 bc1e2175f13cff04…｜本批 1b9c1877c9e12781…</ns0:text><ns0:text x="30" y="1077" class="small">原ABC／目前3D及正式產品回覆保留。圖上名義尺寸與方塊試排，不等於施工、照護、風水或搬運核可。</ns0:text><ns0:metadata>{"source_sha256": "bc1e2175f13cff043deeb725e190a3b59908810f58661d9efadec05efbca9a5e", "report_hash": "1b9c1877c9e12781f8f9ec3369adb8f91555b09c2f8bab3159f4088fe0897a59", "adopted": false}</ns0:metadata><ns0:text x="30" y="119">左：常用層機位及局部送回風帶。右：檢修與管井比較。兩種架構不能疊成同時安裝。</ns0:text><ns0:text x="30" y="157" class="label">1F 常用層</ns0:text><ns0:polygon points="30.0,175.0 270.0,175.0 270.0,331.0 30.0,331.0" fill="#e4ecef" stroke="#94a49d" stroke-width="0.7" data-room="B:floor-1:garage" /><ns0:polygon points="30.0,331.0 126.0,331.0 126.0,539.0 30.0,539.0" fill="#f0e4d6" stroke="#94a49d" stroke-width="0.7" data-room="B:floor-1:stair1" /><ns0:polygon points="30.0,539.0 270.0,539.0 270.0,629.8 30.0,629.8" fill="#edf1ec" stroke="#94a49d" stroke-width="0.7" data-room="B:floor-1:shrine" /><ns0:rect x="140.2" y="602.6" width="72.0" height="24.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="152.2" y="582.6" width="48.0" height="20.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="73.2" y="583.8" width="56.0" height="18.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="73.2" y="607.2" width="56.0" height="18.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:polygon points="126.0,331.0 270.0,331.0 270.0,539.0 126.0,539.0" fill="#edf1ec" stroke="#94a49d" stroke-width="0.7" data-room="B:floor-1:shrine-front" /><ns0:polygon points="30.0,629.8 84.4,629.8 84.4,693.8 30.0,693.8" fill="#edf1ec" stroke="#94a49d" stroke-width="0.7" data-room="B:floor-1:left-approach" /><ns0:polygon points="30.0,693.8 84.4,693.8 84.4,755.0 30.0,755.0" fill="#edf1ec" stroke="#94a49d" stroke-width="0.7" data-room="B:floor-1:storage-front" /><ns0:polygon points="84.4,629.8 135.60000000000002,629.8 135.60000000000002,693.8 84.4,693.8" fill="#edf1ec" stroke="#94a49d" stroke-width="0.7" data-room="B:floor-1:laundry-front" /><ns0:rect x="89.0" y="634.4000000000001" width="26.0" height="26.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:polygon points="84.4,693.8 202.8,693.8 202.8,755.0 84.4,755.0" fill="#edf1ec" stroke="#94a49d" stroke-width="0.7" data-room="B:floor-1:laundry-base" /><ns0:rect x="89.0" y="726.4" width="24.0" height="24.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="150.2" y="726.4" width="48.0" height="24.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="130.0" y="734.4" width="14.0" height="12.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:polygon points="135.60000000000002,629.8 216.8,629.8 216.8,693.8 135.60000000000002,693.8" fill="#edf1ec" stroke="#94a49d" stroke-width="0.7" data-room="B:floor-1:altar-backing" /><ns0:rect x="140.2" y="634.4000000000001" width="18.0" height="48.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:polygon points="216.8,629.8 270.0,629.8 270.0,693.8 216.8,693.8" fill="#edf1ec" stroke="#94a49d" stroke-width="0.7" data-room="B:floor-1:corridor1" /><ns0:polygon points="202.8,693.8 270.0,693.8 270.0,755.0 202.8,755.0" fill="#f0e4d6" stroke="#94a49d" stroke-width="0.7" data-room="B:floor-1:bath-approach" /><ns0:polygon points="163.2,755.0 270.0,755.0 270.0,880.2 163.2,880.2" fill="#f0e4d6" stroke="#94a49d" stroke-width="0.7" data-room="B:floor-1:rear-bath" /><ns0:rect x="217.4" y="827.6" width="48.0" height="48.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="167.8" y="768.0" width="28.0" height="18.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="184.6" y="857.6" width="24.0" height="18.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:polygon points="30.0,755.0 163.2,755.0 163.2,880.2 30.0,880.2" fill="#edf1ec" stroke="#94a49d" stroke-width="0.7" data-room="B:floor-1:storage" /><ns0:rect x="46.0" y="803.0" width="48.0" height="68.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:text x="130.0" y="447.0" class="small">香火另系統</ns0:text><ns0:text x="60" y="907" class="small">街／騎樓 ↑</ns0:text><ns0:text x="300" y="157" class="label">2F 常用層</ns0:text><ns0:polygon points="300.0,539.0 540.0,539.0 540.0,629.8 300.0,629.8" fill="#edf1ec" stroke="#94a49d" stroke-width="0.7" data-room="B:floor-2:living2" /><ns0:polygon points="300.0,175.0 540.0,175.0 540.0,331.0 300.0,331.0" fill="#e4ecef" stroke="#94a49d" stroke-width="0.7" data-room="B:floor-2:balcony2" /><ns0:polygon points="300.0,331.0 396.0,331.0 396.0,539.0 300.0,539.0" fill="#f0e4d6" stroke="#94a49d" stroke-width="0.7" data-room="B:floor-2:stair2" /><ns0:polygon points="396.0,331.0 540.0,331.0 540.0,539.0 396.0,539.0" fill="#edf1ec" stroke="#94a49d" stroke-width="0.7" data-room="B:floor-2:living2-front" /><ns0:rect x="444.0" y="417.0" width="24.0" height="44.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="498.0" y="403.0" width="36.0" height="72.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="402.0" y="423.0" width="3.2" height="40.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:polygon points="486.8,629.8 540.0,629.8 540.0,770.2 456.0,770.2 456.0,880.2 300.0,880.2 300.0,713.8 405.6,713.8 405.6,693.8 486.8,693.8" fill="#edf1ec" stroke="#94a49d" stroke-width="0.7" data-room="B:floor-2:master" /><ns0:rect x="306.0" y="724.4" width="80.0" height="72.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="306.0" y="801.0" width="24.0" height="72.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="410.2" y="699.8" width="48.0" height="20.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:polygon points="405.6,629.8 486.8,629.8 486.8,693.8 405.6,693.8" fill="#f0e4d6" stroke="#94a49d" stroke-width="0.7" data-room="B:floor-2:dry-protection" /><ns0:polygon points="300.0,629.8 405.6,629.8 405.6,713.8 300.0,713.8" fill="#f0e4d6" stroke="#94a49d" stroke-width="0.7" data-room="B:floor-2:public-bath" /><ns0:rect x="304.6" y="634.4000000000001" width="24.0" height="18.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="310.6" y="681.2" width="18.0" height="28.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="357.0" y="673.2" width="36.0" height="36.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:polygon points="456.0,770.2 540.0,770.2 540.0,880.2 456.0,880.2" fill="#f0e4d6" stroke="#94a49d" stroke-width="0.7" data-room="B:floor-2:private-bath" /><ns0:rect x="466.6" y="774.8000000000001" width="18.0" height="28.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="513.4" y="774.8000000000001" width="22.0" height="36.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="499.4" y="816.0" width="36.0" height="36.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="502.0" y="723.0" width="20.0" height="46.0" fill="#72b7bc" opacity="0.3" data-kind="partial-duct-band" /><ns0:rect x="422.0" y="749.0" width="100.0" height="20.0" fill="#72b7bc" opacity="0.3" data-kind="partial-duct-band" /><ns0:rect x="422.0" y="749.0" width="20.0" height="44.0" fill="#72b7bc" opacity="0.3" data-kind="partial-duct-band" /><ns0:polyline points="512.0,733.0 512.0,759.0 432.0,759.0 432.0,783.0" fill="none" stroke="#147d8b" stroke-width="2" /><ns0:rect x="492.0" y="701.0" width="40.0" height="64.0" fill="#bda4d1" opacity="0.85" stroke="#693b82" stroke-width="2" data-kind="unit-envelope" data-unit="B2-N" /><ns0:text x="493.6" y="717.0" class="tiny">B2-N</ns0:text><ns0:rect x="492.0" y="725.0" width="28.0" height="18.0" fill="none" stroke="#ad3329" stroke-width="2" stroke-dasharray="5 3" data-kind="rejected-central-shaft" /><ns0:text x="330" y="907" class="small">街／騎樓 ↑</ns0:text><ns0:text x="580" y="160" class="label">B1香火獨立補排，沒有一般ERV回收。</ns0:text><ns0:text x="580" y="188" class="label">B2機位只試後主臥；前側起居尚未接通。</ns0:text><ns0:text x="580" y="216" class="label">B3客房先留，前閱讀不能當已送到風。</ns0:text><ns0:text x="580" y="265">紫框＝1600×1000×450試排預算，可旋轉</ns0:text><ns0:text x="580" y="293">綠帶＝500×300局部密閉送／回風帶，非整層四管</ns0:text><ns0:text x="580" y="321" fill="#a43a30">紅虛框＝集中式替代井試點，本次不留</ns0:text><ns0:text x="580" y="349">灰＝家具；米色＝衛浴／樓梯／設備或乾保護區</ns0:text><ns0:text x="580" y="405" class="label">整機拆換剖面必須補圖，不能只留小檢修孔</ns0:text><ns0:rect x="610" y="435" width="400.0" height="250.0" fill="#ece5f2" stroke="#693b82" stroke-width="2" /><ns0:rect x="640" y="466" width="307.5" height="159.25" fill="#c5b0d5" stroke="#693b82" /><ns0:text x="655" y="526">封存尺寸例 1230×637×220</ns0:text><ns0:text x="655" y="554">非已選型／接口及濾網抽拉待核</ns0:text><ns0:text x="610" y="708" class="small">1260×700名義拆板也未核框料／手部／轉向</ns0:text><ns0:text x="580" y="746">450高含管接是預算；實際梁底／完成天花Z未知</ns0:text><ns0:text x="580" y="774">地面檢修不能以「不碰家具」當作逃生可通行</ns0:text><ns0:text x="580" y="835" class="label">集中井 B-S：兩旁剩 130／500 mm</ns0:text><ns0:text x="580" y="866">本次旁通目標 900 mm 未保住；此試點不留。</ns0:text><ns0:text x="580" y="897">主臥20.0761 − 0.315＝19.7611㎡，低於原20㎡。</ns0:text><ns0:text x="30" y="953">3F使用預留 B3-R：L形客房，XY [4800, 13150, 1000, 1600] mm</ns0:text><ns0:text x="30" y="987">尚缺：OA／EA外牆終端、完整支路、梁門剖面、消防、濾網靜壓、低速噪音及補氣平衡。</ns0:text></ns0:svg>
