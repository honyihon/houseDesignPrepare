.0,366.20000000000005 300.0,366.20000000000005" fill="#edf1ec" stroke="#94a49d" stroke-width="0.7" data-room="A:floor-2:master" /><ns0:rect x="303.2" y="238.2" width="80.0" height="72.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="436.8" y="339.0" width="72.0" height="24.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="303.2" y="339.0" width="72.0" height="24.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="520.8" y="238.2" width="16.0" height="96.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:polygon points="386.4,410.20000000000005 482.4,410.20000000000005 482.4,494.2 386.4,494.2" fill="#f0e4d6" stroke="#94a49d" stroke-width="0.7" data-room="A:floor-2:master-bath" /><ns0:rect x="391.008" y="413.4" width="24.0" height="18.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="421.08" y="413.4" width="18.0" height="28.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="443.20000000000005" y="455.0" width="36.0" height="36.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:polygon points="386.4,494.2 482.4,494.2 482.4,570.2 386.4,570.2" fill="#edf1ec" stroke="#94a49d" stroke-width="0.7" data-room="A:floor-2:walkin" /><ns0:rect x="398.4" y="497.40000000000003" width="72.0" height="24.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:polygon points="482.4,366.20000000000005 540.0,366.20000000000005 540.0,624.6 482.4,624.6" fill="#edf1ec" stroke="#94a49d" stroke-width="0.7" data-room="A:floor-2:hall2" /><ns0:polygon points="300.0,624.6 428.0,624.6 428.0,800.2 300.0,800.2" fill="#edf1ec" stroke="#94a49d" stroke-width="0.7" data-room="A:floor-2:study" /><ns0:rect x="303.2" y="698.4480000000001" width="28.0" height="56.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="408.8" y="663.8" width="16.0" height="72.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:polygon points="428.0,624.6 540.0,624.6 540.0,800.2 428.0,800.2" fill="#edf1ec" stroke="#94a49d" stroke-width="0.7" data-room="A:floor-2:bedroom2" /><ns0:rect x="435.0" y="627.8" width="42.0" height="75.2" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="512.8" y="688.692" width="24.0" height="72.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="437.6" y="773.0" width="48.0" height="24.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:polygon points="300.0,800.2 540.0,800.2 540.0,880.2 300.0,880.2" fill="#e4ecef" stroke="#94a49d" stroke-width="0.7" data-room="A:floor-2:balcony2" /><ns0:polygon points="300.0,175.0 540.0,175.0 540.0,235.0 300.0,235.0" fill="#e4ecef" stroke="#94a49d" stroke-width="0.7" data-room="A:floor-2:front-service" /><ns0:polygon points="300.0,410.20000000000005 386.4,410.20000000000005 386.4,570.2 300.0,570.2" fill="#f0e4d6" stroke="#94a49d" stroke-width="0.7" data-room="A:floor-2:stair2" /><ns0:polygon points="300.0,570.2 482.4,570.2 482.4,624.6 300.0,624.6" fill="#edf1ec" stroke="#94a49d" stroke-width="0.7" data-room="A:floor-2:rear-hall" /><ns0:polygon points="300.0,366.20000000000005 482.4,366.20000000000005 482.4,410.20000000000005 300.0,410.20000000000005" fill="#edf1ec" stroke="#94a49d" stroke-width="0.7" data-room="A:floor-2:front-landing" /><ns0:rect x="422.0" y="587.0" width="99.2" height="20.0" fill="#72b7bc" opacity="0.3" data-kind="partial-duct-band" /><ns0:rect x="501.20000000000005" y="377.0" width="20.0" height="230.0" fill="#72b7bc" opacity="0.3" data-kind="partial-duct-band" /><ns0:rect x="410.0" y="377.0" width="111.2" height="20.0" fill="#72b7bc" opacity="0.3" data-kind="partial-duct-band" /><ns0:rect x="410.0" y="337.0" width="20.0" height="60.0" fill="#72b7bc" opacity="0.3" data-kind="partial-duct-band" /><ns0:polyline points="432.0,597.0 511.20000000000005,597.0 511.20000000000005,387.0 420.0,387.0 420.0,347.0" fill="none" stroke="#147d8b" stroke-width="2" /><ns0:rect x="400.0" y="577.0" width="64.0" height="40.0" fill="#bda4d1" opacity="0.85" stroke="#693b82" stroke-width="2" data-kind="unit-envelope" data-unit="A2-N" /><ns0:text x="401.6" y="593.0" class="tiny">A2-N</ns0:text><ns0:rect x="358.0" y="579.0" width="28.0" height="18.0" fill="none" stroke="#ad3329" stroke-width="2" stroke-dasharray="5 3" data-kind="rejected-central-shaft" /><ns0:text x="330" y="907" class="small">街／騎樓 ↑</ns0:text><ns0:text x="580" y="160" class="label">優先報常住層分區，三樓使用區一期做。</ns0:text><ns0:text x="580" y="188" class="label">A1避MDF／梯下；A2後廳檢修暫占走道。</ns0:text><ns0:text x="580" y="216" class="label">主臥、次臥、書房分支與關門回風另排。</ns0:text><ns0:text x="580" y="265">紫框＝1600×1000×450試排預算，可旋轉</ns0:text><ns0:text x="580" y="293">綠帶＝500×300局部密閉送／回風帶，非整層四管</ns0:text><ns0:text x="580" y="321" fill="#a43a30">紅虛框＝集中式替代井試點，本次不留</ns0:text><ns0:text x="580" y="349">灰＝家具；米色＝衛浴／樓梯／設備或乾保護區</ns0:text><ns0:text x="580" y="405" class="label">整機拆換剖面必須補圖，不能只留小檢修孔</ns0:text><ns0:rect x="610" y="435" width="400.0" height="250.0" fill="#ece5f2" stroke="#693b82" stroke-width="2" /><ns0:rect x="640" y="466" width="307.5" height="159.25" fill="#c5b0d5" stroke="#693b82" /><ns0:text x="655" y="526">封存尺寸例 1230×637×220</ns0:text><ns0:text x="655" y="554">非已選型／接口及濾網抽拉待核</ns0:text><ns0:text x="610" y="708" class="small">1260×700名義拆板也未核框料／手部／轉向</ns0:text><ns0:text x="580" y="746">450高含管接是預算；實際梁底／完成天花Z未知</ns0:text><ns0:text x="580" y="774">地面檢修不能以「不碰家具」當作逃生可通行</ns0:text><ns0:text x="580" y="835" class="label">集中井 A-S：兩旁剩 90／1370 mm</ns0:text><ns0:text x="580" y="866">本次旁通目標 1500 mm 未保住；此試點不留。</ns0:text><ns0:text x="580" y="897">1370mm旁通不是1500mm轉位面，不能當通過。</ns0:text><ns0:text x="30" y="953">3F使用預留 A3-R：後段公共乾式通道，XY [2500, 10050, 1600, 1000] mm</ns0:text><ns0:text x="30" y="987">尚缺：OA／EA外牆終端、完整支路、梁門剖面、消防、濾網靜壓、低速噪音及補氣平衡。</ns0:text></ns0:svg>
