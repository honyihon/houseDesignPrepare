<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" width="1400" height="1100" role="img" aria-labelledby="title desc"><ns0:title id="title">A棟｜新風機位／分層預留 vs 集中管井</ns0:title><ns0:desc id="desc">ABC獨立深化比較，未採用。毫米局部模型座標，道路在上方；完整門組、結構及專業核對未完成。</ns0:desc><ns0:style>text{font-family:system-ui,sans-serif;font-size:17px;fill:#263e49} .title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:650}.small{font-size:14px}.tiny{font-size:12px}</ns0:style><ns0:rect x="0" y="0" width="1400" height="1100" fill="#fafbf8" /><ns0:text x="30" y="42" class="title">A棟｜新風機位／分層預留 vs 集中管井</ns0:text><ns0:text x="30" y="78">深化比較／未採用｜單位mm；來源是概念模型，梁柱、完成面、商品及實際路徑待核。</ns0:text><ns0:text x="30" y="1053" class="small">來源 bc1e2175f13cff04…｜本批 1b9c1877c9e12781…</ns0:text><ns0:text x="30" y="1077" class="small">原ABC／目前3D及正式產品回覆保留。圖上名義尺寸與方塊試排，不等於施工、照護、風水或搬運核可。</ns0:text><ns0:metadata>{"source_sha256": "bc1e2175f13cff043deeb725e190a3b59908810f58661d9efadec05efbca9a5e", "report_hash": "1b9c1877c9e12781f8f9ec3369adb8f91555b09c2f8bab3159f4088fe0897a59", "adopted": false}</ns0:metadata><ns0:text x="30" y="119">左：常用層機位及局部送回風帶。右：檢修與管井比較。兩種架構不能疊成同時安裝。</ns0:text><ns0:text x="30" y="157" class="label">1F 常用層</ns0:text><ns0:polygon points="30.0,331.0 116.4,331.0 116.4,410.20000000000005 30.0,410.20000000000005" fill="#edf1ec" stroke="#94a49d" stroke-width="0.7" data-room="A:floor-1:entry" /><ns0:polygon points="116.4,331.0 270.0,331.0 270.0,533.0799999999999 116.4,533.0799999999999" fill="#edf1ec" stroke="#94a49d" stroke-width="0.7" data-room="A:floor-1:living" /><ns0:rect x="230.8" y="450.6016" width="36.0" height="72.00000000000004" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="119.60000000000001" y="462.0016" width="3.2" height="49.20000000000004" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="196.84799999999998" y="355.624" width="48.0" height="72.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="120.04799999999999" y="3