<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" width="1400" height="1100" role="img" aria-labelledby="title desc"><ns0:title id="title">C棟｜新風機位／分層預留 vs 集中管井</ns0:title><ns0:desc id="desc">ABC獨立深化比較，未採用。毫米局部模型座標，道路在上方；完整門組、結構及專業核對未完成。</ns0:desc><ns0:style>text{font-family:system-ui,sans-serif;font-size:17px;fill:#263e49} .title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:650}.small{font-size:14px}.tiny{font-size:12px}</ns0:style><ns0:rect x="0" y="0" width="1400" height="1100" fill="#fafbf8" /><ns0:text x="30" y="42" class="title">C棟｜新風機位／分層預留 vs 集中管井</ns0:text><ns0:text x="30" y="78">深化比較／未採用｜單位mm；來源是概念模型，梁柱、完成面、商品及實際路徑待核。</ns0:text><ns0:text x="30" y="1053" class="small">來源 bc1e2175f13cff04…｜本批 1b9c1877c9e12781…</ns0:text><ns0:text x="30" y="1077" class="small">原ABC／目前3D及正式產品回覆保留。圖上名義尺寸與方塊試排，不等於施工、照護、風水或搬運核可。</ns0:text><ns0:metadata>{"source_sha256": "bc1e2175f13cff043deeb725e190a3b59908810f58661d9efadec05efbca9a5e", "report_hash": "1b9c1877c9e12781f8f9ec3369adb8f91555b09c2f8bab3159f4088fe0897a59", "adopted": false}</ns0:metadata><ns0:text x="30" y="119">左：常用層機位及局部送回風帶。右：檢修與管井比較。兩種架構不能疊成同時安裝。</ns0:text><ns0:text x="30" y="157" class="label">1F 常用層</ns0:text><ns0:polygon points="30.0,175.0 270.0,175.0 270.0,331.0 30.0,331.0" fill="#e4ecef" stroke="#94a49d" stroke-width="0.7" data-room="C:floor-1:garage" /><ns0:polygon points="190.0,403.0 270.0,403.0 270.0,475.0 190.0,475.0" fill="#edf1ec" stroke="#94a49d" stroke-width="0.7" data-room="C:floor-1:entrance" /><ns0:rect x="252.8" y="443.0" width="14.0" height="48.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:polygon points="30.0,459.0 126.0,459.0 126.0,518.2 30.0,518.2" fill="#edf1ec" stroke="#94a49d" stroke-width="0.7" data-room="C:floor-1:living" /><ns0:rect x="102.60000000000001" y="439.4" width="36.0" height="72.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="34.6" y="472.0" width="3.2" height="40.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="34.6" y="485.8" width="44.0" height="24.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="34.6" y="446.2" width="36.0" height="34.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:polygon points="30.0,659.0 78.0,659.0 78.0,727.0 30.0,727.0" fill="#f0e4d6" stroke="#94a49d" stroke-width="0.7" data-room="C:floor-1:sideyard" /><ns0:rect x="42.0" y="699.8" width="24.0" height="24.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:polygon points="30.0,331.0 190.0,331.0 190.0,459.0 30.0,459.0" fill="#edf1ec" stroke="#94a49d" stroke-width="0.7" data-room="C:floor-1:dining" /><ns0:rect x="50.0" y="350.20000000000005" width="72.0" height="72.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:polygon points="30.0,518.2 126.0,518.2 126.0,659.0 30.0,659.0" fill="#edf1ec" stroke="#94a49d" stroke-width="0.7" data-room="C:floor-1:kitchen" /><ns0:rect x="34.6" y="556.8" width="24.0" height="96.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="87.4" y="526.8" width="30.0" height="28.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:polygon points="126.0,533.4000000000001 270.0,533.4000000000001 270.0,727.0 126.0,727.0" fill="#f0e4d6" stroke="#94a49d" stroke-width="0.7" data-room="C:floor-1:stair1f" /><ns0:polygon points="30.0,727.0 174.0,727.0 174.0,880.2 30.0,880.2" fill="#edf1ec" stroke="#94a49d" stroke-width="0.7" data-room="C:floor-1:elder" /><ns0:rect x="33.2" y="816.2" width="75.2" height="60.800000000000004" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="84.88" y="730.2" width="40.0" height="3.2" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="33.2" y="730.2" width="48.0" height="24.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="88.0" y="731.6" width="16.0" height="14.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:polygon points="78.0,659.0 126.0,659.0 126.0,727.0 78.0,727.0" fill="#edf1ec" strok