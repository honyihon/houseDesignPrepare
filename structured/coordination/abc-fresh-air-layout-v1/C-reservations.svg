fill="#72b7bc" opacity="0.3" data-kind="partial-duct-band" /><ns0:polyline points="164.0,379.0 164.0,495.0 106.0,495.0 106.0,743.0 118.0,743.0 118.0,775.0" fill="none" stroke="#147d8b" stroke-width="2" /><ns0:rect x="144.0" y="347.0" width="40.0" height="64.0" fill="#bda4d1" opacity="0.85" stroke="#693b82" stroke-width="2" data-kind="unit-envelope" data-unit="C1-N" /><ns0:text x="145.60000000000002" y="363.0" class="tiny">C1-N</ns0:text><ns0:rect x="94.0" y="587.0" width="28.0" height="18.0" fill="none" stroke="#ad3329" stroke-width="2" stroke-dasharray="5 3" data-kind="rejected-central-shaft" /><ns0:text x="60" y="907" class="small">街／騎樓 ↑</ns0:text><ns0:text x="300" y="157" class="label">2F 常用層</ns0:text><ns0:polygon points="300.0,175.0 540.0,175.0 540.0,331.0 300.0,331.0" fill="#e4ecef" stroke="#94a49d" stroke-width="0.7" data-room="C:floor-2:balcony2f" /><ns0:rect x="332.0" y="179.6" width="26.0" height="26.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="304.6" y="230.4" width="24.0" height="96.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="360.0" y="179.6" width="24.0" height="24.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="386.0" y="179.6" width="24.0" height="18.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:polygon points="412.0,331.0 540.0,331.0 540.0,533.4000000000001 412.0,533.4000000000001" fill="#edf1ec" stroke="#94a49d" stroke-width="0.7" data-room="C:floor-2:living2f" /><ns0:rect x="500.8" y="397.4" width="36.0" height="96.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="415.2" y="403.0" width="18.0" height="72.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="460.0" y="423.4" width="24.0" height="44.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:polygon points="300.0,331.0 412.0,331.0 412.0,479.0 300.0,479.0" fill="#edf1ec" stroke="#94a49d" stroke-width="0.7" data-room="C:floor-2:guestroom2f" /><ns0:rect x="303.2" y="334.20000000000005" width="42.0" height="75.2" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="380.8" y="393.8" width="28.0" height="56.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="303.2" y="451.8" width="72.0" height="24.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:polygon points="396.0,533.4000000000001 540.0,533.4000000000001 540.0,727.0 396.0,727.0" fill="#f0e4d6" stroke="#94a49d" stroke-width="0.7" data-room="C:floor-2:stair2f" /><ns0:polygon points="444.0,727.0 540.0,727.0 540.0,880.2 444.0,880.2" fill="#edf1ec" stroke="#94a49d" stroke-width="0.7" data-room="C:floor-2:kitchen2f" /><ns0:rect x="447.20000000000005" y="781.0" width="26.0" height="96.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="508.8" y="730.2" width="28.0" height="30.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:polygon points="300.0,727.0 396.0,727.0 396.0,807.0 300.0,807.0" fill="#f0e4d6" stroke="#94a49d" stroke-width="0.7" data-room="C:floor-2:bath2f" /><ns0:rect x="374.8" y="730.2" width="18.0" height="24.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="303.2" y="775.8000000000001" width="18.0" height="28.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:rect x="323.2" y="767.8000000000001" width="36.0" height="36.0" fill="#c5ccc8" stroke="#788e82" stroke-width="0.6" /><ns0:polygon points="396.0,727.0 444.0,727.0 444.0,880.2 396.0,880.2" fill="#edf1ec" stroke="#94a49d" stroke-width="0.7" data-room="C:floor-2:rear-hall" /><ns0:polygon points="300.0,807.0 396.0,807.0 396.0,880.2 300.0,880.2" fill="#e4ecef" stroke="#94a49d" stroke-width="0.7" data-room="C:floor-2:rear-service" /><ns0:polygon points="300.0,479.0 412.0,479.0 412.0,533.4000000000001 300.0,533.4000000000001" fill="#edf1ec" stroke="#94a49d" stroke-width="0.7" data-room="C:floor-2:living-nook" /><ns0:polygon points="300.0,533.4000000000001 396.0,533.4000000000001 396.0,727.0 300.0,727.0" fill="#edf1ec" stroke="#94a49d" stroke-width="0.7" data-room="C:floor-2:day-reserve" /><ns0:rect x="362.0" y="421.0" width="20.0" height="96.0" fill="#72b7bc" opacity="0.3" data-kind="partial-duct-band" /><ns0:polyline points="372.0,507.0 372.0,431.0" fill="none" stroke="#147d8b" stroke-width="2" /><ns0:rect x="340.0" y="487.0" width="64.0" height="40.0" fill="#bda4d1" opacity="0.85" stroke="#693b82" stroke-width="2" data-kind="unit-envelope" data-unit="C2-N" /><ns0:text x="341.6" y="503.0" class="tiny">C2-N</ns0:text><ns0:rect x="364.0" y="587.0" width="28.0" height="18.0" fill="none" stroke="#ad3329" stroke-width="2" stroke-dasharray="5 3" data-kind="rejected-central-shaft" /><ns0:text x="330" y="907" class="small">街／騎樓 ↑</ns0:text><ns0:text x="580" y="160" class="label">C1走左側高位帶，不穿樓梯區。</ns0:text><ns0:text x="580" y="188" class="label">前置門／梯門可關，孝親房專支回風。</ns0:text><ns0:text x="580" y="216" class="label">C2睡房分支；保留唯一2F洗衣機。</ns0:text><ns0:text x="580" y="265">紫框＝1600×1000×450試排預算，可旋轉</ns0:text><ns0:text x="580" y="293">綠帶＝500×300局部密閉送／回風帶，非整層四管</ns0:text><ns0:text x="580" y="321" fill="#a43a30">紅虛框＝集中式替代井試點，本次不留</ns0:text><ns0:text x="580" y="349">灰＝家具；米色＝衛浴／樓梯／設備或乾保護區</ns0:text><ns0:text x="580" y="405" class="label">整機拆換剖面必須補圖，不能只留小檢修孔</ns0:text><ns0:rect x="610" y="435" width="400.0" height="250.0" fill="#ece5f2" stroke="#693b82" stroke-width="2" /><ns0:rect x="640" y="466" width="307.5" height="159.25" fill="#c5b0d5" stroke="#693b82" /><ns0:text x="655" y="526">封存尺寸例 1230×637×220</ns0:text><ns0:text x="655" y="554">非已選型／接口及濾網抽拉待核</ns0:text><ns0:text x="610" y="708" class="small">1260×700名義拆板也未核框料／手部／轉向</ns0:text><ns0:text x="580" y="746">450高含管接是預算；實際梁底／完成天花Z未知</ns0:text><ns0:text x="580" y="774">地面檢修不能以「不碰家具」當作逃生可通行</ns0:text><ns0:text x="580" y="835" class="label">集中井 C-S：兩旁剩 885／100 mm</ns0:text><ns0:text x="580" y="866">本次旁通目標 1200 mm 未保住；此試點不留。</ns0:text><ns0:text x="580" y="897">廚房原1685 → 885mm；非完整照護動線核可。</ns0:text><ns0:text x="30" y="953">3F使用預留 C3-R：公共橫向通道（不穿主臥），XY [4000, 7750, 1600, 1000] mm</ns0:text><ns0:text x="30" y="987">尚缺：OA／EA外牆終端、完整支路、梁門剖面、消防、濾網靜壓、低速噪音及補氣平衡。</ns0:text></ns0:svg>
