<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="G4D落差d｜上方要容納，下方也要保留空間"><title>G4D落差d｜上方要容納，下方也要保留空間</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">G4D落差d｜上方要容納，下方也要保留空間</text><text x="28" y="76">Claude第二輪已交叉核對｜部分算式與研究排序一致，未有完整解法、採用或專業核可。</text><text x="28" y="1158" class="small">本批 35d879c85857be3f9f43173552d8bb1a11d8fa70edb643ea4b4eca23e8a9361c</text><text x="28" y="1182" class="small">全部尺寸為列明假設；實際資料留白。原ABC／3D、家規與149控制不動，未跑瀏覽器。</text><text x="40" y="140">d下限＝3704.9＋上方50＋接頭上凸e＋額外餘量M－假梯底；不能直接指定500或600。</text><text x="40" y="180">表列僅M＝0的邊界，不是施工餘量；真正M、下方要求C及下凸量仍未知。</text><text x="40" y="240">法向板厚t</text><text x="280" y="240">上凸e</text><text x="490" y="240">M0落差下限mm</text><text x="850" y="240">實際落差上限／可行區間</text><text x="40" y="280">150</text><text x="280" y="280">0</text><text x="490" y="280">357.102</text><text x="850" y="280">未知／未驗證</text><text x="40" y="312">150</text><text x="280" y="312">25</text><text x="490" y="312">382.102</text><text x="850" y="312">未知／未驗證</text><text x="40" y="344">150</text><text x="280" y="344">50</text><text x="490" y="344">407.102</text><text x="850" y="344">未知／未驗證</text><text x="40" y="376">200</text><text x="280" y="376">0</text><text x="490" y="376">415.861</text><text x="850" y="376">未知／未驗證</text><text x="40" y="408">200</text><text x="280" y="408">25</text><text x="490" y="408">440.861</text><text x="850" y="408">未知／未驗證</text><text x="40" y="440">200</text><text x="280" y="440">50</text><text x="490" y="440">465.861</text><text x="850" y="440">未知／未驗證</text><text x="40" y="472">250</text><text x="280" y="472">0</text><text x="490" y="472">474.620</text><text x="850" y="472">未知／未驗證</text><text x="40" y="504">250</text><text x="280" y="504">25</text><text x="490" y="504">499.620</text><text x="850" y="504">未知／未驗證</text><text x="40" y="536">250</text><text x="280" y="536">50</text><text x="490" y="536">524.620</text><text x="850" y="536">未知／未驗證</text><text x="40" y="568">300</text><text x="280" y="568">0</text><text x="490" y="568">533.379</text><text x="850" y="568">未知／未驗證</text><text x="40" y="600">300</text><text x="280" y="600">25</text><text x="490" y="600">558.379</text><text x="850" y="600">未知／未驗證</text><text x="40" y="632">300</text><text x="280" y="632">50</text><text x="490" y="632">583.379</text><text x="850" y="632">未知／未驗證</text><text x="40" y="730">t300＋上凸50需至少583.379mm，才只是消除算式負餘量。不能因此逕改600；加大落差也會減少平台上方空間。</text><text x="40" y="767">最低末端中心預算＝3461.6－d。d500／550／600分別2961.6／2911.6／2861.6，不是整室或整盒最低淨高。</text><text x="40" y="804">若沿同坡示意管再延至後緣200，分別再少4mm；實際接頭、下凸、清掃及完成面未知，真正下限不能由此確定。</text><text x="40" y="841">C必須與預算用相同高程及扣帳口徑；實際可接受的d上限與M未到，數字表不能判定有可施工區間。</text></svg>
