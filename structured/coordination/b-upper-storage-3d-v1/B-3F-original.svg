<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1320" width="1400" height="1320" role="img" aria-label="B-3F｜原配置｜標高+7000mm"><title>B-3F｜原配置｜標高+7000mm</title><style>text{font-family:system-ui,sans-serif;fill:#263e49}.small{font-size:13px}.room{font-size:12px}</style><rect x="0" y="0" width="1400" height="1320" fill="#fafbf8" /><text x="28" y="40" font-size="26" font-weight="700">B-3F｜原配置｜標高+7000mm</text><text x="28" y="76" font-size="16">B同版底圖／未採用｜保原P4／Q3多邊形、設備及兩入口；只比儲藏，不把完整梯核鋪成實心樓板。</text><text x="28" y="106" font-size="16">橙：新增／桌下儲藏；橙虛線：取物帶。綠：列明到達地面；紅虛線：梯井或天井，不得封滿。</text><text x="28" y="1278" font-size="16" class-="small">來源 958e4c5b58ef47a3121818135dc85b46dd64f7ae615ebe423295b008454dcd3b</text><text x="28" y="1302" font-size="16" class-="small">只核列明2D投影；不是新3D、整座梯淨高、實際門片、風水、聲學、結構、法規或施工核可。</text><rect x="45.0" y="150.0" width="312.0" height="916.76" fill="#eef0e7" stroke="#607c73" /><polygon points="169.8,394.4 169.8,623.2 45.0,623.2 45.0,394.4" fill="#edf0e9" stroke="#607c73" stroke-width="0.9" data-room-id="stair" /><text x="107.4" y="508.8" font-size="11" text-anchor="middle">梯核（不可鋪滿）</text><polygon points="357.0,352.79999999999995 169.8,352.79999999999995 169.8,623.2 45.0,623.2 45.0,741.24 357.0,741.24 357.0,623.2" fill="#edf0e9" stroke="#607c73" stroke-width="0.9" data-room-id="quiet-living" /><text x="263.4" y="488.0" font-size="11" text-anchor="middle">安靜起居</text><polygon points="287.84,741.24 287.84,824.4399999999999 182.28,824.4399999999999 182.28,741.24" fill="#f2e1d9" stroke="#607c73" stroke-width="0.9" data-room-id="dry-protection" /><text x="235.06" y="782.8399999999999" font-size="11" text-anchor="middle">乾背保護</text><line x1="193.2" y1="741.24" x2="251.95999999999998" y2="741.24" stroke="#00a3bb" stroke-width="3" /><polygon points="357.0,352.79999999999995 357.0,150.0 45.0,150.0 45.0,352.79999999999995 45.0,394.4 169.8,394.4 169.8,352.79999999999995" fill="#edf0e9" stroke="#607c73" stroke-width="0.9" data-room-id="front-entertainment" /><text