ont-size="15">4｜原900×900淋浴移後右，向前操作｜平面900×900mm</text><text x="430" y="453" font-size="15">5｜原700×450馬桶移前左，背靠左牆｜平面700×450mm</text><text x="430" y="478" font-size="15">6｜原600×450面盆轉向左牆｜平面450×600mm</text><text x="430" y="503" font-size="15">7｜原1500×600濕茶水台橫放靠前牆｜平面1500×600mm</text><text x="430" y="528" font-size="15">8｜原1800×2000床轉向／床頭靠左實牆｜平面2000×1800mm</text><text x="430" y="553" font-size="15">9｜原1800×600衣櫃｜平面1800×600mm</text><text x="430" y="578" font-size="15">10｜原1200×500梳妝台轉向｜平面500×1200mm</text><text x="430" y="603" font-size="15">11｜原900×550盆櫃轉向｜平面550×900mm</text><text x="430" y="628" font-size="15">12｜原450×700馬桶轉向｜平面700×450mm</text><text x="430" y="653" font-size="15">13｜原900淋浴｜平面900×900mm</text><text x="430" y="678" font-size="15">14｜安靜起居側緣乾式雜物櫃｜平面450×1200mm；高1800mm（提案）</text><text x="430" y="703" font-size="15">預留｜管道井預留</text><text x="430" y="728" font-size="15">預留｜管道井預留</text><text x="430" y="753" font-size="15">預留｜管道井預留</text><text x="430" y="778" font-size="15">預留｜原門活動包絡</text><text x="430" y="803" font-size="15">預留｜原門活動包絡</text><text x="430" y="828" font-size="15">預留｜原門活動包絡</text><text x="430" y="853" font-size="15">預留｜原門活動包絡</text></svg>
