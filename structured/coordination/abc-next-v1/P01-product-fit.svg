<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" width="1400" height="1100" role="img" aria-labelledby="title desc"><ns0:title id="title">P01｜全屋選品回套：平整馬桶與完整工程範圍</ns0:title><ns0:desc id="desc">ABC獨立深化比較，未採用。毫米局部模型座標，道路在上方；完整門組、結構及專業核對未完成。</ns0:desc><ns0:style>text{font-family:system-ui,sans-serif;font-size:17px;fill:#263e49} .title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:650}.small{font-size:14px}.tiny{font-size:12px}</ns0:style><ns0:rect x="0" y="0" width="1400" height="1100" fill="#fafbf8" /><ns0:text x="30" y="42" class="title">P01｜全屋選品回套：平整馬桶與完整工程範圍</ns0:text><ns0:text x="30" y="78">深化比較／未採用｜單位mm；來源是概念模型，梁柱、完成面、商品及實際路徑待核。</ns0:text><ns0:text x="30" y="1053" class="small">來源 bc1e2175f13cff04…｜本批 dfde40d73ebcd01b…</ns0:text><ns0:text x="30" y="1077" class="small">原ABC／目前3D及正式產品回覆保留。圖上名義尺寸與方塊試排，不等於施工、照護、風水或搬運核可。</ns0:text><ns0:metadata>{"source_sha256": "bc1e2175f13cff043deeb725e190a3b59908810f58661d9efadec05efbca9a5e", "report_hash": "dfde40d73ebcd01bb0abd0839759b83ffd593a6146ef7f46ec013e53a1a69c6c", "adopted": false}</ns0:metadata><ns0:text x="30" y="118">只比已列候選；一般衛浴與照護套衛分開。較小商品不自動釋放原模型空間或減少收納需求。</ns0:text><ns0:text x="35" y="170" class="label">便器平面疊圖｜後緣對齊只作本體比較</ns0:text><ns0:rect x="85" y="235" width="261.0" height="406.0" fill="#e6eae6" stroke="#82968e" stroke-width="2" /><ns0:rect x="107.62" y="247.18" width="215.76" height="393.82" fill="none" stroke="#367d95" stroke-width="3" /><ns0:rect x="102.4" y="230.94" width="226.2" height="410.05999999999995" fill="none" stroke="#bc7039" stroke-width="3" /><ns0:text x="35" y="710" class="small">灰：模型450×700。</ns0:text><ns0:text x="35" y="744" class="small">藍：KOHLER372×679，寬餘78／深餘21。</ns0:text><ns0:text x="35" y="778" class="small">橘：TOTO390×707，深度多7。</ns0:text><ns0:text x="35" y="812" class="small">兩款305管距；現況／完成牆管距未提供。</ns0:text><ns0:text x="35" y="846" class="small">不預設偏心接頭、後移排污或縮小前淨空。</ns0:text><ns0:text x="600" y="190">三組一般全衛歷史材料小計</ns0:text><ns0:text x="600" y="226">① KOHLER＋凱撒盆龍頭＋淋浴：26,360。</ns0:text><ns0:text x="600" y="262">② TOTO含TC301＋同盆龍頭＋淋浴：27,060。</ns0:text><ns0:text x="600" y="298">③ KOHLER＋HCG小浴櫃＋淋浴：36,490。</ns0:text><ns0:text x="600" y="334">只有KOHLER含蓋公開價本輪重閱；其餘沿用10/22。</ns0:text><ns0:text x="600" y="370">以上不等整間完工價，也不代表建商已含。</ns0:text><ns0:text x="600" y="406" /><ns0:text x="600" y="442">不能直接換的地方</ns0:text><ns0:text x="600" y="478">A1／B1／C孝親：座高、轉位、盆下、門、扶手另核。</ns0:text><ns0:text x="600" y="514">B主臥900mm盆櫃：不以510mm小櫃取代收納。</ns0:text><ns0:text x="600" y="550">K系列室內機295高，比模型280高15mm。</ns0:text><ns0:text x="600" y="586">VILLES5700只是五金，完整濕區門組尚未找到定案。</ns0:text><ns0:text x="30" y="925" class="small">報價要同範圍：型號／全部配件／支架補強／配管與防水／安裝／搬運／稅／保固／原標配折抵／交期。</ns0:text><ns0:text x="30" y="958" class="small">CSV已逐浴室、逐門及逐冷氣配對列項；實際回覆與報價金額留白，不能把歷史公開價填成廠商正式報價。</ns0:text><ns0:text x="30" y="991" class="small">B前後門是互斥版本；C客房兩機是比較，未確定雙機採購。候選數量不能跨版本相加。</ns0:text></ns0:svg>
