46" width="9.875" height="9.875" fill="#b58ba9" stroke="#7f4775" stroke-width="2" /><ns0:text x="720" y="910" class="small">背櫃上方濕區 1.376㎡</ns0:text><ns0:text x="1065" y="155" class="label">4F</ns0:text><ns0:rect x="1065.0" y="334.05" width="94.8" height="205.4" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:line x1="1159.8" y1="334.0500316" x2="1159.8" y2="373.5500316" stroke="#397e70" stroke-width="3" /><ns0:rect x="1065.0" y="629.115" width="94.8" height="247.27" fill="#eee9d8" stroke="#9bada6" stroke-width="0.8" /><ns0:rect x="1065.0" y="180.0" width="237.0" height="154.05" fill="#eee9d8" stroke="#9bada6" stroke-width="0.8" /><ns0:rect x="1159.8" y="334.05" width="142.2" height="205.4" fill="#eee9d8" stroke="#9bada6" stroke-width="0.8" /><ns0:line x1="1159.8" y1="334.0500316" x2="1159.8" y2="373.5500316" stroke="#397e70" stroke-width="3" /><ns0:rect x="1065.0" y="539.45" width="237.0" height="89.665" fill="#eee9d8" stroke="#9bada6" stroke-width="0.8" /><ns0:rect x="1159.8" y="629.115" width="142.2" height="247.27" fill="#eee9d8" stroke="#9bada6" stroke-width="0.8" /><ns0:rect x="1163.75" y="629.115" width="71.89" height="63.2" fill="none" stroke="#ad4c3f" stroke-width="2" stroke-dasharray="5 3" /><ns0:rect x="1163.75" y="602.255" width="71.1" height="23.7" fill="none" stroke="#943b40" stroke-width="2" /><ns0:rect x="1286.2" y="712.46" width="9.875" height="9.875" fill="#b58ba9" stroke="#7f4775" stroke-width="2" /><ns0:text x="30" y="948" class="small">2F兩間衛浴合計投影背櫃2.912㎡；3F公衛投影1.376㎡。神桌本體不在這些濕區內。</ns0:text><ns0:text x="30" y="977" class="small">本版立管預算x5600～5850、y13480～13730；接段名義通道餘1280mm。</ns0:text><ns0:text x="30" y="1006" class="small">立管不消除濕區投影，亦未畫成已核排水。若家規禁止背櫃上方濕區，須另排上層，不能靠防水宣稱符合。</ns0:text></ns0:svg>
