<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" width="1400" height="1100" role="img" aria-labelledby="title desc"><ns0:title id="title">C01｜前左客房：AC04／AC07服務與負荷比較</ns0:title><ns0:desc id="desc">ABC獨立深化比較，未採用。毫米局部模型座標，道路在上方；完整門組、結構及專業核對未完成。</ns0:desc><ns0:style>text{font-family:system-ui,sans-serif;font-size:17px;fill:#263e49} .title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:650}.small{font-size:14px}.tiny{font-size:12px}</ns0:style><ns0:rect x="0" y="0" width="1400" height="1100" fill="#fafbf8" /><ns0:text x="30" y="42" class="title">C01｜前左客房：AC04／AC07服務與負荷比較</ns0:text><ns0:text x="30" y="78">深化比較／未採用｜單位mm；來源是概念模型，梁柱、完成面、商品及實際路徑待核。</ns0:text><ns0:text x="30" y="1053" class="small">來源 bc1e2175f13cff04…｜本批 dfde40d73ebcd01b…</ns0:text><ns0:text x="30" y="1077" class="small">原ABC／目前3D及正式產品回覆保留。圖上名義尺寸與方塊試排，不等於施工、照護、風水或搬運核可。</ns0:text><ns0:metadata>{"source_sha256": "bc1e2175f13cff043deeb725e190a3b59908810f58661d9efadec05efbca9a5e", "report_hash": "dfde40d73ebcd01bb0abd0839759b83ffd593a6146ef7f46ec013e53a1a69c6c", "adopted": false}</ns0:metadata><ns0:text x="30" y="119">單機優先；先研究後端AC04，前端AC07留短管備案，原圖兩機目前都保留。</ns0:text><ns0:rect x="45.0" y="185.0" width="392.00000000000006" height="518.0" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:rect x="56.2" y="196.2" width="147.0" height="263.20000000000005" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:rect x="327.8" y="404.8" width="98.00000000000001" height="196.00000000000003" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:rect x="56.2" y="607.8000000000001" width="252.00000000000003" height="84.00000000000001" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:line x1="437.00000000000006" y1="233.99988800000003" x2="437.00000000000006" y2="359.99988800000006" stroke="#397e70" stroke-width="3" /><ns0:line x1="241.00000000000003" y1="185.0" x2="409.00000000000006" y2="185.0" stroke="#59a7c5" stroke-width="5" data-element-kind="candidate-window" /><ns0:rect x="252.89999999999998" y="662.4000000000001" width="133.0" height="39.2" fill="#6fabb9" stroke="#39677c" stroke-width="2" /><ns0:text x="260.6" y="654.0" class="small">C-AC04</ns0:text><ns0:rect x="96.1" y="186.4" width="133.0" height="39.2" fill="#6fabb9" stroke="#39677c" stroke-width="2" /><ns0:text x="103.80000000000001" y="304.0" class="small">C-AC07</ns0:text><ns0:text x="45" y="760" class="small">房間名義2800×3700＝10.36㎡。</ns0:text><ns0:text x="45" y="794" class="small">床1050×1880、桌1400×700、櫃1800×600不變。</ns0:text><ns0:text x="45" y="828" class="small">後機：原機身底到衣櫃頂僅150mm。</ns0:text><ns0:text x="45" y="862" class="small">前機：投影在床頭／前窗附近，導風與拆洗待核。</ns0:text><ns0:text x="600" y="193">後端單機 AC04</ns0:text><ns0:text x="600" y="225">14.185m管線／後側室外機。</ns0:text><ns0:text x="600" y="257">前景觀側可少一個機位需求。</ns0:text><ns0:text x="600" y="289">服務維修、穿牆及長管實測待核。</ns0:text><ns0:text x="600" y="321" /><ns0:text x="600" y="353">前端單機 AC07</ns0:text><ns0:text x="600" y="385">10.085m管線，少4.1m。</ns0:text><ns0:text x="600" y="417">須核床頭直吹與前三台散熱。</ns0:text><ns0:text x="600" y="449">門關時只服務客房，不借補起居。</ns0:text><ns0:text x="600" y="555" class="label">負荷敏感度（不是選容量計算）</ns0:text><ns0:text x="600" y="600">10.36㎡ × 120 W/㎡ ＝ 1.243 kW</ns0:text><ns0:text x="600" y="638">10.36㎡ × 180 W/㎡ ＝ 1.865 kW</ns0:text><ns0:text x="600" y="676">10.36㎡ × 240 W/㎡ ＝ 2.486 kW</ns0:text><ns0:text x="600" y="755">朝向、窗玻璃、遮陽、外殼、人數與潛熱未知。</ns0:text><ns0:text x="600" y="789">2.8kW只作詢價級距，不直接認定適用。</ns0:text><ns0:text x="600" y="823">雙機只有已確認的備援／用途才再評估。</ns0:text><ns0:text x="600" y="857">兩套2.8kW的總額定5.6kW不能推論比較省電。</ns0:text><ns0:text x="30" y="965" class="small">完整機型要連散熱、出風、除濕、最小能力、管長／高差、冷凝水、電路及保固一起報；尚未採購或刪機。</ns0:text></ns0:svg>
