<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" width="1400" height="1100" role="img" aria-labelledby="title desc"><ns0:title id="title">B排濕03｜有窗重排：兩衛原尺寸試排與通道代價</ns0:title><ns0:desc id="desc">ABC獨立深化比較，未採用。毫米局部模型座標，道路在上方；完整門組、結構及專業核對未完成。</ns0:desc><ns0:style>text{font-family:system-ui,sans-serif;font-size:17px;fill:#263e49} .title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:650}.small{font-size:14px}.tiny{font-size:12px}</ns0:style><ns0:rect x="0" y="0" width="1400" height="1100" fill="#fafbf8" /><ns0:text x="30" y="42" class="title">B排濕03｜有窗重排：兩衛原尺寸試排與通道代價</ns0:text><ns0:text x="30" y="78">深化比較／未採用｜單位mm；來源是概念模型，梁柱、完成面、商品及實際路徑待核。</ns0:text><ns0:text x="30" y="1053" class="small">來源 bc1e2175f13cff04…｜本批 070d1ea2422f3f4d…</ns0:text><ns0:text x="30" y="1077" class="small">原ABC／目前3D及正式產品回覆保留。圖上名義尺寸與方塊試排，不等於施工、照護、風水或搬運核可。</ns0:text><ns0:metadata>{"source_sha256": "bc1e2175f13cff043deeb725e190a3b59908810f58661d9efadec05efbca9a5e", "report_hash": "070d1ea2422f3f4d8c72ad481a20edaad057ddfd094f99b5ddf2c43fd26283cc", "adopted": false}</ns0:metadata><ns0:text x="30" y="116">2F後右公衛從公共通道進；左前套衛只由主臥進。兩衛仍獨立，不穿臥室上公衛。</ns0:text><ns0:text x="40" y="165" class="label">後右公衛／候選後窗</ns0:text><ns0:polygon points="40.0,210.0 302.5,210.0 302.5,553.75 40.0,553.75" fill="#e1ecee" stroke="#819990" stroke-width="1" /><ns0:rect x="54.375" y="224.375" width="75.0" height="56.25" fill="#b9c9cc" stroke="#6e8c91" /><ns0:text x="58.75" y="251.875" class="tiny">盆</ns0:text><ns0:rect x="54.375" y="280.625" width="75.0" height="87.5" fill="none" stroke="#ba9255" stroke-dasharray="4 3" /><ns0:rect x="73.125" y="451.875" width="56.25" height="87.5" fill="#b9c9cc" stroke="#6e8c91" /><ns0:text x="77.5" y="479.375" class="tiny">WC</ns0:text><ns0:rect x="73.125" y="364.375" width="56.25" height="87.5" fill="none" stroke="#ba9255" stroke-dasharray="4 3" /><ns0:rect x="175.625" y="426.875" width="112.5" height="112.5" fill="#b9c9cc" stroke="#6e8c91" /><ns0:text x="180.0" y="454.375" class="tiny">900淋浴</ns0:text><ns0:rect x="175.625" y="339.375" width="112.5" height="87.5" fill="none" stroke="#ba9255" stroke-dasharray="4 3" /><ns0:line x1="148.75" y1="210.0" x2="290.0" y2="210.0" stroke="#388470" stroke-width="4" /><ns0:line x1="146.25" y1="553.75" x2="258.75" y2="553.75" stroke="#53a5bc" stroke-width="5" /><ns0:rect x="163.125" y="224.375" width="112.5" height="112.5" fill="none" stroke="#4d956d" stroke-dasharray="5 4" /><ns0:text x="40" y="615" class="small">900×600候選後窗，窗台1500。</ns0:text><ns0:text x="40" y="648" class="small">名義窗面0.54㎡，有效開口未知。</ns0:text><ns0:text x="40" y="681" class="small">公衛600盆、450×700便器與</ns0:text><ns0:text x="40" y="714" class="small">900淋浴不縮；全門態未核。</ns0:text><ns0:text x="465" y="165" class="label">左前套衛</ns0:text><ns0:polygon points="465.0,210.0 755.4,210.0 755.4,443.2 465.0,443.2" fill="#e1ecee" stroke="#819990" stroke-width="1" /><ns0:rect x="477.65" y="222.65" width="99.0" height="60.5" fill="#b9c9cc" stroke="#6e8c91" /><ns0:text x="481.5" y="246.85" class="tiny">盆</ns0:text><ns0:rect x="477.65" y="283.15" width="99.0" height="77.0" fill="none" stroke="#ba9255" stroke-dasharray="4 3" /><ns0:rect x="477.65" y="362.35" width="77.0" height="49.5" fill="#b9c9cc" stroke="#6e8c91" /><ns0:text x="481.5" y="386.55" class="tiny">WC</ns0:text><ns0:rect x="554.65" y="362.35" width="77.0" height="49.5" fill="none" stroke="#ba9255" stroke-dasharray="4 3" /><ns0:rect x="590.95" y="222.65" width="99.0" height="99.0" fill="#b9c9cc" stroke="#6e8c91" /><ns0:text x="594.8" y="246.85" class="tiny">900淋浴</ns0:text><ns0:rect x="590.95" y="321.65" width="99.0" height="77.0" fill="none" stroke="#ba9255" stroke-dasharray="4 3" /><ns0:line x1="608.0" y1="443.2" x2="732.3" y2="443.2" stroke="#388470" stroke-width="4" /><ns0:rect x="620.65" y="331.55" width="99.0" height="99.0" fill="none" stroke="#4d956d" stroke-dasharray="5 4" /><ns0:rect x="720.75" y="406.35" width="22.0" height="22.0" fill="#b686ac" stroke="#7d4975" /><ns0:text x="465" y="615" class="small">套衛原900×550盆櫃保留。</ns0:text><ns0:text x="465" y="648" class="small">便器旋轉90度，尺寸不變。</ns0:text><ns0:text x="465" y="681" class="small">加深20mm，扣原200管井後</ns0:text><ns0:text x="465" y="714" class="small">4.5149㎡，只略高於4.5下限。</ns0:text><ns0:text x="930" y="210" class="small">代價不只有搬浴室：</ns0:text><ns0:text x="930" y="243" class="small">新增公共通道約3.608㎡</ns0:text><ns0:text x="930" y="276" class="small">（115假設），主臥扣豎道</ns0:text><ns0:text x="930" y="309" class="small">後剩16.0889㎡，低於20目標。</ns0:text><ns0:text x="930" y="342" class="small">套衛門朝床仍未解，不能採用。</ns0:text><ns0:text x="930" y="375" class="small">後窗權利與外部遮擋未知；</ns0:text><ns0:text x="930" y="408" class="small">無後巷的前門版也不能假設</ns0:text><ns0:text x="930" y="441" class="small">後牆能開窗或排風。</ns0:text><ns0:text x="930" y="474" class="small" /><ns0:text x="930" y="507" class="small">左前套衛仍需自己的排氣。</ns0:text><ns0:text x="930" y="540" class="small">原右牆主臥冷氣落入新通道，</ns0:text><ns0:text x="930" y="573" class="small">不能沿用成已完成空調。</ns0:text><ns0:text x="930" y="606" class="small">管線、鏡面及門窗另合圖。</ns0:text><ns0:text x="30" y="895" class="small">原床1800×2000、衣櫃1800×600、梳妝台1200×500及主臥2400後窗不縮；二樓房內900局部直段可試排。</ns0:text><ns0:text x="30" y="928" class="small">操作虛框與900門前到達可分時互疊；器具、管井及新增豎道未碰列明固定本體，但不等所有門態／照護已核。</ns0:text><ns0:text x="30" y="961" class="small">三樓只有後右公衛；二樓左前套衛污水向下排，通氣管上引經三樓左前乾區的防火／隔音與檢修待核。</ns0:text></ns0:svg>
