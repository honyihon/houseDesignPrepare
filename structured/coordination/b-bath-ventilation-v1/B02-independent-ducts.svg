<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" width="1400" height="1100" role="img" aria-labelledby="title desc"><ns0:title id="title">B排濕02｜兩條獨立排氣：平面預算與標高示意</ns0:title><ns0:desc id="desc">ABC獨立深化比較，未採用。毫米局部模型座標，道路在上方；完整門組、結構及專業核對未完成。</ns0:desc><ns0:style>text{font-family:system-ui,sans-serif;font-size:17px;fill:#263e49} .title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:650}.small{font-size:14px}.tiny{font-size:12px}</ns0:style><ns0:rect x="0" y="0" width="1400" height="1100" fill="#fafbf8" /><ns0:text x="30" y="42" class="title">B排濕02｜兩條獨立排氣：平面預算與標高示意</ns0:text><ns0:text x="30" y="78">深化比較／未採用｜單位mm；來源是概念模型，梁柱、完成面、商品及實際路徑待核。</ns0:text><ns0:text x="30" y="1053" class="small">來源 bc1e2175f13cff04…｜本批 070d1ea2422f3f4d…</ns0:text><ns0:text x="30" y="1077" class="small">原ABC／目前3D及正式產品回覆保留。圖上名義尺寸與方塊試排，不等於施工、照護、風水或搬運核可。</ns0:text><ns0:metadata>{"source_sha256": "bc1e2175f13cff043deeb725e190a3b59908810f58661d9efadec05efbca9a5e", "report_hash": "070d1ea2422f3f4d8c72ad481a20edaad057ddfd094f99b5ddf2c43fd26283cc", "adopted": false}</ns0:metadata><ns0:text x="30" y="116">紫框500×300豎道占主臥0.15㎡；兩管分開，不和200×200污水管井共用。</ns0:text><ns0:polygon points="403.93,190.0 509.0,190.0 509.0,467.29 343.1,467.29 343.1,684.54 35.0,684.54 35.0,355.9 243.56,355.9 243.56,316.4 403.93,316.4" fill="#edf1ec" stroke="#819990" stroke-width="1" /><ns0:rect x="46.85" y="376.83500000000004" width="158.0" height="142.2" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="46.85" y="528.12" width="47.4" height="142.2" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="252.645" y="328.25" width="94.8" height="39.5" fill="#b9c9cc" stroke="#6e8c91" /><ns0:line x1="411.83" y1="190.0" x2="501.1" y2="190.0" stroke="#388470" stroke-width="4" /><ns0:line x1="343.1" y1="581.84" x2="343.1" y2="671.11" stroke="#388470" stroke-width="4" /><ns0:line x1="94.25" y1="684.54" x2="283.85" y2="684.54" stroke="#53a5bc" stroke-width="5" /><ns0:rect x="262.125" y="326.275" width="75.05" height="22.12" fill="#76adc4" stroke="#477b90" /><ns0:polygon points="243.56,190.0 403.93,190.0 403.93,316.4 243.56,316.4" fill="#d6e7d7" stroke="#819990" stroke-width="1" /><ns0:line x1="260.15" y1="190.0" x2="349.42" y2="190.0" stroke="#388470" stroke-width="4" /><ns0:polygon points="35.0,190.0 243.56,190.0 243.56,355.9 35.0,355.9" fill="#e1ecee" stroke="#819990" stroke-width="1" /><ns0:rect x="44.085" y="199.085" width="47.4" height="35.55" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="55.935" y="291.515" width="35.55" height="55.3" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="147.575" y="275.71500000000003" width="71.1" height="71.1" fill="#b9c9cc" stroke="#6e8c91" /><ns0:line x1="139.28" y1="190.0" x2="228.55" y2="190.0" stroke="#388470" stroke-width="4" /><ns0:polygon points="343.1,467.29 509.0,467.29 509.0,684.54 343.1,684.54" fill="#e1ecee" stroke="#819990" stroke-width="1" /><ns0:rect x="364.035" y="476.375" width="35.55" height="55.3" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="456.46500000000003" y="476.375" width="43.45" height="71.1" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="428.815" y="557.745" width="71.1" height="71.1" fill="#b9c9cc" stroke="#6e8c91" /><ns0:line x1="343.1" y1="581.84" x2="343.1" y2="671.11" stroke="#388470" stroke-width="4" /><ns0:line x1="410.25" y1="684.54" x2="481.35" y2="684.54" stroke="#53a5bc" stroke-width="5" /><ns0:polygon points="122.8875,365.1825 371.7375,365.1825 371.7375,340.1 371.7375,333.1875 357.9125,333.1875 357.9125,351.35749999999996 136.7125,351.35749999999996 136.7125,239.77 136.7125,232.85750000000002 122.8875,232.85750000000002" fill="#c3d6e7" fill-opacity="0.45" stroke="#4d82a4" stroke-dasharray="5 3" /><ns0:polygon points="122.8875,365.1825 391.4875,365.1825 391.4875,340.1 391.4875,333.1875 377.6625,333.1875 377.6625,351.35749999999996 136.7125,351.35749999999996 136.7125,239.77 136.7125,232.85750000000002 122.8875,232.85750000000002" fill="#c3d6e7" fill-opacity="0.45" stroke="#4d82a4" stroke-dasharray="5 3" /><ns0:rect x="354.95" y="328.25" width="39.5" height="23.7" fill="#d4a6c5" fill-opacity="0.65" stroke="#925b81" stroke-width="2" /><ns0:text x="311.5" y="388.28999999999996" class="tiny">新排氣豎道</ns0:text><ns0:rect x="218.675" y="331.015" width="15.8" height="15.8" fill="#a7847c" stroke="#70483e" /><ns0:text x="169.3" y="324.3" class="tiny">污水管井</ns0:text><ns0:rect x="35.0" y="437.27" width="263.07" height="247.27" fill="none" stroke="#aa7553" stroke-dasharray="5 3" /><ns0:text x="46.85" y="476.77" class="tiny">下層武轎庫投影</ns0:text><ns0:text x="35" y="735" class="small">床前移1815、衣櫃後移2030mm，尺寸不縮。</ns0:text><ns0:text x="35" y="766" class="small">豎道移前臂，避乾保護室、污水井與庫房；</ns0:text><ns0:text x="35" y="797" class="small">平面幾何不代表門窗、結構或宗教認證。</ns0:text><ns0:text x="640" y="160" class="label">標高示意：不是同一切面施工剖面</ns0:text><ns0:line x1="640" y1="743.0" x2="1140" y2="743.0" stroke="#84968e" stroke-width="1.5" /><ns0:text x="1150" y="748.0" class="small">2F +4000</ns0:text><ns0:line x1="640" y1="506.0" x2="1140" y2="506.0" stroke="#84968e" stroke-width="1.5" /><ns0:text x="1150" y="511.0" class="small">3F +7000</ns0:text><ns0:line x1="640" y1="269.0" x2="1140" y2="269.0" stroke="#84968e" stroke-width="1.5" /><ns0:text x="1150" y="274.0" class="small">RF +10000</ns0:text><ns0:polyline points="720,553.4 720,541.55 930,541.55 930,221.6" fill="none" stroke="#3b83a4" stroke-width="5" /><ns0:text x="650" y="583.4" class="small">floor-2 估長8.905m</ns0:text><ns0:polyline points="720,316.4 720,304.55 1005,304.55 1005,221.6" fill="none" stroke="#9872a6" stroke-width="5" /><ns0:text x="650" y="346.4" class="small">floor-3 估長6.155m</ns0:text><ns0:text x="640" y="805" class="small">RF是模型戶外服務區；出管+10600僅候選。</ns0:text><ns0:text x="640" y="829" class="small">排風帽尺寸、兩帽距離、防水／防颱及</ns0:text><ns0:text x="640" y="853" class="small">進氣口／開口距離待核，沒有終端核可。</ns0:text><ns0:text x="640" y="877" class="small" /><ns0:text x="640" y="901" class="small">DN125＋每側25保溫：外預算175mm。</ns0:text><ns0:text x="640" y="925" class="small">兩層各有自己的風機、管路及止回設備；</ns0:text><ns0:text x="640" y="949" class="small">不能只憑無管路時最大風量選機。</ns0:text><ns0:text x="640" y="973" class="small">樓層3m、天花2.4m、管心2.55m為假設；</ns0:text><ns0:text x="640" y="997" class="small">梁、板、吊架、防火及維修未核。</ns0:text></ns0:svg>
