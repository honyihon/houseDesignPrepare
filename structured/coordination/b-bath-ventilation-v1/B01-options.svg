<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" width="1400" height="1100" role="img" aria-labelledby="title desc"><ns0:title id="title">B排濕01｜二三樓公衛：保格局排氣／後窗重排</ns0:title><ns0:desc id="desc">ABC獨立深化比較，未採用。毫米局部模型座標，道路在上方；完整門組、結構及專業核對未完成。</ns0:desc><ns0:style>text{font-family:system-ui,sans-serif;font-size:17px;fill:#263e49} .title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:650}.small{font-size:14px}.tiny{font-size:12px}</ns0:style><ns0:rect x="0" y="0" width="1400" height="1100" fill="#fafbf8" /><ns0:text x="30" y="42" class="title">B排濕01｜二三樓公衛：保格局排氣／後窗重排</ns0:text><ns0:text x="30" y="78">深化比較／未採用｜單位mm；來源是概念模型，梁柱、完成面、商品及實際路徑待核。</ns0:text><ns0:text x="30" y="1053" class="small">來源 bc1e2175f13cff04…｜本批 070d1ea2422f3f4d…</ns0:text><ns0:text x="30" y="1077" class="small">原ABC／目前3D及正式產品回覆保留。圖上名義尺寸與方塊試排，不等於施工、照護、風水或搬運核可。</ns0:text><ns0:metadata>{"source_sha256": "bc1e2175f13cff043deeb725e190a3b59908810f58661d9efadec05efbca9a5e", "report_hash": "070d1ea2422f3f4d8c72ad481a20edaad057ddfd094f99b5ddf2c43fd26283cc", "adopted": false}</ns0:metadata><ns0:text x="30" y="116">本輪只比較B二三樓；一樓有窗公衛、祭祀正門、後門優先與前門備案不改。</ns0:text><ns0:text x="30" y="158" class="label">保位置：500×300獨立排氣豎道</ns0:text><ns0:polygon points="370.90999999999997,195.0 468.0,195.0 468.0,451.22999999999996 314.7,451.22999999999996 314.7,651.98 30.0,651.98 30.0,348.29999999999995 222.72,348.29999999999995 222.72,311.8 370.90999999999997,311.8" fill="#edf1ec" stroke="#819990" stroke-width="1" /><ns0:rect x="40.95" y="367.645" width="146.0" height="131.4" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="40.95" y="507.44" width="43.8" height="131.4" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="231.11499999999998" y="322.75" width="87.6" height="36.5" fill="#b9c9cc" stroke="#6e8c91" /><ns0:line x1="378.21" y1="195.0" x2="460.7" y2="195.0" stroke="#388470" stroke-width="4" /><ns0:line x1="314.7" y1="557.0799999999999" x2="314.7" y2="639.5699999999999" stroke="#388470" stroke-width="4" /><ns0:line x1="84.75" y1="651.98" x2="259.95" y2="651.98" stroke="#53a5bc" stroke-width="5" /><ns0:rect x="239.875" y="320.925" width="69.35" height="20.439999999999998" fill="#76adc4" stroke="#477b90" /><ns0:polygon points="222.72,195.0 370.90999999999997,195.0 370.90999999999997,311.8 222.72,311.8" fill="#d6e7d7" stroke="#819990" stroke-width="1" /><ns0:line x1="238.04999999999998" y1="195.0" x2="320.53999999999996" y2="195.0" stroke="#388470" stroke-width="4" /><ns0:polygon points="30.0,195.0 222.72,195.0 222.72,348.29999999999995 30.0,348.29999999999995" fill="#e1ecee" stroke="#819990" stroke-width="1" /><ns0:rect x="38.394999999999996" y="203.395" width="43.8" height="32.85" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="49.345" y="288.805" width="32.85" height="51.099999999999994" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="134.02499999999998" y="274.205" width="65.7" height="65.7" fill="#b9c9cc" stroke="#6e8c91" /><ns0:line x1="126.36" y1="195.0" x2="208.85" y2="195.0" stroke="#388470" stroke-width="4" /><ns0:polygon points="314.7,451.22999999999996 468.0,451.22999999999996 468.0,651.98 314.7,651.98" fill="#e1ecee" stroke="#819990" stroke-width="1" /><ns0:rect x="334.04499999999996" y="459.625" width="32.85" height="51.099999999999994" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="419.455" y="459.625" width="40.15" height="65.7" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="393.905" y="534.815" width="65.7" height="65.7" fill="#b9c9cc" stroke="#6e8c91" /><ns0:line x1="314.7" y1="557.0799999999999" x2="314.7" y2="639.5699999999999" stroke="#388470" stroke-width="4" /><ns0:line x1="376.75" y1="651.98" x2="442.45" y2="651.98" stroke="#53a5bc" stroke-width="5" /><ns0:rect x="325.65" y="322.75" width="36.5" height="21.9" fill="#c297b7" stroke="#854d79" stroke-width="2" /><ns0:polyline points="419.455,260.7 419.455,397.94 224.91,397.94 224.91,591.39 273.455,591.39 273.455,598.69" fill="none" stroke="#548a63" stroke-width="1.5" stroke-dasharray="5 4" /><ns0:text x="51.9" y="467.28999999999996" class="small">主臥</ns0:text><ns0:text x="234.39999999999998" y="248.29" class="tiny">乾保護室</ns0:text><ns0:text x="81.1" y="248.29" class="small">公衛</ns0:text><ns0:text x="336.59999999999997" y="525.69" class="small">套衛</ns0:text><ns0:text x="30" y="705" class="small">主臥扣新增豎道 20.0761㎡</ns0:text><ns0:text x="30" y="737" class="small">公衛 4.4667㎡／套衛 4.7124㎡</ns0:text><ns0:text x="30" y="769" class="small">原床、櫃、梳妝及2400後窗均保留。</ns0:text><ns0:text x="30" y="801" class="small">床櫃換位避門口正向投影；無直接窗。</ns0:text><ns0:text x="510" y="158" class="label">後右公衛有窗：增加公共通道</ns0:text><ns0:polygon points="510.0,651.98 794.7,651.98 794.7,451.22999999999996 850.91,451.22999999999996 850.91,311.8 702.72,311.8 702.72,349.76 510.0,349.76" fill="#edf1ec" stroke="#819990" stroke-width="1" /><ns0:rect x="520.95" y="500.14" width="146.0" height="131.4" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="520.95" y="359.25" width="43.8" height="131.4" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="711.115" y="322.75" width="87.6" height="36.5" fill="#b9c9cc" stroke="#6e8c91" /><ns0:line x1="850.91" y1="364.36" x2="850.91" y2="446.85" stroke="#388470" stroke-width="4" /><ns0:line x1="604.9" y1="349.76" x2="687.39" y2="349.76" stroke="#388470" stroke-width="4" /><ns0:line x1="564.75" y1="651.98" x2="739.95" y2="651.98" stroke="#53a5bc" stroke-width="5" /><ns0:polygon points="702.72,195.0 850.91,195.0 850.91,311.8 702.72,311.8" fill="#d6e7d7" stroke="#819990" stroke-width="1" /><ns0:line x1="718.05" y1="195.0" x2="800.54" y2="195.0" stroke="#388470" stroke-width="4" /><ns0:polygon points="850.91,195.0 948.0,195.0 948.0,451.22999999999996 850.91,451.22999999999996" fill="#edf1ec" stroke="#819990" stroke-width="1" /><ns0:polygon points="510.0,195.0 702.72,195.0 702.72,349.76 510.0,349.76" fill="#e1ecee" stroke="#819990" stroke-width="1" /><ns0:rect x="518.395" y="203.395" width="65.7" height="40.15" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="518.395" y="296.105" width="51.099999999999994" height="32.85" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="593.585" y="203.395" width="65.7" height="65.7" fill="#b9c9cc" stroke="#6e8c91" /><ns0:line x1="604.9" y1="349.76" x2="687.39" y2="349.76" stroke="#388470" stroke-width="4" /><ns0:polygon points="794.7,451.22999999999996 948.0,451.22999999999996 948.0,651.98 794.7,651.98" fill="#e1ecee" stroke="#819990" stroke-width="1" /><ns0:rect x="803.095" y="459.625" width="43.8" height="32.85" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="814.045" y="592.4849999999999" width="32.85" height="51.099999999999994" fill="#b9c9cc" stroke="#6e8c91" /><ns0:rect x="873.905" y="577.885" width="65.7" height="65.7" fill="#b9c9cc" stroke="#6e8c91" /><ns0:line x1="858.21" y1="451.22999999999996" x2="940.7" y2="451.22999999999996" stroke="#388470" stroke-width="4" /><ns0:line x1="856.75" y1="651.98" x2="922.45" y2="651.98" stroke="#53a5bc" stroke-width="5" /><ns0:rect x="816.5999999999999" y="322.75" width="21.9" height="21.9" fill="#c297b7" stroke="#854d79" stroke-width="2" /><ns0:polyline points="809.665,405.605 704.91,405.605 704.91,591.39 753.4549999999999,591.39 753.4549999999999,598.69" fill="none" stroke="#548a63" stroke-width="1.5" stroke-dasharray="5 4" /><ns0:text x="531.9" y="467.28999999999996" class="small">主臥</ns0:text><ns0:text x="714.4" y="248.29" class="tiny">乾保護室</ns0:text><ns0:polygon points="687.39,349.76 687.39,651.98 604.9,651.98 604.9,349.76" fill="#d99c92" fill-opacity="0.18" stroke="#ae6256" stroke-dasharray="5 4" /><ns0:text x="561.1" y="248.29" class="small">套衛</ns0:text><ns0:text x="816.5999999999999" y="525.69" class="small">公衛</ns0:text><ns0:text x="881.5699999999999" y="277.49" class="tiny">公</ns0:text><ns0:text x="881.5699999999999" y="306.69" class="tiny">共</ns0:text><ns0:text x="881.5699999999999" y="335.89" class="tiny">通</ns0:text><ns0:text x="881.5699999999999" y="365.09000000000003" class="tiny">道</ns0:text><ns0:text x="510" y="705" class="small">主臥扣新增豎道 16.0889㎡</ns0:text><ns0:text x="510" y="737" class="small">公衛 4.7124㎡／套衛 4.5149㎡</ns0:text><ns0:text x="510" y="769" class="small">原床、櫃、梳妝及2400後窗均保留。</ns0:text><ns0:text x="510" y="801" class="small">通道1100假設；紅帶套衛門朝床仍未解。</ns0:text><ns0:text x="1015" y="200" class="small">同一32坪概念框內，</ns0:text><ns0:text x="1015" y="233" class="small">不外擴、沒有側窗假設。</ns0:text><ns0:text x="1015" y="266" class="small" /><ns0:text x="1015" y="299" class="small">左案原20㎡主臥只餘</ns0:text><ns0:text x="1015" y="332" class="small">0.0761㎡，梁柱／包覆</ns0:text><ns0:text x="1015" y="365" class="small">再加大即可能不足。</ns0:text><ns0:text x="1015" y="398" class="small" /><ns0:text x="1015" y="431" class="small">右案主臥降至16.0889㎡，</ns0:text><ns0:text x="1015" y="464" class="small">且套衛門朝床仍未解。</ns0:text><ns0:text x="1015" y="497" class="small">左前套衛仍無直接窗，</ns0:text><ns0:text x="1015" y="530" class="small">也要排氣到屋頂。</ns0:text><ns0:text x="1015" y="563" class="small">原主臥冷氣須重選位置。</ns0:text><ns0:text x="30" y="910" class="small">三樓：左案維持左前公衛、後右乾區；右案改後右公衛、左前乾區，均不新增第二間浴廁。</ns0:text><ns0:text x="30" y="942" class="small">左案新機盒改前臂上方避床；氣流、鏡高與管線未知。兩案濕區／風管預算均避明列保護投影。</ns0:text><ns0:text x="30" y="974" class="small">左案較少重排，暫列優先工程核對；右案保留外窗比較，兩案均未達原兩衛5／6㎡目標，也未採用。</ns0:text></ns0:svg>
