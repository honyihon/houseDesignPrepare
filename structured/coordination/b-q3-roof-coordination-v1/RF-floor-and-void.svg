<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="Q3 RF到達／前室｜保原側門，梯井保持開口"><title>Q3 RF到達／前室｜保原側門，梯井保持開口</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}.room{font-size:14px;font-weight:650}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">Q3 RF到達／前室｜保原側門，梯井保持開口</text><text x="28" y="76">Q3改梯後RF獨立合圖／未採用｜新完整平台、前室及樓板需結構核定，舊圖只保對照，未併原ABC／3D。</text><text x="28" y="1158" class="small">本批 654ee674a408530032015e1d8200eb0512fdc224767ed8eb34cc8dd55afee0eb</text><text x="28" y="1182" class="small">門態與方塊是本批來源的靜態算式，非結構、法規、風水、產品、消防、照護或施工核可。未跑瀏覽器。</text><rect x="45.0" y="271.0" width="336.00000000000006" height="728.0000000000001" fill="#eef0e7" stroke="#607c73" stroke-width="1.5" /><rect x="56.2" y="532.8000000000001" width="308.00000000000006" height="456.40000000000003" fill="#f7f7f4" stroke="#a55748" stroke-width="2" stroke-dasharray="6 4" /><rect x="56.2" y="392.80000000000007" width="308.00000000000006" height="140.0" fill="#b9d0b3" stroke="#4c7750" stroke-width="1.8" /><rect x="61.1" y="287.1" width="303.8" height="105.70000000000002" fill="#d9dfbf" stroke="#74803e" stroke-width="1.8" /><rect x="364.20000000000005" y="287.1" width="32.900000000000006" height="107.80000000000001" fill="#f0c17f" stroke="#bd834c" /><polygon points="348.1,254.9000000000001 348.1,287.1 222.10000000000002,287.1 222.10000000000002,254.9000000000001" fill="#f0c17f" stroke="#bd834c" /><rect x="56.2" y="532.8000000000001" width="140.0" height="37.800000000000004" fill="none" stroke="#b88b7a" stroke-width="0.8" /><rect x="224.20000000000002" y="797.4000000000001" width="140.0" height="37.800000000000004" fill="none" stroke="#b88b7a" stroke-width="0.8" /><rect x="56.2" y="570.6000000000001" width="140.0" height="37.800000000000004" fill="none" stroke="#b88b7a" stroke-width="0.8" /><rect x="224.20000000000002" y="759.6000000000001" width="140.0" height="37.800000000000004" fill="none" stroke="#b88b7a" stroke-width="0.8" /><rect x="56.2" y="608.4000000000001" width="140.0" height="37.800000000000004" fill="none" stroke="#b88b7a" stroke-width="0.8" /><rect x="224.20000000000002" y="721.8000000000001" width="140.0" height="37.800000000000004" fill="none" stroke="#b88b7a" stroke-width="0.8" /><rect x="56.2" y="646.2" width="140.0" height="37.800000000000004" fill="none" stroke="#b88b7a" stroke-width="0.8" /><rect x="224.20000000000002" y="684.0000000000001" width="140.0" height="37.800000000000004" fill="none" stroke="#b88b7a" stroke-width="0.8" /><rect x="56.2" y="684.0000000000001" width="140.0" height="37.800000000000004" fill="none" stroke="#b88b7a" stroke-width="0.8" /><rect x="224.20000000000002" y="646.2" width="140.0" height="37.800000000000004" fill="none" stroke="#b88b7a" stroke-width="0.8" /><rect x="56.2" y="721.8000000000001" width="140.0" height="37.800000000000004" fill="none" stroke="#b88b7a" stroke-width="0.8" /><rect x="224.20000000000002" y="608.4000000000001" width="140.0" height="37.800000000000004" fill="none" stroke="#b88b7a" stroke-width="0.8" /><rect x="56.2" y="759.6000000000001" width="140.0" height="37.800000000000004" fill="none" stroke="#b88b7a" stroke-width="0.8" /><rect x="224.20000000000002" y="570.6000000000001" width="140.0" height="37.800000000000004" fill="none" stroke="#b88b7a" stroke-width="0.8" /><rect x="56.2" y="797.4000000000001" width="140.0" height="37.800000000000004" fill="none" stroke="#b88b7a" stroke-width="0.8" /><rect x="224.20000000000002" y="532.8000000000001" width="140.0" height="37.800000000000004" fill="none" stroke="#b88b7a" stroke-width="0.8" /><line x1="206.00000000000003" y1="271.0" x2="364.20000000000005" y2="271.0" stroke="#fafbf8" stroke-width="4" /><polygon points="212.65,112.80000000000001 199.35000000000002,112.80000000000001 199.35000000000002,271.0 212.65,271.0 212.65,112.80000000000001" fill="#bb9474" stroke="#805534" stroke-width="0.8" /><line x1="381.00000000000006" y1="271.0" x2="381.00000000000006" y2="411.0000000000001" stroke="#fafbf8" stroke-width="4" /><polygon points="521.0,417.6500000000001 521.0,404.35 381.00000000000006,404.35 381.00000000000006,417.6500000000001 521.0,417.6500000000001" fill="#bb9474" stroke="#805534" stroke-width="0.8" /><line x1="294.20000000000005" y1="462.80000000000007" x2="285.1" y2="462.80000000000007" stroke="#277c79" stroke-width="2" stroke-dasharray="5 3" /><line x1="285.1" y1="462.80000000000007" x2="285.1" y2="75.00000000000006" stroke="#277c79" stroke-width="2" stroke-dasharray="5 3" /><line x1="294.20000000000005" y1="462.80000000000007" x2="294.20000000000005" y2="341.0000000000001" stroke="#9b753f" stroke-width="2" stroke-dasharray="5 3" /><line x1="294.20000000000005" y1="341.0000000000001" x2="444.00000000000006" y2="341.0000000000001" stroke="#9b753f" stroke-width="2" stroke-dasharray="5 3" /><text x="40" y="135" class="small">僅畫RF梯核局部；樓梯洞下方是3F梯段</text><text x="94.0" y="350.80000000000007" class="room">乾式前室</text><text x="75.80000000000001" y="495.0000000000001" class="room">完整新到達平台</text><text x="94.0" y="782.0" class="room">後梯井：不可鋪滿</text><text x="420" y="350" class="room">RF側門y4400保原研究位置</text><text x="600" y="145">綠色完整平台承接Q3後移800mm到達，黃綠前室接回原前門與側門。新的完整平地、同標高</text><text x="600" y="168">與支承是待核條件，並非舊圖證據。</text><text x="600" y="203">棕色下方示意16個踏步；列明RF地面不蓋其投影。若整塊梯核鋪實心地板，16踏全部受蓋，</text><text x="600" y="226">明列排除。</text><text x="600" y="261">僅保平台／前室／門檻，2200×3260梯井保持開口；護欄、扶手、梁板、淨高及實際樓板</text><text x="600" y="284">邊界尚未核定。</text><text x="600" y="319">RF側門y4400保留，不等於三樓也保同門位；Q3三樓側門已到y5270，兩層各看自己</text><text x="600" y="342">的平台及門圖。</text><text x="600" y="377">前門1130扣兩側115→900；側門1000同口徑→770，巡檢只用700。前門90</text><text x="600" y="400">0算式不套到後機位或整機搬運。</text><text x="600" y="435">外框12.48㎡仍只是研究梯核框，不是合法屋突面積。新前室／到達板可能改有效樓板與申照</text><text x="600" y="458">計算，必須建築／結構同核。</text><text x="600" y="493">本批沒有跑實際樓梯、梁底或頭部路徑；踏步不被蓋不等於全程安全或消防核可。</text></svg>
