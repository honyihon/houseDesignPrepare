<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" width="1400" height="1100" role="img" aria-labelledby="title desc"><ns0:title id="title">B棟新風｜一二樓現在做、三樓先預留</ns0:title><ns0:desc id="desc">本圖為系統拓樸，沒有實際風管座標、機位、尺寸或施工開孔核可。新風需求已由屋主確認。</ns0:desc><ns0:style>text{font-family:system-ui,sans-serif;font-size:17px;fill:#263e49} .title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:650}.small{font-size:14px}.tiny{font-size:12px}</ns0:style><ns0:rect x="0" y="0" width="1400" height="1100" fill="#fafbf8" /><ns0:text x="30" y="42" class="title">B棟新風｜一二樓現在做、三樓先預留</ns0:text><ns0:text x="30" y="78">新風需求已確認｜系統分區預案：主機台數、風量、機位、風管與工程尚待核圖。</ns0:text><ns0:text x="30" y="1053" class="small">來源 bc1e2175f13cff04…｜本批 7f0687eac7983425…</ns0:text><ns0:text x="30" y="1077" class="small">原ABC／3D保留；本圖為送回風分區，線條不是實際管線或風水／法規／施工通過證明。</ns0:text><ns0:metadata>{"source_sha256": "bc1e2175f13cff043deeb725e190a3b59908810f58661d9efadec05efbca9a5e", "report_hash": "7f0687eac7983425b5307f04ba6e813f3bb7c46acddba7914f7b137e6af5428d", "adopted": false}</ns0:metadata><ns0:text x="30" y="116">B棟已述常住2人；三樓人數未指定。每棟空氣系統各自獨立，不跨棟共管。</ns0:text><ns0:defs><ns0:marker id="supply" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><ns0:polygon points="0,0 8,4 0,8" fill="#497d9b" /></ns0:marker><ns0:marker id="return" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><ns0:polygon points="0,0 8,4 0,8" fill="#568565" /></ns0:marker></ns0:defs><ns0:rect x="35" y="350" width="240" height="230" fill="#dce8e2" stroke="#789688" stroke-width="2" /><ns0:text x="52" y="390">B棟一般新風主機群</ns0:text><ns0:text x="52" y="423">ERV優先</ns0:text><ns0:text x="52" y="456">最低：過濾室外新風</ns0:text><ns0:text x="52" y="489">＋有設計的排出路徑</ns0:text><ns0:text x="52" y="522">台數／實機未選</ns0:text><ns0:rect x="350" y="180" width="710" height="205" fill="#e9ece8" stroke="#94a69b" /><ns0:text x="370" y="212" class="label">3F 未指定人數｜先留支路／電源／檢修</ns0:text><ns0:text x="370" y="244" class="small">送風：L形客房／安靜閱讀／安靜閱讀</ns0:text><ns0:text x="370" y="296" class="small">三樓風量未定，不視為0；客房／活動按使用調節。</ns0:text><ns0:text x="370" y="325" class="small">客房、閱讀各有支路；與B1香火完全分管，右後仍為乾式預留。</ns0:text><ns0:polyline points="275,410 305,410 305,255 350,255" fill="none" stroke="#497d9b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#supply)" /><ns0:polyline points="350,370 330,370 330,535 275,535" fill="none" stroke="#568565" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#return)" /><ns0:text x="1090" y="242" class="small">浴廁獨排</ns0:text><ns0:text x="1090" y="271" class="small">不與一般ERV共管</ns0:text><ns0:text x="1090" y="300" class="small">關門轉送另核</ns0:text><ns0:rect x="350" y="410" width="710" height="205" fill="#e1edf0" stroke="#94a69b" /><ns0:text x="370" y="442" class="label">2F 常住2人｜現在做可運作系統</ns0:text><ns0:text x="370" y="474" class="small">送風：L形主臥／安靜起居／安靜起居</ns0:text><ns0:text x="370" y="526" class="small">本層已述人數初估50～70m³/h；非選機值。</ns0:text><ns0:text x="370" y="555" class="small">主臥關門有乾淨回風支路或消音轉送；不經乾背櫃保護室、浴室或梯廳。</ns0:text><ns0:polyline points="275,410 313,410 313,485 350,485" fill="none" stroke="#497d9b" stroke-width="2" stroke-dasharray="none" marker-end="url(#supply)" /><ns0:polyline points="350,600 335,600 335,535 275,535" fill="none" stroke="#568565" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#return)" /><ns0:text x="1090" y="472" class="small">浴廁獨排</ns0:text><ns0:text x="1090" y="501" class="small">不與一般ERV共管</ns0:text><ns0:text x="1090" y="530" class="small">關門轉送另核</ns0:text><ns0:rect x="350" y="640" width="710" height="205" fill="#e3ecdf" stroke="#94a69b" /><ns0:text x="370" y="672" class="label">1F 未指定人數｜現在做可運作系統</ns0:text><ns0:text x="370" y="716" class="small">過濾室外新風 → 香火區 → 獨立源頭排氣 → 室外</ns0:text><ns0:text x="370" y="748" class="small">不接一般全熱回收；補氣不可直吹神桌。</ns0:text><ns0:text x="370" y="780" class="small">隔煙／樓梯門關閉，補排風量與祭祀人數待核。</ns0:text><ns0:text x="1090" y="702" class="small">浴廁獨排</ns0:text><ns0:text x="1090" y="731" class="small">不與一般ERV共管</ns0:text><ns0:text x="1090" y="760" class="small">關門轉送另核</ns0:text><ns0:text x="30" y="885" class="small">三樓若近期常用劇院／健身等活動，該區一期啟用；藍為送風、綠虛線為乾淨回風，非實際管路。</ns0:text><ns0:text x="30" y="925" class="small">B1香火補排獨立，上層ERV不能當其補氣；原500×300浴室井不塞新風主幹，避完整祭祀保護區另合圖。</ns0:text></ns0:svg>
