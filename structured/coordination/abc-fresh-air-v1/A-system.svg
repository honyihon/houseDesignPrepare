<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" width="1400" height="1100" role="img" aria-labelledby="title desc"><ns0:title id="title">A棟新風｜一二樓現在做、三樓先預留</ns0:title><ns0:desc id="desc">本圖為系統拓樸，沒有實際風管座標、機位、尺寸或施工開孔核可。新風需求已由屋主確認。</ns0:desc><ns0:style>text{font-family:system-ui,sans-serif;font-size:17px;fill:#263e49} .title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:650}.small{font-size:14px}.tiny{font-size:12px}</ns0:style><ns0:rect x="0" y="0" width="1400" height="1100" fill="#fafbf8" /><ns0:text x="30" y="42" class="title">A棟新風｜一二樓現在做、三樓先預留</ns0:text><ns0:text x="30" y="78">新風需求已確認｜系統分區預案：主機台數、風量、機位、風管與工程尚待核圖。</ns0:text><ns0:text x="30" y="1053" class="small">來源 bc1e2175f13cff04…｜本批 7f0687eac7983425…</ns0:text><ns0:text x="30" y="1077" class="small">原ABC／3D保留；本圖為送回風分區，線條不是實際管線或風水／法規／施工通過證明。</ns0:text><ns0:metadata>{"source_sha256": "bc1e2175f13cff043deeb725e190a3b59908810f58661d9efadec05efbca9a5e", "report_hash": "7f0687eac7983425b5307f04ba6e813f3bb7c46acddba7914f7b137e6af5428d", "adopted": false}</ns0:metadata><ns0:text x="30" y="116">A棟已述常住4人；三樓人數未指定。每棟空氣系統各自獨立，不跨棟共管。</ns0:text><ns0:defs><ns0:marker id="supply" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><ns0:polygon points="0,0 8,4 0,8" fill="#497d9b" /></ns0:marker><ns0:marker id="return" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><ns0:polygon points="0,0 8,4 0,8" fill="#568565" /></ns0:marker></ns0:defs><ns0:rect x="35" y="350" width="240" height="230" fill="#dce8e2" stroke="#789688" stroke-width="2" /><ns0:text x="52" y="390">A棟一般新風主機群</ns0:text><ns0:text x="52" y="423">ERV優先</ns0:text><ns0:text x="52" y="456">最低：過濾室外新風</ns0:text><ns0:text x="52" y="489">＋有設計的排出路徑</ns0:text><ns0:text x="52" y="522">台數／實機未選</ns0:text><ns0:rect x="350" y="180" width="710" height="205" fill="#e9ece8" stroke="#94a69b" /><ns0:text x="370" y="212" class="label">3F 未指定人數｜先留支路／電源／檢修</ns0:text><ns0:text x="370" y="244" class="small">送風：客房／家庭劇院／多用途休憩／沙發床區／閱讀／工作區</ns0:text><ns0:text x="370" y="296" class="small">三樓風量未定，不視為0；客房／活動按使用調節。</ns0:text><ns0:text x="370" y="325" class="small">劇院／客房關門仍須獨立或消音回風；活動使用按同時人數加強。</ns0:text><ns0:polyline points="275,410 305,410 305,255 350,255" fill="none" stroke="#497d9b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#supply)" /><ns0:polyline points="350,370 330,370 330,535 275,535" fill="none" stroke="#568565" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#return)" /><ns0:text x="1090" y="242" class="small">浴廁獨排</ns0:text><ns0:text x="1090" y="271" class="small">不與一般ERV共管</ns0:text><ns0:text x="1090" y="300" class="small">關門轉送另核</ns0:text><ns0:rect x="350" y="410" width="710" height="205" fill="#e1edf0" stroke="#94a69b" /><ns0:text x="370" y="442" class="label">2F 常住2人｜現在做可運作系統</ns0:text><ns0:text x="370" y="474" class="small">送風：主臥／次臥／書房／工作室</ns0:text><ns0:text x="370" y="526" class="small">本層已述人數初估50～70m³/h；非選機值。</ns0:text><ns0:text x="370" y="555" class="small">各關門房有回風或消音轉送至本層乾淨公共區；不借樓梯。</ns0:text><ns0:polyline points="275,410 313,410 313,485 350,485" fill="none" stroke="#497d9b" stroke-width="2" stroke-dasharray="none" marker-end="url(#supply)" /><ns0:polyline points="350,600 335,600 335,535 275,535" fill="none" stroke="#568565" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#return)" /><ns0:text x="1090" y="472" class="small">浴廁獨排</ns0:text><ns0:text x="1090" y="501" class="small">不與一般ERV共管</ns0:text><ns0:text x="1090" y="530" class="small">關門轉送另核</ns0:text><ns0:rect x="350" y="640" width="710" height="205" fill="#e3ecdf" stroke="#94a69b" /><ns0:text x="370" y="672" class="label">1F 常住2人｜現在做可運作系統</ns0:text><ns0:text x="370" y="704" class="small">送風：前段合併客餐廳／孝親房</ns0:text><ns0:text x="370" y="756" class="small">本層已述人數初估50～70m³/h；非選機值。</ns0:text><ns0:text x="370" y="785" class="small">客餐乾淨側回風；孝親房關門要專支回風或消音轉送，不能靠梯廳。</ns0:text><ns0:polyline points="275,410 321,410 321,715 350,715" fill="none" stroke="#497d9b" stroke-width="2" stroke-dasharray="none" marker-end="url(#supply)" /><ns0:polyline points="350,830 340,830 340,535 275,535" fill="none" stroke="#568565" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#return)" /><ns0:text x="1090" y="702" class="small">浴廁獨排＋油煙獨排</ns0:text><ns0:text x="1090" y="731" class="small">不與一般ERV共管</ns0:text><ns0:text x="1090" y="760" class="small">關門轉送另核</ns0:text><ns0:text x="30" y="885" class="small">三樓若近期常用劇院／健身等活動，該區一期啟用；藍為送風、綠虛線為乾淨回風，非實際管路。</ns0:text><ns0:text x="30" y="925" class="small">孝親房、主臥先做有效室外送風；次臥、書房及三樓劇院／客房保留支路，隔音門不靠大門縫換氣。</ns0:text></ns0:svg>
