.20000000000005" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="656.4" y="530.7" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="500.4" y="390.30000000000007" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="656.4" y="495.6" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="500.4" y="425.4" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="656.4" y="460.5" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="500.4" y="460.5" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="656.4" y="425.4" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="500.4" y="495.6" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="656.4" y="390.30000000000007" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="500.4" y="530.7" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="656.4" y="355.20000000000005" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="500.4" y="565.8000000000001" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="656.4" y="320.1" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><polygon points="786.4000000000001,190.10000000000002 786.4000000000001,320.1 500.4,320.1 500.4,190.10000000000002 786.4000000000001,190.10000000000002" fill="#b8d4af" stroke="#4d7a50" stroke-width="1.5" /><text x="490" y="145" font-size="16" font-weight="700">B-3F｜+7000mm</text><rect x="945.0" y="77.0" width="312.0" height="676.0" fill="#edf0e9" stroke="#607c73" /><rect x="955.4" y="320.1" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="1111.4" y="565.8000000000001" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="955.4" y="355.20000000000005" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="1111.4" y="530.7" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="955.4" y="390.30000000000007" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="1111.4" y="495.6" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="955.4" y="425.4" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="1111.4" y="460.5" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="955.4" y="460.5" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="1111.4" y="425.4" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="955.4" y="495.6" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="1111.4" y="390.30000000000007" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="955.4" y="530.7" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="1111.4" y="355.20000000000005" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="955.4" y="565.8000000000001" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="1111.4" y="320.1" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><polygon points="1241.4,190.10000000000002 1241.4,320.1 955.4,320.1 955.4,190.10000000000002 1241.4,190.10000000000002" fill="#b8d4af" stroke="#4d7a50" stroke-width="1.5" /><polygon points="1242.05,91.95000000000005 1242.05,190.10000000000002 959.95,190.10000000000002 959.95,91.95000000000005 1242.05,91.95000000000005" fill="#b8d4af" stroke="#4d7a50" stroke-width="1.5" /><polygon points="1271.95,91.95000000000005 1271.95,192.05000000000007 1241.4,192.05000000000007 1241.4,91.95000000000005 1271.95,91.95000000000005" fill="#b8d4af" stroke="#4d7a50" stroke-width="1.5" /><polygon points="1226.45,62.05000000000001 1226.45,91.95000000000005 1109.45,91.95000000000005 1109.45,62.05000000000001" fill="#b8d4af" stroke="#4d7a50" stroke-width="1.5" /><rect x="955.4" y="320.1" width="286.0" height="423.8" fill="none" stroke="#ad493b" stroke-width="2" stroke-dasharray="5 3" /><text x="945" y="145" font-size="16" font-weight="700">B-RF-D1｜+10000mm</text><text x="35" y="845" font-size="16">2F：一樓原24級梯不改；二樓新到達用L形來源多邊形，900mm指定轉接線在列明地面內。若誤鋪2200×1000新全寬平台，會壓到一樓上來的right-</text><text x="35" y="872" font-size="16">9／10／11。局部200mm板厚假設不是全梯淨高核可。</text><text x="35" y="917" font-size="16">3F：承接二樓Q3的18級／270mm踏面上層梯，後移800mm，折返平台1900縮至1100mm。L形KTV房界、前門及側門位置各保自己的來源，不能拿舊矩形房</text><text x="35" y="944" font-size="16">間或舊平台套用。</text><text x="35" y="989" font-size="16">RF：到達平台2200×1000、乾前室2170×755及列明門檻合用；只鋪這些地面，後梯井2200×3260保持開口，不蓋三樓上來16個列明踏步。RF側門y4</text><text x="35" y="1016" font-size="16">400與3F側門y5270是不同層。</text><text x="35" y="1061" font-size="16">本批是同版平面／標高與未來場景輸入，不是新3D畫面或專業簽證；梁板、扶手、實際門片、整段淨高、防火、救援與屋突資格仍待資料。</text></svg>
