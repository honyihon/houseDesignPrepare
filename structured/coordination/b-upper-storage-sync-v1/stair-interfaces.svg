<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1500" width="1400" height="1500" role="img" aria-label="B上下層接口｜2F L形到達、3F Q3與RF梯井"><title>B上下層接口｜2F L形到達、3F Q3與RF梯井</title><style>text{font-family:system-ui,sans-serif;fill:#263e49}.small{font-size:13px}.room{font-size:12px}</style><rect x="0" y="0" width="1400" height="1500" fill="#fafbf8" /><text x="28" y="40" font-size="26" font-weight="700">B上下層接口｜2F L形到達、3F Q3與RF梯井</text><text x="28" y="76" font-size="16">B同版底圖／未採用｜保原P4／Q3多邊形、設備及兩入口；只比儲藏，不把完整梯核鋪成實心樓板。</text><text x="28" y="106" font-size="16">橙：新增／桌下儲藏；橙虛線：取物帶。綠：列明到達地面；紅虛線：梯井或天井，不得封滿。</text><text x="28" y="1458" font-size="16" class-="small">來源 958e4c5b58ef47a3121818135dc85b46dd64f7ae615ebe423295b008454dcd3b</text><text x="28" y="1482" font-size="16" class-="small">只核列明2D投影；不是新3D、整座梯淨高、實際門片、風水、聲學、結構、法規或施工核可。</text><rect x="35.0" y="77.0" width="312.0" height="676.0" fill="#edf0e9" stroke="#607c73" /><rect x="45.4" y="216.10000000000002" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="201.4" y="567.1" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="45.4" y="251.20000000000005" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="201.4" y="532.0" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="45.4" y="286.30000000000007" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="201.4" y="496.9" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="45.4" y="321.4" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="201.4" y="461.80000000000007" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="45.4" y="356.5" width="130.0" height="35.1" fill="none" stroke="#a2755e" stroke-width="0.7" /><rect x="201.4" y="426.70000000000005" width="130.0" height="35.1" fill="none" stroke="#a275