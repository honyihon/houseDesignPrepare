<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1320" width="1400" height="1320" role="img" aria-label="B-RF-D1｜原配置｜標高+10000mm"><title>B-RF-D1｜原配置｜標高+10000mm</title><style>text{font-family:system-ui,sans-serif;fill:#263e49}.small{font-size:13px}.room{font-size:12px}</style><rect x="0" y="0" width="1400" height="1320" fill="#fafbf8" /><text x="28" y="40" font-size="26" font-weight="700">B-RF-D1｜原配置｜標高+10000mm</text><text x="28" y="76" font-size="16">B同版底圖／未採用｜保原P4／Q3多邊形、設備及兩入口；只比儲藏，不把完整梯核鋪成實心樓板。</text><text x="28" y="106" font-size="16">橙：新增／桌下儲藏；橙虛線：取物帶。綠：列明到達地面；紅虛線：梯井或天井，不得封滿。</text><text x="28" y="1278" font-size="16" class-="small">來源 958e4c5b58ef47a3121818135dc85b46dd64f7ae615ebe423295b008454dcd3b</text><text x="28" y="1302" font-size="16" class-="small">只核列明2D投影；不是新3D、整座梯淨高、實際門片、風水、聲學、結構、法規或施工核可。</text><rect x="45.0" y="150.0" width="312.0" height="916.76" fill="#eef0e7" stroke="#607c73" /><polygon points="45.0,150.0 357.0,150.0 357.0,352.79999999999995 45.0,352.79999999999995" fill="#edf0e9" stroke="#607c73" stroke-width="0.9" data-room-id="front-platform" /><text x="201.0" y="251.39999999999998" font-size="11" text-anchor="middle">RF前平台</text><line x1="104.8" y1="352.79999999999995" x2="163.56" y2="352.79999999999995" stroke="#00a3bb" stroke-width="3" /><rect x="238.17999999999998" y="909.98" width="78.0" height="104.0" fill="none" stroke="#777d8c" stroke-dasharray="3 2" /><rect x="50.98" y="155.98" width="104.0" height="65.0" fill="none" stroke="#777d8c" stroke-dasharray="3 2" /><rect x="97.78" y="862.4" width="72.8" height="93.6" fill="none" stroke="#777d8c" stroke-dasharray="3 2" /><rect x="50.98" y="228.78" width="36.4" height="36.4" fill="none" stroke="#777d8c" stroke-dasharray="3 2" /><rect x="330.21999999999997" y="966.4" width="20.8" height="20.8" fill="none" stroke="#777d8c" stroke-dasharray="3 2" /><rect x="215.04" y="155.98" width="46.8" height="70.2" fill="none" stroke="#777d8c" stroke-dasharray="3 2" /><rect x="304.21999999999997" y="15