on points="97.0,746.4399999999999 97.0,852.0 102.19999999999999,852.0 102.19999999999999,746.4399999999999" fill="#b89965" /><polygon points="169.8,746.4399999999999 169.8,852.0 175.0,852.0 175.0,746.4399999999999" fill="#b89965" /><line x1="104.8" y1="352.79999999999995" x2="163.56" y2="352.79999999999995" stroke="#00a3bb" stroke-width="3" /><line x1="169.8" y1="352.79999999999995" x2="169.8" y2="404.79999999999995" stroke="#00a3bb" stroke-width="3" /><rect x="266.0" y="239.44" width="31.2" height="93.6" fill="#b8cabd" stroke="#446952" stroke-width="0.7" data-item-key="front-platform:drying-rack" data-storage-case="" /><text x="281.6" y="286.24" font-size="11" text-anchor="middle">1</text><rect x="165.38" y="228.78" width="62.4" height="23.4" fill="#b8cabd" stroke="#446952" stroke-width="0.7" data-item-key="front-platform:folding-table" data-storage-case="" /><text x="196.57999999999998" y="240.48" font-size="11" text-anchor="middle">2</text><text x="45" y="132" font-size="16">道路／前方 ↑</text><text x="45" y="1100" font-size="12">6000×17630mm＝105.78㎡研究地坪框；不是每層可建量</text><text x="430" y="155" font-size="21" font-weight="700">本層資料與圖例</text><text x="430" y="188" font-size="16">沿D1原折衣桌占地改為帶防雨下櫃的工作檯；原折衣功能、操作帶及分時通行保留，不再吃已不足2</text><text x="430" y="213" font-size="16">4㎡的平台。</text><text x="430" y="248" font-size="16">D1／D2各沿自己的桌位改下櫃，不另畫舊桌；設備與檢修預留不縮。RF24㎡目標仍未達，前室</text><text x="430" y="273" font-size="16">不算戶外平台。</text><text x="430" y="318" font-size="20" font-weight="700">物件編號／完整品名（均沿本版）</text><text x="430" y="353" font-size="15">1｜1800×600移動晾衣架試排｜平面600×1800mm</text><text x="430" y="378" font-size="15">2｜1200×450折衣桌試排｜平面1200×450mm</text><text x="430" y="403" font-size="15">預留｜水塔／泵浦整組預留</text><text x="430" y="428" font-size="15">預留｜熱泵整組預留</text><text x="430" y="453" font-size="15">預留｜後浴廁空氣出口區／非污水通氣</text><text x="430" y="478" font-size="15">預留｜前污氣出口協調區</text><text x="430" y="503" font-size="15">預留｜後400污水通氣井投影</text><text x="430" y="528" font-size="15">預留｜representative-slot-1｜冷氣室外機及維修預留（非新購台數）</text><text x="430" y="553" font-size="15">預留｜representative-slot-2｜冷氣室外機及維修預留（非新購台數）</text><text x="430" y="578" font-size="15">預留｜B-AC03｜冷氣室外機及維修預留（非新購台數）</text><text x="430" y="603" font-size="15">預留｜B-AC04｜冷氣室外機及維修預留（非新購台數）</text><text x="430" y="628" font-size="15">預留｜樓梯屋突／保留樓梯洞</text></svg>
