<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" width="1400" height="1100" role="img" aria-labelledby="title desc"><ns0:title id="title">B第三輪01｜100mm基線＋公衛器具／立管深化</ns0:title><ns0:desc id="desc">ABC獨立深化比較，未採用。毫米局部模型座標，道路在上方；完整門組、結構及專業核對未完成。</ns0:desc><ns0:style>text{font-family:system-ui,sans-serif;font-size:17px;fill:#263e49} .title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:650}.small{font-size:14px}.tiny{font-size:12px}</ns0:style><ns0:rect x="0" y="0" width="1400" height="1100" fill="#fafbf8" /><ns0:text x="30" y="42" class="title">B第三輪01｜100mm基線＋公衛器具／立管深化</ns0:text><ns0:text x="30" y="78">深化比較／未採用｜單位mm；來源是概念模型，梁柱、完成面、商品及實際路徑待核。</ns0:text><ns0:text x="30" y="1053" class="small">來源 bc1e2175f13cff04…｜本批 5414953c7dc6105a…</ns0:text><ns0:text x="30" y="1077" class="small">原ABC／目前3D及正式產品回覆保留。圖上名義尺寸與方塊試排，不等於施工、照護、風水或搬運核可。</ns0:text><ns0:metadata>{"source_sha256": "bc1e2175f13cff043deeb725e190a3b59908810f58661d9efadec05efbca9a5e", "report_hash": "5414953c7dc6105adc17aaefe1fba1e8da40845fff7f3451db28e8a93f25df55", "adopted": false}</ns0:metadata><ns0:text x="30" y="116">Claude同意100mm基線；紫框管井為候選，洗衣機及右牆機盒修正尚未由Claude審閱。</ns0:text><ns0:polygon points="455.3,185.0 575.0,185.0 575.0,500.9 386.0,500.9 386.0,748.4 35.0,748.4 35.0,374.0 272.6,374.0 272.6,329.0 455.3,329.0" fill="#edf1ec" stroke="#819990" stroke-width="1" /><ns0:rect x="48.5" y="561.2" width="180.0" height="162.0" fill="#b9c9cc" stroke="#6e8c91" /><ns0:text x="51.65" y="581.0" class="tiny">床</ns0:text><ns0:rect x="228.5" y="561.2" width="54.0" height="162.0" fill="none" stroke="#ba9255" stroke-dasharray="4 3" /><ns0:rect x="48.5" y="387.5" width="54.0" height="162.0" fill="#b9c9cc" stroke="#6e8c91" /><ns0:text x="51.65" y="407.29999999999995" class="tiny">衣櫃</ns0:text><ns0:rect x="102.5" y="387.5" width="54.0" height="162.0" fill="none" stroke="#ba9255" stroke-dasharray="4 3" /><ns0:rect x="282.95" y="342.5" width="108.0" height="45.0" fill="#b9c9cc" stroke="#6e8c91" /><ns0:text x="286.1" y="362.29999999999995" class="tiny">梳妝台</ns0:text><ns0:rect x="282.95" y="387.5" width="108.0" height="63.0" fill="none" stroke="#ba9255" stroke-dasharray="4 3" /><ns0:line x1="464.3" y1="185.0" x2="566.0" y2="185.0" stroke="#388470" stroke-width="4" /><ns0:line x1="386.0" y1="631.4" x2="386.0" y2="733.1" stroke="#388470" stroke-width="4" /><ns0:line x1="102.5" y1="748.4" x2="318.5" y2="748.4" stroke="#53a5bc" stroke-width="5" /><ns0:rect x="538.55" y="383.45" width="25.2" height="85.5" fill="#76adc4" stroke="#477b90" /><ns0:polygon points="272.6,185.0 455.3,185.0 455.3,329.0 272.6,329.0" fill="#d6e7d7" stroke="#819990" stroke-width="1" /><ns0:line x1="291.5" y1="185.0" x2="393.2" y2="185.0" stroke="#388470" stroke-width="4" /><ns0:polygon points="35.0,185.0 272.6,185.0 272.6,374.0 35.0,374.0" fill="#e1ecee" stroke="#819990" stroke-width="1" /><ns0:rect x="45.35" y="195.35" width="54.0" height="40.5" fill="#b9c9cc" stroke="#6e8c91" /><ns0:text x="48.5" y="215.15" class="tiny">盆</ns0:text><ns0:rect x="45.35" y="235.85" width="54.0" height="63.0" fill="none" stroke="#ba9255" stroke-dasharray="4 3" /><ns0:rect x="58.849999999999994" y="300.65" width="40.5" height="63.0" fill="#b9c9cc" stroke="#6e8c91" /><ns0:text x="62.0" y="320.45" class="tiny">WC</ns0:text><ns0:rect x="58.849999999999994" y="237.65" width="40.5" height="63.0" fill="none" stroke="#ba9255" stroke-dasharray="4 3" /><ns0:rect x="163.25" y="282.65" width="81.0" height="81.0" fill="#b9c9cc" stroke="#6e8c91" /><ns0:text x="166.4" y="302.45" class="tiny">900淋浴</ns0:text><ns0:rect x="163.25" y="219.65" width="81.0" height="63.0" fill="none" stroke="#ba9255" stroke-dasharray="4 3" /><ns0:line x1="153.8" y1="185.0" x2="255.5" y2="185.0" stroke="#388470" stroke-width="4" /><ns0:polygon points="386.0,500.9 575.0,500.9 575.0,748.4 386.0,748.4" fill="#e1ecee" stroke="#819990" stroke-width="1" /><ns0:rect x="409.84999999999997" y="511.25" width="40.5" height="63.0" fill="#b9c9cc" stroke="#6e8c91" /><ns0:text x="413.0" y="531.05" class="tiny">WC</ns0:text><ns0:rect x="409.84999999999997" y="574.25" width="40.5" height="63.0" fill="none" stroke="#ba9255" stroke-dasharray="4 3" /><ns0:rect x="515.15" y="511.25" width="49.5" height="81.0" fill="#b9c9cc" stroke="#6e8c91" /><ns0:text x="518.3" y="531.05" class="tiny">盆</ns0:text><ns0:rect x="452.15" y="511.25" width="63.0" height="81.0" fill="none" stroke="#ba9255" stroke-dasharray="4 3" /><ns0:rect x="483.65" y="603.95" width="81.0" height="81.0" fill="#b9c9cc" stroke="#6e8c91" /><ns0:text x="486.8" y="623.75" class="tiny">900淋浴</ns0:text><ns0:rect x="420.65" y="603.95" width="63.0" height="81.0" fill="none" stroke="#ba9255" stroke-dasharray="4 3" /><ns0:line x1="386.0" y1="631.4" x2="386.0" y2="733.1" stroke="#388470" stroke-width="4" /><ns0:line x1="462.5" y1="748.4" x2="543.5" y2="748.4" stroke="#53a5bc" stroke-width="5" /><ns0:rect x="244.25" y="345.65" width="18.0" height="18.0" fill="#b98db4" stroke="#7b4376" stroke-width="2" /><ns0:rect x="244.25" y="282.65" width="18.0" height="63.0" fill="#e2e8ba" stroke="#839653" stroke-dasharray="3 2" /><ns0:rect x="164.15" y="195.35" width="81.0" height="81.0" fill="none" stroke="#4f9467" stroke-dasharray="5 4" /><ns0:rect x="396.34999999999997" y="641.75" width="81.0" height="81.0" fill="none" stroke="#4f9467" stroke-dasharray="5 4" /><ns0:rect x="284.29999999999995" y="724.55" width="101.7" height="8.549999999999999" fill="#dec49e" stroke="#ad7946" /><ns0:polyline points="515.15,266.0 515.15,435.2 275.29999999999995,435.2 275.29999999999995,673.7 335.15,673.7 335.15,682.7" fill="none" stroke="#4d855b" stroke-width="2" stroke-dasharray="5 4" /><ns0:text x="287.9" y="259.7" class="small">獨立乾室</ns0:text><ns0:text x="107.0" y="493.7" class="small">主臥</ns0:text><ns0:text x="458.0" y="471.2" class="tiny">右牆機盒</ns0:text><ns0:text x="650" y="185">每面115mm內縮估算：</ns0:text><ns0:text x="650" y="217">主臥 20.2261㎡</ns0:text><ns0:text x="650" y="249">公衛輪廓 4.5067㎡</ns0:text><ns0:text x="650" y="281">減200×200管井 0.0400㎡</ns0:text><ns0:text x="650" y="313">公衛扣管井後 4.4667㎡</ns0:text><ns0:text x="650" y="345">套衛 4.7124㎡</ns0:text><ns0:text x="650" y="377" /><ns0:text x="650" y="409">完整家具保留：</ns0:text><ns0:text x="650" y="441">床1800×2000／櫃1800×600</ns0:text><ns0:text x="650" y="473">梳妝1200×500／後窗2400</ns0:text><ns0:text x="650" y="505">公衛盆600×450／套衛盆900×550</ns0:text><ns0:text x="650" y="537">便器450×700／淋浴900×900</ns0:text><ns0:text x="1020" y="185" class="small">公衛新試排：</ns0:text><ns0:text x="1020" y="217" class="small">便器離左完成牆150mm。</ns0:text><ns0:text x="1020" y="249" class="small">淋浴向左移200mm；濕面到</ns0:text><ns0:text x="1020" y="281" class="small">乾室名義左界由115增至315mm。</ns0:text><ns0:text x="1020" y="313" class="small">管井到乾室角部約218mm；</ns0:text><ns0:text x="1020" y="345" class="small">東側綠條不排管。</ns0:text><ns0:text x="1020" y="377" class="small">200管井能否裝管及檢修未知。</ns0:text><ns0:text x="1020" y="409" class="small">公衛向前外開門片在本圖外。</ns0:text><ns0:text x="1020" y="441" class="small">左前公衛沒有直接外窗。</ns0:text><ns0:text x="1020" y="473" class="small">排氣、補氣與排水坡另核。</ns0:text><ns0:text x="1020" y="505" class="small">700操作虛框／900到達有共享，</ns0:text><ns0:text x="1020" y="537" class="small">只能分時，不代表照護核可。</ns0:text><ns0:text x="30" y="880" class="small">房間輪廓沿用NEW-01；20㎡含狹長入口／梳妝與轉折，後段最大內接矩形只有14.4231㎡。</ns0:text><ns0:text x="30" y="916" class="small">原目標20／5／6㎡及兩衛下限3.6／4.5㎡不改；本案仍未全達原目標。</ns0:text><ns0:text x="30" y="952" class="small">三樓延用公衛器具與管井候選，右後保持乾預留；屋頂只核對管井投影，通氣終端未選。</ns0:text></ns0:svg>
