<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" width="1400" height="1100" role="img" aria-labelledby="title desc"><ns0:title id="title">B第三輪03｜更正床門距離，另排右牆冷氣候選</ns0:title><ns0:desc id="desc">ABC獨立深化比較，未採用。毫米局部模型座標，道路在上方；完整門組、結構及專業核對未完成。</ns0:desc><ns0:style>text{font-family:system-ui,sans-serif;font-size:17px;fill:#263e49} .title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:650}.small{font-size:14px}.tiny{font-size:12px}</ns0:style><ns0:rect x="0" y="0" width="1400" height="1100" fill="#fafbf8" /><ns0:text x="30" y="42" class="title">B第三輪03｜更正床門距離，另排右牆冷氣候選</ns0:text><ns0:text x="30" y="78">深化比較／未採用｜單位mm；來源是概念模型，梁柱、完成面、商品及實際路徑待核。</ns0:text><ns0:text x="30" y="1053" class="small">來源 bc1e2175f13cff04…｜本批 5414953c7dc6105a…</ns0:text><ns0:text x="30" y="1077" class="small">原ABC／目前3D及正式產品回覆保留。圖上名義尺寸與方塊試排，不等於施工、照護、風水或搬運核可。</ns0:text><ns0:metadata>{"source_sha256": "bc1e2175f13cff043deeb725e190a3b59908810f58661d9efadec05efbca9a5e", "report_hash": "5414953c7dc6105adc17aaefe1fba1e8da40845fff7f3451db28e8a93f25df55", "adopted": false}</ns0:metadata><ns0:text x="30" y="116">上方仍朝道路、下方是後牆；只示2F主臥後段，3F機盒同位但不新增右後套衛。</ns0:text><ns0:polygon points="665.0,185.0 525.3499999999999,185.0 312.2,185.0 312.2,237.5 35.0,237.5 35.0,674.3 444.5,674.3 444.5,385.54999999999995 665.0,385.54999999999995 665.0,185.0" fill="#edf1ec" stroke="#819990" /><ns0:polygon points="444.5,385.54999999999995 665.0,385.54999999999995 665.0,674.3 444.5,674.3" fill="#e1ecee" stroke="#819990" /><ns0:rect x="50.75" y="455.9" width="210.0" height="189.0" fill="#bdccce" stroke="#718d92" /><ns0:text x="56.0" y="479.0" class="small">原床</ns0:text><ns0:rect x="50.75" y="253.25" width="63.0" height="189.0" fill="#bdccce" stroke="#718d92" /><ns0:text x="56.0" y="276.35" class="small">衣櫃</ns0:text><ns0:rect x="324.275" y="200.75" width="126.0" height="52.5" fill="#bdccce" stroke="#718d92" /><ns0:text x="329.525" y="223.85" class="small">梳妝</ns0:text><ns0:line x1="444.5" y1="537.8" x2="444.5" y2="656.45" stroke="#4f8667" stroke-width="4" /><ns0:rect x="325.84999999999997" y="646.4749999999999" width="118.64999999999999" height="9.975" fill="#d5b37f" stroke="#a4753e" stroke-width="2" /><ns0:rect x="337.925" y="549.875" width="94.5" height="94.5" fill="none" stroke="#5f986c" stroke-dasharray="4 3" /><ns0:rect x="300.125" y="631.775" width="99.75" height="29.4" fill="none" stroke="#bd6658" stroke-dasharray="5 3" stroke-width="2" /><ns0:rect x="622.475" y="248.525" width="29.4" height="99.75" fill="#7eb5cd" stroke="#3d7893" stroke-width="2" /><ns0:line x1="113.75" y1="674.3" x2="365.75" y2="674.3" stroke="#5aa6c4" stroke-width="5" /><ns0:line x1="260.75" y1="618.65" x2="325.84999999999997" y2="618.65" stroke="#a16e40" stroke-width="2" /><ns0:text x="263.9" y="606.05" class="tiny">x向620</ns0:text><ns0:text x="119.0" y="708.9499999999999" class="small">後窗2400保留</ns0:text><ns0:text x="481.25" y="314.15" class="tiny">右牆機盒候選</ns0:text><ns0:text x="481.25" y="461.15" class="small">右後套衛</ns0:text><ns0:text x="760" y="185">更正先前15mm判讀：</ns0:text><ns0:text x="760" y="218">床止於x2150、門片始於x2770，</ns0:text><ns0:text x="760" y="251">x相隔620；y相隔15。</ns0:text><ns0:text x="760" y="284">兩矩形最短距離 620.18mm。</ns0:text><ns0:text x="760" y="317">所以15mm不是床門碰撞餘量。</ns0:text><ns0:text x="760" y="350" /><ns0:text x="760" y="383">真正待核的是後牆／窗／門頭：</ns0:text><ns0:text x="760" y="416">全開葉片到假設後完成牆55mm。</ns0:text><ns0:text x="760" y="449">95mm預算有沒有含把手未知；</ns0:text><ns0:text x="760" y="482">門擋、開角、窗簾與窗扇需實品。</ns0:text><ns0:text x="760" y="515">原後牆機盒與門片平面重疊；</ns0:text><ns0:text x="760" y="548">假設2400高門頭會碰2350底機盒。</ns0:text><ns0:text x="30" y="840" class="small">Codex候選：機盒改右壁，保留950×280×280mm尺寸與2350mm底高。</ns0:text><ns0:text x="30" y="878" class="small">列明盒體在115假設房內，平面避後窗及全開門片；未承接舊配管作通過。</ns0:text><ns0:text x="30" y="916" class="small">冷媒、冷凝水、風吹床、服務淨空與實機固定位置都需重新設計；Claude尚未看此修正。</ns0:text><ns0:text x="30" y="954" class="small">本圖裁取y12970以後的實際房形；紅虛框是原後牆機盒，藍為新候選，棕為全開門片。</ns0:text><ns0:text x="30" y="992" class="small">完整前臂與900局部路徑見第1張；這是候選套繪，不是竣工尺寸。</ns0:text></ns0:svg>
