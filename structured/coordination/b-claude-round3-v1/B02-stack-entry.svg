<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" width="1400" height="1100" role="img" aria-labelledby="title desc"><ns0:title id="title">B第三輪02｜後門／前門：管井落點與洗衣機修正</ns0:title><ns0:desc id="desc">ABC獨立深化比較，未採用。毫米局部模型座標，道路在上方；完整門組、結構及專業核對未完成。</ns0:desc><ns0:style>text{font-family:system-ui,sans-serif;font-size:17px;fill:#263e49} .title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:650}.small{font-size:14px}.tiny{font-size:12px}</ns0:style><ns0:rect x="0" y="0" width="1400" height="1100" fill="#fafbf8" /><ns0:text x="30" y="42" class="title">B第三輪02｜後門／前門：管井落點與洗衣機修正</ns0:text><ns0:text x="30" y="78">深化比較／未採用｜單位mm；來源是概念模型，梁柱、完成面、商品及實際路徑待核。</ns0:text><ns0:text x="30" y="1053" class="small">來源 bc1e2175f13cff04…｜本批 5414953c7dc6105a…</ns0:text><ns0:text x="30" y="1077" class="small">原ABC／目前3D及正式產品回覆保留。圖上名義尺寸與方塊試排，不等於施工、照護、風水或搬運核可。</ns0:text><ns0:metadata>{"source_sha256": "bc1e2175f13cff043deeb725e190a3b59908810f58661d9efadec05efbca9a5e", "report_hash": "5414953c7dc6105adc17aaefe1fba1e8da40845fff7f3451db28e8a93f25df55", "adopted": false}</ns0:metadata><ns0:text x="30" y="116">同一200×200立管投影到兩版1F，不能把後門配置與前門洗衣機混用。橘線為上層公衛。</ns0:text><ns0:text x="35" y="160" class="label">後門優先：直接入庫</ns0:text><ns0:rect x="35.0" y="195.0" width="85.68" height="100.8" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:rect x="35.0" y="295.8" width="85.68" height="96.39" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:rect x="120.68" y="195.0" width="80.64" height="100.8" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:rect x="127.925" y="202.245" width="40.95" height="40.95" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:rect x="120.68" y="295.8" width="186.48" height="96.39" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:rect x="127.925" y="347.145" width="37.8" height="37.8" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:rect x="224.315" y="347.145" width="75.6" height="37.8" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:rect x="192.5" y="359.745" width="22.05" height="18.9" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:rect x="201.32" y="195.0" width="127.89" height="100.8" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:rect x="208.565" y="202.245" width="28.35" height="75.6" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:line x1="329.21" y1="209.805" x2="329.21" y2="280.995" stroke="#397e70" stroke-width="3" /><ns0:rect x="329.21" y="195.0" width="83.79" height="100.8" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:line x1="329.21" y1="209.805" x2="329.21" y2="280.995" stroke="#397e70" stroke-width="3" /><ns0:rect x="307.16" y="295.8" width="105.84" height="96.39" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:line x1="334.565" y1="392.19" x2="405.755" y2="392.19" stroke="#397e70" stroke-width="3" /><ns0:rect x="244.79" y="392.19" width="168.21" height="197.19" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:rect x="330.15500000000003" y="506.535" width="75.6" height="75.6" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:rect x="252.035" y="412.66499999999996" width="44.1" height="28.35" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:rect x="278.495" y="553.7850000000001" width="37.8" height="28.35" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:line x1="334.565" y1="392.19" x2="405.755" y2="392.19" stroke="#397e70" stroke-width="3" /><ns0:line x1="261.8" y1="589.38" x2="318.5" y2="589.38" stroke="#59a7c5" stroke-width="5" data-element-kind="candidate-window" /><ns0:rect x="35.0" y="392.19" width="209.79" height="197.19" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:rect x="60.2" y="467.79" width="75.6" height="107.1" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:line x1="45.71" y1="589.38" x2="169.19" y2="589.38" stroke="#397e70" stroke-width="3" /><ns0:rect x="35.0" y="195.0" width="166.32" height="132.3" fill="#e1bd8b" fill-opacity="0.13" stroke="#b47d3f" stroke-dasharray="6 4" /><ns0:rect x="181.475" y="307.455" width="12.6" height="12.6" fill="#bb8db7" stroke="#703a71" stroke-width="2" /><ns0:polyline points="107.45,589.38 107.45,467.79" fill="none" stroke="#367e9c" stroke-width="3" /><ns0:text x="35" y="650" class="small">後門名義1960，直接進後左庫。</ns0:text><ns0:text x="35" y="684" class="small">1360接段不在後巷到庫房必要線。</ns0:text><ns0:text x="35" y="718" class="small">屋主確認武轎不必搬入神明堂。</ns0:text><ns0:text x="35" y="752" class="small">管井未碰列明家具；檢修仍未知。</ns0:text><ns0:text x="505" y="160" class="label">無後巷備案：前門經側緣</ns0:text><ns0:rect x="505.0" y="195.0" width="166.32" height="18.9" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:rect x="505.0" y="213.9" width="110.25" height="81.9" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:line x1="505.63" y1="295.8" x2="614.62" y2="295.8" stroke="#397e70" stroke-width="3" /><ns0:rect x="505.0" y="295.8" width="110.25" height="96.39" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:line x1="505.63" y1="295.8" x2="614.62" y2="295.8" stroke="#397e70" stroke-width="3" /><ns0:rect x="615.25" y="213.9" width="56.07" height="81.9" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:rect x="615.25" y="295.8" width="189.0" height="96.39" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:rect x="684.865" y="303.045" width="40.95" height="40.95" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:rect x="625.645" y="347.145" width="37.8" height="37.8" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:line x1="804.25" y1="303.045" x2="804.25" y2="374.235" stroke="#397e70" stroke-width="3" /><ns0:rect x="671.3199999999999" y="195.0" width="127.89" height="100.8" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:rect x="678.565" y="202.245" width="28.35" height="75.6" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:line x1="799.21" y1="209.805" x2="799.21" y2="280.995" stroke="#397e70" stroke-width="3" /><ns0:rect x="799.21" y="195.0" width="83.79" height="100.8" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:line x1="799.21" y1="209.805" x2="799.21" y2="280.995" stroke="#397e70" stroke-width="3" /><ns0:rect x="804.25" y="295.8" width="78.75" height="96.39" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:line x1="808.03" y1="392.19" x2="879.22" y2="392.19" stroke="#397e70" stroke-width="3" /><ns0:line x1="804.25" y1="303.045" x2="804.25" y2="374.235" stroke="#397e70" stroke-width="3" /><ns0:rect x="714.79" y="392.19" width="168.21" height="197.19" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:rect x="800.155" y="506.535" width="75.6" height="75.6" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:rect x="722.035" y="412.66499999999996" width="44.1" height="28.35" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:rect x="748.495" y="553.7850000000001" width="37.8" height="28.35" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:line x1="808.03" y1="392.19" x2="879.22" y2="392.19" stroke="#397e70" stroke-width="3" /><ns0:line x1="731.8" y1="589.38" x2="788.5" y2="589.38" stroke="#59a7c5" stroke-width="5" data-element-kind="candidate-window" /><ns0:rect x="505.0" y="392.19" width="209.79" height="197.19" fill="#edf1ec" stroke="#9bada6" stroke-width="0.8" /><ns0:rect x="530.2" y="467.79" width="75.6" height="107.1" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><ns0:rect x="505.0" y="195.0" width="166.32" height="132.3" fill="#e1bd8b" fill-opacity="0.13" stroke="#b47d3f" stroke-dasharray="6 4" /><ns0:rect x="651.475" y="307.455" width="12.6" height="12.6" fill="#bb8db7" stroke="#703a71" stroke-width="2" /><ns0:polyline points="560.125,213.9 560.125,429.99" fill="none" stroke="#367e9c" stroke-width="3" stroke-dasharray="5 4" /><ns0:rect x="622.495" y="303.045" width="40.95" height="40.95" fill="none" stroke="#b5574a" stroke-dasharray="4 3" /><ns0:rect x="725.815" y="303.045" width="50.4" height="40.95" fill="#d2e1d1" fill-opacity="0.45" stroke="#688d67" stroke-dasharray="4 3" /><ns0:rect x="733.06" y="303.045" width="71.19" height="71.19" fill="none" stroke="#b9864d" stroke-dasharray="5 4" /><ns0:text x="682.66" y="332.34000000000003" class="tiny">洗衣機</ns0:text><ns0:text x="505" y="650" class="small">管井與原洗衣機重疊0.038㎡（紅虛框）。</ns0:text><ns0:text x="505" y="684" class="small">新機位右移990，650×650機身不縮。</ns0:text><ns0:text x="505" y="718" class="small">機身避開管井及門開矩形預算。</ns0:text><ns0:text x="505" y="752" class="small">洗衣操作與門開共享0.44525㎡，須分時。</ns0:text><ns0:text x="1010" y="195" class="small">兩版共同未解：</ns0:text><ns0:text x="1010" y="229" class="small">200×200只是預算，</ns0:text><ns0:text x="1010" y="263" class="small">DN100／通氣／清掃口</ns0:text><ns0:text x="1010" y="297" class="small">及維修可達未核。</ns0:text><ns0:text x="1010" y="331" class="small" /><ns0:text x="1010" y="365" class="small">前門接段1750／門1730，</ns0:text><ns0:text x="1010" y="399" class="small">門扣230假設僅1500。</ns0:text><ns0:text x="1010" y="433" class="small">公衛投影前接段3.15㎡。</ns0:text><ns0:text x="1010" y="467" class="small">屋主確認不禁止通道</ns0:text><ns0:text x="1010" y="501" class="small">上方浴廁及污水管。</ns0:text><ns0:text x="1010" y="535" class="small">工程與檢修仍待核。</ns0:text><ns0:text x="1010" y="569" class="small" /><ns0:text x="1010" y="603" class="small">本張藍線是路線方向，</ns0:text><ns0:text x="1010" y="637" class="small">不等裝桿／抬轎掃掠。</ns0:text><ns0:text x="30" y="885" class="small">後門優先與前門備案各保留日常／祭祀／搬運三態；祭祀中軸門及神桌、乾背櫃與原庫房位置不改。</ns0:text><ns0:text x="30" y="920" class="small">新洗衣機要重排給排水／插座，家務門鉸鏈與完整門組仍未提供；沒有完成施工或搬運驗證。</ns0:text><ns0:text x="30" y="955" class="small">公衛東側乾條 [2325, 12455, 200, 700] 不排管；立管橫向污水與屋頂終端尚未設計。</ns0:text></ns0:svg>
