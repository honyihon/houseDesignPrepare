<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="A二樓後工作陽台｜洗衣備位／暫不放實機"><title>A二樓後工作陽台｜洗衣備位／暫不放實機</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}.room{font-size:11px}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">A二樓後工作陽台｜洗衣備位／暫不放實機</text><text x="28" y="78">獨立預先規劃／未採用｜橙：安裝備位；綠：晾衣含衣物外廓；虛線：操作預算，不是實品門片或完整通路。</text><text x="28" y="106">圖內尺寸mm；三棟共享到達、產品、噪音、防水、排水及專業核對待資料。原ABC、3D與已驗ZIP不改。</text><text x="28" y="1157" class="small">本批 4d78d285e0efe2623261cb86418c5a0c1b3585fea693ebdc816f8a79d4cec45e</text><text x="28" y="1183" class="small">局部矩形／路徑不當輪椅、風水、法規或施工核可；未啟動瀏覽器或點陣轉圖。</text><rect x="40.0" y="241.0" width="264.0" height="144.32" fill="#eaf0e9" stroke="#91a298" stroke-width="0.7" /><text x="172.0" y="313.15999999999997" text-anchor="middle" class="room">主臥</text><rect x="43.519999999999996" y="244.51999999999998" width="88.0" height="79.19999999999999" fill="#aabdb3" stroke="#5e7f71" stroke-width="0.5" /><rect x="190.48" y="355.4" width="79.19999999999999" height="26.4" fill="#aabdb3" stroke="#5e7f71" stroke-width="0.5" /><rect x="43.519999999999996" y="355.4" width="79.19999999999999" height="26.4" fill="#aabdb3" stroke="#5e7f71" stroke-width="0.5" /><rect x="282.88" y="244.51999999999998" width="17.599999999999998" height="105.6" fill="#aabdb3" stroke="#5e7f71" stroke-width="0.5" /><rect x="135.04" y="433.71999999999997" width="105.6" height="92.39999999999999" fill="#eaf0e9" stroke="#91a298" stroke-width="0.7" /><text x="187.84" y="479.91999999999996" text-anchor="middle" class="room">公衛</text><rect x="140.10879999999997" y="437.24" width="26.4" height="19.799999999999997" fill="#aabdb3" stroke="#5e7f71" stroke-width="0.5" /><rect x="173.188" y="437.24" width="19.799999999999997" height="30.799999999999997" fill="#aabdb3" stroke="#5e7f71" stroke-width="0.5" /><rect x="197.51999999999998" y="483.0" width="39.599999999999994" height="39.599999999999994" fill="#aabdb3" stroke="#5e7f71" stroke-width="0.5" /><rect x="135.04" y="526.12" width="105.6" height="83.6" fill="#eaf0e9" stroke="#91a298" stroke-width="0.7" /><text x="187.84" y="567.92" text-anchor="middle" class="room">更衣</text><rect x="148.24" y="529.64" width="79.19999999999999" height="26.4" fill="#aabdb3" stroke="#5e7f71" stroke-width="0.5" /><rect x="240.64" y="385.32" width="63.36" height="284.24" fill="#eaf0e9" stroke="#91a298" stroke-width="0.7" /><text x="272.32" y="527.44" text-anchor="middle" class="room">公共走道</text><rect x="40.0" y="669.56" width="140.79999999999998" height="193.16" fill="#eaf0e9" stroke="#91a298" stroke-width="0.7" /><text x="110.39999999999999" y="766.14" text-anchor="middle" class="room">書房</text><rect x="43.519999999999996" y="750.7927999999999" width="30.799999999999997" height="61.599999999999994" fill="#aabdb3" stroke="#5e7f71" stroke-width="0.5" /><rect x="159.68" y="712.68" width="17.599999999999998" height="79.19999999999999" fill="#aabdb3" stroke="#5e7f71" stroke-width="0.5" /><rect x="180.79999999999998" y="669.56" width="123.19999999999999" height="193.16" fill="#eaf0e9" stroke="#91a298" stroke-width="0.7" /><text x="242.39999999999998" y="766.14" text-anchor="middle" class="room">次臥</text><rect x="188.5" y="673.0799999999999" width="46.199999999999996" height="82.72" fill="#aabdb3" stroke="#5e7f71" stroke-width="0.5" /><rect x="274.08" y="740.0612" width="26.4" height="79.19999999999999" fill="#aabdb3" stroke="#5e7f71" stroke-width="0.5" /><rect x="191.35999999999999" y="832.8" width="52.8" height="26.4" fill="#aabdb3" stroke="#5e7f71" stroke-width="0.5" /><rect x="40.0" y="862.7199999999999" width="264.0" height="88.0" fill="#eaf0e9" stroke="#91a298" stroke-width="0.7" /><text x="172.0" y="906.7199999999999" text-anchor="middle" class="room">後工作陽台</text><rect x="40.0" y="175.0" width="264.0" height="66.0" fill="#eaf0e9" stroke="#91a298" stroke-width="0.7" /><text x="172.0" y="208.0" text-anchor="middle" class="room">前設備陽台</text><rect x="40.0" y="433.71999999999997" width="95.03999999999999" height="176.0" fill="#eaf0e9" stroke="#91a298" stroke-width="0.7" /><text x="87.52" y="521.72" text-anchor="middle" class="room">樓梯</text><rect x="40.0" y="609.72" width="200.64" height="59.839999999999996" fill="#eaf0e9" stroke="#91a298" stroke-width="0.7" /><text x="140.32" y="639.64" text-anchor="middle" class="room">後乾區</text><rect x="40.0" y="385.32" width="200.64" height="48.4" fill="#eaf0e9" stroke="#91a298" stroke-width="0.7" /><text x="140.32" y="409.52" text-anchor="middle" class="room">到達平台</text><text x="40" y="150">來源A二樓</text><text x="40" y="990" class="small">原分區與尺寸只供上下文</text><text x="40" y="1012" class="small">不畫跨棟或穿共壁捷徑</text><rect x="191.79999999999998" y="876.5799999999999" width="37.4" height="33.0" fill="#f2b668" stroke="#935b21" stroke-width="1" /><rect x="470.0" y="261.25" width="750.0" height="250.0" fill="#edf0e9" stroke="#607c73" stroke-width="1" /><rect x="480.0" y="330.0" width="112.5" height="168.75" fill="#d1d9d4" stroke="#7c897d" stroke-width="1" stroke-dasharray="4 3" /><rect x="1097.5" y="330.0" width="112.5" height="168.75" fill="#d1d9d4" stroke="#7c897d" stroke-width="1" stroke-dasharray="4 3" /><rect x="726.25" y="261.25" width="137.5" height="112.5" fill="none" stroke="#7c897d" stroke-width="1" stroke-dasharray="4 3" /><rect x="1091.25" y="261.25" width="137.5" height="112.5" fill="none" stroke="#7c897d" stroke-width="1" stroke-dasharray="4 3" /><rect x="901.25" y="300.625" width="106.25" height="93.75" fill="#f2b668" stroke="#935b21" stroke-width="1" /><text x="954.375" y="347.5" text-anchor="middle" class="small">洗衣備位</text><rect x="751.25" y="300.625" width="150.0" height="112.5" fill="none" stroke="#a76e38" stroke-dasharray="5 3" stroke-width="1" /><line x1="795.0" y1="332.5" x2="795.0" y2="357.5" stroke="#348468" stroke-width="2.3" /><line x1="795.0" y1="357.5" x2="826.25" y2="357.5" stroke="#348468" stroke-width="2.3" /><text x="470" y="575" class="small">右側灰框：原冷氣維修；門前灰虛框：沿來源或另列改位預算</text><text x="470" y="146">兩端冷氣原維修預留不動；850×750安裝備位＋1200×900取放帶</text><text x="440" y="620">優先二樓，避免把上層衣物全搬到RF；仍需穿書房，與陽台門前操作有共用，並非公共直達。水電排濕防水與振動由建商／</text><text x="440" y="644">A設計師共同預留，未定實機。</text><text x="440" y="680">先在二樓留水、電、合法排水、止水與防水條件，不直接採購。設備外廓與換機、漏水警示、隔振與排濕待實機。</text><text x="440" y="716">備位與列明冷氣維修不碰；取放帶與書房陽台門前有共用，必須連真實門片與維修工況核。現門900名義，不當900實際</text><text x="440" y="740">淨寬。</text><text x="440" y="776">機位上下投影在一樓後工作陽台，但仍鄰睡房；不把位置對齊當排水／噪音／結構通過。A裝潢另接設計師，預埋前與建商同</text><text x="440" y="800">版核。</text><text x="440" y="836">C二樓改列暫不用／保空間：原650×650機位、給排水及恢復使用的操作不放固定櫃。原圖仍畫原機，未實際搬到A或</text><text x="440" y="860">拆除。</text><text x="440" y="896">二樓備位不取代一樓共用組；長輩不應因此被要求上樓洗衣。一樓跨棟合法、遮雨平整取送仍優先。</text></svg>
