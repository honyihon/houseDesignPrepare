<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="Q3面積敏感度｜20㎡取決於真實聲學包絡"><title>Q3面積敏感度｜20㎡取決於真實聲學包絡</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}.room{font-size:14px;font-weight:650}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">Q3面積敏感度｜20㎡取決於真實聲學包絡</text><text x="28" y="76">獨立Q3比較／未採用｜改上層梯及RF到達有結構代價；一樓功能及原Q2保留，不代表隔音或樓梯核可。</text><text x="28" y="1158" class="small">本批 a5e3e758fc5249a2c0768fd3b48d5d7448365c170820ccfbb529ca439ed59de2</text><text x="28" y="1182" class="small">指定幾何、局部踏步與面積算式不是法規、風水、結構、消防、產品或聲學簽證。未跑瀏覽器／WebGL。</text><text x="35" y="135">下表都保原400井、另加50mm／面包覆及0.54㎡機櫃；額外內縮不是聲學材料規格或dB。</text><text x="40" y="200">KTV延伸mm</text><text x="300" y="200">折返平台mm</text><text x="570" y="200">加100／面後㎡</text><text x="890" y="200">加150／面後㎡</text><text x="40" y="250">0</text><text x="300" y="250">1900</text><text x="570" y="250">18.6129</text><text x="890" y="250">17.7439</text><text x="40" y="305">450</text><text x="300" y="305">1450</text><text x="570" y="305">19.4994</text><text x="890" y="305">18.5854</text><text x="40" y="360">600</text><text x="300" y="360">1300</text><text x="570" y="360">19.7949</text><text x="890" y="360">18.8659</text><text x="40" y="415">800</text><text x="300" y="415">1100</text><text x="570" y="415">20.1889</text><text x="890" y="415">19.2399</text><text x="40" y="470">900</text><text x="300" y="470">1000</text><text x="570" y="470">20.3859</text><text x="890" y="470">19.4269</text><text x="35" y="565">Q3主比較取800mm：折返平台1100、加100／面後20.1889㎡，保全部原5項3F目標列帳但不當功能／合法已通過。</text><text x="35" y="600">同Q3若加150／面只19.2399㎡；900mm延伸也只有19.4269㎡且平台到1000模型下限，未把它當穩健替代案。</text><text x="35" y="635">若額外100mm但實際需1㎡地面服務空間，800mm延伸只19.7289㎡。雙門聲閘、機櫃或其他器材若吃面積，必須重新扣帳。</text><text x="35" y="670">只算面積能放20，不代表唱歌、低頻、樓板振動、鄰戶或關門新風成立；聲學、結構與機電需用同版真實包絡回套。</text><text x="35" y="705">前門1330扣兩側215只給900預算，不是產品淨開口。門組重量、把手、防火／隔煙與實際聲學門資料仍未知。</text><text x="35" y="740">若改梯、聲學或申照不成立，就保Q2原梯與20㎡原目標，不自動接受14㎡、取消客房／外窗或侵入祭祀上方。</text></svg>
