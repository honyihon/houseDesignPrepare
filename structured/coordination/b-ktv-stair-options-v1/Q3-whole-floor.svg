<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="Q3｜L形KTV保20㎡的條件與完整三樓比較"><title>Q3｜L形KTV保20㎡的條件與完整三樓比較</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}.room{font-size:14px;font-weight:650}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">Q3｜L形KTV保20㎡的條件與完整三樓比較</text><text x="28" y="76">獨立Q3比較／未採用｜改上層梯及RF到達有結構代價；一樓功能及原Q2保留，不代表隔音或樓梯核可。</text><text x="28" y="1158" class="small">本批 a5e3e758fc5249a2c0768fd3b48d5d7448365c170820ccfbb529ca439ed59de2</text><text x="28" y="1182" class="small">指定幾何、局部踏步與面積算式不是法規、風水、結構、消防、產品或聲學簽證。未跑瀏覽器／WebGL。</text><polygon points="169.8,389.4 169.8,618.2 45.0,618.2 45.0,389.4" fill="#edf0e9" stroke="#607c73" stroke-width="0.7" /><text x="107.4" y="503.8" text-anchor="middle" class="room">新上層梯候選</text><polygon points="357.0,347.79999999999995 169.8,347.79999999999995 169.8,618.2 45.0,618.2 45.0,736.24 357.0,736.24 357.0,618.2" fill="#edf0e9" stroke="#607c73" stroke-width="0.7" /><text x="263.4" y="483.0" text-anchor="middle" class="room">安靜保護／通行</text><rect x="302.4" y="441.4" width="46.8" height="93.6" fill="#b9c9be" stroke="#3c6355" stroke-width="0.6" /><rect x="232.2" y="459.59999999999997" width="31.2" height="57.199999999999996" fill="#b9c9be" stroke="#3c6355" stroke-width="0.6" /><rect x="177.6" y="467.4" width="4.16" height="52.0" fill="#b9c9be" stroke="#3c6355" stroke-width="0.6" /><polygon points="287.84,736.24 287.84,819.4399999999999 182.28,819.4399999999999 182.28,736.24" fill="#edf0e9" stroke="#607c73" stroke-width="0.7" /><text x="235.06" y="777.8399999999999" text-anchor="middle" class="room">乾背保護室</text><line x1="193.2" y1="736.24" x2="251.95999999999998" y2="736.24" stroke="#fafbf8" stroke-width="3" /><polygon points="190.73,795.0 195.67,795.0 195.67,736.24 190.73,736.24 190.73,795.0" fill="#bb9474" stroke="#805534" stroke-width="0.6" />