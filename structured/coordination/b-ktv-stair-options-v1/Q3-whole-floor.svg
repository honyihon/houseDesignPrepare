troke="#3c6355" stroke-width="0.6" /><rect x="330.21999999999997" y="961.4" width="20.8" height="20.8" fill="#ca9d8b" stroke="#9c4634" /><line x1="292.0" y1="1061.76" x2="338.8" y2="1061.76" stroke="#168cae" stroke-width="3" /><polygon points="169.8,736.24 169.8,847.0 45.0,847.0 45.0,736.24" fill="#dceff4" stroke="#607c73" stroke-width="0.7" /><text x="107.4" y="791.62" text-anchor="middle" class="room">原工作天井</text><line x1="104.8" y1="736.24" x2="163.56" y2="736.24" stroke="#fafbf8" stroke-width="3" /><polygon points="102.33,795.0 107.27,795.0 107.27,736.24 102.33,736.24 102.33,795.0" fill="#bb9474" stroke="#805534" stroke-width="0.6" /><polygon points="357.0,736.24 287.84,736.24 287.84,819.4399999999999 182.28,819.4399999999999 182.28,736.24 169.8,736.24 169.8,847.0 169.8,878.1999999999999 232.2,878.1999999999999 232.2,899.0 357.0,899.0" fill="#edf0e9" stroke="#607c73" stroke-width="0.7" /><text x="322.41999999999996" y="777.8399999999999" text-anchor="middle" class="room">原公共到達</text><line x1="170.83999999999997" y1="878.1999999999999" x2="229.6" y2="878.1999999999999" stroke="#fafbf8" stroke-width="3" /><rect x="133.92000000000002" y="884.18" width="34.32" height="2.34" fill="#bb9474" stroke="#805534" stroke-width="0.6" /><rect x="133.92000000000002" y="888.5999999999999" width="34.32" height="2.34" fill="#bb9474" stroke="#805534" stroke-width="0.6" /><line x1="275.62" y1="899.0" x2="334.38" y2="899.0" stroke="#fafbf8" stroke-width="3" /><rect x="238.7" y="891.4599999999999" width="34.32" height="2.34" fill="#bb9474" stroke="#805534" stroke-width="0.6" /><rect x="238.7" y="895.88" width="34.32" height="2.34" fill="#bb9474" stroke="#805534" stroke-width="0.6" /><line x1="293.03999999999996" y1="736.24" x2="351.8" y2="736.24" stroke="#fafbf8" stroke-width="3" /><polygon points="345.82,156.18 56.18,156.18 56.18,234.95999999999998 74.38,234.95999999999998 74.38,260.96 56.18,260.96 56.18,378.22 158.62,378.22 158.62,336.62 345.82,336.62" fill="none" stroke="#7f55a0" stroke-dasharray="4 3" /><rect x="49.16" y="393.03999999999996" width="114.39999999999999" height="221.51999999999998" fill="none" stroke="#617981" stroke-dasharray="5 3" /><line x1="94.4" y1="389.4" x2="163.56" y2="389.4" stroke="#fafbf8" stroke-width="3" /><line x1="169.8" y1="393.03999999999996" x2="169.8" y2="445.03999999999996" stroke="#fafbf8" stroke-width="3" /><polygon points="166.03,320.24 161.08999999999997,320.24 161.08999999999997,389.4 166.03,389.4 166.03,320.24" fill="#bb9474" stroke="#805534" stroke-width="0.7" /><polygon points="221.79999999999998,447.51 221.79999999999998,442.57 169.8,442.57 169.8,447.51 221.79999999999998,447.51" fill="#bb9474" stroke="#805534" stroke-width="0.7" /><line x1="128.98" y1="419.03999999999996" x2="128.98" y2="262.0" stroke="#277c79" stroke-width="1.5" stroke-dasharray="4 3" /><line x1="128.98" y1="262.0" x2="227.0" y2="262.0" stroke="#277c79" stroke-width="1.5" stroke-dasharray="4 3" /><line x1="137.56" y1="419.03999999999996" x2="253.0" y2="419.03999999999996" stroke="#277c79" stroke-width="1.5" stroke-dasharray="4 3" /><line x1="137.56" y1="419.03999999999996" x2="128.98" y2="419.03999999999996" stroke="#277c79" stroke-width="1.5" stroke-dasharray="4 3" /><line x1="128.98" y1="419.03999999999996" x2="128.98" y2="262.0" stroke="#277c79" stroke-width="1.5" stroke-dasharray="4 3" /><text x="45" y="125" class="small">道路／1F騎樓在前下方，1F配置不改</text><text x="45" y="1090" class="small">同6×17.63m研究框；不增加Q2整層量體</text><text x="445" y="145">KTV左後800×2400mm從原梯核重分名義1.92㎡，右側不伸進完整祭祀保護區；整層量體不增</text><text x="445" y="168">加，但Q2原10.647㎡前新增量體仍待核。</text><text x="445" y="203">115＋額外100mm／面、原400井再包50mm、另扣600×900機櫃後20.1889㎡。這</text><text x="445" y="226">只有0.1889㎡餘量，沒有dB、完整聲閘或消音選型。</text><text x="445" y="261">客房12.423、公衛6.133、天井4.123㎡原輪廓不改；主臥與2F兩衛、1F祭祀／搬轎及一</text><text x="445" y="284">樓梯也保原幾何。</text><text x="445" y="319">2F→3F及3F→RF兩梯折返平台1900→1100mm；18級／1000寬／270踏面及來源3</text><text x="445" y="342">000層高不變，後端y9030不動。</text><text x="445" y="377">1330名義KTV門扣兩側215預算900；原梯核側門改中心y5270，避免落在新KTV邊界形成</text><text x="445" y="400">聲學旁通，兩門九態列明。</text><text x="445" y="435">新增主要是入口凹部與通路，不等於座位增加或無柱20㎡大矩形。900到達只到空地，沙發仍700試線</text><text x="445" y="458">；機櫃操作共用路線。</text><text x="445" y="493">RF到達後移800mm，既有D1／D2屋頂門路結果不繼承，原24㎡缺口不因KTV改善解除。</text><text x="445" y="528">2F新平台不可整塊鋪滿；需保原前平台＋左接段與右下樓梯洞，詳下一張。梁、板洞、扶手、全程淨高及消</text><text x="445" y="551">防未核。</text></svg>
