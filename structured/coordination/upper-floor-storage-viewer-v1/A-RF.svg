xt x="211.0" y="982.26" font-size="11" text-anchor="middle">5</text><rect x="60.98" y="927.4" width="46.8" height="36.4" fill="none" stroke="#b75916" stroke-width="1.4" stroke-dasharray="4 3" /><rect x="60.98" y="904.0" width="46.8" height="23.4" fill="#f6bd69" stroke="#a74e19" stroke-width="1.6" data-storage-id="A-RF" /><text x="84.38" y="915.6999999999999" font-size="11" text-anchor="middle">S1</text><text x="55" y="130" font-size="16">道路／前方 ↑</text><text x="55" y="1100" font-size="12">6000×17630mm研究框；不是可建量或地籍測量</text><text x="430" y="155" font-size="21" font-weight="700">S1｜後平台防雨工具櫃</text><text x="430" y="186" font-size="16">櫃體平面 900×450mm；高900mm（提案）</text><text x="430" y="213" font-size="16">占地0.405㎡；額外占地0.405㎡</text><text x="430" y="244" font-size="16">只放耐候工具／清潔備品；不拿弱電立管當雜物間，不新增屋頂房間。錨定、防水、設備拆換與荷重</text><text x="430" y="269" font-size="16">待核。</text><text x="430" y="350" font-size="20" font-weight="700">現有家具／設備名稱對照</text><text x="430" y="382" font-size="15">1｜1000L 水塔｜平面1100×1100mm</text><text x="430" y="407" font-size="15">2｜VF800 恆壓泵｜平面800×600mm</text><text x="430" y="432" font-size="15">3｜Haier 熱泵熱水器｜平面900×800mm</text><text x="430" y="457" font-size="15">4｜太陽能逆變器｜平面800×350mm</text><text x="430" y="482" font-size="15">5｜曬衣架｜平面2400×600mm</text><text x="430" y="507" font-size="15">door-approach</text><text x="430" y="532" font-size="15">door-approach</text><text x="430" y="557" font-size="15">door-approach</text><text x="430" y="582" font-size="15">door-approach</text><text x="430" y="607" font-size="15">stairs</text><text x="430" y="632" font-size="15">stairs-landing</text><text x="430" y="657" font-size="15">door-approach</text><text x="430" y="682" font-size="15">door-approach</text><text x="430" y="707" font-size="15">door-approach</text><text x="430" y="732" font-size="15">door-approach</text><text x="28" y="1210" font-size="14">列明本體／操作／通路2D篩檢無新增衝突；不是全路線、門扇、真人、風水或施工核可。</text><text x="28" y="1238" font-size="12">來源與本批：a011d8dc173c8c71b606b55284deb716533b7dfcf4593cd04828f95f8fa21981</text><text x="28" y="1262" font-size="13">RF只放耐候用品，不新增室內房間；B折衣檯收納沿原操作帶分時，不解除原RF24㎡缺口。</text></svg>
