<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="S1 前熱泵／後水塔，優先核維修｜屋頂設備與前平台同圖"><title>S1 前熱泵／後水塔，優先核維修｜屋頂設備與前平台同圖</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}.room{font-size:14px;font-weight:650}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">S1 前熱泵／後水塔，優先核維修｜屋頂設備與前平台同圖</text><text x="28" y="76">獨立RF預留／未採用｜非選機、機身容量或完整管路核可。原ABC／3D、天井與B前後門方案保留。</text><text x="28" y="1158" class="small">本批 fb2bb12392d6f12629d1fc318433c06f8596abad8ae41cc867abdc7cce4c6775</text><text x="28" y="1182" class="small">只有指定幾何及條件回算，實際樓梯到達、產品、結構、風水、聲音與施工未知；未跑瀏覽器／WebGL。</text><rect x="45.0" y="145.0" width="312.0" height="916.76" fill="#eef0e7" stroke="#607c73" /><polygon points="357.0,347.79999999999995 169.8,347.79999999999995 169.8,618.2 45.0,618.2 45.0,736.24 357.0,736.24 357.0,618.2" fill="#f1ded6" stroke="#b88b7a" fill-opacity="0.7" /><polygon points="287.84,736.24 287.84,819.4399999999999 182.28,819.4399999999999 182.28,736.24" fill="#f1ded6" stroke="#b88b7a" fill-opacity="0.7" /><polygon points="261.84000000000003,150.98 261.84000000000003,184.0 304.21999999999997,184.0 304.21999999999997,150.98 261.84000000000003,150.98" fill="#d4e5b9" stroke="#708738" stroke-width="0.5" /><polygon points="154.98,150.98 154.98,215.98 152.38,215.98 152.38,256.8 245.2,256.8 305.0,256.8 305.0,221.18 304.21999999999997,221.18 304.21999999999997,220.39999999999998 261.84000000000003,220.39999999999998 261.84000000000003,221.18 215.04,221.18 215.04,150.98 154.98,150.98" fill="#d4e5b9" stroke="#708738" stroke-width="0.5" /><polygon points="50.98,223.78 87.38,223.78 87.38,260.18 50.98,260.18 50.98,341.82 104.8,341.82 104.8,289.03999999999996 115.97999999999999,289.03999999999996 115.97999999999999,256.8 115.97999999999999,215.98 50.98,215.98 50.98,223.78" fill="#d4e5b9" stroke="#708738" stroke-width="0.5" /><polygon 