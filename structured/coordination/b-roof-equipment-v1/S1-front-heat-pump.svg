999999996 161.08999999999997,347.79999999999995 166.03,347.79999999999995 166.03,289.03999999999996" fill="#d7b28e" stroke="#805534" stroke-width="0.7" /><text x="45" y="130" class="small">前側道路／綠色僅平台面積上界</text><text x="45" y="1090" class="small">後冷氣移到右側；紅虛線為3F客床投影</text><text x="445" y="145">扣設備／門後的前開放輪廓14.6090㎡（含共用通行）；再扣700試線餘9.3936㎡。兩種口徑</text><text x="445" y="168">都非完整淨平台，未達原24㎡目標。</text><text x="445" y="203">粉紅保護投影不放設備或作日常曬衣，後側只留必要巡檢。RF側門不能自動當日常通路，橘色另比RF前門</text><text x="445" y="226">；樓梯／門片與消防仍未知。</text><text x="445" y="261">後水塔／泵浦至少3㎡、熱泵2.5㎡作整組預留，不是已選產品；形狀與維修方向需真實包絡回套。</text><text x="445" y="296">原B-AC03／04機身900×350保留身分尺寸、移到後右公共到達上方；前兩代表槽不是已定兩台</text><text x="445" y="319">新購。所有管路及聲音重核。</text><text x="445" y="354">兩個出口協調區與400後污水通氣井分開。浴廁空氣、污水、雨水、香火及一般新風不混管；完整支管與出</text><text x="445" y="377">口容量未知。</text><text x="445" y="412">水塔至後井平面距離270mm；只算兩個包絡，不能當原廠檢修空間。額外100／200mm敏感度另列</text><text x="445" y="435">JSON。</text><text x="445" y="470">700方塊從RF側門外指定點起算，對未知水塔／熱泵只到預留區邊緣。沒有驗整機拆運、原梯段、荷重、</text><text x="445" y="493">防颱或實際操作。</text><text x="445" y="528">三樓天井輪廓4.123㎡、RF洞2.639㎡維持；沒有借此解除二樓更衣乾區上方防水、KTV20與</text><text x="445" y="551">P3排水缺口。</text></svg>
