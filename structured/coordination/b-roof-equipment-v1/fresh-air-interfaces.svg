<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="B新風介面｜同尺寸轉回乾區，屋頂只留必要室外接口"><title>B新風介面｜同尺寸轉回乾區，屋頂只留必要室外接口</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}.room{font-size:14px;font-weight:650}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">B新風介面｜同尺寸轉回乾區，屋頂只留必要室外接口</text><text x="28" y="76">獨立RF預留／未採用｜非選機、機身容量或完整管路核可。原ABC／3D、天井與B前後門方案保留。</text><text x="28" y="1158" class="small">本批 fb2bb12392d6f12629d1fc318433c06f8596abad8ae41cc867abdc7cce4c6775</text><text x="28" y="1182" class="small">只有指定幾何及條件回算，實際樓梯到達、產品、結構、風水、聲音與施工未知；未跑瀏覽器／WebGL。</text><polygon points="224.8,292.9000000000001 366.90000000000003,292.9000000000001 366.90000000000003,180.9000000000001 224.8,180.9000000000001 224.8,292.9000000000001" fill="#f1ded6" stroke="#607c73" stroke-width="0.7" /><polygon points="366.90000000000003,180.9000000000001 366.90000000000003,292.9000000000001 224.8,292.9000000000001 224.8,180.9000000000001 40.0,180.9000000000001 40.0,619.1000000000001 292.0,619.1000000000001 292.0,400.0000000000001 460.00000000000006,400.0000000000001 460.00000000000006,180.9000000000001 366.90000000000003,180.9000000000001" fill="#edf0e9" stroke="#607c73" stroke-width="0.7" /><rect x="50.5" y="435.0" width="140.0" height="126.00000000000001" fill="#cbd5c8" stroke="#758372" stroke-width="0.5" /><rect x="57.5" y="302.0000000000001" width="126.00000000000001" height="42.00000000000001" fill="#cbd5c8" stroke="#758372" stroke-width="0.5" /><rect x="50.5" y="197.0000000000001" width="35.0" height="84.00000000000001" fill="#cbd5c8" stroke="#758372" stroke-width="0.5" /><polygon points="460.00000000000006,400.0000000000001 292.0,400.0000000000001 292.0,619.1000000000001 460.00000000000006,619.1000000000001 460.00000000000006,400.0000000000001" fill="#dceff4" stroke="#607c73" stroke-width="0.7" /><rect x="413.45000000000005" y="408.05000000000007" width="38.50000000000001" height="63.00000000000001" fill="#cbd5c8" stroke="#758372" stroke-width="0.5" /><rect x="309.5" y="408.05000000000007" width="49.00000000000001" height="31.500000000000004" fill="#cbd5c8" stroke="#758372" stroke-width="0.5" /><rect x="388.95000000000005" y="548.0500000000002" width="63.00000000000001" height="63.00000000000001" fill="#cbd5c8" stroke="#758372" stroke-width="0.5" /><rect x="376.00000000000006" y="305.5000000000001" width="70.0" height="112.00000000000001" fill="none" stroke="#b3504c" stroke-width="2" stroke-dasharray="6 4" /><rect x="331.90000000000003" y="300.95000000000005" width="112.00000000000001" height="70.0" fill="#b1d6cb" fill-opacity="0.8" stroke="#267d6a" stroke-width="2" /><text x="40" y="140" class="room">B2-N｜2F主臥入口乾區</text><text x="40" y="665" class="small">紅：舊位碰浴室0.25㎡；綠：同尺寸旋轉候選</text><polygon points="674.8,292.9000000000001 816.9000000000001,292.9000000000001 816.9000000000001,180.9000000000001 674.8,180.9000000000001 674.8,292.9000000000001" fill="#f1ded6" stroke="#607c73" stroke-width="0.7" /><polygon points="490.0,330.0000000000001 490.0,372.0000000000001 490.0,619.1000000000001 742.0,619.1000000000001 742.0,372.0000000000001 658.0,372.0000000000001 658.0,330.0000000000001 490.0,330.0000000000001" fill="#edf0e9" stroke="#607c73" stroke-width="0.7" /><rect x="500.5" y="473.5" width="140.0" height="126.00000000000001" fill="#cbd5c8" stroke="#758372" stroke-width="0.5" /><rect x="498.05" y="338.05000000000007" width="42.00000000000001" height="126.00000000000001" fill="#cbd5c8" stroke="#758372" stroke-width="0.5" /><polygon points="910.0,400.0000000000001 742.0,400.0000000000001 742.0,619.1000000000001 910.0,619.1000000000001 910.0,400.0000000000001" fill="#dceff4" stroke="#607c73" stroke-width="0.7" /><rect x="870.45" y="408.05000000000007" width="31.500000000000004" height="42.00000000000001" fill="#cbd5c8" stroke="#758372" stroke-width="0.5" /><rect x="750.05" y="408.05000000000007" width="49.00000000000001" height="31.500000000000004" fill="#cbd5c8" stroke="#758372" stroke-width="0.5" /><rect x="838.95" y="548.0500000000002" width="63.00000000000001" height="63.00000000000001" fill="#cbd5c8" stroke="#758372" stroke-width="0.5" /><polygon points="658.0,330.0000000000001 658.0,180.9000000000001 490.0,180.9000000000001 490.0,330.0000000000001 658.0,330.0000000000001" fill="#dceff4" stroke="#607c73" stroke-width="0.7" /><polygon points="816.9000000000001,180.9000000000001 816.9000000000001,292.9000000000001 674.8,292.9000000000001 674.8,180.9000000000001 658.0,180.9000000000001 658.0,330.0000000000001 658.0,372.0000000000001 742.0,372.0000000000001 742.0,400.0000000000001 910.0,400.0000000000001 910.0,180.9000000000001 816.9000000000001,180.9000000000001" fill="#edf0e9" stroke="#607c73" stroke-width="0.7" /><rect x="826.0" y="305.5000000000001" width="70.0" height="112.00000000000001" fill="none" stroke="#b3504c" stroke-width="2" stroke-dasharray="6 4" /><rect x="781.9000000000001" y="300.95000000000005" width="112.00000000000001" height="70.0" fill="#b1d6cb" fill-opacity="0.8" stroke="#267d6a" stroke-width="2" /><text x="490" y="140" class="room">B3-R｜3F公共到達乾區</text><text x="490" y="665" class="small">紅：舊位碰浴室0.25㎡；綠：同尺寸旋轉候選</text><text x="970" y="145">1600×1000mm整組預算維持，不縮機身、</text><text x="970" y="167">不進乾保護室或床上；只是候選天花投影，沒有占掉</text><text x="970" y="189">地面作機房。</text><text x="970" y="223">450mm厚度是舊試排預算，梁下、天花、管接、</text><text x="970" y="245">吊架與防振未核；不能當有實際安裝淨高。</text><text x="970" y="279">濾網側抽／整機下放會占通路，架梯、暫時清空與安</text><text x="970" y="301">全通行要另核；機位乾區算術容納不等於檢修可用。</text><text x="970" y="335">一樓香火專用補排不進一般ERV；浴廁／污水通氣</text><text x="970" y="357">與一般新風室外口也不共管。</text><text x="970" y="391">前後OA／EA備案保留。熱泵／污氣／香火回吸需</text><text x="970" y="413">實際Z、風向、距離與排放依據，不在本圖畫已合法</text><text x="970" y="435">共壁開口。</text><text x="970" y="469">三樓新前KTV仍需專支、回風及消音，原前閱讀的</text><text x="970" y="491">路由不能直接算已服務KTV；不鎖一層一機或購買</text><text x="970" y="513">台數。</text><text x="40" y="755">本圖對應新版P3／Q2局部乾區，原新風研究及條件工具保留；不同版本的路線長度、壓損與風機工作點不能混用。</text><text x="40" y="790">新風主機優先室內分區，RF試排未增加一台戶外ERV。實際廠商若提屋頂式機組，需要另列全戶外機身、保溫防雨、維修及乾淨風管，不用空白屋頂當已留足。</text><text x="40" y="825">本輪無真實設備資料；條件模板僅能回算預留包絡，其他氣流、結構、宗教及產品關卡仍未知。</text></svg>
