<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1280" viewBox="0 0 1200 1280" role="img" aria-labelledby="title desc" lang="zh-Hant"><title id="title">C棟樓高、覆土與樓梯四案比較</title><desc id="desc">原3.6m22級、4m22級、4m24級踏面270及4m24級踏面250。原140mm梯段前後預算需另保留；四案皆未採用，未驗結構淨高及新配管。</desc><style>text{font-family:'Noto Sans CJK TC','Microsoft JhengHei',sans-serif;fill:#203b35}.head{font-size:22px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.pending{fill:#93461e}</style><rect x="0" y="0" width="1200" height="1280" fill="#f6faf7" stroke="none" /><text x="35" y="43" class="head">C 棟｜樓高、降板、樓梯與配管：四案一起比較</text><text x="35" y="74" class="body">保留右景觀／左洗曬使用方向；以下均為剖面及空間預算，未修改原3D、房間或門窗。</text><rect x="30" y="91" width="1140" height="38" fill="#fff0d5" stroke="none" /><text x="42" y="116" class="small pending">土深300、板厚150、其他層次50均為假設；3.5m為整段騎樓的保守協調目標，非逐處法規判決。</text><rect x="30" y="145" width="555" height="380" fill="#ffffff" stroke="#b6ccc1" rx="8" /><text x="46" y="177" class="head">原3.6m／22級／踏面270</text><text x="46" y="203" class="small">2F +3600／3F +6600／RF +9600</text><text x="345" y="203" class="small">梯段／平台深度預算</text><rect x="125" y="275.0" width="105" height="12.0" fill="#a5bf90" stroke="#6e8d58" /><rect x="125" y="287.0" width="105" height="2.0" fill="#80b7d3" stroke="none" /><rect x="125" y="289.0" width="105" height="6.0" fill="#a6b4af" stroke="none" /><line x1="50" y1="275.0" x2="295" y2="275.0" stroke="#315c4c" stroke-width="2" /><line x1="50" y1="279.0" x2="295" y2="279.0" stroke="#bb761e" stroke-dasharray="6 4" /><line x1="50" y1="419" x2="295" y2="419" stroke="#315c4c" stroke-width="2" /><text x="52" y="235" class="small">2F土面／板厚均待核</text><text x="52" y="346" class="small">參考槽底：3100</text><text x="52" y="369" class="small pending">相對3500餘量：-400</text><text x="52" y="394" class="small">未計實際梁深／地坪高差</text><text x="52" y="440" class="small">土300案例；不是選定根域</text><rect x="352" y="230" width="158.39999999999998" height="212.95999999999998" fill="#eef3f0" stroke="#688