<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220" role="img" aria-labelledby="title desc" lang="zh-Hant"><title id="title">C棟2F景觀／洗曬深化：平面、上下層與剖面協調</title><desc id="desc">依已確認的右側9平方公尺景觀與左側單機洗曬配置繪製。三樓平台平面完整重疊，但樓板、降板與土深未定。一樓冷氣概念管線有低位跨騎樓問題。僅工程協調，不是施工圖。</desc><style>text{font-family:'Noto Sans CJK TC','Microsoft JhengHei',sans-serif;fill:#203b35}.small{font-size:14px}.note{font-size:16px}.head{font-size:21px;font-weight:700}.pending{fill:#8b3d17}.dim{fill:none;stroke:#5f7770;stroke-width:1}</style><rect x="0" y="0" width="1200" height="1220" fill="#f6faf7" stroke="none" /><text x="40" y="48" class="head" font-size="27">C 棟 2F｜右景觀、左洗曬：深化協調圖</text><text x="40" y="79" class="note">使用方向已確認；平面取自 c-split／daily，未改原3D、設備尺寸、門窗或樓高。</text><rect x="40" y="96" width="1120" height="38" fill="#fff0d5" stroke="none" /><text x="54" y="121" class="note pending">工程協調／非施工圖：土深、降板、實際排水點、冷氣機型及合法面積均未核定。</text><text x="65" y="163" class="small">道路／騎樓方向（圖上方）；尺寸單位 mm</text><rect x="65.0" y="180.0" width="720.0" height="468.0" fill="#edf2f0" stroke="#365e53" stroke-width="2" /><rect x="305.0" y="378.0" width="480.0" height="270.0" fill="#e0f0df" stroke="#2563b8" stroke-dasharray="7 5" stroke-width="2" /><rect x="667.4" y="192.0" width="108.0" height="162.0" fill="#ffce7b" stroke="#bd731e" fill-opacity="0.12" stroke-dasharray="4 4" /><rect x="407.0" y="192.0" width="108.0" height="162.0" fill="#ffce7b" stroke="#bd731e" fill-opacity="0.12" stroke-dasharray="4 4" /><rect x="527.0" y="192.0" width="108.0" height="162.0" fill="#ffce7b" stroke="#bd731e" fill-opacity="0.12" stroke-dasharray="4 4" /><rect x="161.0" y="271.8" width="78.0" height="72.0" fill="#77b6d1" stroke="#4e94b0" fill-opacity="0.12" stroke-dasharray="3 4" /><rect x="150.8" y="346.2" width="108.0" height="288.0" fill="#77b6d1" stroke="#4e94b0" fill-opacity="0.12" stroke-dasharray="3 4" /><rect x="245.0" y="265.8" width="72.0" height="96.0" fill="#77b6d1" stroke="#4e94b0" fill-opacity="0.12" stroke-dasharray="3 4" /><rect x="323.0" y="247.8" width="72.0" height="72.0" fill="#77b6d1" stroke="#4e94b0" fill-opacity="0.12" stroke-dasharray="3 4" /><rect x="318.79999999999995" y="391.79999999999995" width="452.4" height="108.0" fill="#90b78a" stroke="#447448" /><circle cx="375.8" cy="445.8" r="12" fill="#335e3b" /><circle cx="488.59999999999997" cy="445.8" r="12" fill="#335e3b" /><circle cx="601.4" cy="445.8" r="12" fill="#335e3b" /><circle cx="714.1999999999999" cy="445.8" r="12" fill="#335e3b" /><rect x="161.0" y="193.8" width="78.0" height="78.0" fill="#c9d6df" stroke="#486275" stroke-width="1.5" /><text x="200.0" y="237.8" class="note" text-anchor="middle" font-weight="700">W</text><rect x="78.8" y="346.2" width="72.0" height="288.0" fill="#c9d6df" stroke="#486275" stroke-width="1.5" /><text x="114.8" y="495.2" class="note" text-anchor="middle" font-weight="700">R</text><rect x="245.0" y="193.8" width="72.0" height="72.0" fill="#c9d6df" stroke="#486275" stroke-width="1.5" /><text x="281.0" y="234.8" class="note" text-anchor="middle" font-weight="700">S</text><rect x="323.0" y="193.8" width="72.0" height="54.0" fill="#c9d6df" stroke="#486275" stroke-width="1.5" /><text x="359.0" y="225.8" class="note" text-anchor="middle" font-weight="700">D</text><rect x="667.4" y="192.0" width="108.0" height="42.0" fill="#d2d9dc" stroke="#53636c" stroke-width="1.5" /><text x="721.4" y="218.0" class="note" text-anchor="middle" font-weight="700">H1</text><rect x="407.0" y="192.0" width="108.0" height="42.0" fill="#d2d9dc" stroke="#53636c" stroke-width="1.5" /><text x="461.0" y="218.0" class="note" text-anchor="middle" font-weight="700">H2</text><rect x="527.0" y="192.0" width="108.0" height="42.0" fill="#d2d9dc" stroke="#53636c" stroke-width="1.5" /><text x="581.0" y="218.0" class="note" text-anchor="middle" font-weight="700">H3</text><polyline points="689.0,588.0 203.0,588.0 203.0,313.79999999999995 200.0,313.79999999999995" fill="none" stroke="#187b79" stroke-width="3" stroke-dasharray="7 5" /><text x="355" y="523" class="note" font-weight="700">覆土投影 3.393㎡／四株木本示意</text><text x="346" y="552" class="note" font-weight="700">右側景觀 9㎡；土深 D 未定</text><text x="350" y="579" class="small">後側通行／休憩帶：名義深1235</text><text x="350" y="602" class="small">保留門口及試線，不在此補放固定桌椅</text><line x1="635" x2="743" y1="648" y2="648" stroke="#f6faf7" stroke-width="9" /><text x="620" y="675" class="small">原900名義門洞／實際淨寬未核</text><line x1="40" x2="40" y1="180" y2="648" class="dim" /><text x="25" y="454" class="small" transform="rotate(-90 25 454)">3900</text><text x="398" y="701" class="small" text-anchor="middle">← 6000 →（全幅比較框，非地籍或合法申報尺寸）</text><text x="830" y="180" class="head">本輪保留與新增核對</text><text x="830" y="212" class="small">W 洗衣機 650×650，僅一台</text><text x="830" y="238" class="small">S 預洗槽 600×600</text><text x="830" y="264" class="small">D 洗劑櫃 600×450</text><text x="830" y="290" class="small">R 晾衣架 2400×600，原尺寸</text><text x="830" y="316" class="small">藍虛框：原操作帶，不是多餘空地</text><text x="830" y="342" class="small">橙虛框：冷氣原維修預留</text><text x="830" y="368" class="small">H1＝C-AC01；H2＝C-AC03</text><text x="830" y="394" class="small">H3＝C-AC07；機身900×350</text><text x="830" y="420" class="small">風口方向／原廠淨空尚未知</text><text x="830" y="446" class="small">機身距前界僅100，勿封實外罩</text><text x="830" y="472" class="small">洗槽操作帶→景觀：135（名義）</text><text x="830" y="498" class="small">冷氣維修帶→景觀：200（名義）</text><text x="830" y="524" class="small">青線：700方塊中心試線</text><text x="830" y="550" class="small">不是已核輪椅或搬機路線</text><text x="830" y="576" class="small">覆土下方為1F騎樓通行區</text><text x="830" y="602" class="small">三樓同位平台投影覆蓋9㎡</text><text x="830" y="628" class="small">完整實板／支承仍待剖面核對</text><line x1="40" x2="1160" y1="729" y2="729" stroke="#b8ccc1" /><text x="40" y="766" class="head">上下層剖面概念｜水平沿前後方向，土深／板厚未按比例，不可作放樣</text><rect x="80" y="808" width="702" height="14" fill="#bcc8c5" stroke="none" /><text x="90" y="798" class="small">3F 同位平台（基準 +6600）；完整樓板、懸臂系統與排水未核</text><line x1="80" x2="782" y1="1092" y2="1092" stroke="#436657" stroke-width="3" /><line x1="782" x2="782" y1="822" y2="1092" stroke="#436657" stroke-width="3" /><rect x="377" y="838" width="405" height="254" fill="#ddeddf" stroke="none" fill-opacity="0.6" /><text x="424" y="879" class="note">2F景觀投影深2250</text><text x="99" y="922" class="small">左：道路／前緣</text><text x="596" y="922" class="small">右：室內外牆</text><text x="100" y="1068" class="small">2F 基準 +3600；原上下層差3000</text><rect x="397.7" y="1092" width="162" height="61" fill="#a4bb8b" stroke="#47764b" stroke-dasharray="5 4" /><text x="411" y="1121" class="note" font-weight="700">D 未定</text><text x="88" y="1169" class="small">降板須與騎樓淨高／樓高一併核算；不得完工後切板或新增占用通行的落柱。</text><text x="830" y="799" class="head">優先協調事項</text><text x="830" y="827" class="small pending">① 降板＋覆土荷重＋排水剖面</text><text x="830" y="855" class="small pending">② 土區檢修／溢流不經門口</text><text x="830" y="883" class="small pending">③ 冷媒、冷凝水另核管路</text><text x="830" y="911" class="small pending">④ C-AC01原管線15.335m</text><text x="830" y="939" class="small pending">其中一段2350高跨前騎樓</text><text x="830" y="967" class="small pending">若適用3500梁下要求須重排</text><text x="830" y="995" class="small pending">11.085m僅幾何下界，非新配管</text><text x="830" y="1023" class="small pending">一樓樓高與梁底須同步協調</text><text x="40" y="1200" class="small">資料：c-split/daily凍結平面；本圖只讀衍生，未變更主案、產品、冷氣配管或核准任何高雄厝面積。</text></svg>
