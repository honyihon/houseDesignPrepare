<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1050 880" width="900" height="754" role="img"><ns0:title>C｜已接受廚房＋單機家務深化：管線／維修關係剖面示意，非按比例或施工路徑</ns0:title><ns0:text x="25" y="35" font-size="21" fill="#24382e">C｜已接受廚房＋單機家務深化</ns0:text><ns0:text x="25" y="70" font-size="17" fill="#24382e">關係剖面：不按比例。虛線不是管線路徑；梁、管道間位置、管徑、坡度與淨高未設計。</ns0:text><ns0:line x1="30" x2="1000" y1="235" y2="235" stroke="#94a3b8" stroke-width="4" /><ns0:text x="35" y="170" font-size="17" fill="#24382e">floor-4 · 來源概念樓高 3000mm（未核）</ns0:text><ns0:text x="35" y="203" font-size="15" fill="#24382e">設備／乾式區：實際用途與合法範圍待核</ns0:text><ns0:text x="540" y="185" font-size="15" fill="#24382e">公共／維修側檢修面待配置</ns0:text><ns0:line x1="30" x2="1000" y1="385" y2="385" stroke="#94a3b8" stroke-width="4" /><ns0:text x="35" y="320" font-size="17" fill="#24382e">floor-3 · 來源概念樓高 3000mm（未核）</ns0:text><ns0:text x="35" y="353" font-size="15" fill="#24382e">後段衛浴</ns0:text><ns0:text x="540" y="335" font-size="15" fill="#24382e">公共／維修側檢修面待配置</ns0:text><ns0:line x1="30" x2="1000" y1="535" y2="535" stroke="#94a3b8" stroke-width="4" /><ns0:text x="35" y="470" font-size="17" fill="#24382e">floor-2 · 來源概念樓高 3000mm（未核）</ns0:text><ns0:text x="35" y="503" font-size="15" fill="#24382e">240cm後小廚房／後段公共衛浴</ns0:text><ns0:text x="540" y="485" font-size="15" fill="#24382e">公共／維修側檢修面待配置</ns0:text><ns0:line x1="30" x2="1000" y1="685" y2="685" stroke="#94a3b8" stroke-width="4" /><ns0:text x="35" y="620" font-size="17" fill="#24382e">floor-1 · 來源概念樓高 3600mm（未核）</ns0:text><ns0:text x="35" y="653" font-size="15" fill="#24382e">一字廚房／前置冰箱／孝親套衛／有可開高窗的訪客公衛</ns0:text><ns0:text x="540" y="635" font-size="15" fill="#24382e">公共／維修側檢修面待配置</ns0:text><ns0:line x1="810" x2="810" y1="120" y2="750" stroke="#0284c7" stroke-width="3" stroke-dasharray="9 7" /><ns0:text x="730" y="105" font-size="15" fill="#24382e">排水／通氣關係</ns0:text><ns0:line x1="950" x2="950" y1="120" y2="750" stroke="#b45309" stroke-width="3" stroke-dasharray="9 7" /><ns0:text x="870" y="105" font-size="15" fill="#24382e">排氣／補氣關係</ns0:text><ns0:text x="35" y="790" font-size="16" fill="#24382e">排水：合法接點／清潔口未知；不得憑此假設可穿梁、長橫管、降低天花或跨基地排水。</ns0:text><ns0:text x="35" y="822" font-size="16" fill="#24382e">排氣：各濕區獨立核排風與補氣，合法出口、防火、逆止、噪音及避免回吸均未核。</ns0:text><ns0:text x="35" y="854" font-size="16" fill="#24382e">泵浦／冷氣：基座隔振、原廠淨空、維修／換機與漏水斷電另核；非設備安裝核定。</ns0:text></ns0:svg>