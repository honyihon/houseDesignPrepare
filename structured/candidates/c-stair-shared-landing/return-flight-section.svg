<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc" lang="zh-Hant"><title id="title">C棟24級樓梯上下層到達與回程梯段剖面</title><desc id="desc">沿右側回程梯段的概念剖面。二樓平台避開最後一級；離散踏面中心試算不等於實際淨高。</desc><style>text{font-family:'Noto Sans CJK TC','Microsoft JhengHei',sans-serif;fill:#203b35}.head{font-size:22px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.warn{fill:#a54a29}</style><rect x="0" y="0" width="1200" height="1120" fill="#f6faf7" stroke="none" /><text x="35" y="44" class="head">C 棟｜右側回程梯段剖面：檢查二樓平台會不會蓋住最後一級</text><text x="35" y="77" class="body">1F→2F：24級／4m；2F→3F及3F→RF保留18級／3m，所有上層基準提高400mm。</text><rect x="30" y="94" width="1140" height="42" fill="#fff0d5" stroke="none" /><text x="42" y="121" class="small warn">這是既列水平踏面與平台的協調剖面，未設計斜梯板、梁、欄杆、門楣、管線或實際樓板洞口。</text><line x1="50" y1="982.0" x2="691" y2="982.0" stroke="#b2c5bd" stroke-dasharray="5 4" /><text x="52" y="972.0" class="small">1F +0</text><line x1="50" y1="698.0" x2="691" y2="698.0" stroke="#b2c5bd" stroke-dasharray="5 4" /><text x="52" y="688.0" class="small">2F +4000</text><line x1="50" y1="485.00000000000006" x2="691" y2="485.00000000000006" stroke="#b2c5bd" stroke-dasharray="5 4" /><text x="52" y="475.00000000000006" class="small">3F +7000</text><line x1="50" y1="272.0000000000001" x2="691" y2="272.0000000000001" stroke="#b2c5bd" stroke-dasharray="5 4" /><text x="52" y="262.0000000000001" class="small">RF +10000</text><line x1="543.76" y1="840.0" x2="655.76" y2="840.0" stroke="#237d72" stroke-width="4" /><line x1="513.52" y1="828.1666666666667" x2="543.76" y2="828.1666666666667" stroke="#237d72" stroke-width="4" /><line x1="543.76" y1="828.1666666666667" x2="543.76" y2="840.0000000000024" stroke="#237d72" stroke-width="2" /><line x1="483.28000000000003" y1="816.3333333333334" x2="513.52" y2="816.3333333333334" stroke="#237d72" stroke-width="4" /><line x1="513.52" y1="816.3333333333334" x2="513.52" y2="828.166666666669" stroke="#237d72" stroke-width="2" /><line x1="453.04" y1="804.5" x2="483.28000000000003" y2="804.5" stroke="#237d72" stroke-width="4" /><line x1="483.28000000000003" y1="804.5" x2="483.28000000000003" y2="816.3333333333358" stroke="#237d72" stroke-width="2" /><line x1="422.8" y1="792.6666666666667" x2="453.04" y2="792.6666666666667" stroke="#237d72" stroke-width="4" /><line x1="453.04" y1="792.6666666666667" x2="453.04" y2="804.5000000000024" stroke="#237d72" stroke-width="2" /><line x1="392.56" y1="780.8333333333334" x2="422.8" y2="780.8333333333334" stroke="#237d72" stroke-width="4" /><line x1="422.8" y1="780.8333333333334" x2="422.8" y2="792.666666666669" stroke="#237d72" stroke-width="2" /><line x1="362.32" y1="769.0" x2="392.56" y2="769.0" stroke="#237d72" stroke-width="4" /><line x1="392.56" y1="769.0" x2="392.56" y2="780.8333333333358" stroke="#237d72" stroke-width="2" /><line x1="332.08" y1="757.1666666666666" x2="362.32" y2="757.1666666666666" stroke="#237d72" stroke-width="4" /><line x1="362.32" y1="757.1666666666666" x2="362.32" y2="769.0000000000024" stroke="#237d72" stroke-width="2" /><line x1="301.84000000000003" y1="745.3333333333334" x2="332.08" y2="745.3333333333334" stroke="#237d72" stroke-width="4" /><line x1="332.08" y1="745.3333333333334" x2="332.08" y2="757.166666666669" stroke="#237d72" stroke-width="2" /><line x1="271.6" y1="733.5" x2="301.84000000000003" y2="733.5" stroke="#237d72" stroke-width="4" /><line x1="301.84000000000003" y1="733.5" x2="301.84000000000003" y2="745.3333333333358" stroke="#237d72" stroke-width="2" /><line x1="241.36" y1="721.6666666666667" x2="271.6" y2="721.6666666666667" stroke="#237d72" stroke-width="4" /><line x1="271.6" y1="721.6666666666667" x2="271.6" y2="733.5000000000024" stroke="#237d72" stroke-width="2" /><line x1="211.12" y1="709.8333333333334" x2="241.36" y2="709.8333333333334" stroke="#237d72" stroke-width="4" /><line x1="241.36" y1="709.8333333333334" x2="241.36" y2="721.666666666669" stroke="#237d72" stroke-width="2" /><line x1="99.12" y1="982.0" x2="211.12" y2="982.0" stroke="#237d72" stroke-width="4" /><line x1="99.12" y1="698.0" x2="211.12" y2="698.0" stroke="#397ea7" stroke-width="4" /><line x1="483.28000000000003" y1="591.5" x2="655.76" y2="591.5" stroke="#397ea7" stroke-width="4" /><line x1="453.04" y1="579.6666666666667" x2="483.28000000000003" y2="579.6666666666667" stroke="#397ea7" stroke-width="4" /><line x1="483.28000000000003" y1="579.6666666666667" x2="483.28000000000003" y2="591.5000000000024" stroke="#397ea7" stroke-width="2" /><line x1="422.8" y1="567.8333333333334" x2="453.04" y2="567.8333333333334" stroke="#397ea7" stroke-width="4" /><line x1="453.04" y1="567.8333333333334" x2="453.04" y2="579.666666666669" stroke="#397ea7" stroke-width="2" /><line x1="392.56" y1="556.0" x2="422.8" y2="556.0" stroke="#397ea7" stroke-width="4" /><line x1="422.8" y1="556.0" x2="422.8" y2="567.8333333333358" stroke="#397ea7" stroke-width="2" /><line x1="362.32" y1="544.1666666666667" x2="392.56" y2="544.1666666666667" stroke="#397ea7" stroke-width="4" /><line x1="392.56" y1="544.1666666666667" x2="392.56" y2="556.0000000000024" stroke="#397ea7" stroke-width="2" /><line x1="332.08" y1="532.3333333333334" x2="362.32" y2="532.3333333333334" stroke="#397ea7" stroke-width="4" /><line x1="362.32" y1="532.3333333333334" x2="362.32" y2="544.166666666669" stroke="#397ea7" stroke-width="2" /><line x1="301.84000000000003" y1="520.5" x2="332.08" y2="520.5" stroke="#397ea7" stroke-width="4" /><line x1="332.08" y1="520.5" x2="332.08" y2="532.3333333333358" stroke="#397ea7" stroke-width="2" /><line x1="271.6" y1="508.6666666666667" x2="301.84000000000003" y2="508.6666666666667" stroke="#397ea7" stroke-width="4" /><line x1="301.84000000000003" y1="508.6666666666667" x2="301.84000000000003" y2="520.5000000000024" stroke="#397ea7" stroke-width="2" /><line x1="241.36" y1="496.83333333333337" x2="271.6" y2="496.83333333333337" stroke="#397ea7" stroke-width="4" /><line x1="271.6" y1="496.83333333333337" x2="271.6" y2="508.6666666666691" stroke="#397ea7" stroke-width="2" /><line x1="483.28000000000003" y1="378.5" x2="655.76" y2="378.5" stroke="#7d64a4" stroke-width="4" /><line x1="453.04" y1="366.66666666666674" x2="483.28000000000003" y2="366.66666666666674" stroke="#7d64a4" stroke-width="4" /><line x1="483.28000000000003" y1="366.66666666666674" x2="483.28000000000003" y2="378.5000000000025" stroke="#7d64a4" stroke-width="2" /><line x1="422.8" y1="354.83333333333337" x2="453.04" y2="354.83333333333337" stroke="#7d64a4" stroke-width="4" /><line x1="453.04" y1="354.83333333333337" x2="453.04" y2="366.66666666666913" stroke="#7d64a4" stroke-width="2" /><line x1="392.56" y1="343.0000000000001" x2="422.8" y2="343.0000000000001" stroke="#7d64a4" stroke-width="4" /><line x1="422.8" y1="343.0000000000001" x2="422.8" y2="354.83333333333576" stroke="#7d64a4" stroke-width="2" /><line x1="362.32" y1="331.16666666666674" x2="392.56" y2="331.16666666666674" stroke="#7d64a4" stroke-width="4" /><line x1="392.56" y1="331.16666666666674" x2="392.56" y2="343.0000000000025" stroke="#7d64a4" stroke-width="2" /><line x1="332.08" y1="319.33333333333337" x2="362.32" y2="319.33333333333337" stroke="#7d64a4" stroke-width="4" /><line x1="362.32" y1="319.33333333333337" x2="362.32" y2="331.16666666666913" stroke="#7d64a4" stroke-width="2" /><line x1="301.84000000000003" y1="307.5000000000001" x2="332.08" y2="307.5000000000001" stroke="#7d64a4" stroke-width="4" /><line x1="332.08" y1="307.5000000000001" x2="332.08" y2="319.33333333333576" stroke="#7d64a4" stroke-width="2" /><line x1="271.6" y1="295.66666666666674" x2="301.84000000000003" y2="295.66666666666674" stroke="#7d64a4" stroke-width="4" /><line x1="301.84000000000003" y1="295.66666666666674" x2="301.84000000000003" y2="307.5000000000025" stroke="#7d64a4" stroke-width="2" /><line x1="241.36" y1="283.83333333333337" x2="271.6" y2="283.83333333333337" stroke="#7d64a4" stroke-width="4" /><line x1="271.6" y1="283.83333333333337" x2="271.6" y2="295.66666666666913" stroke="#7d64a4" stroke-width="2" /><line x1="129.36" y1="485.00000000000006" x2="241.36" y2="485.00000000000006" stroke="#7d64a4" stroke-width="4" /><line x1="129.36" y1="272.0000000000001" x2="241.36" y2="272.0000000000001" stroke="#4c6f5d" stroke-width="4" /><line x1="211.12" y1="698.0" x2="241.36" y2="698.0" stroke="#bd4f38" stroke-width="5" stroke-dasharray="5 3" /><text x="105" y="674.0" class="small warn">紅虛線：舊整片平台必須避開此段</text><text x="745" y="180" class="head">平台怎麼分開？</text><text x="745" y="215" class="small">1F出發及2F到達採完整1000mm共享平台。</text><text x="745" y="250" class="small">2F接續上樓只保留左側1000mm出發面；</text><text x="745" y="285" class="small">右側及中間270mm區段不再整片封板。</text><text x="745" y="320" class="small">3F／RF仍按原平台位置到達。</text><text x="745" y="355" class="small" /><text x="745" y="390" class="head">這裡不能直接照舊圖蓋板</text><text x="745" y="425" class="small">若保留舊整片平台，最後一級上方試算只剩約16.7mm。</text><text x="745" y="460" class="small">所以不只改階數，二樓板洞與護欄須另畫。</text><text x="745" y="495" class="small" /><text x="745" y="530" class="head">離散試算的範圍</text><text x="745" y="565" class="small">踏面中心共54點；已列上方梯面最小距離</text><text x="745" y="600" class="small">扣假設150mm後約2850mm。</text><text x="745" y="635" class="small">16點沒有已列上方構造，狀態仍未知。</text><text x="745" y="670" class="small">沒有驗過梁底、斜梯板、欄杆或全寬淨高。</text><text x="745" y="705" class="small" /><text x="745" y="740" class="small">門牆及消防是使用這個排法的前提</text><text x="745" y="775" class="small">前置門已選作深化，產品與消防仍待核；</text><text x="745" y="810" class="small">若需認證防火門，門牆及平台必須再合圖。</text><text x="745" y="845" class="small" /><text x="745" y="880" class="small">覆土及C-AC01立管仍另案待設計。</text><text x="110" y="1023" class="small">← 前方共享平台　／　往後到中間平台 →（y座標，水平與垂直比例不同）</text><text x="35" y="1070" class="small warn">樓梯以外房間、家具及床位均保留；本剖面不是新整棟3D或法規／結構／照護驗收。</text></svg>
