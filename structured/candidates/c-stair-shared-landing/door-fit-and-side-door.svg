<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1250" viewBox="0 0 1200 1250" role="img" aria-labelledby="title desc" lang="zh-Hant"><title id="title">C棟已確認前置門：完成淨寬、停放及二樓側門核對</title><desc id="desc">屋主接受配置，門組未選定。1200名義開口維持900完成淨寬目標；100mm門組運行深度只有60mm平台前餘量。側門須與前門一併核。</desc><style>text{font-family:'Noto Sans CJK TC','Microsoft JhengHei',sans-serif;fill:#203b35}.head{font-size:22px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.warn{fill:#a54a29}</style><rect x="0" y="0" width="1200" height="1250" fill="#f6faf7" stroke="none" /><text x="35" y="44" class="head">C 棟｜前置可關門已確認：門組尺寸與二樓側門協調</text><text x="35" y="78" class="body">保留24級／270mm踏面、1000mm完整平台、孝親套衛及三樓通道；開放版留比較。</text><rect x="30" y="95" width="1140" height="43" fill="#fff0d5" stroke="none" /><text x="43" y="122" class="small warn">以下均為門組選型前的扣減／停放敏感度；沒有選定產品，也不將900mm名義側門當成900mm完成淨寬。</text><text x="35" y="179" class="head">前門：1200名義開口，守住900淨寬目標</text><text x="635" y="179" class="head">門片停放：左右不能當成相同尺寸</text><text x="40" y="214" class="small">總扣除</text><text x="185" y="214" class="small">計算淨寬</text><text x="355" y="214" class="small">對900餘量</text><text x="640" y="214" class="small">假設門片寬</text><text x="820" y="214" class="small">1F餘量</text><text x="1000" y="214" class="small">2F餘量</text><text x="40" y="246" class="body">150</text><text x="185" y="246" class="body">1050</text><text x="355" y="246" class="body">+150</text><text x="40" y="275" class="body">200</text><text x="185" y="275" class="body">1000</text><text x="355" y="275" class="body">+100</text><text x="40" y="304" class="body">250</text><text x="185" y="304" class="body">950</text><text x="355" y="304" class="body">+50</text><text x="40" y="333" class="body">300</text><text x="185" y="333" class="body">900</text><text x="355" y="333" class="body warn">+0</text><text x="40" y="362" class="body">350</text><text x="185" y="362" class="body">850</text><text x="355" y="362" class="body warn">-50</text><text x="640" y="246" class="body">1200</text><text x="820" y="246" class="body">+600</text><text x="1000" y="246" class="body">+300</text><text x="640" y="275" class="body">1300</text><text x="820" y="275" class="body">+500</text><text x="1000" y="275" class="body">+200</text><text x="640" y="304" class="body">1400</text><text x="820" y="304" class="body">+400</text><text x="1000" y="304" class="body">+100</text><text x="640" y="333" class="body">1500</text><text x="820" y="333" class="body">+300</text><text x="1000" y="333" class="body warn">+0</text><text x="640" y="362" class="body">1600</text><text x="820" y="362" class="body">+200</text><text x="1000" y="362" class="body warn">-100</text><text x="40" y="414" class="small">扣除含框、止擋及未退盡門片；不是逐項相加的產品規格。</text><text x="640" y="414" class="small">先扣100mm角部預算：1F可用1800、2F可用1500。</text><text x="40" y="440" class="small warn">剩900只是達到算術目標，尚無實際門框／淨寬核可。</text><text x="640" y="440" class="small warn">門片可能比洞口寬，不能只留1200便當能全開。</text><line x1="30" y1="462" x2="1170" y2="462" stroke="#c0d3c7" /><text x="35" y="499" class="head">門組深度：不要把框軌／把手吃掉的平台空間漏算</text><text x="40" y="533" class="small">假設深度</text><text x="240" y="533" class="small">原門線距平台</text><text x="470" y="533" class="small">保留原60餘量需前移</text><text x="790" y="533" class="small">兩層各多用前室</text><text x="40" y="566" class="body">80</text><text x="240" y="566" class="body">+80</text><text x="470" y="566" class="body">0</text><text x="790" y="566" class="body">0.000㎡</text><text x="40" y="593" class="body">100</text><text x="240" y="593" class="body">+60</text><text x="470" y="593" class="body">0</text><text x="790" y="593" class="body">0.000㎡</text><text x="40" y="620" class="body">120</text><text x="240" y="620" class="body">+40</text><text x="470" y="620" class="body">20</text><text x="790" y="620" class="body">0.072㎡</text><text x="40" y="647" class="body">150</text><text x="240" y="647" class="body">+10</text><text x="470" y="647" class="body">50</text><text x="790" y="647" class="body">0.180㎡</text><text x="40" y="674" class="body">180</text><text x="240" y="674" class="body warn">-20</text><text x="470" y="674" class="body">80</text><text x="790" y="674" class="body">0.288㎡</text><text x="40" y="701" class="body">200</text><text x="240" y="701" class="body warn">-40</text><text x="470" y="701" class="body">100</text><text x="790" y="701" class="body">0.360㎡</text><text x="40" y="728" class="body">220</text><text x="240" y="728" class="body warn">-60</text><text x="470" y="728" class="body">120</text><text x="790" y="728" class="body">0.432㎡</text><text x="40" y="774" class="small warn">180深若保留原餘量，需前移80mm；2F門外預算距電視操作帶僅20mm，不能直接採用。</text><text x="40" y="799" class="small warn">220深需前移120mm時已碰2F電視操作帶。實際門線維持8550；表中前移都尚未選定。</text><line x1="30" y1="820" x2="1170" y2="820" stroke="#c0d3c7" /><text x="35" y="857" class="head">二樓前門與側門：兩道一起處理，不能只關前門</text><text x="40" y="895" class="body">前門開／側門開：前門＋側門兩路</text><text x="40" y="927" class="body">前門開／側門關：仍有前門一路</text><text x="40" y="959" class="body">前門關／側門開：仍可經乾式預留繞側門</text><text x="40" y="991" class="body">前門關／側門關：未見這兩路敞開；不等於隔音或氣密</text><text x="40" y="1035" class="small warn">側門原900名義洞口，沒有額外框預算；完成淨寬目標仍900。必要時擴洞須另核，不默縮側通道。</text><text x="40" y="1064" class="small">上述只列敞開門洞路徑：人仍可開門通行，不是逃生圖，也沒有計算門縫漏氣或聲學數值。</text><rect x="30" y="1090" width="1140" height="110" fill="#fff0d5" stroke="none" /><text x="44" y="1119" class="head">交門商／建築師一次回覆</text><text x="44" y="1148" class="small">框外／洞口定義、完成淨寬、實際門片寬、退盡停放、軌與把手深度、雙面操作、順平地面及救援方式。</text><text x="44" y="1177" class="small">再核密封、固定面到板底收口、側門及消防適用；沒有門型可把未知淨高、結構或防火需求直接抵銷。</text><text x="35" y="1230" class="small warn">配置已併原3D；產品、側門擴洞及門線再前移未選定，瀏覽器待驗，無施工核可。</text></svg>
