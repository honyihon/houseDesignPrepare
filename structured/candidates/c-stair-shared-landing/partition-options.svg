<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc" lang="zh-Hant"><title id="title">C棟共享平台：開放與前置可關門比較</title><desc id="desc">門線前移410mm的幾何比較，平台仍完整。前室每層用原公共地面1.476平方米；門開時仍有斜視線，二樓側門未關就仍有旁通。</desc><style>text{font-family:'Noto Sans CJK TC','Microsoft JhengHei',sans-serif;fill:#203b35}.head{font-size:22px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.warn{fill:#a54a29}</style><rect x="0" y="0" width="1200" height="1200" fill="#f6faf7" stroke="none" /><text x="35" y="44" class="head">C 棟｜已確認前置可關門；開放梯間保留比較</text><text x="35" y="77" class="body">屋主已接受分隔配置，24級／270mm踏面保留；門組產品、淨寬、密封、防火及結構仍待核。</text><rect x="30" y="94" width="1140" height="52" fill="#fff0d5" stroke="none" /><text x="43" y="117" class="small warn">前置門線 y=8550，比原梯廳前緣向前410mm；1200mm是名義開口，兩側另作100mm門前預算。</text><text x="43" y="137" class="small warn">圖示門關閉，虛框為開門停放預算；遮視線須使用適當不透視面，透明門扇不能達到相同效果。</text><rect x="30" y="163" width="555" height="500" fill="#ffffff" stroke="#b5cbbf" rx="8" /><text x="46" y="195" class="head">1F 前置門／客餐通行</text><rect x="71.8" y="220.0" width="302.40000000000003" height="243.60000000000002" fill="#f5f8f6" stroke="#bbcec3" /><rect x="71.8" y="325.0" width="302.40000000000003" height="34.440000000000005" fill="#e2eee2" stroke="#abc2a7" /><rect x="105.4" y="245.2" width="117.60000000000001" height="75.60000000000001" fill="#e4f2f7" stroke="#689cae" fill-opacity="0.6" stroke-dasharray="4 3" /><rect x="105.4" y="337.6" width="117.60000000000001" height="75.60000000000001" fill="#e4f2f7" stroke="#689cae" fill-opacity="0.6" stroke-dasharray="4 3" /><rect x="182.68" y="342.64" width="184.8" height="84.0" fill="none" stroke="#28815d" stroke-width="2" /><rect x="71.8" y="320.8" width="302.40000000000003" height="8.4" fill="#a9b8b0" stroke="#617c6c" /><rect x="67.6" y="329.2" width="8.4" height="30.240000000000002" fill="#a9b8b0" stroke="#617c6c" /><rect x="113.80000000000001" y="320.8" width="100.80000000000001" height="8.4" fill="#f5f8f6" stroke="#926932" /><rect x="113.80000000000001" y="329.2" width="100.80000000000001" height="8.4" fill="#dfc79d" stroke="#926932" /><rect x="214.60000000000002" y="329.2" width="100.80000000000001" height="8.4" fill="none" stroke="#926932" stroke-dasharray="3 2" stroke-width="2" /><line x1="71.8" y1="359.44" x2="374.20000000000005" y2="359.44" stroke="#1b7b68" stroke-dasharray="6 3" /><line x1="180.3204336947456" y1="220.0" x2="201.68824020016683" y2="325.0" stroke="#b98031" stroke-dasharray="4 3" /><line x1="194.86455379482902" y1="220.0" x2="209.22652210175147" y2="325.0" stroke="#b98031" stroke-dasharray="4 3" /><line x1="209.40867389491243" y1="220.0" x2="216.76480400333614" y2="325.0" stroke="#b98031" stroke-dasharray="4 3" /><text x="68" y="244" class="small">入口視線：上段省略</text><text x="275.08000000000004" y="406.48" class="small" text-anchor="middle">原1000平台完整保留</text><text x="385" y="232" class="small">橙色：關門示意</text><text x="385" y="263" class="small">棕虛框：門片停放</text><text x="385" y="294" class="small">藍框：門前／後預算</text><text x="385" y="325" class="small">綠框：共享前平台</text><text x="385" y="356" class="small">綠虛線：原前緣8960</text><text x="385" y="387" class="small">門後至第一級1060</text><text x="385" y="418" class="small">門後至平台前緣60</text><text x="385" y="449" class="small">每層前室用1.476㎡</text><text x="385" y="480" class="small">含原共享平台0.44㎡</text><text x="385" y="511" class="small">另增加公共前室1.036㎡</text><text x="385" y="542" class="small">門框、扶手、密封待核</text><text x="46" y="592" class="small">名義門洞1200；完成門框／全開淨寬未確認，不等同已核照護淨寬。</text><text x="46" y="622" class="small">只截取門前區域；其餘梯段、床位及三樓通道維持前輪細排。</text><rect x="615" y="163" width="555" height="500" fill="#ffffff" stroke="#b5cbbf" rx="8" /><text x="631" y="195" class="head">2F 前置門／起居側</text><rect x="656.8" y="220.0" width="302.40000000000003" height="243.60000000000002" fill="#f5f8f6" stroke="#bbcec3" /><rect x="656.8" y="325.0" width="302.40000000000003" height="34.440000000000005" fill="#e2eee2" stroke="#abc2a7" /><rect x="715.6" y="245.2" width="117.60000000000001" height="75.60000000000001" fill="#e4f2f7" stroke="#689cae" fill-opacity="0.6" stroke-dasharray="4 3" /><rect x="715.6" y="337.6" width="117.60000000000001" height="75.60000000000001" fill="#e4f2f7" stroke="#689cae" fill-opacity="0.6" stroke-dasharray="4 3" /><rect x="767.6800000000001" y="342.64" width="184.8" height="84.0" fill="none" stroke="#28815d" stroke-width="2" /><rect x="656.8" y="320.8" width="302.40000000000003" height="8.4" fill="#a9b8b0" stroke="#617c6c" /><rect x="652.6" y="329.2" width="8.4" height="30.240000000000002" fill="#a9b8b0" stroke="#617c6c" /><rect x="724.0" y="320.8" width="100.80000000000001" height="8.4" fill="#f5f8f6" stroke="#926932" /><rect x="724.0" y="329.2" width="100.80000000000001" height="8.4" fill="#dfc79d" stroke="#926932" /><rect x="824.8" y="329.2" width="100.80000000000001" height="8.4" fill="none" stroke="#926932" stroke-dasharray="3 2" stroke-width="2" /><line x1="656.8" y1="359.44" x2="959.2" y2="359.44" stroke="#1b7b68" stroke-dasharray="6 3" /><rect x="876.88" y="220.0" width="75.60000000000001" height="55.440000000000005" fill="#d3dade" stroke="#8198a3" /><text x="860" y="262" class="small">原沙發末段</text><text x="860.08" y="406.48" class="small" text-anchor="middle">原1000平台完整保留</text><text x="970" y="232" class="small">橙色：關門示意</text><text x="970" y="263" class="small">棕虛框：門片停放</text><text x="970" y="294" class="small">藍框：門前／後預算</text><text x="970" y="325" class="small">綠框：共享前平台</text><text x="970" y="356" class="small">綠虛線：原前緣8960</text><text x="970" y="387" class="small">門後至第一級1060</text><text x="970" y="418" class="small">門後至平台前緣60</text><text x="970" y="449" class="small">每層前室用1.476㎡</text><text x="970" y="480" class="small">含原共享平台0.44㎡</text><text x="970" y="511" class="small">另增加公共前室1.036㎡</text><text x="970" y="542" class="small">門框、扶手、密封待核</text><text x="631" y="592" class="small">名義門洞1200；完成門框／全開淨寬未確認，不等同已核照護淨寬。</text><text x="631" y="622" class="small">只截取門前區域；其餘梯段、床位及三樓通道維持前輪細排。</text><text x="35" y="706" class="head">兩版的生活取捨</text><text x="40" y="747" class="small">開放版：前室不再擴大，少一組門與回牆，但聲音、視線及冷氣可直接互通，不能用格柵補稱隔音。</text><text x="40" y="789" class="small">前置門版：門關時有機會減少直通；每層需用原公共地面1.476㎡作前室，含先前0.44㎡共享平台。</text><text x="40" y="831" class="small">一、二樓門洞及停放方向不同，不能把同一門組位置直接複製；原家具與操作帶的局部碰撞未發現衝突。</text><text x="40" y="873" class="small">門打開後仍有斜向看見梯段的平面視線；不把偏門或局部霧玻璃當成所有角度的風水／隱私核可。</text><text x="40" y="915" class="small">二樓還有起居延伸→乾式預留→梯廳側門的旁通，前門關閉不等於側門關閉，也不保證空調分區。</text><text x="40" y="957" class="small">若要隔音，門組密封、固定面到板底的封閉、側門及其他介面要一起核，尚無產品測試可提供dB數值。</text><text x="40" y="999" class="small">門前／後900mm、兩側100mm及100mm隔屏厚度只是本輪幾何預算；實際救援、門片、把手及淨寬待核。</text><rect x="30" y="1060" width="1140" height="83" fill="#fff0d5" stroke="none" /><text x="44" y="1090" class="head">屋主已接受前置可關門作深化方向；產品及消防／結構仍待合圖。</text><text x="44" y="1120" class="body warn">分隔已併入原3D的C新配置；瀏覽器待驗，防火區劃、隔音、照護或施工未核。</text><text x="35" y="1174" class="small">同一份新細排資料衍生；不新增虛構面積，不縮孝親套衛，不把舊Windows通過結果當新門組驗收。</text></svg>
