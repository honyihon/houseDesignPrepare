<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc" lang="zh-Hant"><title id="title">C棟24級270mm踏面：共享前平台細排</title><desc id="desc">1F及2F平台與門口提案。共享前室200mm，保留1000mm平台及原梯廳外框，2F平台避開下方最後一級。</desc><style>text{font-family:'Noto Sans CJK TC','Microsoft JhengHei',sans-serif;fill:#203b35}.head{font-size:22px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.warn{fill:#a54a29}</style><rect x="0" y="0" width="1200" height="1200" fill="#f6faf7" stroke="none" /><text x="35" y="44" class="head">C 棟｜4m樓高、24級、270mm踏面：共享前平台細排</text><text x="35" y="76" class="body">兩折梯維持原外框；前平台完整1000mm，向公共前室共享200mm。3F橫向通道／孝親房／套衛不縮。</text><rect x="30" y="93" width="1140" height="42" fill="#fff0d5" stroke="none" /><text x="43" y="120" class="small warn">屋主已選前置可關門：原梯廳前緣仍保持開口，門線另設在前方y=8550，不在平台內硬加門。</text><rect x="30" y="151" width="555" height="572" fill="#ffffff" stroke="#b5cbbf" rx="8" /><text x="45" y="184" class="head">1F 出發／側通道</text><rect x="71.0" y="198.0" width="288.0" height="44.800000000000004" fill="#eef4ec" stroke="#bbcfc1" /><rect x="71.0" y="242.8" width="288.0" height="387.2" fill="#f5f8f6" stroke="#526f60" stroke-width="2" /><rect x="71.0" y="242.8" width="96.0" height="387.2" fill="#eef4ec" stroke="#85a78a" stroke-dasharray="4 3" /><rect x="176.60000000000002" y="248.4" width="176.0" height="376.0" fill="none" stroke="#93a9a1" stroke-dasharray="5 4" /><rect x="71.0" y="630.0" width="96.0" height="40.0" fill="#f3e9d8" stroke="#bba47d" /><rect x="167.0" y="630.0" width="192.0" height="40.0" fill="#f3e9d8" stroke="#bba47d" /><rect x="176.60000000000002" y="544.4000000000001" width="176.0" height="80.0" fill="#bddac8" stroke="#7295a1" /><rect x="176.60000000000002" y="306.8" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="272.6" y="522.8" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="176.60000000000002" y="328.4" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="272.6" y="501.2" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="176.60000000000002" y="350.0" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="272.6" y="479.6" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="176.60000000000002" y="371.6" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="272.6" y="458.0" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="176.60000000000002" y="393.20000000000005" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="272.6" y="436.4" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="176.60000000000002" y="414.8" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="272.6" y="414.8" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="176.60000000000002" y="436.4" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="272.6" y="393.20000000000005" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="176.60000000000002" y="458.0" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="272.6" y="371.6" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="176.60000000000002" y="479.6" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="272.6" y="350.0" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="176.60000000000002" y="501.2" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="272.6" y="328.4" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="176.60000000000002" y="522.8" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="272.6" y="306.8" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="176.60000000000002" y="226.8" width="176.0" height="80.0" fill="#b5dec7" stroke="#247958" stroke-width="2" /><rect x="176.60000000000002" y="226.8" width="176.0" height="16.0" fill="#f1ce8d" stroke="#b77e24" stroke-width="1.5" /><line x1="111.0" y1="242.8" x2="352.6" y2="242.8" stroke="#f8fcf9" stroke-width="7" /><line x1="111.0" y1="242.8" x2="352.6" y2="242.8" stroke="#aa6940" stroke-width="2" stroke-dasharray="7 3" /><text x="119.0" y="478.0" class="small" transform="rotate(-90 119.0 478.0)" text-anchor="middle">1200 名義側通道</text><text x="264.6" y="590.0" class="small" text-anchor="middle">中間平台</text><text x="119.0" y="656.0" class="small" text-anchor="middle">孝親房</text><text x="263.0" y="656.0" class="small" text-anchor="middle">套衛（不縮）</text><text x="263.0" y="217.2" class="small" text-anchor="middle">公共前室</text><text x="380" y="238" class="small">24級＝12＋12</text><text x="380" y="268" class="small">級高166.67</text><text x="380" y="298" class="small">每梯段11踏面</text><text x="380" y="328" class="small">踏面270不縮</text><text x="380" y="358" class="small">平台1000不縮</text><text x="380" y="388" class="small">前移共享200</text><text x="380" y="418" class="small">兩區共用0.44㎡</text><text x="380" y="448" class="small">不是增加樓地板</text><text x="380" y="478" class="small">前開口3020待核</text><text x="46" y="691" class="small">固定梯廳3600×4840；灰虛框為原2200×4700梯段外框。</text><rect x="615" y="151" width="555" height="572" fill="#ffffff" stroke="#b5cbbf" rx="8" /><text x="630" y="184" class="head">2F 到達／接續18級上樓</text><rect x="656.0" y="198.0" width="288.0" height="44.800000000000004" fill="#eef4ec" stroke="#bbcfc1" /><rect x="656.0" y="242.8" width="288.0" height="387.2" fill="#f5f8f6" stroke="#526f60" stroke-width="2" /><rect x="656.0" y="242.8" width="96.0" height="387.2" fill="#eef4ec" stroke="#85a78a" stroke-dasharray="4 3" /><rect x="761.6" y="248.4" width="176.0" height="376.0" fill="none" stroke="#93a9a1" stroke-dasharray="5 4" /><rect x="656.0" y="630.0" width="96.0" height="40.0" fill="#f3e9d8" stroke="#bba47d" /><rect x="752.0" y="630.0" width="192.0" height="40.0" fill="#f3e9d8" stroke="#bba47d" /><rect x="761.6" y="501.2" width="176.0" height="123.2" fill="#bddac8" stroke="#7295a1" /><rect x="761.6" y="328.4" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="857.6" y="479.6" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="761.6" y="350.0" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="857.6" y="458.0" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="761.6" y="371.6" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="857.6" y="436.4" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="761.6" y="393.20000000000005" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="857.6" y="414.8" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="761.6" y="414.8" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="857.6" y="393.20000000000005" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="761.6" y="436.4" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="857.6" y="371.6" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="761.6" y="458.0" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="857.6" y="350.0" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="761.6" y="479.6" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="857.6" y="328.4" width="80.0" height="21.6" fill="#dae6ed" stroke="#7295a1" /><rect x="761.6" y="248.4" width="80.0" height="80.0" fill="#bddac8" stroke="#7295a1" /><rect x="761.6" y="226.8" width="176.0" height="80.0" fill="#b5dec7" stroke="#247958" stroke-width="2" /><rect x="761.6" y="226.8" width="176.0" height="16.0" fill="#f1ce8d" stroke="#b77e24" stroke-width="1.5" /><rect x="841.6" y="306.8" width="96.0" height="21.6" fill="#f7d4ca" stroke="#b44c38" stroke-dasharray="4 3" /><line x1="761.6" y1="242.8" x2="937.6" y2="242.8" stroke="#f8fcf9" stroke-width="7" /><line x1="761.6" y1="242.8" x2="937.6" y2="242.8" stroke="#aa6940" stroke-width="2" stroke-dasharray="7 3" /><text x="704.0" y="478.0" class="small" transform="rotate(-90 704.0 478.0)" text-anchor="middle">1200 名義側通道</text><text x="849.6" y="590.0" class="small" text-anchor="middle">中間平台</text><text x="704.0" y="656.0" class="small" text-anchor="middle">後走道</text><text x="848.0" y="656.0" class="small" text-anchor="middle">後小廚房</text><text x="848.0" y="217.2" class="small" text-anchor="middle">二樓起居</text><text x="965" y="238" class="small">接續上樓仍18級</text><text x="965" y="268" class="small">左側出發平台保留</text><text x="965" y="298" class="small">右側到達面分開畫</text><text x="965" y="328" class="small">紅區不可整片封板</text><text x="965" y="358" class="small">保留最後一級上來</text><text x="965" y="388" class="small">起居共用0.44㎡</text><text x="965" y="418" class="small">沙發／櫃體不移</text><text x="965" y="448" class="small">前開口2200待核</text><text x="965" y="478" class="small">新板洞／護欄待核</text><text x="631" y="691" class="small">固定梯廳3600×4840；灰虛框為原2200×4700梯段外框。</text><text x="35" y="763" class="head">共享的200mm是平整平台，沒有把階梯伸進三樓通道</text><text x="40" y="801" class="small">前平台從 y=8760 到9760，完整1000；原梯廳前緣 y=8960，所以200mm與公共前室共用。</text><text x="40" y="839" class="small">1F／2F各有0.44㎡公共地面同時供平台使用，不重複加算面積，不在此擺鞋櫃、椅子或門片。</text><text x="40" y="877" class="small">1F開口由原1000調整為合計3020；2F由原900調整為2200。這是門牆改動，結構／防火尚未核。</text><text x="40" y="915" class="small">二樓到達面不能照搬舊的整片平台：須避開1200×270mm區域，其中包含下方最後一級的上方空間。</text><text x="40" y="953" class="small">3F既有橫向通道名義深1360mm與前門位置保留；RF到達位置保留，未向屋頂平台新增封閉屋突。</text><text x="40" y="991" class="small">1F孝親房與套衛的牆線、床櫃及衛浴設備保留。名義側通道1200不是已扣牆、扶手的完成面淨寬。</text><rect x="30" y="1030" width="1140" height="104" fill="#fff0d5" stroke="none" /><text x="45" y="1058" class="head">這個排法的代價</text><text x="45" y="1087" class="body">梯間較開放，起居區會更容易聽到樓梯聲；門牆分隔、隱私及門見梯的接受度仍須討論。</text><text x="45" y="1114" class="body warn">若需獨立門扇，不能把門塞進730mm偏移內；必須重新設計完整平台與門的位置。</text><text x="35" y="1167" class="small">另案仍保留250mm踏面比較。這次是局部細排，不代表降板、冷媒立管、實際淨高或建照已解決。</text></svg>
