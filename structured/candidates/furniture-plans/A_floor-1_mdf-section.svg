<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="mdf-title mdf-desc" data-mdf-study="conditional-not-installed"><title id="mdf-title">A 1F MDF上折梯下候選剖面（非結構剖面）</title><desc id="mdf-desc">優先研究上折回程梯較高段下方；原18U落地機櫃不縮小。梯下只畫候選虛框，不新增機櫃、不切結構或開側門。90cm梯段尚不能完整容納120cm左右維修外廓；缺資料仍未知，側壁龕備援不可同時計作已釋放空間。</desc><style>text{font-family:system-ui,sans-serif;fill:#263846;font-size:18px}</style><rect x="0" y="0" width="1100" height="720" fill="#f8fafc" /><text x="28" y="34" font-size="26" font-weight="700">梯下MDF優先候選／側壁龕備援</text><text x="28" y="65">使用共用梯段／機櫃數據，未含實際梁、斜板、裝修、消防或設備選型。</text><rect x="362.0" y="315.0" width="31.2" height="14" fill="#94a3b8" /><line x1="362.0" x2="393.2" y1="339.0" y2="339.0" stroke="#64748b" stroke-dasharray="5 4" data-underside-deduction-mm="200" /><line x1="362.0" x2="393.2" y1="351.0" y2="351.0" stroke="#b45309" stroke-dasharray="5 4" data-underside-deduction-mm="300" /><rect x="330.8" y="295.0" width="31.2" height="14" fill="#94a3b8" /><line x1="330.8" x2="362.0" y1="319.0" y2="319.0" stroke="#64748b" stroke-dasharray="5 4" data-underside-deduction-mm="200" /><line x1="330.8" x2="362.0" y1="331.0" y2="331.0" stroke="#b45309" stroke-dasharray="5 4" data-underside-deduction-mm="300" /><rect x="299.6" y="275.0" width="31.2" height="14" fill="#94a3b8" /><line x1="299.6" x2="330.8" y1="299.0" y2="299.0" stroke="#64748b" stroke-dasharray="5 4" data-underside-deduction-mm="200" /><line x1="299.6" x2="330.8" y1="311.0" y2="311.0" stroke="#b45309" stroke-dasharray="5 4" data-underside-deduction-mm="300" /><rect x="268.4" y="255.00000000000006" width="31.2" height="14" fill="#94a3b8" /><line x1="268.4" x2="299.6" y1="279.00000000000006" y2="279.00000000000006" stroke="#64748b" stroke-dasharray="5 4" data-underside-deduction-mm="200" /><line x1="268.4" x2="299.6" y1="291.00000000000006" y2="291.00000000000006" stroke="#b45309" stroke-dasharray="5 4" data-underside-deduction-mm="300" /><rect x="237.2" y="235.00000000000006" width="31.2" height="14" fill="#94a3b8" /><line x1="237.2" x2="268.4" y1="259.00000000000006" y2="259.00000000000006" stroke="#64748b" stroke-dasharray="5 4" data-underside-deduction-mm="200" /><line x1="237.2" x2="268.4" y1="271.00000000000006" y2="271.00000000000006" stroke="#b45309" stroke-dasharray="5 4" data-underside-deduction-mm="300" /><rect x="206.0" y="215.0" width="31.2" height="14" fill="#94a3b8" /><line x1="206.0" x2="237.2" y1="239.0" y2="239.0" stroke="#64748b" stroke-dasharray="5 4" data-underside-deduction-mm="200" /><line x1="206.0" x2="237.2" y1="251.0" y2="251.0" stroke="#b45309" stroke-dasharray="5 4" data-underside-deduction-mm="300" /><rect x="174.8" y="195.00000000000006" width="31.2" height="14" fill="#94a3b8" /><line x1="174.8" x2="206.0" y1="219.00000000000006" y2="219.00000000000006" stroke="#64748b" stroke-dasharray="5 4" data-underside-deduction-mm="200" /><line x1="174.8" x2="206.0" y1="231.00000000000006" y2="231.00000000000006" stroke="#b45309" stroke-dasharray="5 4" data-underside-deduction-mm="300" /><rect x="143.6" y="175.00000000000006" width="31.2" height="14" fill="#94a3b8" /><line x1="143.6" x2="174.8" y1="199.00000000000006" y2="199.00000000000006" stroke="#64748b" stroke-dasharray="5 4" data-underside-deduction-mm="200" /><line x1="143.6" x2="174.8" y1="211.00000000000006" y2="211.00000000000006" stroke="#b45309" stroke-dasharray="5 4" data-underside-deduction-mm="300" /><rect x="112.4" y="155.0" width="31.2" height="14" fill="#94a3b8" /><line x1="112.4" x2="143.6" y1="179.0" y2="179.0" stroke="#64748b" stroke-dasharray="5 4" data-underside-deduction-mm="200" /><line x1="112.4" x2="143.6" y1="191.0" y2="191.0" stroke="#b45309" stroke-dasharray="5 4" data-underside-deduction-mm="300" /><rect x="81.2" y="135.00000000000006" width="31.2" height="14" fill="#94a3b8" /><line x1="81.2" x2="112.4" y1="159.00000000000006" y2="159.00000000000006" stroke="#64748b" stroke-dasharray="5 4" data-underside-deduction-mm="200" /><line x1="81.2" x2="112.4" y1="171.00000000000006" y2="171.00000000000006" stroke="#b45309" stroke-dasharray="5 4" data-underside-deduction-mm="300" /><rect x="50.0" y="115.00000000000006" width="31.2" height="14" fill="#94a3b8" /><line x1="50.0" x2="81.2" y1="139.00000000000006" y2="139.00000000000006" stroke="#64748b" stroke-dasharray="5 4" data-underside-deduction-mm="200" /><line x1="50.0" x2="81.2" y1="151.00000000000006" y2="151.00000000000006" stroke="#b45309" stroke-dasharray="5 4" data-underside-deduction-mm="300" /><line x1="45" x2="405" y1="575" y2="575" stroke="#334155" /><rect x="68.0" y="335" width="240.0" height="240" fill="none" stroke="#b45309" stroke-dasharray="8 5" data-service-height-target-mm="2000" /><rect x="164.0" y="455.0" width="72.0" height="120.0" fill="#0e7490" data-rack-height-mm="1000.0" /><text x="50" y="603">前方80cm → 60cm機櫃 → 後方60cm</text><text x="50" y="635">虛線扣200／300mm只是敏感度，並非已核梁板底。</text><text x="465" y="136">機櫃 60×60×100cm；頂部暫留20cm</text><text x="465" y="174">維修外廓 120×200cm；暫以2m站立高度比較</text><text x="465" y="212" fill="#b45309">梯段寬90cm：左右維修仍有衝突</text><text x="465" y="260">僅沿上折梯縱向推估（不含兩側）：</text><text x="465" y="297">扣200mm → 本體區2.80m；縱向維修區2.30m</text><text x="465" y="335">扣300mm → 本體區2.70m；縱向維修區2.20m</text><text x="465" y="392">這些數字不證明完整維修、散熱、承重或避難成立。</text><text x="465" y="439">側壁龕備援仍保留，不能同時計入新增可用面積。</text><text x="465" y="480">家務櫃只畫40cm深條件式範圍，不列已擺家具。</text><text x="28" y="692">下一步：建築師梯剖面／消防分隔 → 弱電實物、散熱與換機演練 → 才決定搬入及再利用。</text></svg>
