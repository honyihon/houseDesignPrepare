<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320" role="img" aria-labelledby="track-title track-desc"><title id="track-title">兩片門軌道假設剖示意</title><desc id="track-desc">45mm門片、15mm軌道間距、45mm門片與25mm把手，共130mm。原轉位起點95mm會被侵入；新起點165mm仍留35mm。不是選品或施工圖。</desc><style>text{font:16px system-ui,sans-serif;fill:#263846}.dim{stroke:#334155;stroke-width:2}.warn{stroke:#b43b25;stroke-width:3;stroke-dasharray:7 5}</style><rect width="840" height="320" fill="#f8faf8"/><text x="24" y="30">局部剖示意：由左完成面向浴室內側看</text><path d="M140 80H660 M140 72V90 M660 72V90" class="dim"/><text x="290" y="65">總厚130mm（未選品）</text><rect x="140" y="110" width="180" height="75" fill="#d6aa69"/><rect x="320" y="110" width="60" height="75" fill="#e2e8f0"/><rect x="380" y="110" width="180" height="75" fill="#b48445"/><rect x="560" y="130" width="100" height="35" fill="#475569"/><text x="175" y="210">從動片45</text><text x="323" y="240">間距15</text><text x="420" y="210">主動片45</text><text x="565" y="240">把手25</text><path d="M520 95V270" class="warn"/><text x="300" y="294" fill="#b43b25">原轉位起點95mm（會侵入）</text><path d="M800 95V265" class="dim"/><text x="670" y="105">新轉位起點</text><text x="680" y="125">165mm</text><path d="M660 180H800" class="dim"/><text x="695" y="202">餘35mm</text></svg>