<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="B工作天井｜地面不動、RF開洞與留板帶分開比較"><title>B工作天井｜地面不動、RF開洞與留板帶分開比較</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}.room{font-size:14px;font-weight:650}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">B工作天井｜地面不動、RF開洞與留板帶分開比較</text><text x="28" y="76">獨立介面比較／未採用｜原ABC／3D、B兩個搬轎入口、Q1／Q2及RF快照保留。不是工程或風水核可。</text><text x="28" y="1158" class="small">本批 9c83e36da82eb20bfa65edac647d5ed813228ebad86545937b0a88770faa1991</text><text x="28" y="1182" class="small">僅指定平面與算式；合法戶外、結構、防水、通風乾衣、護欄及實物拆運未知。未跑瀏覽器／WebGL。</text><text x="40" y="135" class="room">R0 原完整開洞／右側繞行</text><rect x="40.0" y="180.0" width="234.0" height="292.5" fill="#edf0e9" stroke="#607c73" /><polygon points="40.0,223.55000000000007 274.0,223.55000000000007 274.0,180.0 40.0,180.0 40.0,223.55000000000007" fill="#edf0e9" stroke="#8c9b90" stroke-width="0.6" /><polygon points="211.6,223.55000000000007 211.6,327.55000000000007 274.0,327.55000000000007 274.0,223.55000000000007 211.6,223.55000000000007" fill="#edf0e9" stroke="#8c9b90" stroke-width="0.6" /><polygon points="40.0,362.0 40.0,401.0 40.0,472.5 274.0,472.5 274.0,401.0 196.0,401.0 196.0,362.0 40.0,362.0" fill="#e1ebd8" stroke="#8c9b90" stroke-width="0.6" /><polygon points="196.0,362.0 196.0,223.55000000000007 40.0,223.55000000000007 40.0,362.0 196.0,362.0" fill="#edf0e9" stroke="#8c9b90" stroke-width="0.6" /><rect x="40.0" y="223.55000000000007" width="156.0" height="138.45000000000002" fill="#dceff4" stroke="#397b8e" stroke-width="1.8" /><rect x="40.0" y="223.55000000000007" width="156.0" height="138.45000000000002" fill="none" stroke="#217eac" stroke-width="2.5" stroke-dasharray="7 4" /><polygon points="202.5,223.55000000000007 202.5,217.05000000000007 40.0,217.05000000000007 40.0,223.55000000000007" fill="#bd8f56" fill-opacity="0.7" 