<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="C入口與門態｜新前置門接舊照護直線的修正"><title>C入口與門態｜新前置門接舊照護直線的修正</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}.room{font-size:13px;font-weight:650}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">C入口與門態｜新前置門接舊照護直線的修正</text><text x="28" y="76">獨立完整1F比較／未採用｜原ABC、3D與上層不改；115mm完成預算，實際門組、照護及施工未核。</text><text x="28" y="1158" class="small">本批來源 bcf9de051c7600acef76f2c12a8631862cc53997edf15e4885dc086fdb51e1a1</text><text x="28" y="1182" class="small">只有指定名義幾何；不沿用舊passed，不當產品、風水、照護、救援、消防、法規或施工核可。</text><rect x="297.0" y="145.0" width="378.0" height="237.29999999999998" fill="#edf0e9" stroke="#85978e" /><rect x="297.0" y="298.29999999999995" width="126.0" height="329.7" fill="#e7efdc" stroke="#85978e" /><rect x="45.0" y="628.0" width="378.0" height="178.5" fill="#e7efdc" stroke="#85978e" /><rect x="435.59999999999997" y="382.29999999999995" width="231.0" height="416.84999999999997" fill="#c9ced7" stroke="#617185" /><rect x="297.0" y="250.0" width="378.0" height="10.5" fill="#7f8b84" /><rect x="291.75" y="260.5" width="10.5" height="37.8" fill="#7f8b84" /><rect x="349.5" y="250.0" width="126.0" height="10.5" fill="#fafbf8" /><polygon points="601.5,260.5 601.5,271.0 475.5,271.0 475.5,260.5 601.5,260.5" fill="#bb9474" stroke="#805534" /><polygon points="281.25,784.4499999999999 281.25,794.425 148.95,794.425 148.95,784.4499999999999 281.25,784.4499999999999" fill="#bb9474" stroke="#805534" /><line x1="412.5" y1="145.0" x2="412.5" y2="319.29999999999995" stroke="#277c79" stroke-width="3" stroke-dasharray="5 3" /><line x1="412.5" y1="319.29999999999995" x2="360.0" y2="319.29999999999995" stroke="#277c79" stroke-width="3" stroke-dasharray="5 3" /><line x1="360.0" y1="319.29999999999995" x2="360.0" y2="717.25" stroke="#277c79" stroke-width="3" stroke-dasharray="5 3" /><line x1="360.0" y1="717.25" x2="344.25" y2="717.25" stroke="#277c79" stroke-width="3" stroke-dasharray="5 3" /><line x1="344.25" y1="717.25" x2="344.25" y2="827.5" stroke="#277c79" stroke-width="3" stroke-dasharray="5 3" /><text x="350" y="235" class="room">前置門 y8550</text><text x="445" y="370" class="room">第一級 y9760</text><text x="305" y="520" class="room">梯旁名義1200</text><text x="100" y="760" class="room">後照護前室／IDF</text><text x="760" y="145">不能直接疊舊圖：舊900試線沿x3000，碰新門固定面；新線在門</text><text x="760" y="169">處改x3500，門後平地再轉x3000。</text><text x="760" y="205">保原門線與家具，不將舊照護版右側閱讀椅搬到新門區。孝親電視轉側牆</text><text x="760" y="229">，避免前入口加寬與電視重疊。</text><text x="760" y="265">四組門各三態，共81組；半開／關閉分別阻擋其相關路線，朝街到床只</text><text x="760" y="289">受街門／前室門／臥室門，入浴另受浴室門。</text><text x="760" y="325">朝街1200、公衛900、孝親及浴室1200都是名義洞。公衛不因</text><text x="760" y="349">此取得900完成淨寬；其門片與廚房門組仍未知。</text><text x="760" y="385">前室1700深扣230後1470，不當獨立1500轉位；IDF需</text><text x="760" y="409">共享檢修，不可擺櫃阻斷照護動線。</text><text x="760" y="445">門移動行程須先清空。把手、止擋、防夾、外解鎖、無凸軌、防火密封與</text><text x="760" y="469">關門新風／排氣均待實際產品與專業資料。</text><text x="45" y="1040">900方塊路徑示意；未核道路高差、門檻、抬抱人員或全程救援。</text></svg>
