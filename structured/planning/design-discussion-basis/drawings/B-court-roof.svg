<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="R1｜RF左板帶直達後機位：完整屋頂需求仍待排"><title>R1｜RF左板帶直達後機位：完整屋頂需求仍待排</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}.room{font-size:14px;font-weight:650}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">R1｜RF左板帶直達後機位：完整屋頂需求仍待排</text><text x="28" y="76">獨立介面比較／未採用｜原ABC／3D、B兩個搬轎入口、Q1／Q2及RF快照保留。不是工程或風水核可。</text><text x="28" y="1158" class="small">本批 9c83e36da82eb20bfa65edac647d5ed813228ebad86545937b0a88770faa1991</text><text x="28" y="1182" class="small">僅指定平面與算式；合法戶外、結構、防水、通風乾衣、護欄及實物拆運未知。未跑瀏覽器／WebGL。</text><rect x="45.0" y="145.0" width="312.0" height="916.76" fill="#eef0e7" stroke="#607c73" /><polygon points="357.0,347.79999999999995 169.8,347.79999999999995 169.8,618.2 45.0,618.2 45.0,736.24 357.0,736.24 357.0,618.2" fill="#f1ded6" stroke="#b88b7a" fill-opacity="0.7" /><polygon points="287.84,736.24 287.84,819.4399999999999 182.28,819.4399999999999 182.28,736.24" fill="#f1ded6" stroke="#b88b7a" fill-opacity="0.7" /><rect x="45.0" y="347.79999999999995" width="124.8" height="270.4" fill="#d2d9e0" stroke="#66758b" /><rect x="45.0" y="736.24" width="57.199999999999996" height="110.75999999999999" fill="#b8c9b5" stroke="#537b51" stroke-width="1.5" /><rect x="102.19999999999999" y="736.24" width="67.6" height="5.2" fill="#b8c9b5" stroke="#537b51" /><rect x="102.19999999999999" y="741.4399999999999" width="67.6" height="105.55999999999999" fill="#c8dce4" stroke="#217eac" stroke-width="1.5" /><polygon points="97.0,736.24 97.0,741.4399999999999 175.0,741.4399999999999 175.0,736.24" fill="#bd8f56" /><polygon points="97.0,847.0 97.0,852.1999999999999 175.0,852.1999999999999 175.0,847.0" fill="#bd8f56" /><polygon points="97.0,741.4399999999999 97.0,847.0 102.19999999999999,847.0 102.19999999999999,741.4399999999999" fill="#bd8f56" /><polygon points="169.8,741.4399999999999 169.8,847.0 175.0,847.0 175.0,741.4399999999999" fill="#bd8f56" /><rect x="118.84" y="1038.3600000000001" width="46.8" height="18.2" fill="#b2c6b7" stroke="#486650" /><rect x="49.16" y="1038.3600000000001" width="46.8" height="18.2" fill="#b2c6b7" stroke="#486650" /><rect x="215.04" y="150.2" width="46.8" height="70.2" fill="none" stroke="#b78447" stroke-dasharray="4 3" /><rect x="215.04" y="150.2" width="46.8" height="18.2" fill="#c2ccd6" stroke="#536b80" /><rect x="306.03999999999996" y="150.2" width="46.8" height="70.2" fill="none" stroke="#b78447" stroke-dasharray="4 3" /><rect x="306.03999999999996" y="150.2" width="46.8" height="18.2" fill="#c2ccd6" stroke="#536b80" /><line x1="193.2" y1="373.79999999999995" x2="323.2" y2="373.79999999999995" stroke="#277c79" stroke-width="1.8" stroke-dasharray="4 3" /><line x1="323.2" y1="373.79999999999995" x2="323.2" y2="202.2" stroke="#277c79" stroke-width="1.8" stroke-dasharray="4 3" /><line x1="323.2" y1="202.2" x2="238.44" y2="202.2" stroke="#277c79" stroke-width="1.8" stroke-dasharray="4 3" /><line x1="193.2" y1="373.79999999999995" x2="323.2" y2="373.79999999999995" stroke="#277c79" stroke-width="1.8" stroke-dasharray="4 3" /><line x1="323.2" y1="373.79999999999995" x2="323.2" y2="701.4" stroke="#277c79" stroke-width="1.8" stroke-dasharray="4 3" /><line x1="323.2" y1="701.4" x2="73.6" y2="701.4" stroke="#277c79" stroke-width="1.8" stroke-dasharray="4 3" /><line x1="73.6" y1="701.4" x2="73.6" y2="1018.5999999999999" stroke="#277c79" stroke-width="1.8" stroke-dasharray="4 3" /><line x1="193.2" y1="373.79999999999995" x2="323.2" y2="373.79999999999995" stroke="#277c79" stroke-width="1.8" stroke-dasharray="4 3" /><line x1="323.2" y1="373.79999999999995" x2="323.2" y2="701.4" stroke="#277c79" stroke-width="1.8" stroke-dasharray="4 3" /><line x1="323.2" y1="701.4" x2="73.6" y2="701.4" stroke="#277c79" stroke-width="1.8" stroke-dasharray="4 3" /><line x1="73.6" y1="701.4" x2="73.6" y2="951.0" stroke="#277c79" stroke-width="1.8" stroke-dasharray="4 3" /><line x1="73.6" y1="951.0" x2="142.24" y2="951.0" stroke="#277c79" stroke-width="1.8" stroke-dasharray="4 3" /><line x1="142.24" y1="951.0" x2="142.24" y2="1018.5999999999999" stroke="#277c79" stroke-width="1.8" stroke-dasharray="4 3" /><text x="45" y="130" class="small">前兩代表槽：身分／新購數未定</text><text x="45" y="1090" class="small">後兩原B-AC03／04保留</text><text x="445" y="145">RF左留1100mm板帶，三樓只是部分遮頂；沒有新柱腳、梁深或結構可行的既成證據。</text><text x="445" y="181">井前護欄後退100到天井上方，避開原R0占祭祀投影0.25㎡的待核介面。700方塊從RF側門外沿</text><text x="445" y="205">左板帶到後機位。</text><text x="445" y="241">粉紅區為完整祭祀／乾背保護投影；只容必要巡檢通行，不在這裡放機器或作日常曬衣。</text><text x="445" y="277">既有兩台及兩個前代表槽只作列明平面避讓。原機的維修包絡、全熱、機型及整機拆運仍需同版正式資料。</text><text x="445" y="313">其餘水塔／泵浦3㎡、熱泵2.5㎡、活動曬衣24㎡、梯間6㎡及保護29.5㎡原目標全部保留，未畫入</text><text x="445" y="337">不當取消或屋頂已足。</text><text x="445" y="373">只看RF前23.4㎡，扣兩個代表維修槽就剩20.97㎡；未扣其他設備或走道仍比24㎡平台少3.0</text><text x="445" y="397">3㎡。</text><text x="445" y="433">不能因此搬回舊水塔文字座標，亦不拿不同樓層曬衣互抵。屋頂全部設備尚未完成排位，荷重／防颱／振動未</text><text x="445" y="457">核。</text><text x="445" y="493">R1能改善開洞及通行介面，不能解除三樓天井壓2F更衣乾區的防水風險、KTV20缺口或P3前排水問</text><text x="445" y="517">題。</text></svg>
