<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="C照護浴室｜側牆盆、雙片門與仍緊的餘量"><title>C照護浴室｜側牆盆、雙片門與仍緊的餘量</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}.room{font-size:13px;font-weight:650}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">C照護浴室｜側牆盆、雙片門與仍緊的餘量</text><text x="28" y="76">獨立完整1F比較／未採用｜原ABC、3D與上層不改；115mm完成預算，實際門組、照護及施工未核。</text><text x="28" y="1158" class="small">本批來源 bcf9de051c7600acef76f2c12a8631862cc53997edf15e4885dc086fdb51e1a1</text><text x="28" y="1182" class="small">只有指定名義幾何；不沿用舊passed，不當產品、風水、照護、救援、消防、法規或施工核可。</text><rect x="50.0" y="155.0" width="408.00000000000006" height="510.00000000000006" fill="#dceff4" stroke="#607c73" stroke-width="2" /><rect x="327.1" y="174.55" width="76.5" height="119.00000000000001" fill="#b9c9be" stroke="#3c6355" /><rect x="327.1" y="293.55" width="76.5" height="119.00000000000001" fill="none" stroke="#8ba694" stroke-dasharray="4 3" /><rect x="234.45000000000002" y="441.45000000000005" width="204.00000000000003" height="204.00000000000003" fill="#b9c9be" stroke="#3c6355" /><rect x="234.45000000000002" y="322.45000000000005" width="204.00000000000003" height="119.00000000000001" fill="none" stroke="#8ba694" stroke-dasharray="4 3" /><rect x="69.55" y="174.55" width="76.5" height="102.00000000000001" fill="#b9c9be" stroke="#3c6355" /><rect x="146.05" y="174.55" width="119.00000000000001" height="102.00000000000001" fill="none" stroke="#8ba694" stroke-dasharray="4 3" /><rect x="295.65" y="635.675" width="81.60000000000001" height="7.65" fill="#c4aa8b" stroke="#916b41" /><rect x="299.475" y="180.075" width="5.95" height="5.95" fill="#c4aa8b" stroke="#916b41" /><rect x="426.975" y="211.525" width="5.95" height="175.95000000000002" fill="#c4aa8b" stroke="#916b41" /><rect x="426.975" y="455.475" width="5.95" height="175.95000000000002" fill="#c4aa8b" stroke="#916b41" /><rect x="426.975" y="455.475" width="5.95" height="22.950000000000003" fill="#c4aa8b" stroke="#916b41" /><rect x="278.82000000000005" y="182.37" width="1.36" height="1.36" fill="#c4aa8b" stroke="#916b41" /><rect x="429.27000000000004" y="528.32" width="1.36" height="1.36" fill="#c4aa8b" stroke="#916b41" /><rect x="97.6" y="322.45000000000005" width="255.00000000000003" height="306.0" fill="none" stroke="#3c8a7d" stroke-width="2" stroke-dasharray="6 3" /><polygon points="87.4,495.85 87.4,608.05 79.75,608.05 79.75,495.85 87.4,495.85" fill="#bb9474" stroke="#805534" /><polygon points="77.2,490.75 77.2,602.95 69.55,602.95 69.55,490.75 77.2,490.75" fill="#bb9474" stroke="#805534" /><polygon points="91.65,608.05 91.65,611.45 69.55,611.45 69.55,608.05 91.65,608.05" fill="#bb9474" stroke="#805534" /><polygon points="91.65,509.45000000000005 91.65,523.05 87.4,523.05 87.4,509.45000000000005 91.65,509.45000000000005" fill="#bb9474" stroke="#805534" /><text x="55" y="735" class="small">600mm後高窗候選 → 830mm戶外帶</text><text x="55" y="780" class="small">2.4×3m名義；115假設完成輪廓約6.0109㎡</text><text x="560" y="145">側牆盆600×450轉向、馬桶450×700及1200淋浴保留；折椅與扶手等八類配件沒有</text><text x="560" y="169">刪除或縮小。</text><text x="560" y="205">盆前900方塊有50mm面向餘量，但偏中線250mm；坐姿龍頭、膝部、熱管及實際可及未知</text><text x="560" y="229">。</text><text x="560" y="265">盆操作與馬桶側移重疊0.2675㎡，必須分時；1500×1800及1500圓仍借淋浴濕地</text><text x="560" y="289">，不是專用乾地轉位。</text><text x="560" y="325">全開／半開／關閉的兩片門及25把手／20止擋都列入；門組到轉位35mm，實際更厚產品可能</text><text x="560" y="349">侵入。</text><text x="560" y="385">局部板框到右扶手18.5mm，單項消耗20mm後為−1.5mm；這仍是未解風險，不是施工</text><text x="560" y="409">誤差已足。</text><text x="560" y="445">折椅收起、扶手掀起是本輪操作前提，放下狀態不能借同一預留宣稱通過。整套錨定承重、防水排水</text><text x="560" y="469">、外救援待核。</text><text x="560" y="505">套衛仍經臥室；訪客用前公衛，照服公共直達偏好尚未滿足。局部板框不代表真人從騎樓抬抱到床或</text><text x="560" y="529">浴室救援成立。</text><text x="560" y="565">新風、兩衛獨排及關門補氣須合圖；外窗只代表候選，不證明有效換氣或免除機械排濕。</text></svg>
