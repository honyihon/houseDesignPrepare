<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="Q3樓梯代價｜二樓L形接段，不能蓋住原下樓梯"><title>Q3樓梯代價｜二樓L形接段，不能蓋住原下樓梯</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}.room{font-size:14px;font-weight:650}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">Q3樓梯代價｜二樓L形接段，不能蓋住原下樓梯</text><text x="28" y="76">獨立Q3比較／未採用｜改上層梯及RF到達有結構代價；一樓功能及原Q2保留，不代表隔音或樓梯核可。</text><text x="28" y="1158" class="small">本批 a5e3e758fc5249a2c0768fd3b48d5d7448365c170820ccfbb529ca439ed59de2</text><text x="28" y="1182" class="small">指定幾何、局部踏步與面積算式不是法規、風水、結構、消防、產品或聲學簽證。未跑瀏覽器／WebGL。</text><text x="40" y="140" class="room">排除：直接鋪新矩形平台</text><rect x="40.0" y="252.0" width="312.0" height="676.0" fill="#edf0e9" stroke="#607c73" /><rect x="50.4" y="365.1" width="286.0" height="553.8000000000001" fill="none" stroke="#537d73" stroke-dasharray="5 3" /><rect x="206.4" y="391.1" width="130.0" height="35.1" fill="#e5c5b7" stroke="#b88b7a" stroke-width="0.5" /><rect x="206.4" y="426.20000000000005" width="130.0" height="35.1" fill="#e5c5b7" stroke="#b88b7a" stroke-width="0.5" /><rect x="206.4" y="461.30000000000007" width="130.0" height="35.1" fill="#e5c5b7" stroke="#b88b7a" stroke-width="0.5" /><rect x="206.4" y="496.4" width="130.0" height="35.1" fill="#e5c5b7" stroke="#b88b7a" stroke-width="0.5" /><rect x="206.4" y="531.5" width="130.0" height="35.1" fill="#e5c5b7" stroke="#b88b7a" stroke-width="0.5" /><rect x="206.4" y="566.6" width="130.0" height="35.1" fill="#e5c5b7" stroke="#b88b7a" stroke-width="0.5" /><rect x="206.4" y="601.7" width="130.0" height="35.1" fill="#e5c5b7" stroke="#b88b7a" stroke-width="0.5" /><rect x="206.4" y="636.8000000000001" width="130.0" height="35.1" fill="#e5c5b7" stroke="#b88b7a" stroke-width="0.5" /><rect x="206.4" y="671.9" width="130.0" height="35.1" fill="#e5c5b7" stroke="#b88b7a" stroke-width="0.5" /><rect x="206.4" y="707.0" width="130.0" height="35.1" fill="#e5c5b7" stroke="#b88b7a" stroke-width="0.5" /><rect x="206.4" y="742.1" width="130.0" height="35.1" fill="#e5c5b7" stroke="#b88b7a" stroke-width="0.5" /><rect x="50.4" y="365.1" width="286.0" height="130.0" fill="#bc7f74" fill-opacity="0.8" stroke="#9e4939" /><text x="207.70000000000002" y="655.0" class="small">原1F右跑下樓梯洞</text><text x="520" y="140" class="room">Q3候選：保原前平台＋左接段</text><rect x="520.0" y="252.0" width="312.0" height="676.0" fill="#edf0e9" stroke="#607c73" /><rect x="530.4" y="365.1" width="286.0" height="553.8000000000001" fill="none" stroke="#537d73" stroke-dasharray="5 3" /><rect x="686.4" y="391.1" width="130.0" height="35.1" fill="#e5c5b7" stroke="#b88b7a" stroke-width="0.5" /><rect x="686.4" y="426.20000000000005" width="130.0" height="35.1" fill="#e5c5b7" stroke="#b88b7a" stroke-width="0.5" /><rect x="686.4" y="461.30000000000007" width="130.0" height="35.1" fill="#e5c5b7" stroke="#b88b7a" stroke-width="0.5" /><rect x="686.4" y="496.4" width="130.0" height="35.1" fill="#e5c5b7" stroke="#b88b7a" stroke-width="0.5" /><rect x="686.4" y="531.5" width="130.0" height="35.1" fill="#e5c5b7" stroke="#b88b7a" stroke-width="0.5" /><rect x="686.4" y="566.6" width="130.0" height="35.1" fill="#e5c5b7" stroke="#b88b7a" stroke-width="0.5" /><rect x="686.4" y="601.7" width="130.0" height="35.1" fill="#e5c5b7" stroke="#b88b7a" stroke-width="0.5" /><rect x="686.4" y="636.8000000000001" width="130.0" height="35.1" fill="#e5c5b7" stroke="#b88b7a" stroke-width="0.5" /><rect x="686.4" y="671.9" width="130.0" height="35.1" fill="#e5c5b7" stroke="#b88b7a" stroke-width="0.5" /><rect x="686.4" y="707.0" width="130.0" height="35.1" fill="#e5c5b7" stroke="#b88b7a" stroke-width="0.5" /><rect x="686.4" y="742.1" width="130.0" height="35.1" fill="#e5c5b7" stroke="#b88b7a" stroke-width="0.5" /><polygon points="816.4000000000001,391.1 816.4000000000001,261.1 530.4,261.1 530.4,365.1 530.4,391.1 530.4,495.1 660.4,495.1 660.4,391.1" fill="#b9d0b3" stroke="#4c7750" stroke-width="1.8" /><line x1="751.4" y1="326.1" x2="595.4" y2="326.1" stroke="#277c79" stroke-width="2" stroke-dasharray="5 3" /><line x1="595.4" y1="326.1" x2="595.4" y2="430.1" stroke="#277c79" stroke-width="2" stroke-dasharray="5 3" /><text x="687.7" y="655.0" class="small">原1F右跑下樓梯洞</text><text x="1000" y="145">左圖錯誤鋪板壓原右跑末段三踏；200mm板</text><text x="1000" y="167">厚示意下局部餘量300／133／−33mm</text><text x="1000" y="189">，因此排除。</text><text x="1000" y="223">右圖保原2200×1000前平台，加左側1</text><text x="1000" y="245">000×1000接段。900方塊先橫過原平</text><text x="1000" y="267">台，再沿左側接到新出發位。</text><text x="1000" y="301">右側下樓梯洞保留，不拿房間矩形把梯洞填平；</text><text x="1000" y="323">本輪沒有動一樓梯。</text><text x="1000" y="357">左接段下方少數左跑踏步局部最小3300mm</text><text x="1000" y="379">只來自來源步高及200mm板厚假設，不是整</text><text x="1000" y="401">座梯淨高驗收。</text><text x="1000" y="435">2F／3F上層折返平台1100mm仍只比1</text><text x="1000" y="457">000模型下限多100mm，扶手、梁板與防</text><text x="1000" y="479">火未知。</text><text x="1000" y="513">3F與RF到達後移800mm；屋頂前室／門</text><text x="1000" y="535">路要另回套，不能沿用舊passed。</text><text x="40" y="1020">上下層高仍用來源4m／3m／3m，原一樓24級、上層18級；未新增第五層，也未用陡梯或縮踏面換KTV。</text><text x="40" y="1055">樓板形狀與門檻均是新結構設計候選。上層梁板改動可能影響下層，不保證一樓施工完全不受影響。</text></svg>
