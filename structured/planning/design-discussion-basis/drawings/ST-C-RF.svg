<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1280" width="1400" height="1280" role="img" aria-label="C-RF儲藏與品名圖"><title>C-RF｜前平台防雨工具櫃</title><style>text{font-family:system-ui,sans-serif;fill:#263e49}</style><rect x="0" y="0" width="1400" height="1280" fill="#fafbf8" /><text x="28" y="40" font-size="26" font-weight="700">C-RF｜前平台防雨工具櫃</text><text x="28" y="76" font-size="16">橙色＝本輪儲藏櫃；橙虛線＝取物操作帶。編號對照名稱直接列在右側，不用滑鼠提示。</text><text x="28" y="105" font-size="16">2D提案／未併主3D。房界、原家具、衣櫃與空調尺寸保留；完成面、門組、荷重及工程待核。</text><polygon points="367.0,615.92 367.0,867.6 179.8,867.6 179.8,615.92 367.0,615.92" fill="#e9eee3" stroke="#688477" stroke-width="1" /><text x="273.4" y="741.76" font-size="11" text-anchor="middle">同軸樓梯屋突</text><line x1="179.8" y1="649.20009776" x2="179.8" y2="696.00009776" stroke="#00a3bb" stroke-width="3" /><line x1="185.0000624" y1="615.92" x2="237.0000624" y2="615.92" stroke="#00a3bb" stroke-width="3" /><line x1="185.0000624" y1="867.6" x2="237.0000624" y2="867.6" stroke="#00a3bb" stroke-width="3" /><line x1="257.79999999999995" y1="867.6" x2="289.0" y2="867.6" stroke="#164fce" stroke-width="4" /><polygon points="179.8,615.92 179.8,867.6 55.0,867.6 55.0,615.92 179.8,615.92" fill="#e9eee3" stroke="#688477" stroke-width="1" /><text x="117.4" y="741.76" font-size="11" text-anchor="middle">弱電立管／乾式</text><line x1="179.8" y1="649.20009776" x2="179.8" y2="696.00009776" stroke="#00a3bb" stroke-width="3" /><line x1="91.4" y1="867.6" x2="143.39999999999998" y2="867.6" stroke="#164fce" stroke-width="4" /><polygon points="159.0,867.6 159.0,997.5999999999999 55.0,997.5999999999999 55.0,867.6 159.0,867.6" fill="#e9eee3" stroke="#688477" stroke-width="1" /><text x="107.0" y="932.5999999999999" font-size="11" text-anchor="middle">水塔候選區</text><polygon points="263.0,867.6 263.0,997.5999999999999 159.0,997.5999999999999 159.0,867.6 263.0,867.6" fill="#e9eee3" stroke="#688477" stroke-width="1" /><text x="211.0" y="932.5999999999999" font-size="11" text-anchor="middle">加壓候選區</text><line x1="185.0" y1="867.6" x2="237.0" y2="867.6" stroke="#00a3bb" stroke-width="3" /><polygon points="367.0,867.6 367.0,997.5999999999999 263.0,997.5999999999999 263.0,867.6 367.0,867.6" fill="#e9eee3" stroke="#688477" stroke-width="1" /><text x="315.0" y="932.5999999999999" font-size="11" text-anchor="middle">熱泵候選區</text><polygon points="367.0,150.0 367.0,615.92 55.0,615.92 55.0,150.0 367.0,150.0" fill="#e9eee3" stroke="#688477" stroke-width="1" /><text x="211.0" y="382.96" font-size="11" text-anchor="middle">屋頂平台</text><line x1="185.0" y1="615.92" x2="237.0" y2="615.92" stroke="#00a3bb" stroke-width="3" /><polygon points="367.0,997.5999999999999 367.0,1066.76 55.0,1066.76 55.0,997.5999999999999 367.0,997.5999999999999" fill="#e9eee3" stroke="#688477" stroke-width="1" /><text x="211.0" y="1032.1799999999998" font-size="11" text-anchor="middle">曬衣候選區</text><rect x="179.8" y="644.0" width="46.8" height="57.199999999999996" fill="none" stroke="#7c8a92" stroke-width=".7" stroke-dasharray="3 2" /><rect x="179.8" y="820.8" width="62.4" height="46.8" fill="none" stroke="#7c8a92" stroke-width=".7" stroke-dasharray="3 2" /><rect x="133.0" y="644.0" width="46.8" height="57.199999999999996" fill="none" stroke="#7c8a92" stroke-width=".7" stroke-dasharray="3 2" /><rect x="179.8" y="867.6" width="62.4" height="46.8" fill="none" stroke="#7c8a92" stroke-width=".7" stroke-dasharray="3 2" /><rect x="179.8" y="569.12" width="62.4" height="46.8" fill="none" stroke="#7c8a92" stroke-width=".7" stroke-dasharray="3 2" /><rect x="78.4" y="904.0" width="57.199999999999996" height="57.199999999999996" fill="#b8cabd" stroke="#446952" stroke-width=".7" /><text x="107.0" y="932.5999999999999" font-size="11" text-anchor="middle">1</text><rect x="190.2" y="917.0" width="41.6" height="31.2" fill="#b8cabd" stroke="#446952" stroke-width=".7" /><text x="211.0" y="932.5999999999999" font-size="11" text-anchor="middle">2</text><rect x="291.6" y="911.8" width="46.8" height="41.6" fill="#b8cabd" stroke="#446952" stroke-width=".7" /><text x="315.0" y="932.5999999999999" font-size="11" text-anchor="middle">3</text><rect x="148.6" y="367.36" width="124.8" height="31.2" fill="#b8cabd" stroke="#446952" stroke-width=".7" /><text x="211.0" y="382.96" font-size="11" text-anchor="middle">4</text><rect x="148.6" y="1016.5799999999999" width="124.8" height="31.2" fill="#b8cabd" stroke="#446952" stroke-width=".7" /><text x="211.0" y="1032.1799999999998" font-size="11" text-anchor="middle">5</text><rect x="60.98" y="485.4" width="46.8" height="36.4" fill="none" stroke="#b75916" stroke-width="1.4" stroke-dasharray="4 3" /><rect x="60.98" y="462.0" width="46.8" height="23.4" fill="#f6bd69" stroke="#a74e19" stroke-width="1.6" data-storage-id="C-RF" /><text x="84.38" y="473.7" font-size="11" text-anchor="middle">S1</text><text x="55" y="130" font-size="16">道路／前方 ↑</text><text x="55" y="1100" font-size="12">6000×17630mm研究框；不是可建量或地籍測量</text><text x="430" y="155" font-size="21" font-weight="700">S1｜前平台防雨工具櫃</text><text x="430" y="186" font-size="16">櫃體平面 900×450mm；高900mm（提案）</text><text x="430" y="213" font-size="16">占地0.405㎡；額外占地0.405㎡</text><text x="430" y="244" font-size="16">不占屋突樓梯與乾式弱電維修區，原晾衣架保留；只存耐候備品，不能當室內乾衣／棉被儲藏室。</text><text x="430" y="350" font-size="20" font-weight="700">現有家具／設備名稱對照</text><text x="430" y="382" font-size="15">1｜1000L 水塔｜平面1100×1100mm</text><text x="430" y="407" font-size="15">2｜VF800 恆壓泵｜平面800×600mm</text><text x="430" y="432" font-size="15">3｜Haier 熱泵熱水器｜平面900×800mm</text><text x="430" y="457" font-size="15">4｜曬衣架｜平面2400×600mm</text><text x="430" y="482" font-size="15">5｜曬衣架｜平面2400×600mm</text><text x="430" y="507" font-size="15">door-approach</text><text x="430" y="532" font-size="15">door-approach</text><text x="430" y="557" font-size="15">door-approach</text><text x="430" y="582" font-size="15">door-approach</text><text x="430" y="607" font-size="15">door-approach</text><text x="28" y="1210" font-size="14">列明本體／操作／通路2D篩檢無新增衝突；不是全路線、門扇、真人、風水或施工核可。</text><text x="28" y="1238" font-size="12">來源與本批：a011d8dc173c8c71b606b55284deb716533b7dfcf4593cd04828f95f8fa21981</text><text x="28" y="1262" font-size="13">RF只放耐候用品，不新增室內房間；B折衣檯收納沿原操作帶分時，不解除原RF24㎡缺口。</text></svg>
