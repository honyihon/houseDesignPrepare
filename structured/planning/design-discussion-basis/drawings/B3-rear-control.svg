"4 3" /><line x1="158.1" y1="783.04" x2="158.1" y2="899.0" stroke="#277c79" stroke-width="1.5" stroke-dasharray="4 3" /><line x1="322.41999999999996" y1="706.6" x2="322.41999999999996" y2="783.04" stroke="#277c79" stroke-width="1.5" stroke-dasharray="4 3" /><line x1="322.41999999999996" y1="783.04" x2="322.41999999999996" y2="847.0" stroke="#277c79" stroke-width="1.5" stroke-dasharray="4 3" /><line x1="322.41999999999996" y1="847.0" x2="227.0" y2="847.0" stroke="#277c79" stroke-width="1.5" stroke-dasharray="4 3" /><line x1="227.0" y1="847.0" x2="227.0" y2="977.0" stroke="#277c79" stroke-width="1.5" stroke-dasharray="4 3" /><line x1="104.8" y1="247.95999999999998" x2="163.56" y2="247.95999999999998" stroke="#fafbf8" stroke-width="3" /><rect x="166.16" y="247.95999999999998" width="34.32" height="2.34" fill="#bb9474" stroke="#805534" stroke-width="0.6" /><rect x="166.16" y="252.38" width="34.32" height="2.34" fill="#bb9474" stroke="#805534" stroke-width="0.6" /><line x1="104.8" y1="347.79999999999995" x2="163.56" y2="347.79999999999995" stroke="#fafbf8" stroke-width="3" /><rect x="67.88" y="341.03999999999996" width="34.32" height="2.34" fill="#bb9474" stroke="#805534" stroke-width="0.6" /><rect x="67.88" y="345.46" width="34.32" height="2.34" fill="#bb9474" stroke="#805534" stroke-width="0.6" /><text x="45" y="120" class="small">前方道路／1F騎樓在此下方</text><text x="45" y="1090" class="small">6×17.63m研究框，約32地坪；不是可建量核定</text><text x="445" y="145">Q1保留原P3三樓資料；低音量／閱讀只是比較方向，不取消原20㎡KTV目標，也不承諾夜間噪音合格</text><text x="445" y="169">。</text><text x="445" y="205">後娛樂扣井14.3141㎡、後客房15.5156㎡；聲學再內縮會繼續吃面積，不能把原14㎡下限當</text><text x="445" y="229">20㎡。</text><text x="445" y="265">固定後段、115每面預算、完整乾保護室及後井，連不加客房／KTV分隔的樂觀上界也只有31.017</text><text x="445" y="289">1㎡。</text><text x="445" y="325">12客房＋20KTV共32㎡，已高於此上界；微移分隔無法在這組固定條件下解決，並非證明全棟不能換</text><text x="445" y="349">拓樸。</text><text x="445" y="385">後娛樂仍投影二樓主臥乾區9.062㎡，並與客房共牆；未壓床體不等於低頻／振動合理。</text><text x="445" y="421">三樓工作陽台尚未在Q1獨立核成完整方案；不把既有景觀、設備或屋頂曬衣直接算作已達工作陽台目標。</text><text x="445" y="457">原兩個1F搬轎入口、祭祀朝街門及乾保護範圍維持；Q1與Q2不混用面積、門位或聲學結果。</text></svg>
