 cm 淋浴區｜平面900×900mm</text><text x="430" y="657" font-size="15">hvac-service</text><text x="430" y="682" font-size="15">door-approach</text><text x="430" y="707" font-size="15">C-AC05｜冷氣室外機</text><text x="430" y="732" font-size="15">door-approach</text><text x="430" y="757" font-size="15">door-approach</text><text x="430" y="782" font-size="15">C-AC05｜冷氣室內機</text><text x="430" y="807" font-size="15">door-approach</text><text x="430" y="832" font-size="15">C-AC06｜冷氣室內機</text><text x="430" y="857" font-size="15">door-approach</text><text x="430" y="882" font-size="15">door-approach</text><text x="430" y="907" font-size="15">circulation</text><text x="430" y="932" font-size="15">door-approach</text><text x="430" y="957" font-size="15">door-approach</text><text x="430" y="982" font-size="15">door-approach</text><text x="430" y="1007" font-size="15">door-approach</text><text x="430" y="1032" font-size="15">door-approach</text><text x="430" y="1057" font-size="15">hvac-service</text><text x="430" y="1082" font-size="15">C-AC06｜冷氣室外機</text><text x="28" y="1210" font-size="14">列明本體／操作／通路2D篩檢無新增衝突；不是全路線、門扇、真人、風水或施工核可。</text><text x="28" y="1238" font-size="12">來源與本批：a011d8dc173c8c71b606b55284deb716533b7dfcf4593cd04828f95f8fa21981</text><text x="28" y="1262" font-size="13">RF只放耐候用品，不新增室內房間；B折衣檯收納沿原操作帶分時，不解除原RF24㎡缺口。</text></svg>
