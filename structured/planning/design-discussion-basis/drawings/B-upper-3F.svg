<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="P2｜前公衛＋濕茶水前室，優先核可建量｜3F"><title>P2｜前公衛＋濕茶水前室，優先核可建量｜3F</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}.room{font-size:13px;font-weight:650}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">P2｜前公衛＋濕茶水前室，優先核可建量｜3F</text><text x="28" y="76">獨立重排比較／未採用｜mm座標；前陽台改室內為重大代價，須正式建築設計，不可自行封陽台。</text><text x="28" y="1158" class="small">來源 00baf0b3950e2593…｜本批 51f8f16f8f30c82b…</text><text x="28" y="1182" class="small">指定平面幾何不等於法規／風水／照護／搬運／產品或施工核可。前排水及結構未完成；原ABC／3D保留。</text><polygon points="184.8,342.79999999999995 184.8,613.2 60.0,613.2 60.0,342.79999999999995" fill="#edf0e9" stroke="#607c73" stroke-width="1" /><text x="122.4" y="478.0" text-anchor="middle" class="room">原梯核</text><polygon points="372.0,342.79999999999995 184.8,342.79999999999995 184.8,613.2 60.0,613.2 60.0,731.24 372.0,731.24 372.0,613.2" fill="#edf0e9" stroke="#607c73" stroke-width="1" /><text x="278.4" y="478.0" text-anchor="middle" class="room">安靜起居／閱讀</text><rect x="317.4" y="436.4" width="46.8" height="93.6" fill="#b9c9be" stroke="#3c6355" stroke-width="0.8" /><rect x="247.2" y="454.59999999999997" width="31.2" height="57.199999999999996" fill="#b9c9be" stroke="#3c6355" stroke-width="0.8" /><rect x="192.6" y="462.4" width="4.16" height="52.0" fill="#b9c9be" stroke="#3c6355" stroke-width="0.8" /><line x1="278.4" y1="342.79999999999995" x2="337.15999999999997" y2="342.79999999999995" stroke="#fafbf8" stroke-width="4" /><polygon points="339.63,284.03999999999996 334.69,284.03999999999996 334.69,342.79999999999995 339.63,342.79999999999995 339.63,284.03999999999996" fill="#be987d" stroke="#875137" stroke-width="0.8" /><polygon points="302.84,731.24 302.84,814.4399999999999 197.28,814.4399999999999 197.28,731.24" fill="#edf0e9" stroke="#607c73" stroke-width="1" /><text x="250.06" y="772.8399999999999" text-anchor="middle" class="room">乾保護室</text><line x1="208.2" y1="731.24" x2="266.96" y2="731.24" stroke="#fafbf8" stroke-width="4" /><polygon points="205.73,790.0 210.67,790.0 210.67,731.24 205.73,731.24 205.73,790.0" fill="#be987d" stroke="#875137" stroke-width="0.8" /><polygon points="230.04,140.0 230.04,242.95999999999998 60.0,242.95999999999998 60.0,140.0" fill="#dceff4" stroke="#607c73" stroke-width="1" /><text x="145.01999999999998" y="191.48" text-anchor="middle" class="room">前公衛</text><rect x="65.98" y="190.18" width="46.8" height="46.8" fill="#b9c9be" stroke="#3c6355" stroke-width="0.8" /><rect x="132.8" y="145.98" width="23.4" height="36.4" fill="#b9c9be" stroke="#3c6355" stroke-width="0.8" /><rect x="192.85999999999999" y="145.98" width="31.2" height="23.4" fill="#b9c9be" stroke="#3c6355" stroke-width="0.8" /><rect x="65.98" y="145.98" width="20.8" height="20.8" fill="#ca9d8b" stroke="#9c4634" stroke-width="1" /><line x1="166.6" y1="140.0" x2="218.6" y2="140.0" stroke="#1a9ac0" stroke-width="4" /><line x1="165.04" y1="242.95999999999998" x2="223.79999999999998" y2="242.95999999999998" stroke="#fafbf8" stroke-width="4" /><polygon points="221.32999999999998,301.72 226.26999999999998,301.72 226.26999999999998,242.95999999999998 221.32999999999998,242.95999999999998 221.32999999999998,301.72" fill="#be987d" stroke="#875137" stroke-width="0.8" /><polygon points="372.0,342.79999999999995 372.0,140.0 230.04,140.0 230.04,342.79999999999995" fill="#edf0e9" stroke="#607c73" stroke-width="1" /><text x="301.02" y="241.39999999999998" text-anchor="middle" class="room">前開放帶</text><polygon points="230.04,242.95999999999998 230.04,342.79999999999995 60.0,342.79999999999995 60.0,242.95999999999998" fill="#edf0e9" stroke="#607c73" stroke-width="1" /><text x="145.01999999999998" y="292.88" text-anchor="middle" class="room">茶水／前室</text><polygon points="197.28,731.24 60.0,731.24 60.0,814.4399999999999 60.0,1056.76 210.79999999999998,1056.76 210.79999999999998,814.4399999999999 197.28,814.4399999999999" fill="#f1e7cd" stroke="#607c73" stroke-width="1" /><text x="135.39999999999998" y="935.5999999999999" text-anchor="middle" class="room">客房</text><rect x="67.8" y="925.1999999999999" width="104.0" height="93.6" fill="#b9c9be" stroke="#3c6355" stroke-width="0.8" /><rect x="67.8" y="826.4" width="31.2" height="93.6" fill="#b9c9be" stroke="#3c6355" stroke-width="0.8" /><rect x="65.98" y="814.4399999999999" width="87.61999999999999" height="5.2" fill="#b9c9be" stroke="#3c6355" stroke-width="0.8" /><line x1="73.0" y1="1056.76" x2="197.79999999999998" y2="1056.76" stroke="#1a9ac0" stroke-width="4" /><line x1="117.46000000000001" y1="731.24" x2="176.22" y2="731.24" stroke="#fafbf8" stroke-width="4" /><polygon points="114.99,790.0 119.93,790.0 119.93,731.24 114.99,731.24 114.99,790.0" fill="#be987d" stroke="#875137" stroke-width="0.8" /><polygon points="372.0,1056.76 372.0,731.24 302.84,731.24 302.84,814.4399999999999 210.79999999999998,814.4399999999999 210.79999999999998,1056.76" fill="#e8dff2" stroke="#607c73" stroke-width="1" /><text x="291.4" y="935.5999999999999" text-anchor="middle" class="room">娛樂候選</text><rect x="249.79999999999998" y="998.0" width="93.6" height="46.8" fill="#b9c9be" stroke="#3c6355" stroke-width="0.8" /><rect x="265.4" y="920.0" width="62.4" height="31.2" fill="#b9c9be" stroke="#3c6355" stroke-width="0.8" /><rect x="359.0" y="878.4" width="4.16" height="52.0" fill="#b9c9be" stroke="#3c6355" stroke-width="0.8" /><rect x="345.21999999999997" y="956.4" width="20.8" height="20.8" fill="#ca9d8b" stroke="#9c4634" stroke-width="1" /><line x1="242.0" y1="1056.76" x2="356.4" y2="1056.76" stroke="#1a9ac0" stroke-width="4" /><line x1="308.03999999999996" y1="731.24" x2="366.8" y2="731.24" stroke="#fafbf8" stroke-width="4" /><polygon points="364.33,790.0 369.27,790.0 369.27,731.24 364.33,731.24 364.33,790.0" fill="#be987d" stroke="#875137" stroke-width="0.8" /><line x1="146.83999999999997" y1="701.6" x2="146.83999999999997" y2="778.04" stroke="#3a8f78" stroke-width="1.8" stroke-dasharray="5 3" /><line x1="146.83999999999997" y1="778.04" x2="173.1" y2="778.04" stroke="#3a8f78" stroke-width="1.8" stroke-dasharray="5 3" /><line x1="173.1" y1="778.04" x2="173.1" y2="894.0" stroke="#3a8f78" stroke-width="1.8" stroke-dasharray="5 3" /><line x1="337.41999999999996" y1="701.6" x2="337.41999999999996" y2="778.04" stroke="#3a8f78" stroke-width="1.8" stroke-dasharray="5 3" /><line x1="337.41999999999996" y1="778.04" x2="337.41999999999996" y2="842.0" stroke="#3a8f78" stroke-width="1.8" stroke-dasharray="5 3" /><line x1="337.41999999999996" y1="842.0" x2="242.0" y2="842.0" stroke="#3a8f78" stroke-width="1.8" stroke-dasharray="5 3" /><line x1="242.0" y1="842.0" x2="242.0" y2="972.0" stroke="#3a8f78" stroke-width="1.8" stroke-dasharray="5 3" /><line x1="149.18" y1="368.79999999999995" x2="149.18" y2="313.41999999999996" stroke="#3a8f78" stroke-width="1.8" stroke-dasharray="5 3" /><line x1="149.18" y1="313.41999999999996" x2="194.42" y2="313.41999999999996" stroke="#3a8f78" stroke-width="1.8" stroke-dasharray="5 3" /><line x1="194.42" y1="313.41999999999996" x2="194.42" y2="274.41999999999996" stroke="#3a8f78" stroke-width="1.8" stroke-dasharray="5 3" /><line x1="194.42" y1="274.41999999999996" x2="194.42" y2="213.57999999999998" stroke="#3a8f78" stroke-width="1.8" stroke-dasharray="5 3" /><line x1="194.42" y1="213.57999999999998" x2="130.98" y2="213.57999999999998" stroke="#3a8f78" stroke-width="1.8" stroke-dasharray="5 3" /><text x="216.0" y="121.8" text-anchor="middle">道路／前方</text><text x="60.0" y="1081.1999999999998" class="small">6000 × 17630mm；1F騎樓前帶不改</text><text x="440" y="145">安靜起居／閱讀，禁睡及高活動：29.2948㎡（115mm假設）</text><text x="440" y="183">前側有窗公衛：5.1600㎡（115mm假設）</text><text x="440" y="221">乾式前室／工作預留：5.1376㎡（115mm假設）</text><text x="440" y="259">後左客房／乾擋板：15.5156㎡（115mm假設）</text><text x="440" y="297">後右娛樂候選（低於20㎡目標）：14.3141㎡（115mm假設）</text><text x="440" y="335">指定115mm假設與0.16㎡管井預算下，20／5／6㎡及茶水5㎡有幾何餘量；代價是</text><text x="440" y="361">前側新增12.753㎡室內輪廓、陽台與室外機重排，合法性／前排水仍未核。</text><text x="440" y="399">藍色為候選濕區、米色為睡眠乾區、紫色為娛樂候選；虛線只是列明方塊試線。</text><text x="440" y="437">所有濕／睡眠／高活動輪廓避開名義神明堂及乾背櫃；濕區另避武轎庫。管線、牆體及振動未核</text><text x="440" y="463">，不能稱全案風水通過。</text><text x="440" y="501">公衛朝前、套衛朝後，側界未畫假窗。公衛框線只代表候選直接外口；獨排補氣、防雨隱私與有</text><text x="440" y="527">效開口待核。</text><text x="440" y="565">門畫全開，半開及關閉仍可能阻路。梯廳新接茶水前室是否需門，及原1000門能否達900</text><text x="440" y="591">淨寬，均未核。</text><text x="440" y="629">娛樂區扣0.16㎡後通氣井僅14.3141㎡，低於原20㎡目標。若聲學構造再吃面積，</text><text x="440" y="655">14㎡下限也可能不成立；與客房共牆及法器櫃振動待評。</text><text x="440" y="693">客房床頭靠左實牆，100mm乾擋板阻中軸視線；床尾約635mm，未當700mm全環繞</text><text x="440" y="719">或照護空間。</text><text x="440" y="757">娛樂區仍投影二樓主臥乾區9.0620㎡；即使未壓床體，也不是夜間隔音／振動成立。</text></svg>
