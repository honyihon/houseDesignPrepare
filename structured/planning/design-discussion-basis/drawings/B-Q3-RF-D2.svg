y1="805.4" x2="219.98" y2="1023.28" stroke="#9b753f" stroke-width="1.1" stroke-dasharray="4 3" /><text x="45" y="125" class="small">綠：日常由前門／棕：必要巡檢依門路表</text><text x="45" y="1090" class="small">整個梯核不能鋪實心地板</text><text x="445" y="145">新到達平台y4770，前室接回前門與原研究RF側門y4400。外框不擴大，RF側門不必僅因改梯後</text><text x="445" y="168">移；不是現場開洞許可。</text><text x="445" y="203">全寬2200×1000平台、2170×755前室及門檻是新結構條件；保2200×3260後梯井，</text><text x="445" y="226">不蓋三樓上來的踏步。</text><text x="445" y="261">日常700／800／900試線不進祭祀保護投影，前門全開才通；900扣框預算無工差，不當實際或輪</text><text x="445" y="284">椅核可。</text><text x="445" y="319">後設備巡檢接原側門，前熱泵改由前門避晾衣架；700試線不代表整機搬運，須各自門全開才通。</text><text x="445" y="354">S1／S2設備及D1／D2桌架原位保留；D1折衣分時、D2後設備緊。香火、一般新風、浴廁及污水通</text><text x="445" y="377">氣仍分系統。</text><text x="445" y="412">前平台設備／門後輪廓17.1090㎡、再扣桌架15.4890㎡均含通路。24㎡目標未達、不把室內</text><text x="445" y="435">前室計入。</text><text x="445" y="470">RF前室位於Q3 KTV凹部上方，腳步、門振動與樓板聲學未核。Q3的20.1889㎡只是指定預算</text><text x="445" y="493">，150mm厚度等仍不足20。</text><text x="445" y="528">原P3前排水、R1防水／乾衣及RF全部性能未解。本圖只補同版接法，原梯屋頂比較不被覆寫或套新pa</text><text x="445" y="551">ssed。</text></svg>
