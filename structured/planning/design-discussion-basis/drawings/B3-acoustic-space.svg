<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="B3｜面積與聲學空間敏感度，沒有dB承諾"><title>B3｜面積與聲學空間敏感度，沒有dB承諾</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}.room{font-size:13px;font-weight:650}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">B3｜面積與聲學空間敏感度，沒有dB承諾</text><text x="28" y="76">獨立比較／未採用｜前量體、隔音、新風、RF天井與機位未核；原ABC／3D及P1／P2／P3保留。</text><text x="28" y="1158" class="small">本批來源 73787cd11a2b56a9db15bcef7082d1a233940d104c5ff5976108a68128bc8e5c</text><text x="28" y="1182" class="small">僅指定模型的幾何／算式，不代表聲學、產品、法規、風水、消防、搬運或施工核可。</text><text x="35" y="135">額外內縮是每一面再加；基準已115mm。只算平面損失，牆地天花、門窗、消音和實際效果未選定。</text><text x="40" y="195">配置</text><text x="230" y="195">每面額外mm</text><text x="450" y="195">扣井後㎡</text><text x="650" y="195">20目標</text><text x="850" y="195">14下限</text><text x="1060" y="195">原候選家具</text><text x="40" y="245">原後段</text><text x="230" y="245">0</text><text x="450" y="245">14.3141</text><text x="650" y="245">未達</text><text x="850" y="245">算術達標</text><text x="1060" y="245">本假設容納</text><text x="40" y="286">原後段</text><text x="230" y="286">50</text><text x="450" y="286">13.4541</text><text x="650" y="286">未達</text><text x="850" y="286">未達</text><text x="1060" y="286">本假設容納</text><text x="40" y="327">原後段</text><text x="230" y="327">100</text><text x="450" y="327">12.6141</text><text x="650" y="327">未達</text><text x="850" y="327">未達</text><text x="1060" y="327">需調整</text><text x="40" y="368">原後段</text><text x="230" y="368">150</text><text x="450" y="368">11.7941</text><text x="650" y="368">未達</text><text x="850" y="368">未達</text><text x="1060" y="368">需調整</text><text x="40" y="409">原後段</text><text x="230" y="409">200</text><text x="450" y="409">10.9941</text><text x="650" y="409">未達</text><text x="850" y="409">未達</text><text x="1060" y="409">需調整</text><text x="40" y="450">新前側</text><text x="230" y="450">0</text><text x="450" y="450">21.0159</text><text x="650" y="450">算術達標</text><text x="850" y="450">算術達標</text><text x="1060" y="450">本假設容納</text><text x="40" y="491">新前側</text><text x="230" y="491">50</text><text x="450" y="491">20.1019</text><text x="650" y="491">算術達標</text><text x="850" y="491">算術達標</text><text x="1060" y="491">本假設容納</text><text x="40" y="532">新前側</text><text x="230" y="532">100</text><text x="450" y="532">19.2079</text><text x="650" y="532">未達</text><text x="850" y="532">算術達標</text><text x="1060" y="532">本假設容納</text><text x="40" y="573">新前側</text><text x="230" y="573">150</text><text x="450" y="573">18.3339</text><text x="650" y="573">未達</text><text x="850" y="573">算術達標</text><text x="1060" y="573">需調整</text><text x="40" y="614">新前側</text><text x="230" y="614">200</text><text x="450" y="614">17.4799</text><text x="650" y="614">未達</text><text x="850" y="614">算術達標</text><text x="1060" y="614">需調整</text><text x="35" y="680">固定後段樂觀上界31.0171㎡，已短於12＋20目標0.9829㎡；還沒扣新增分隔／走道／隔音。</text><text x="35" y="715">新前側維持20㎡時，額外四面內縮容許量約55.6mm／面；不是可指定產品厚度或聲學規格。</text><text x="35" y="750">50mm案例20.1019㎡不代表50mm材料就能唱歌；若實際需要100mm，本模型只有19.2079㎡，原20需求仍保留待取捨。</text><text x="35" y="785">前置活動不壓2F主臥／床體；仍可能經門、窗、風管及梁板傳聲。關門新風需核風量、消音、壓損、檢修，與香火／浴廁分系統。</text><text x="35" y="820">次序：先核合法量體／屋頂改動，再由聲學、建築、機電用實際包絡回套面積與費用；資料不足前不選最薄值當通過。</text></svg>
