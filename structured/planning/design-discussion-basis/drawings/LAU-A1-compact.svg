<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="A一樓原陽台轉向洗衣／不減廚房"><title>A一樓原陽台轉向洗衣／不減廚房</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}.room{font-size:11px}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">A一樓原陽台轉向洗衣／不減廚房</text><text x="28" y="78">獨立預先規劃／未採用｜橙：安裝備位；綠：晾衣含衣物外廓；虛線：操作預算，不是實品門片或完整通路。</text><text x="28" y="106">圖內尺寸mm；三棟共享到達、產品、噪音、防水、排水及專業核對待資料。原ABC、3D與已驗ZIP不改。</text><text x="28" y="1157" class="small">本批 4d78d285e0efe2623261cb86418c5a0c1b3585fea693ebdc816f8a79d4cec45e</text><text x="28" y="1183" class="small">局部矩形／路徑不當輪椅、風水、法規或施工核可；未啟動瀏覽器或點陣轉圖。</text><rect x="40.0" y="346.6" width="95.03999999999999" height="87.11999999999999" fill="#eaf0e9" stroke="#91a298" stroke-width="0.7" /><text x="87.52" y="390.15999999999997" text-anchor="middle" class="room">公共玄關</text><rect x="135.04" y="346.6" width="168.95999999999998" height="222.28799999999998" fill="#eaf0e9" stroke="#91a298" stroke-width="0.7" /><text x="219.51999999999998" y="457.74399999999997" text-anchor="middle" class="room">客餐</text><rect x="260.88" y="478.16175999999996" width="39.599999999999994" height="79.20000000000003" fill="#aabdb3" stroke="#5e7f71" stroke-width="0.5" /><rect x="138.56" y="490.70176" width="3.5199999999999996" height="54.12000000000004" fill="#aabdb3" stroke="#5e7f71" stroke-width="0.5" /><rect x="223.53279999999998" y="373.6864" width="52.8" height="79.19999999999999" fill="#aabdb3" stroke="#5e7f71" stroke-width="0.5" /><rect x="139.0528" y="350.12" width="52.8" height="15.399999999999999" fill="#aabdb3" stroke="#5e7f71" stroke-width="0.5" /><rect x="40.0" y="609.72" width="59.839999999999996" height="95.91999999999999" fill="#eaf0e9" stroke="#91a298" stroke-width="0.7" /><text x="69.92" y="657.68" text-anchor="middle" class="room">MDF備援／未釋放</text><rect x="56.72" y="650.64" width="26.4" height="26.4" fill="#aabdb3" stroke="#5e7f71" stroke-width="0.5" /><rect x="40.0" y="433.71999999999997" width="95.03999999999999" height="176.0" fill="#eaf0e9" stroke="#91a298" stroke-width="0.7" /><text x="87.52" y="521.72" text-anchor="middle" class="room">樓梯</text><rect x="194.88" y="568.8879999999999" width="109.11999999999999" height="136.75199999999998" fill="#eaf0e9" stroke="#91a298" stroke-width="0.7" /><text x="249.44" y="637.2639999999999" text-anchor="middle" class="room">照護公衛</text><rect x="280.67999999999995" y="572.4079999999999" width="19.799999999999997" height="26.4" fill="#aabdb3" stroke="#5e7f71" stroke-width="0.5" /><rect x="269.67999999999995" y="609.5862399999999" width="30.799999999999997" height="19.799999999999997" fill="#aabdb3" stroke="#5e7f71" stroke-width="0.5" /><rect x="199.0336" y="649.3199999999999" width="52.799999999999976" height="52.8" fill="#aabdb3" stroke="#5e7f71" stroke-width="0.5" /><rect x="40.0" y="705.64" width="105.6" height="165.88" fill="#eaf0e9" stroke="#91a298" stroke-width="0.7" /><text x="92.8" y="788.5799999999999" text-anchor="middle" class="room">廚房</text><rect x="43.519999999999996" y="709.16" width="26.4" height="105.6" fill="#aabdb3" stroke="#5e7f71" stroke-width="0.5" /><rect x="111.28" y="747.198" width="30.799999999999997" height="33.0" fill="#aabdb3" stroke="#5e7f71" stroke-width="0.5" /><rect x="145.6" y="705.64" width="158.39999999999998" height="165.88" fill="#eaf0e9" stroke="#91a298" stroke-width="0.7" /><text x="224.79999999999998" y="788.5799999999999" text-anchor="middle" class="room">孝親房</text><rect x="151.76" y="785.28" width="66.88" height="82.72" fill="#aabdb3" stroke="#5e7f71" stroke-width="0.5" /><rect x="193.648" y="709.16" width="52.8" height="26.4" fill="#aabdb3" stroke="#5e7f71" stroke-width="0.5" /><rect x="40.0" y="871.52" width="264.0" height="79.19999999999999" fill="#eaf0e9" stroke="#91a298" stroke-width="0.7" /><text x="172.0" y="911.12" text-anchor="middle" class="room">後工作陽台</text><rect x="170.9" y="875.04" width="28.599999999999998" height="28.599999999999998" fill="#aabdb3" stroke="#5e7f71" stroke-width="0.5" /><rect x="43.519999999999996" y="875.04" width="39.599999999999994" height="28.599999999999998" fill="#aabdb3" stroke="#5e7f71" stroke-width="0.5" /><rect x="40.0" y="175.0" width="264.0" height="171.6" fill="#eaf0e9" stroke="#91a298" stroke-width="0.7" /><text x="172.0" y="260.8" text-anchor="middle" class="room">騎樓不放設備</text><rect x="135.04" y="568.8879999999999" width="59.839999999999996" height="46.111999999999995" fill="#eaf0e9" stroke="#91a298" stroke-width="0.7" /><text x="164.95999999999998" y="591.944" text-anchor="middle" class="room">照護通道</text><rect x="99.84" y="615.0" width="95.03999999999999" height="90.64" fill="#eaf0e9" stroke="#91a298" stroke-width="0.7" /><text x="147.36" y="660.3199999999999" text-anchor="middle" class="room">公共乾區</text><text x="40" y="150">來源A一樓；前方在上</text><text x="40" y="990" class="small">原分區與尺寸只供上下文</text><text x="40" y="1012" class="small">不畫跨棟或穿共壁捷徑</text><rect x="187.39999999999998" y="876.5799999999999" width="37.4" height="33.0" fill="#f2b668" stroke="#935b21" stroke-width="0.7" /><rect x="187.39999999999998" y="912.66" width="37.4" height="33.0" fill="#f2b668" stroke="#935b21" stroke-width="0.7" /><rect x="84.0" y="921.4599999999999" width="52.8" height="22.0" fill="#cce5c4" stroke="#935b21" stroke-width="0.7" /><rect x="470.0" y="286.25" width="750.0" height="225.0" fill="#edf0e9" stroke="#607c73" stroke-width="1" /><rect x="1028.75" y="330.0" width="112.5" height="168.75" fill="#d1d9d4" stroke="#7c897d" stroke-width="1" stroke-dasharray="4 3" /><rect x="620.0" y="286.25" width="137.5" height="112.5" fill="none" stroke="#7c897d" stroke-width="1" stroke-dasharray="4 3" /><rect x="480.0" y="296.25" width="112.5" height="81.25" fill="#d1d9d4" stroke="#7c897d" stroke-width="1" stroke-dasharray="4 3" /><rect x="888.75" y="300.625" width="106.25" height="93.75" fill="#f2b668" stroke="#935b21" stroke-width="1" /><text x="941.875" y="347.5" text-anchor="middle" class="small">共用洗衣備位</text><rect x="888.75" y="403.125" width="106.25" height="93.75" fill="#f2b668" stroke="#935b21" stroke-width="1" /><text x="941.875" y="450.0" text-anchor="middle" class="small">乾衣備位</text><rect x="595.0" y="428.125" width="150.0" height="62.5" fill="#cce5c4" stroke="#935b21" stroke-width="1" /><text x="670.0" y="459.375" text-anchor="middle" class="small">降下晾衣外廓</text><rect x="751.25" y="300.625" width="137.5" height="112.5" fill="none" stroke="#a76e38" stroke-dasharray="5 3" stroke-width="1" /><rect x="751.25" y="384.375" width="137.5" height="112.5" fill="none" stroke="#a76e38" stroke-dasharray="5 3" stroke-width="1" /><rect x="595.0" y="328.125" width="150.0" height="100.0" fill="none" stroke="#a76e38" stroke-dasharray="5 3" stroke-width="1" /><rect x="651.25" y="304.375" width="187.5" height="187.5" fill="none" stroke="#286a84" stroke-dasharray="7 4" stroke-width="1.5" /><line x1="688.75" y1="357.5" x2="820.0" y2="357.5" stroke="#348468" stroke-width="2.3" /><text x="470" y="575" class="small">右側灰框：原冷氣維修；門前灰虛框：沿來源或另列改位預算</text><text x="470" y="146">後陽台局部｜6m研究寬；不是核定可建量</text><text x="440" y="620">先保原陽台與廚房，不稱已完成輪椅洗衣區。晾衣降下會占1500轉位的一部分；同時乾衣機操作與洗衣操作分時，實際門</text><text x="440" y="643">片與機器拆換待核。</text><text x="440" y="678">優先續研，不減廚房。藍色1500方格碰降下衣物外廓；只在完全收起條件下局部不碰，本輪未核收起淨高或真實產品。</text><text x="440" y="713">洗衣／可選乾衣機安裝包絡各850×750；機器朝左，不是商品尺寸，操作帶與門片／接管需依實機重核。</text><text x="440" y="748">1200×500晾衣外廓含衣物預算；降到可及高度，不站椅子、不跨濕地。容量未證三戶足夠，雨天乾衣／獨排補氣另核</text><text x="440" y="771">。</text><text x="440" y="806">兩個A一樓900名義門，總框230假設只剩670；公共乾區與廚房共邊1040，不能直接硬放1130／1200洞</text><text x="440" y="829">。</text><text x="440" y="864">洗衣與乾衣操作帶共用，單人分時；900方塊只核陽台內列明路徑。三棟共享通路尚無總平面，不當完整照護可達。</text><text x="440" y="899">機器鄰孝親房，須核噪音／振動、止水、合法污水、防水、地排及設備維修。原三棟人流、B祭祀搬轎均不改。</text></svg>
