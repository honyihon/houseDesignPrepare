<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1280" width="1400" height="1280" role="img" aria-label="B-RF-D2儲藏與品名圖"><title>B-RF-D2｜折衣桌下防雨收納工作檯</title><style>text{font-family:system-ui,sans-serif;fill:#263e49}</style><rect x="0" y="0" width="1400" height="1280" fill="#fafbf8" /><text x="28" y="40" font-size="26" font-weight="700">B-RF-D2｜折衣桌下防雨收納工作檯</text><text x="28" y="76" font-size="16">橙色＝本輪儲藏櫃；橙虛線＝取物操作帶。編號對照名稱直接列在右側，不用滑鼠提示。</text><text x="28" y="105" font-size="16">2D提案／未併主3D。房界、原家具、衣櫃與空調尺寸保留；完成面、門組、荷重及工程待核。</text><polygon points="55.0,150.0 367.0,150.0 367.0,352.79999999999995 55.0,352.79999999999995" fill="#e9eee3" stroke="#688477" stroke-width="1" /><text x="211.0" y="251.39999999999998" font-size="11" text-anchor="middle">RF平台</text><line x1="114.8" y1="352.79999999999995" x2="173.56" y2="352.79999999999995" stroke="#00a3bb" stroke-width="3" /><rect x="248.17999999999998" y="904.0" width="92.03999999999999" height="88.39999999999999" fill="none" stroke="#7c8a92" stroke-width=".7" stroke-dasharray="3 2" /><rect x="248.17999999999998" y="995.78" width="104.0" height="65.0" fill="none" stroke="#7c8a92" stroke-width=".7" stroke-dasharray="3 2" /><rect x="107.78" y="862.4" width="72.8" height="93.6" fill="none" stroke="#7c8a92" stroke-width=".7" stroke-dasharray="3 2" /><rect x="60.98" y="228.78" width="36.4" height="36.4" fill="none" stroke="#7c8a92" stroke-width=".7" stroke-dasharray="3 2" /><rect x="340.21999999999997" y="966.4" width="20.8" height="20.8" fill="none" stroke="#7c8a92" stroke-width=".7" stroke-dasharray="3 2" /><rect x="225.04" y="155.98" width="46.8" height="70.2" fill="none" stroke="#7c8a92" stroke-width=".7" stroke-dasharray="3 2" /><rect x="314.21999999999997" y="155.98" width="46.8" height="70.2" fill="none" stroke="#7c8a92" stroke-width=".7" stroke-dasharray="3 2" /><rect x="248.17999999999998" y="830.42" width="46.8" height="70.2" fill="none" stroke="#7c8a92" stroke-width=".7" stroke-dasharray="3 2" /><rect x="314.21999999999997" y="830.42" width="46.8" height="70.2" fill="none" stroke="#7c8a92" stroke-width=".7" stroke-dasharray="3 2" /><rect x="55.0" y="352.79999999999995" width="124.8" height="270.4" fill="none" stroke="#7c8a92" stroke-width=".7" stroke-dasharray="3 2" /><rect x="276.0" y="239.44" width="31.2" height="93.6" fill="#b8cabd" stroke="#446952" stroke-width=".7" /><text x="291.6" y="286.24" font-size="11" text-anchor="middle">1</text><rect x="60.98" y="179.38" width="62.4" height="36.4" fill="none" stroke="#b75916" stroke-width="1.4" stroke-dasharray="4 3" /><rect x="60.98" y="155.98" width="62.4" height="23.4" fill="#f6bd69" stroke="#a74e19" stroke-width="1.6" data-storage-id="B-RF-D2" /><text x="92.18" y="167.68" font-size="11" text-anchor="middle">S1</text><text x="55" y="130" font-size="16">道路／前方 ↑</text><text x="55" y="1100" font-size="12">6000×17630mm研究框；不是可建量或地籍測量</text><text x="430" y="155" font-size="21" font-weight="700">S1｜折衣桌下防雨收納工作檯</text><text x="430" y="186" font-size="16">櫃體平面 1200×450mm；高900mm（提案）</text><text x="430" y="213" font-size="16">占地0.540㎡；額外占地0.000㎡</text><text x="430" y="244" font-size="16">D2保留自己的桌位與操作帶，獨立列櫃，不把D1位置借過來；耐候、錨定、荷重與實際桌高另核</text><text x="430" y="269" font-size="16">。</text><text x="430" y="350" font-size="20" font-weight="700">現有家具／設備名稱對照</text><text x="430" y="382" font-size="15">1｜同1800×600移動晾衣架試排｜平面600×1800mm</text><text x="430" y="407" font-size="15">水塔／泵浦整組預留</text><text x="430" y="432" font-size="15">熱泵整組預留</text><text x="430" y="457" font-size="15">後浴廁空氣出口區／非污水通氣</text><text x="430" y="482" font-size="15">前污氣出口協調區</text><text x="430" y="507" font-size="15">後400污水通氣井投影</text><text x="430" y="532" font-size="15">representative-slot-1｜冷氣室外機及維修預留（非新購台數）</text><text x="430" y="557" font-size="15">representative-slot-2｜冷氣室外機及維修預留（非新購台數）</text><text x="430" y="582" font-size="15">B-AC03｜冷氣室外機及維修預留（非新購台數）</text><text x="430" y="607" font-size="15">B-AC04｜冷氣室外機及維修預留（非新購台數）</text><text x="430" y="632" font-size="15">樓梯屋突／保留樓梯洞</text><text x="28" y="1210" font-size="14">列明本體／操作／通路2D篩檢無新增衝突；不是全路線、門扇、真人、風水或施工核可。</text><text x="28" y="1238" font-size="12">來源與本批：a011d8dc173c8c71b606b55284deb716533b7dfcf4593cd04828f95f8fa21981</text><text x="28" y="1262" font-size="13">RF只放耐候用品，不新增室內房間；B折衣檯收納沿原操作帶分時，不解除原RF24㎡缺口。</text></svg>
