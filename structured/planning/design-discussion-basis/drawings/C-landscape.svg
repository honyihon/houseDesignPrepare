<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" width="1400" height="1100" role="img" aria-labelledby="title desc"><title id="title">C02｜9㎡景觀與高位冷媒：原案／植栽改位／左繞</title><desc id="desc">ABC獨立深化比較，未採用。毫米局部模型座標，道路在上方；完整門組、結構及專業核對未完成。</desc><style>text{font-family:system-ui,sans-serif;font-size:17px;fill:#263e49} .title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:650}.small{font-size:14px}.tiny{font-size:12px}</style><rect x="0" y="0" width="1400" height="1100" fill="#fafbf8" /><text x="30" y="42" class="title">C02｜9㎡景觀與高位冷媒：原案／植栽改位／左繞</text><text x="30" y="78">深化比較／未採用｜單位mm；來源是概念模型，梁柱、完成面、商品及實際路徑待核。</text><text x="30" y="1053" class="small">來源 bc1e2175f13cff04…｜本批 dfde40d73ebcd01b…</text><text x="30" y="1077" class="small">原ABC／目前3D及正式產品回覆保留。圖上名義尺寸與方塊試排，不等於施工、照護、風水或搬運核可。</text><metadata>{"source_sha256": "bc1e2175f13cff043deeb725e190a3b59908810f58661d9efadec05efbca9a5e", "report_hash": "dfde40d73ebcd01bb0abd0839759b83ffd593a6146ef7f46ec013e53a1a69c6c", "adopted": false}</metadata><text x="30" y="117">三案均保留原覆土面積與洗衣、洗槽、上鎖櫃、240cm晾衣設備。高位線不是地面障礙。</text><text x="30" y="157" class="label">原線／原植栽（保留對照）</text><rect x="30.0" y="200.0" width="402.0" height="261.3" fill="#eee9d8" stroke="#9bada6" stroke-width="0.8" /><rect x="83.6" y="207.705" width="43.550000000000004" height="43.550000000000004" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><rect x="37.705" y="292.795" width="40.2" height="160.8" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><rect x="130.5" y="207.705" width="40.2" height="40.2" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><rect x="174.05" y="207.705" width="40.2" height="30.150000000000002" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><line x1="348.250134" y1="461.3" x2="408.550134" y2="461.3" stroke="#397e70" stroke-width="3" /><rect x="366.34000000000003" y="206.7" width="60.300000000000004" height="23.450000000000003" fill="#a4bfce" stroke="#6f91a0" data-element-kind="outdoor-unit-footprint" /><rect x="220.95000000000002" y="206.7" width="60.300000000000004" height="23.450000000000003" fill="#a4bfce" stroke="#6f91a0" data-element-kind="outdoor-unit-footprint" /><rect x="287.95" y="206.7" width="60.300000000000004" height="23.450000000000003" fill="#a4bfce" stroke="#6f91a0" data-element-kind="outdoor-unit-footprint" /><rect x="164.0" y="310.55" width="268.0" height="150.75" fill="#d5e8cb" fill-opacity="0.7" stroke="#5f8d59" /><rect x="171.705" y="318.255" width="252.59" height="60.300000000000004" fill="#b0cda2" stroke="#5a855b" /><circle cx="203.53" cy="348.405" r="6" fill="#3c7548" /><circle cx="203.53" cy="348.405" r="40.2" fill="none" stroke="#79a56d" stroke-dasharray="3 3" /><text x="195.53" y="374.405" class="tiny">T1</text><circle cx="266.51" cy="348.405" r="6" fill="#3c7548" /><circle cx="266.51" cy="348.405" r="40.2" fill="none" stroke="#79a56d" stroke-dasharray="3 3" /><text x="258.51" y="374.405" class="tiny">T2</text><circle cx="329.49" cy="348.405" r="6" fill="#3c7548" /><circle cx="329.49" cy="348.405" r="40.2" fill="none" stroke="#79a56d" stroke-dasharray="3 3" /><text x="321.49" y="374.405" class="tiny">T3</text><circle cx="392.47" cy="348.405" r="6" fill="#3c7548" /><circle cx="392.47" cy="348.405" r="40.2" fill="none" stroke="#79a56d" stroke-dasharray="3 3" /><text x="384.47" y="374.405" class="tiny">T4</text><polyline points="328.15000000000003,461.3 328.15000000000003,218.425 396.49,218.425 396.49,218.425" fill="none" stroke="#276f9c" stroke-width="3" /><text x="30" y="540" class="small">AC01估長 15.495m（含1m預留）。</text><text x="30" y="574" class="small">較原線 +0m。</text><text x="30" y="608" class="small">最近樹中心投影 20mm。</text><text x="30" y="642" class="small">樹冠半徑600＋75管束＋100預留：</text><text x="30" y="676" class="small">投影餘量 -755mm。</text><text x="490" y="157" class="label">P1調植栽位置、保留原線</text><rect x="490.0" y="200.0" width="402.0" height="261.3" fill="#eee9d8" stroke="#9bada6" stroke-width="0.8" /><rect x="543.6" y="207.705" width="43.550000000000004" height="43.550000000000004" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><rect x="497.705" y="292.795" width="40.2" height="160.8" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><rect x="590.5" y="207.705" width="40.2" height="40.2" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><rect x="634.05" y="207.705" width="40.2" height="30.150000000000002" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><line x1="808.250134" y1="461.3" x2="868.5501340000001" y2="461.3" stroke="#397e70" stroke-width="3" /><rect x="826.34" y="206.7" width="60.300000000000004" height="23.450000000000003" fill="#a4bfce" stroke="#6f91a0" data-element-kind="outdoor-unit-footprint" /><rect x="680.95" y="206.7" width="60.300000000000004" height="23.450000000000003" fill="#a4bfce" stroke="#6f91a0" data-element-kind="outdoor-unit-footprint" /><rect x="747.95" y="206.7" width="60.300000000000004" height="23.450000000000003" fill="#a4bfce" stroke="#6f91a0" data-element-kind="outdoor-unit-footprint" /><rect x="624.0" y="310.55" width="268.0" height="150.75" fill="#d5e8cb" fill-opacity="0.7" stroke="#5f8d59" /><rect x="631.705" y="318.255" width="252.59" height="60.300000000000004" fill="#b0cda2" stroke="#5a855b" /><circle cx="658.84" cy="348.405" r="6" fill="#3c7548" /><circle cx="658.84" cy="348.405" r="40.2" fill="none" stroke="#79a56d" stroke-dasharray="3 3" /><text x="650.84" y="374.405" class="tiny">T1</text><circle cx="713.78" cy="348.405" r="6" fill="#3c7548" /><circle cx="713.78" cy="348.405" r="40.2" fill="none" stroke="#79a56d" stroke-dasharray="3 3" /><text x="705.78" y="374.405" class="tiny">T2</text><circle cx="820.31" cy="348.405" r="6" fill="#3c7548" /><circle cx="820.31" cy="348.405" r="40.2" fill="none" stroke="#79a56d" stroke-dasharray="3 3" /><text x="812.31" y="374.405" class="tiny">T3</text><circle cx="868.55" cy="348.405" r="6" fill="#3c7548" /><circle cx="868.55" cy="348.405" r="40.2" fill="none" stroke="#79a56d" stroke-dasharray="3 3" /><text x="860.55" y="374.405" class="tiny">T4</text><polyline points="788.1500000000001,461.3 788.1500000000001,218.425 856.49,218.425 856.49,218.425" fill="none" stroke="#276f9c" stroke-width="3" /><text x="490" y="540" class="small">AC01估長 15.495m（含1m預留）。</text><text x="490" y="574" class="small">較原線 +0m。</text><text x="490" y="608" class="small">最近樹中心投影 480mm。</text><text x="490" y="642" class="small">樹冠半徑600＋75管束＋100預留：</text><text x="490" y="676" class="small">投影餘量 -295mm。</text><text x="950" y="157" class="label">P2原植栽、高位線左繞（優先核）</text><rect x="950.0" y="200.0" width="402.0" height="261.3" fill="#eee9d8" stroke="#9bada6" stroke-width="0.8" /><rect x="1003.6" y="207.705" width="43.550000000000004" height="43.550000000000004" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><rect x="957.705" y="292.795" width="40.2" height="160.8" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><rect x="1050.5" y="207.705" width="40.2" height="40.2" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><rect x="1094.05" y="207.705" width="40.2" height="30.150000000000002" fill="#bfc9c6" stroke="#7e9390" stroke-width="0.8" /><line x1="1268.250134" y1="461.3" x2="1328.550134" y2="461.3" stroke="#397e70" stroke-width="3" /><rect x="1286.3400000000001" y="206.7" width="60.300000000000004" height="23.450000000000003" fill="#a4bfce" stroke="#6f91a0" data-element-kind="outdoor-unit-footprint" /><rect x="1140.95" y="206.7" width="60.300000000000004" height="23.450000000000003" fill="#a4bfce" stroke="#6f91a0" data-element-kind="outdoor-unit-footprint" /><rect x="1207.95" y="206.7" width="60.300000000000004" height="23.450000000000003" fill="#a4bfce" stroke="#6f91a0" data-element-kind="outdoor-unit-footprint" /><rect x="1084.0" y="310.55" width="268.0" height="150.75" fill="#d5e8cb" fill-opacity="0.7" stroke="#5f8d59" /><rect x="1091.705" y="318.255" width="252.59" height="60.300000000000004" fill="#b0cda2" stroke="#5a855b" /><circle cx="1123.53" cy="348.405" r="6" fill="#3c7548" /><circle cx="1123.53" cy="348.405" r="40.2" fill="none" stroke="#79a56d" stroke-dasharray="3 3" /><text x="1115.53" y="374.405" class="tiny">T1</text><circle cx="1186.51" cy="348.405" r="6" fill="#3c7548" /><circle cx="1186.51" cy="348.405" r="40.2" fill="none" stroke="#79a56d" stroke-dasharray="3 3" /><text x="1178.51" y="374.405" class="tiny">T2</text><circle cx="1249.49" cy="348.405" r="6" fill="#3c7548" /><circle cx="1249.49" cy="348.405" r="40.2" fill="none" stroke="#79a56d" stroke-dasharray="3 3" /><text x="1241.49" y="374.405" class="tiny">T3</text><circle cx="1312.47" cy="348.405" r="6" fill="#3c7548" /><circle cx="1312.47" cy="348.405" r="40.2" fill="none" stroke="#79a56d" stroke-dasharray="3 3" /><text x="1304.47" y="374.405" class="tiny">T4</text><polyline points="1248.15,461.3 1248.15,441.20000000000005 1067.25,441.20000000000005 1067.25,218.425 1316.49,218.425 1316.49,218.425" fill="none" stroke="#276f9c" stroke-width="3" /><text x="1070.6" y="421.1" class="tiny">+6350候選線</text><text x="950" y="540" class="small">AC01估長 20.895m（含1m預留）。</text><text x="950" y="574" class="small">較原線 +5.4m。</text><text x="950" y="608" class="small">最近樹中心投影 840mm。</text><text x="950" y="642" class="small">樹冠半徑600＋75管束＋100預留：</text><text x="950" y="676" class="small">投影餘量 +65mm。</text><text x="30" y="800">P2優先核：保原植栽、管線增加5.4m至20.895m。最大20m的候選不能硬套，應另找合負荷與管長的精確配對。</text><text x="30" y="837">P1最近480mm只對較小冠幅敏感度有餘量；未選定樹種，不能要求永久修剪成假定大小。</text><text x="30" y="874">圖中虛圓是假設600半徑的投影提醒，並非成熟樹冠或法規覆蓋率；4株木本／一株至少1200mm的要求仍保留。</text><text x="30" y="911">AC03原線距原樹中心230mm，AC07原線170mm，也須同步協調；本圖沒有把三套冷媒塞進同一150mm束。</text><text x="30" y="948">前排淺藍為室外機投影；高位線不等同地面穿過機身。土深荷重、騎樓高度、支架與排水仍待合圖。</text></svg>
