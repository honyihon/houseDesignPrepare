<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="G4D外擴與上游｜上凸、平面外擴及檢修分開核"><title>G4D外擴與上游｜上凸、平面外擴及檢修分開核</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">G4D外擴與上游｜上凸、平面外擴及檢修分開核</text><text x="28" y="76">Claude第二輪已交叉核對｜部分算式與研究排序一致，未有完整解法、採用或專業核可。</text><text x="28" y="1158" class="small">本批 35d879c85857be3f9f43173552d8bb1a11d8fa70edb643ea4b4eca23e8a9361c</text><text x="28" y="1182" class="small">全部尺寸為列明假設；實際資料留白。原ABC／3D、家規與149控制不動，未跑瀏覽器。</text><text x="40" y="140">以下高程欄另以t250、上凸25、M0比較；上凸25並不等於前後側各外擴25。</text><text x="40" y="205" class="small">案例</text><text x="370" y="205" class="small">前／後／側增量</text><text x="640" y="205" class="small">後移</text><text x="770" y="205" class="small">平台間隔</text><text x="980" y="205" class="small">d下限mm</text><text x="1200" y="205" class="small">d500餘量</text><text x="40" y="250" class="small">nominal</text><text x="370" y="250" class="small">0／0／0</text><text x="640" y="250" class="small">0</text><text x="770" y="250" class="small">20</text><text x="980" y="250" class="small">499.620</text><text x="1200" y="250" class="small">0.380</text><text x="40" y="294" class="small">front25-no-shift</text><text x="370" y="294" class="small">25／0／0</text><text x="640" y="294" class="small">0</text><text x="770" y="294" class="small">-5</text><text x="980" y="294" class="small">500.120</text><text x="1200" y="294" class="small">-0.120</text><text x="40" y="338" class="small">front25-shift5</text><text x="370" y="338" class="small">25／0／0</text><text x="640" y="338" class="small">5</text><text x="770" y="338" class="small">0</text><text x="980" y="338" class="small">503.106</text><text x="1200" y="338" class="small">-3.106</text><text x="40" y="382" class="small">all25-no-shift</text><text x="370" y="382" class="small">25／25／25</text><text x="640" y="382" class="small">0</text><text x="770" y="382" class="small">-5</text><text x="980" y="382" class="small">515.552</text><text x="1200" y="382" class="small">-15.552</text><text x="40" y="426" class="small">all25-shift5</text><text x="370" y="426" class="small">25／25／25</text><text x="640" y="426" class="small">5</text><text x="770" y="426" class="small">0</text><text x="980" y="426" class="small">518.539</text><text x="1200" y="426" class="small">-18.539</text><text x="40" y="470" class="small">all50-shift30</text><text x="370" y="470" class="small">50／50／50</text><text x="640" y="470" class="small">30</text><text x="770" y="470" class="small">0</text><text x="980" y="470" class="small">549.403</text><text x="1200" y="470" class="small">-49.403</text><text x="40" y="565">平台間隔負數就是侵入，0只是接觸邊界。前擴25需至少後移5才不侵入，但原包絡每後移1，高程餘量約少0.5973；前／後緣新增量仍要另算。</text><text x="40" y="602">側向外擴也會讓部分外框超出原右回程踏步投影；本表只延伸同一樂觀模型，並未取得整個擴大外框的真實構造證據。</text><text x="40" y="639">上游不能借局部50：盆線到原井心的假管頂3788.4，距假板底3800僅11.6；若全線同樣要求50，這裡缺38.4。實際排口與構造未知，不等於全域無解。</text><text x="40" y="676">橫移y4500與y4700的水平總長都4375，末端盆頂都3200.9（d500）；只能改轉折位置，不能直接當門扇、接頭或清掃改善。</text><text x="40" y="713">梯下接入後只研究向下落管。G4不能再默認向上直穿梯段，通氣須另外回保留井至RF；四條比較中心線也不代表四根實管可重疊。</text></svg>
