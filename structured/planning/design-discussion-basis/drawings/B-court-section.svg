<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="R1上下關係｜部分遮頂仍須完整天井防水"><title>R1上下關係｜部分遮頂仍須完整天井防水</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}.room{font-size:14px;font-weight:650}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">R1上下關係｜部分遮頂仍須完整天井防水</text><text x="28" y="76">獨立介面比較／未採用｜原ABC／3D、B兩個搬轎入口、Q1／Q2及RF快照保留。不是工程或風水核可。</text><text x="28" y="1158" class="small">本批 9c83e36da82eb20bfa65edac647d5ed813228ebad86545937b0a88770faa1991</text><text x="28" y="1182" class="small">僅指定平面與算式；合法戶外、結構、防水、通風乾衣、護欄及實物拆運未知。未跑瀏覽器／WebGL。</text><text x="40" y="130">橫向沿天井中段看x=0～2400；高度僅關係示意，未假定正式樓高、梁深或排水標高。</text><rect x="90" y="250" width="429.0" height="22" fill="#a7b9a5" stroke="#537b51" /><text x="90" y="190">RF留板帶1100mm（支承／梁深未核）</text><line x1="519.0" y1="250" x2="1026.0" y2="250" stroke="#217eac" stroke-width="3" stroke-dasharray="8 6" /><text x="558.0" y="222">上方開口1300mm</text><rect x="480.0" y="185" width="39.0" height="65" fill="#bd8f56" /><text x="1080" y="230">井側100mm僅占位</text><line x1="90" y1="272" x2="90" y2="580" stroke="#607c73" stroke-width="4" /><line x1="1026.0" y1="272" x2="1026.0" y2="580" stroke="#607c73" stroke-width="4" /><rect x="90" y="580" width="936.0" height="18" fill="#b7cedb" stroke="#397b8e" /><text x="90" y="560">3F完整天井地面2400mm；全地面防水／溢流／門檻仍要核</text><text x="210" y="680">2F更衣／梳妝乾區在下方，並未移走</text><line x1="616.5" y1="290" x2="576.5" y2="475" stroke="#217eac" stroke-width="2" stroke-dasharray="6 5" /><line x1="753.0" y1="290" x2="713.0" y2="475" stroke="#217eac" stroke-width="2" stroke-dasharray="6 5" /><line x1="909.0" y1="290" x2="869.0" y2="475" stroke="#217eac" stroke-width="2" stroke-dasharray="6 5" /><text x="110" y="760">風雨可能濺入遮頂區；板洞變小不等於濕地面減半</text><text x="40" y="825">留板帶只減RF名義板洞，不提供隔熱、防水、採光或乾衣性能。天井地面名義5.112㎡，115輪廓4.123㎡；井前另退100後，上方洞2.639㎡不是有效通風口認證。</text><text x="40" y="860">圖未補入洗衣機、晾衣架、排水口或維修管；需完整排好才能稱可用工作陽台。雨水、污廢水及通氣分系統，既有400井不證明容量足。</text><text x="40" y="895">若結構需三樓柱腳、墩座或新梁侵入，原地面、門片與81態結果須重算。R2室內乾區也不能偷加濕洗衣後沿用此結果。</text></svg>
