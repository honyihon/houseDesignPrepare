<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="B RF容量與到達｜不再用移設備湊24㎡"><title>B RF容量與到達｜不再用移設備湊24㎡</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}.room{font-size:14px;font-weight:650}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">B RF容量與到達｜不再用移設備湊24㎡</text><text x="28" y="76">獨立日常試排／未採用｜原24㎡目標與家規保留，原ABC／3D、RF與搬轎版本不變。未驗產品或真正梯段。</text><text x="28" y="1158" class="small">本批 885c3ea5f7d08ba72463499dcffa1e427be0c8b03453401b819534fa73b37808</text><text x="28" y="1182" class="small">指定面積、門態與方塊不是法規、風水、結構、通風、產品、輪椅或施工核可；未跑瀏覽器／WebGL。</text><rect x="45.0" y="165.0" width="264.0" height="775.7199999999999" fill="#eef0e7" stroke="#607c73" /><polygon points="50.06,170.06 50.06,336.6 150.6,336.6 303.94,336.6 303.94,170.06 50.06,170.06" fill="#d7e7c0" stroke="#708738" /><polygon points="50.06,935.66 303.94,935.66 303.94,665.28 250.48,665.28 250.48,735.68 161.16,735.68 161.16,665.28 155.0,665.28 155.0,669.68 155.0,759.0 155.0,763.4 89.0,763.4 89.0,759.0 89.0,669.68 89.0,665.28 50.06,665.28 50.06,935.66" fill="#d7e7c0" stroke="#708738" /><polygon points="309.0,336.6 150.6,336.6 150.6,565.4 45.0,565.4 45.0,665.28 309.0,665.28 309.0,565.4" fill="#f1ded6" stroke="#b88b7a" /><polygon points="250.48,665.28 250.48,735.68 161.16,735.68 161.16,665.28" fill="#f1ded6" stroke="#b88b7a" /><rect x="45.0" y="336.6" width="105.6" height="228.79999999999998" fill="#d2d9e0" stroke="#66758b" /><rect x="93.4" y="669.68" width="57.199999999999996" height="89.32" fill="#c8dce4" stroke="#217eac" /><text x="55" y="230" class="room">前：獨立日常候選</text><text x="55" y="600" class="room">中：保護／梯核分隔</text><text x="55" y="840" class="room">後：未與前日常相通</text><text x="40" y="1005" class="small">6000×17630約32地坪，外框未擴大</text><text x="400" y="145">固定前帶名義23.4㎡；只扣外緣115mm、不扣設備或交界內牆的樂觀上界21.83945㎡，已比</text><text x="400" y="168">24少2.16055㎡。</text><text x="400" y="203">因此即使移走全部設備，或只改RF前門，固定前帶也達不到24；這只針對本固定拓樸，不是所有整棟方案</text><text x="400" y="226">皆不可能。</text><text x="400" y="261">後側有空地但與前側分開。現行RF保護用途不允許當日常曬衣通路，不能把兩塊面積相加後稱24已解。</text><text x="400" y="296">到達平台只用前一層右跑對應1000×1000；原RF圖畫的2200全寬板不當任意可用。70mm前</text><text x="400" y="319">銜接仍是條件，未驗樓板。</text><text x="400" y="354">門中心1715、到達平台中心1780，偏65mm；900方塊以門中心延伸到平台時左緣1265，超</text><text x="400" y="377">出平台左緣1280共15mm。</text><text x="400" y="412">原右鉸鏈全開仍卡外轉角，同洞改左後全開不阻700／800試線；900仍須調整到達平台。門框、扶手</text><text x="400" y="435">與產品淨寬未知。</text><text x="400" y="470">D1保較多後設備餘量但折衣與通道共用；D2日常較順，但後熱泵／水塔包絡緊，不能用生活圖取代設備核</text><text x="400" y="493">對。</text><text x="400" y="540" class="room">真正的後續路徑</text><text x="400" y="578">先保可用的前平台作比較：D1偏設備檢修、D2偏日常家務，兩路待真實包絡回套；原24㎡目標仍列缺口</text><text x="400" y="600">，不因圖能用就視為屋主接受縮小。</text><text x="400" y="634">24㎡若為不可讓步條件：需把一樓祭祀保護位置、全棟樓梯及上層功能一併交建築師重排研究；沒有提出已</text><text x="400" y="656">完成替代案，不先動一樓、縮客房或取消工作天井。</text><text x="400" y="690">合法基地與建築量體回套：本輪仍用原約32地坪框，不往道路／鄰地外伸、不加第二屋頂層，也不預設改風</text><text x="400" y="712">水規則就能解決。實際資料到齊後檢查完整配置。</text></svg>
