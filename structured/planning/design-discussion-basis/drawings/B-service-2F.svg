<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="P3｜前公衛、可關茶水前室與乾側檢修"><title>P3｜前公衛、可關茶水前室與乾側檢修</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}.room{font-size:13px;font-weight:650}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">P3｜前公衛、可關茶水前室與乾側檢修</text><text x="28" y="76">獨立重排比較／未採用｜mm座標；前陽台改室內為重大代價，須正式建築設計，不可自行封陽台。</text><text x="28" y="1158" class="small">來源 38897b7ca1da091d…｜本批 d4a599ed36f47ded…</text><text x="28" y="1182" class="small">指定平面幾何不等於法規／風水／照護／搬運／產品或施工核可。前排水及結構未完成；原ABC／3D保留。</text><rect x="55.0" y="155.0" width="474.15" height="287.09999999999997" fill="#dceff4" stroke="#537380" stroke-width="2" /><rect x="55.0" y="442.09999999999997" width="474.15" height="278.4" fill="#edf0df" stroke="#607c73" stroke-width="2" /><rect x="55.0" y="720.5" width="348.0" height="145.0" fill="#e4e6e0" stroke="#607c73" stroke-width="2" /><rect x="202.17499999999998" y="171.675" width="101.5" height="130.5" fill="none" stroke="#88a18c" stroke-dasharray="4 3" /><rect x="71.675" y="171.675" width="130.5" height="130.5" fill="#b9c9be" stroke="#3c6355" stroke-width="1" /><text x="136.925" y="236.925" text-anchor="middle" class="room">淋浴</text><rect x="309.475" y="323.92499999999995" width="101.5" height="101.5" fill="none" stroke="#88a18c" stroke-dasharray="4 3" /><rect x="410.97499999999997" y="360.17499999999995" width="101.5" height="65.25" fill="#b9c9be" stroke="#3c6355" stroke-width="1" /><text x="461.72499999999997" y="392.79999999999995" text-anchor="middle" class="room">馬桶</text><rect x="425.47499999999997" y="236.925" width="87.0" height="101.5" fill="none" stroke="#88a18c" stroke-dasharray="4 3" /><rect x="425.47499999999997" y="171.675" width="87.0" height="65.25" fill="#b9c9be" stroke="#3c6355" stroke-width="1" /><text x="468.97499999999997" y="204.3" text-anchor="middle" class="room">面盆</text><rect x="323.97499999999997" y="464.575" width="101.5" height="217.49999999999997" fill="none" stroke="#88a18c" stroke-dasharray="4 3" /><rect x="425.47499999999997" y="464.575" width="87.0" height="217.49999999999997" fill="#b9c9be" stroke="#3c6355" stroke-width="1" /><text x="468.97499999999997" y="573.325" text-anchor="middle" class="room">茶水槽候選</text><rect x="71.675" y="413.09999999999997" width="57.99999999999999" height="57.99999999999999" fill="#ca9d8b" stroke="#9c4634" stroke-width="1" /><rect x="71.675" y="471.09999999999997" width="101.5" height="130.5" fill="none" stroke="#945c33" stroke-width="2" stroke-dasharray="6 3" /><line x1="352.25" y1="155.0" x2="497.24999999999994" y2="155.0" stroke="#1a9ac0" stroke-width="5" /><line x1="221.75" y1="442.09999999999997" x2="385.59999999999997" y2="442.09999999999997" stroke="#fafbf8" stroke-width="5" /><rect x="392.84999999999997" y="442.09999999999997" width="95.69999999999999" height="6.5249999999999995" fill="#ad896b" stroke="#744d30" stroke-width="1" /><rect x="392.84999999999997" y="454.42499999999995" width="95.69999999999999" height="6.5249999999999995" fill="#ad896b" stroke="#744d30" stroke-width="1" /><line x1="221.75" y1="720.5" x2="385.59999999999997" y2="720.5" stroke="#fafbf8" stroke-width="5" /><rect x="118.8" y="701.65" width="95.69999999999999" height="6.5249999999999995" fill="#ad896b" stroke="#744d30" stroke-width="1" /><rect x="118.8" y="713.9749999999999" width="95.69999999999999" height="6.5249999999999995" fill="#ad896b" stroke="#744d30" stroke-width="1" /><line x1="303.67499999999995" y1="793.0" x2="303.67499999999995" y2="638.575" stroke="#286a84" stroke-width="2" stroke-dasharray="5 3" /><line x1="303.67499999999995" y1="638.575" x2="303.67499999999995" y2="529.825" stroke="#286a84" stroke-width="2" stroke-dasharray="5 3" /><line x1="303.67499999999995" y1="529.825" x2="303.67499999999995" y2="360.17499999999995" stroke="#286a84" stroke-width="2" stroke-dasharray="5 3" /><text x="55.0" y="128.9" class="small">朝街外窗候選；不能借側界開窗</text><text x="133.3" y="420.34999999999997" class="small">單一管井</text><text x="81.1" y="546.5" class="small">乾側檢修預留</text><text x="76.75" y="829.25" class="small">原梯核／平台，未改本體</text><text x="610" y="145">2F公衛 5.2860㎡、茶水前室 5.1036㎡；沿用115mm每面內縮假設。</text><text x="610" y="180">主臥 23.6651㎡、後套衛</text><text x="610" y="203">6.1330㎡及景觀／室外機沿用P2；這張僅是前段局部深化。</text><text x="610" y="238">原900淋浴／450×700馬桶／600面盆／1500×600茶水台尺寸保留，只換位</text><text x="610" y="261">置與方向；門中軸避馬桶本體，並非完整風水核可。</text><text x="610" y="296">同一400×400井跨共牆；總0.1600㎡＝兩完成面各0.0340＋已扣牆帶0.0</text><text x="610" y="319">920㎡。不把兩個引用當兩井。</text><text x="610" y="354">井後留700×900乾側檢修；位置不在茶水台上方，工具與拆管、密封、聲學及操作高度仍</text><text x="610" y="377">未知。</text><text x="610" y="412">兩組雙扇門全開才有900模型淨帶；公衛門疊包距茶水台25mm，梯門全程活動與台最近約</text><text x="610" y="435">315mm，五金／公差未核。</text><text x="610" y="470">虛線為900方塊試線；與茶水操作帶重疊，需分時，不保證人體／照護或搬運。</text><text x="610" y="505">扣實體門片前室5.0838㎡；保守留完整移動範圍後5.0640㎡，不是法定面積。</text><text x="610" y="540">3F沿同一公衛／井／門，前室不放濕茶水台，但有同軸濕管；3F後客房與娛樂區、隔音／振</text><text x="610" y="563">動缺口不變。</text><text x="610" y="598">前側12.753㎡／層新室內量體沿用P2，仍須正式設計／申照；這次沒有增加量體，也未</text><text x="610" y="621">解決前排水。</text><text x="55" y="950">保留方向：可關前室＋乾側檢修更明確；先不指定門產品，不把短偏移當重力排水完成。</text></svg>
