<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="A前側入口｜斜向門長不能代替真正通行寬"><title>A前側入口｜斜向門長不能代替真正通行寬</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}.room{font-size:15px;font-weight:650}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">A前側入口｜斜向門長不能代替真正通行寬</text><text x="28" y="78">獨立到達研究／未採用｜mm座標；只核固定房界反例與基地內試線，未核門外動線、實際門組或照護。</text><text x="28" y="106">三棟共用一組；C2暫不用保空間、A2以上另留機位。A原室內分區及洗衣設備備位保留。</text><text x="28" y="1157" class="small">本批 cccb8e77b8ff54e162bc27746b1cef493f02e6fd53d43bb19ffe49e41db18730</text><text x="28" y="1183" class="small">原3D與已驗ZIP不改；無新瀏覽器／WebGL或專業驗收。圖上空白與模型餘量不能當實測或商品安全距離。</text><rect x="45.0" y="178.0" width="136.0" height="218.0" fill="#e6ece2" stroke="#799184" /><text x="113.0" y="287.0" text-anchor="middle" class="small">MDF維修備援保留</text><rect x="181.0" y="190.0" width="216.0" height="206.0" fill="#e6ece2" stroke="#799184" /><text x="289.0" y="293.0" text-anchor="middle" class="small">公共乾區</text><rect x="45.0" y="396.0" width="240.0" height="377.0" fill="#e6ece2" stroke="#799184" /><text x="165.0" y="584.5" text-anchor="middle" class="small">廚房原範圍</text><rect x="285.0" y="396.0" width="360.0" height="377.0" fill="#f0e4c8" stroke="#799184" /><text x="465.0" y="584.5" text-anchor="middle" class="small">孝親房保留</text><path d="M385.5,384.5 L385.5,201.5 L192.5,201.5 L192.5,407.5 L56.5,407.5 L56.5,761.5 L273.5,761.5 L273.5,384.5 L385.5,384.5 Z" fill-rule="evenodd" fill="#fff" fill-opacity="0.7" stroke="#538a91" stroke-width="1" /><path d="M228.5,434.41 L227.285,436.048 L224.32,439.32 L221.048,442.285 L217.501,444.916 L213.713,447.186 L209.721,449.075 L205.563,450.562 L201.279,451.635 L196.911,452.283 L192.5,452.5 L101.5,452.5 L101.5,716.5 L228.5,716.5 L228.5,434.41 Z M237.5,357.59 L238.715,355.952 L241.68,352.68 L244.952,349.715 L248.499,347.084 L252.287,344.814 L256.279,342.925 L260.437,341.438 L264.721,340.365 L269.089,339.717 L273.5,339.5 L340.5,339.5 L340.5,246.5 L237.5,246.5 L237.5,357.59 Z" fill-rule="evenodd" fill="#93bdd9" fill-opacity="0.6" stroke="#367c9c" stroke-width="1" /><polygon points="181.0,326.0 285.0,396.0 181.0,396.0" fill="#f3b66c" fill-opacity="0.7" stroke="#a3692b" stroke-dasharray="5 3" /><circle cx="315.0" cy="280.0" r="5" fill="#27536b" /><text x="327.0" y="270.0" class="small">乾區試點</text><circle cx="215.0" cy="590.0" r="5" fill="#27536b" /><text x="227.0" y="580.0" class="small">廚房試點</text><text x="45" y="810">上方接原公共區；藍色是900圓形本體中心可行域</text><text x="45" y="839">只畫完成預算邊界，特意忽略廚具與門片，仍不相通</text><text x="720" y="170">現況公共乾區與廚房只共1040mm名義邊；每側先留115mm完成預算，最</text><text x="720" y="195">樂觀只餘810mm。</text><text x="720" y="232">原900mm名義門扣總框230mm，只能先估670mm；不是900mm實</text><text x="720" y="257">際通行。</text><text x="720" y="294">橙色三角區重分給廚房，斜邊約1254mm、移標面積0.364㎡。但公共區</text><text x="720" y="319">與廚房的合併地面完全沒增加。</text><text x="720" y="356">900圓形本體的中心可行域分成兩塊，兩個試點各在不同塊。斜門較長不能作為</text><text x="720" y="381">角落已可轉過的證據。</text><text x="720" y="418">本反例只否決這種固定房界的門長算法。要保前側自行操作，須連入口、相鄰分區</text><text x="720" y="443">及MDF完整維修一起重新排，不代表所有前側方案都無解。</text><text x="45" y="900">本輪不改廚房、孝親房、照護通道或MDF，也不把未核成的梯下機房當成已可釋出。</text><text x="45" y="936">前門備案：家人／照服以分戶小籃或推車平層取送，長輩不提濕衣上樓。這只是協助流程，原前門全程通路仍未核。</text><text x="45" y="972">若要求三棟長輩都能完全自行抵達，而合法後路或前側完整重排都不成立，就回到共享位置比較，不硬塞此廚房。</text></svg>
