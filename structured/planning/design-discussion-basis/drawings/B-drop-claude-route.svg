<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="G4D｜室內高位先落500，保原梯及兩門的待核方向"><title>G4D｜室內高位先落500，保原梯及兩門的待核方向</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}.room{font-size:14px;font-weight:650}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">G4D｜室內高位先落500，保原梯及兩門的待核方向</text><text x="28" y="76">Claude第一輪交叉核對＋Codex條件提案／未採用｜G4D待第二輪，不是共識、施工或專業核可。</text><text x="28" y="1158" class="small">本批 ab6ef44605ff271d830d70ecf51fb451581cb3fb3fc5e30bfd12415e6f295c59</text><text x="28" y="1182" class="small">原ABC／3D及149控制保留；數值為列明模型，無實測、產品、風水、消防或搬運核可，未跑瀏覽器。</text><rect x="45.0" y="173.0" width="240.0" height="192.0" fill="#e2e8e7" stroke="#7d9492" /><rect x="45.0" y="365.0" width="240.0" height="520.0" fill="#edf0e9" stroke="#607c73" /><rect x="285.0" y="365.0" width="100.0" height="520.0" fill="#efd6ce" stroke="#b88b7a" /><rect x="53.0" y="472.0" width="100.0" height="27.0" fill="#e2e6df" stroke="#7c9484" stroke-width="0.7" /><rect x="173.0" y="742.0" width="100.0" height="27.0" fill="#e2e6df" stroke="#7c9484" stroke-width="0.7" /><rect x="53.0" y="499.0" width="100.0" height="27.0" fill="#e2e6df" stroke="#7c9484" stroke-width="0.7" /><rect x="173.0" y="715.0" width="100.0" height="27.0" fill="#e2e6df" stroke="#7c9484" stroke-width="0.7" /><rect x="53.0" y="526.0" width="100.0" height="27.0" fill="#e2e6df" stroke="#7c9484" stroke-width="0.7" /><rect x="173.0" y="688.0" width="100.0" height="27.0" fill="#e2e6df" stroke="#7c9484" stroke-width="0.7" /><rect x="53.0" y="553.0" width="100.0" height="27.0" fill="#e2e6df" stroke="#7c9484" stroke-width="0.7" /><rect x="173.0" y="661.0" width="100.0" height="27.0" fill="#e2e6df" stroke="#7c9484" stroke-width="0.7" /><rect x="53.0" y="580.0" width="100.0" height="27.0" fill="#e2e6df" stroke="#7c9484" stroke-width="0.7" /><rect x="173.0" y="634.0" width="100.0" height="27.0" fill="#e2e6df" stroke="#7c9484" stroke-width="0.7" /><rect x="53.0" y="607.0" width="100.0" height="27.0" fill="#e2e6df" stroke="#7c9484" stroke-width="0.7" /><rect x="173.0" y="607.0" width="100.0" height="27.0" fill="#e2e6df" stroke="#7c9484" stroke-width="0.7" /><rect x="53.0" y="634.0" width="100.0" height="27.0" fill="#e2e6df" stroke="#7c9484" stroke-width="0.7" /><rect x="173.0" y="580.0" width="100.0" height="27.0" fill="#e2e6df" stroke="#7c9484" stroke-width="0.7" /><rect x="53.0" y="661.0" width="100.0" height="27.0" fill="#e2e6df" stroke="#7c9484" stroke-width="0.7" /><rect x="173.0" y="553.0" width="100.0" height="27.0" fill="#e2e6df" stroke="#7c9484" stroke-width="0.7" /><rect x="53.0" y="688.0" width="100.0" height="27.0" fill="#e2e6df" stroke="#7c9484" stroke-width="0.7" /><rect x="173.0" y="526.0" width="100.0" height="27.0" fill="#e2e6df" stroke="#7c9484" stroke-width="0.7" /><rect x="53.0" y="715.0" width="100.0" height="27.0" fill="#e2e6df" stroke="#7c9484" stroke-width="0.7" /><rect x="173.0" y="499.0" width="100.0" height="27.0" fill="#e2e6df" stroke="#7c9484" stroke-width="0.7" /><rect x="53.0" y="742.0" width="100.0" height="27.0" fill="#e2e6df" stroke="#7c9484" stroke-width="0.7" /><rect x="173.0" y="472.0" width="100.0" height="27.0" fill="#e2e6df" stroke="#7c9484" stroke-width="0.7" /><rect x="53.0" y="372.0" width="220.0" height="100.0" fill="#d9dfbf" stroke="#74803e" /><rect x="56.5" y="153.0" width="40.0" height="40.0" fill="#ca9d8b" stroke="#9c4634" /><polygon points="56.5,153.0 56.5,345.0 56.5,385.0 56.5,425.0 56.5,465.0 96.5,465.0 173.0,465.0 173.0,514.0 213.0,514.0 213.0,465.0 213.0,425.0 173.0,425.0 96.5,425.0 96.5,385.0 96.5,345.0 96.5,153.0 56.5,153.0" fill="#b9d9dd" fill-opacity="0.65" stroke="#2d8297" stroke-width="1" /><rect x="173.0" y="474.0" width="40.0" height="40.0" fill="#98c4b7" stroke="#3c7968" stroke-width="2" /><line x1="76.5" y1="173.0" x2="76.5" y2="365.0" stroke="#277c79" stroke-width="2" stroke-dasharray="4 3" /><line x1="76.5" y1="365.0" x2="76.5" y2="445.0" stroke="#277c79" stroke-width="2" stroke-dasharray="4 3" /><line x1="76.5" y1="445.0" x2="193.0" y2="445.0" stroke="#277c79" stroke-width="2" stroke-dasharray="4 3" /><line x1="193.0" y1="445.0" x2="193.0" y2="494.0" stroke="#277c79" stroke-width="2" stroke-dasharray="4 3" /><text x="45" y="125" class="small">2F原井投影，不是現場井</text><text x="45" y="350" class="small">騎樓／室內界y3900：梁未知</text><text x="78.5" y="439.0" class="small">高位落500</text><text x="45" y="545" class="small">G4落點，名義退平台20mm</text><text x="45" y="1020" class="small">右側為祭祀保護，管線不進入</text><text x="465" y="145">Claude的G4回程梯下區域保留研究；原G4高管位仍碰梯底。Codex另比G4D：先在室內</text><text x="465" y="169">平台上方[315,4700]落500，再橫接右回程下。</text><text x="465" y="205">G4D落點仍[1280,4990,400,400]，不是原G0全高平台柱；原24級、1000</text><text x="465" y="229">單跑、平台及街／側門位置都不動。上層井與Q3／RF不自動改圖。</text><text x="465" y="265">500是向下高位落差，不泵、不抬地坪，也不折成水平1:50。總水平匯管仍4375mm，四條支</text><text x="465" y="289">管都照列。</text><text x="465" y="325">需比整組最高管頂與後緣梯底，而不是拿3461.6等通行預算當管頂。400前緣較中心再高4mm</text><text x="465" y="349">；額外接頭及安裝間隔另列。</text><text x="465" y="385">這仍不是空間已夠：400外框距平台只20mm，再向前長25便占平台。檢修開門、地面、消防及搬</text><text x="465" y="409">運沒有重演。</text><text x="465" y="445">騎樓段仍薄：y3900最有利預算3510.7，再需25則3485.7；高位落差在室內，沒有改</text><text x="465" y="469">善此段，也未證明邊界有梁或可通管。</text><text x="465" y="505">前側合法終端與深度先核。落點至道路邊界直線至少5190，地梁、覆土、清掃、權利及復舊未知；不</text><text x="465" y="529">能批准埋管或用後側祭祀地下補路。</text></svg>
