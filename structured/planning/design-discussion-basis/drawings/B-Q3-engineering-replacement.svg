<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="B RF設備：首裝、巡檢與整機汰換分開核"><title>B RF設備：首裝、巡檢與整機汰換分開核</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}.room{font-size:14px;font-weight:650}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">B RF設備：首裝、巡檢與整機汰換分開核</text><text x="28" y="76">Q3／RF同版工程接口｜未採用，原格局與主3D保留；高度及門寬僅列明預算，不是成品或施工核可。</text><text x="28" y="1158" class="small">本批 d9da1ea5deec1b4ae9d4ea42ce626b26339a4f1f92d1c930bde0263df985c698</text><text x="28" y="1182" class="small">未執行瀏覽器／轉圖；結構、聲學、風水、消防、照護、外吊及全程搬運均待核。</text><text x="45" y="130">前門900／側門770mm皆是預算；700巡檢方塊不代表機器可搬。</text><text x="45" y="165">以下純試數值：每側持握／保護預留25mm，未指定任何產品。</text><rect x="65" y="215" width="450.0" height="35" fill="#b9d0b3" stroke="#4c7750" /><text x="65" y="285">前門洞口預算 900mm → 每側25時物件寬上界 850mm</text><rect x="65" y="318" width="375.0" height="25" fill="#d9dfbf" /><text x="65" y="368" class="small">物件700＋兩側50＝750；餘150mm</text><rect x="65" y="373" width="410.0" height="25" fill="#d9dfbf" /><text x="65" y="423" class="small">物件770＋兩側50＝820；餘80mm</text><rect x="65" y="428" width="425.0" height="25" fill="#d9dfbf" /><text x="65" y="478" class="small">物件800＋兩側50＝850；餘50mm</text><rect x="65" y="483" width="475.0" height="25" fill="#e7b7a6" /><text x="65" y="533" class="small">物件900＋兩側50＝950；餘-50mm</text><rect x="65" y="538" width="525.0" height="25" fill="#e7b7a6" /><text x="65" y="588" class="small">物件1000＋兩側50＝1050；餘-150mm</text><rect x="715" y="215" width="385.0" height="35" fill="#b9d0b3" stroke="#4c7750" /><text x="715" y="285">側門洞口預算 770mm → 每側25時物件寬上界 720mm</text><rect x="715" y="318" width="375.0" height="25" fill="#d9dfbf" /><text x="715" y="368" class="small">物件700＋兩側50＝750；餘20mm</text><rect x="715" y="373" width="410.0" height="25" fill="#e7b7a6" /><text x="715" y="423" class="small">物件770＋兩側50＝820；餘-50mm</text><rect x="715" y="428" width="425.0" height="25" fill="#e7b7a6" /><text x="715" y="478" class="small">物件800＋兩側50＝850；餘-80mm</text><rect x="715" y="483" width="475.0" height="25" fill="#e7b7a6" /><text x="715" y="533" class="small">物件900＋兩側50＝950；餘-180mm</text><rect x="715" y="538" width="525.0" height="25" fill="#e7b7a6" /><text x="715" y="588" class="small">物件1000＋兩側50＝1050；餘-280mm</text><text x="45" y="685">水塔／熱泵框是整組預留，不是機身尺寸；冷氣代表槽也不當已選台數。先取實機或原廠可拆運模組的寬、深、高、重與依據。</text><text x="45" y="721">S1前熱泵巡檢經前門；水塔、後冷氣及S2熱泵巡檢經側門。這只是選擇本表洞口參考，不是證明機器能循人員巡檢折線搬出。</text><text x="45" y="757">寬度相容仍要核門高、把手、包裝、長物轉彎、1100折返平台、扶手、踏步、荷重及搬運人員；本輪沒有整機實物演練。</text><text x="45" y="793">若全門梯路線不能換機，才比較原廠可拆模組或外吊。外吊需合法到達、吊點、落放、護欄／防水恢復及費用；目前不當已存在備援。</text><text x="45" y="829">日後條件只回算新的私人結果，未知保null。不得自動縮機器、旋轉、拆機、借保護區、增加採購數或覆寫已填回覆。</text></svg>
