<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="B一樓梯｜400直立柱不能穿踏步，中央200不是400井"><title>B一樓梯｜400直立柱不能穿踏步，中央200不是400井</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}.room{font-size:14px;font-weight:650}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">B一樓梯｜400直立柱不能穿踏步，中央200不是400井</text><text x="28" y="76">P4原1F落管位置的局部反例／未採用｜四位置均不直接套現行梯門；未改格局或併主3D。</text><text x="28" y="1158" class="small">本批 e2dc0bdd6cf5cc308c539d7a991cc72556502bf03a8ba4d8def11200cbc6249a</text><text x="28" y="1182" class="small">局部平台／踏步只作篩檢，非全域無解證明，亦非結構、風水、消防、搬轎、照護或施工核可。</text><text x="45" y="140">左跑局部側視：不是施工剖面，踏步僅畫示意頂面</text><line x1="60.0" y1="1030.0" x2="840.0" y2="1030.0" stroke="#64766b" /><line x1="220.5" y1="1003.3333333333334" x2="261.0" y2="1003.3333333333334" stroke="#64766b" stroke-width="3" /><line x1="261.0" y1="976.6666666666666" x2="301.5" y2="976.6666666666666" stroke="#64766b" stroke-width="3" /><line x1="301.5" y1="950.0" x2="342.0" y2="950.0" stroke="#64766b" stroke-width="3" /><line x1="342.0" y1="923.3333333333334" x2="382.5" y2="923.3333333333334" stroke="#64766b" stroke-width="3" /><line x1="382.5" y1="896.6666666666667" x2="423.0" y2="896.6666666666667" stroke="#64766b" stroke-width="3" /><line x1="423.0" y1="870.0" x2="463.5" y2="870.0" stroke="#64766b" stroke-width="3" /><line x1="463.5" y1="843.3333333333334" x2="504.0" y2="843.3333333333334" stroke="#64766b" stroke-width="3" /><line x1="504.0" y1="816.6666666666667" x2="544.5" y2="816.6666666666667" stroke="#64766b" stroke-width="3" /><line x1="544.5" y1="790.0" x2="585.0" y2="790.0" stroke="#64766b" stroke-width="3" /><line x1="585.0" y1="763.3333333333334" x2="625.5" y2="763.3333333333334" stroke="#64766b" stroke-width="3" /><line x1="625.5" y1="736.6666666666667" x2="666.0" y2="736.6666666666667" stroke="#64766b" stroke-width="3" /><rect x="77.25" y="469.29599999999994" width="60.0" height="560.7040000000001" fill="#e6b2a3" fill-opacity="0.6" stroke="#b95142" /><text x="77.25" y="454.29599999999994" class="small">G0假直立柱</text><rect x="300.0" y="469.29599999999994" width="60.0" height="560.7040000000001" fill="#e6b2a3" fill-opacity="0.6" stroke="#b95142" /><text x="300.0" y="454.29599999999994" class="small">G3假直立柱</text><text x="45" y="1115" class="small">柱頂3504.4只是P4最有利預算平面，非真實接入標高</text><text x="875" y="170">G0在平台邊緣，不碰列明踏面卻擋平台局部試線；不碰踏步</text><text x="875" y="194">不等於可用。</text><text x="875" y="230">G3覆左跑第2、3、4示意踏步，頂高約333／500／</text><text x="875" y="254">667mm。直立400柱貫到3504.4時會穿這些高程</text><text x="875" y="278">。</text><text x="875" y="314">G2中央超寬後同時碰左右共六個示意踏步；樓梯板、梯梁、</text><text x="875" y="338">扶手與支承尚未有真實剖面。</text><text x="875" y="374">保兩跑1000而加400井，名義總幅至少2400，比原</text><text x="875" y="398">2200多200，還沒計井壁／結構。</text><text x="875" y="434">照原外緣加200至右側，名義梯核新增帶會占祭祀前廳1.</text><text x="875" y="458">04㎡；未取得屋主允許，也不是可採用小改。</text><text x="875" y="494">需要建築／結構／機電在新建設計階段整合，不能先畫一條穿</text><text x="875" y="518">梯板的水管再讓現場想辦法。</text></svg>
