<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="後門三態｜只有全開的基地內試線局部不碰"><title>後門三態｜只有全開的基地內試線局部不碰</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}.room{font-size:15px;font-weight:650}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">後門三態｜只有全開的基地內試線局部不碰</text><text x="28" y="78">獨立到達研究／未採用｜mm座標；只核固定房界反例與基地內試線，未核門外動線、實際門組或照護。</text><text x="28" y="106">三棟共用一組；C2暫不用保空間、A2以上另留機位。A原室內分區及洗衣設備備位保留。</text><text x="28" y="1157" class="small">本批 cccb8e77b8ff54e162bc27746b1cef493f02e6fd53d43bb19ffe49e41db18730</text><text x="28" y="1183" class="small">原3D與已驗ZIP不改；無新瀏覽器／WebGL或專業驗收。圖上空白與模型餘量不能當實測或商品安全距離。</text><text x="35" y="165" class="room">全開｜局部試線不碰門板</text><rect x="35.0" y="236.1" width="420.00000000000006" height="126.00000000000001" fill="#edf0e9" stroke="#6b8779" stroke-width="1" /><rect x="347.90000000000003" y="260.6" width="63.00000000000001" height="94.50000000000001" fill="#c9d5ce" stroke="#738577" stroke-dasharray="5 3" stroke-width="1" /><rect x="119.00000000000001" y="236.1" width="77.00000000000001" height="63.00000000000001" fill="none" stroke="#738577" stroke-dasharray="5 3" stroke-width="1" /><rect x="40.6" y="241.7" width="63.00000000000001" height="45.50000000000001" fill="#c9d5ce" stroke="#738577" stroke-dasharray="5 3" stroke-width="1" /><rect x="269.5" y="244.15" width="59.50000000000001" height="52.50000000000001" fill="#f2b668" stroke="#986a36" /><rect x="269.5" y="301.55" width="59.50000000000001" height="52.50000000000001" fill="#f2b668" stroke="#986a36" /><rect x="105.0" y="315.55" width="84.00000000000001" height="35.0" fill="#cce5c4" stroke="#986a36" /><rect x="192.50000000000003" y="244.15" width="77.00000000000001" height="63.00000000000001" fill="none" stroke="#a86e39" stroke-dasharray="6 4" /><rect x="192.50000000000003" y="291.05" width="77.00000000000001" height="63.00000000000001" fill="none" stroke="#a86e39" stroke-dasharray="6 4" /><rect x="105.0" y="259.55" width="84.00000000000001" height="56.00000000000001" fill="none" stroke="#a86e39" stroke-dasharray="6 4" /><path d="M262.5,244.5 L199.5,244.5 L199.5,362.1 L262.5,362.1 L262.5,276.0 L262.5,244.5 Z" fill-rule="evenodd" fill="#9dc9e2" fill-opacity="0.5" stroke="#367c9c" /><path d="M199.5,379.6 L199.5,411.1 L262.5,411.1 L262.5,362.1 L199.5,362.1 L199.5,379.6 Z" fill-rule="evenodd" fill="none" stroke="#886c9b" stroke-dasharray="4 3" /><rect x="98.7" y="355.45000000000005" width="176.4" height="6.65" fill="none" stroke="#a54c37" stroke-dasharray="4 3" /><rect x="98.7" y="355.45000000000005" width="88.2" height="6.65" fill="#b99374" stroke="#67472e" stroke-width="1.5" /><text x="35" y="465" class="small">門板與試線重疊：0.0㎡</text><text x="490" y="165" class="room">半開｜900試線被門板阻擋</text><rect x="490.0" y="236.1" width="420.00000000000006" height="126.00000000000001" fill="#edf0e9" stroke="#6b8779" stroke-width="1" /><rect x="802.9000000000001" y="260.6" width="63.00000000000001" height="94.50000000000001" fill="#c9d5ce" stroke="#738577" stroke-dasharray="5 3" stroke-width="1" /><rect x="574.0" y="236.1" width="77.00000000000001" height="63.00000000000001" fill="none" stroke="#738577" stroke-dasharray="5 3" stroke-width="1" /><rect x="495.6" y="241.7" width="63.00000000000001" height="45.50000000000001" fill="#c9d5ce" stroke="#738577" stroke-dasharray="5 3" stroke-width="1" /><rect x="724.5" y="244.15" width="59.50000000000001" height="52.50000000000001" fill="#f2b668" stroke="#986a36" /><rect x="724.5" y="301.55" width="59.50000000000001" height="52.50000000000001" fill="#f2b668" stroke="#986a36" /><rect x="560.0" y="315.55" width="84.00000000000001" height="35.0" fill="#cce5c4" stroke="#986a36" /><rect x="647.5" y="244.15" width="77.00000000000001" height="63.00000000000001" fill="none" stroke="#a86e39" stroke-dasharray="6 4" /><rect x="647.5" y="291.05" width="77.00000000000001" height="63.00000000000001" fill="none" stroke="#a86e39" stroke-dasharray="6 4" /><rect x="560.0" y="259.55" width="84.00000000000001" height="56.00000000000001" fill="none" stroke="#a86e39" stroke-dasharray="6 4" /><path d="M717.5,244.5 L654.5,244.5 L654.5,362.1 L717.5,362.1 L717.5,276.0 L717.5,244.5 Z" fill-rule="evenodd" fill="#9dc9e2" fill-opacity="0.5" stroke="#367c9c" /><path d="M654.5,379.6 L654.5,411.1 L717.5,411.1 L717.5,362.1 L654.5,362.1 L654.5,379.6 Z" fill-rule="evenodd" fill="none" stroke="#886c9b" stroke-dasharray="4 3" /><rect x="553.7" y="355.45000000000005" width="176.4" height="6.65" fill="none" stroke="#a54c37" stroke-dasharray="4 3" /><rect x="597.8" y="355.45000000000005" width="88.2" height="6.65" fill="#b99374" stroke="#67472e" stroke-width="1.5" /><text x="490" y="465" class="small">門板與試線重疊：0.04275㎡</text><text x="945" y="165" class="room">關閉｜900試線被門板阻擋</text><rect x="945.0" y="236.1" width="420.00000000000006" height="126.00000000000001" fill="#edf0e9" stroke="#6b8779" stroke-width="1" /><rect x="1257.9" y="260.6" width="63.00000000000001" height="94.50000000000001" fill="#c9d5ce" stroke="#738577" stroke-dasharray="5 3" stroke-width="1" /><rect x="1029.0" y="236.1" width="77.00000000000001" height="63.00000000000001" fill="none" stroke="#738577" stroke-dasharray="5 3" stroke-width="1" /><rect x="950.6" y="241.7" width="63.00000000000001" height="45.50000000000001" fill="#c9d5ce" stroke="#738577" stroke-dasharray="5 3" stroke-width="1" /><rect x="1179.5" y="244.15" width="59.50000000000001" height="52.50000000000001" fill="#f2b668" stroke="#986a36" /><rect x="1179.5" y="301.55" width="59.50000000000001" height="52.50000000000001" fill="#f2b668" stroke="#986a36" /><rect x="1015.0" y="315.55" width="84.00000000000001" height="35.0" fill="#cce5c4" stroke="#986a36" /><rect x="1102.5" y="244.15" width="77.00000000000001" height="63.00000000000001" fill="none" stroke="#a86e39" stroke-dasharray="6 4" /><rect x="1102.5" y="291.05" width="77.00000000000001" height="63.00000000000001" fill="none" stroke="#a86e39" stroke-dasharray="6 4" /><rect x="1015.0" y="259.55" width="84.00000000000001" height="56.00000000000001" fill="none" stroke="#a86e39" stroke-dasharray="6 4" /><path d="M1172.5,244.5 L1109.5,244.5 L1109.5,362.1 L1172.5,362.1 L1172.5,276.0 L1172.5,244.5 Z" fill-rule="evenodd" fill="#9dc9e2" fill-opacity="0.5" stroke="#367c9c" /><path d="M1109.5,379.6 L1109.5,411.1 L1172.5,411.1 L1172.5,362.1 L1109.5,362.1 L1109.5,379.6 Z" fill-rule="evenodd" fill="none" stroke="#886c9b" stroke-dasharray="4 3" /><rect x="1008.7" y="355.45000000000005" width="176.4" height="6.65" fill="none" stroke="#a54c37" stroke-dasharray="4 3" /><rect x="1096.9" y="355.45000000000005" width="88.2" height="6.65" fill="#b99374" stroke="#67472e" stroke-width="1.5" /><text x="945" y="465" class="small">門板與試線重疊：0.0855㎡</text><text x="45" y="545">三態使用同一片1260×95mm概念門板：全開停左，半開與關閉會阻斷900試線。不是只憑名義開口1200mm宣稱三態都可通行。</text><text x="45" y="583">本體名稱：橙色上方是共用洗衣備位，橙色下方是可選乾衣備位，綠色是降下晾衣含衣物外廓，灰色是原淨軟水與冷氣維修。細框是原廚房門前，虛線是取放操作帶。</text><text x="45" y="621">灰／橙／綠的原安裝備位均不改。全開門板到試線側緣180mm；平移包絡到乾衣機備位20mm、到降下衣物70mm，均不是實品安全或維修距離。</text><text x="45" y="659">先開到定位→人／推車進入→停妥並離開行程→再關門。門在移動時不得與通行同時安排；停電手開、操作力、可及高度與緊急釋放仍未知。</text><text x="45" y="697">上吊、地面無突出軌道只作討論目標，並非已證無門檻。門外地坪、遮雨、止水與排水不能拿室內900試線代替。</text><text x="45" y="735">前側協助取送備案保留；若後路不成立且要長輩自行使用，再做A入口／共享位置的整體重排。沒有藉此縮孝親房、把MDF移走或宣稱全程照護可達。</text></svg>
