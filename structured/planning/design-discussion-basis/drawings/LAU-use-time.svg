<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="輪用時間示例｜機器可並行，人工取放須錯開"><title>輪用時間示例｜機器可並行，人工取放須錯開</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}.card{font-size:19px;font-weight:700}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">輪用時間示例｜機器可並行，人工取放須錯開</text><text x="28" y="78">預先規劃／未採用｜批數、程序與分鐘均為示例，非實際衣量、原廠性能或容量核可。</text><text x="28" y="106">三棟1F共用一組、C2先暫不用保空間、A上層另留機位；原格局、機位與已驗3D保持。</text><text x="28" y="1157" class="small">本批 5c4d2c47ac309a04d9be0d7eb45abaea9bc179fc28d8e531e89621d2eb0f2d74</text><text x="28" y="1183" class="small">尚未選機、確認共享位置或驗證長輩操作。時程不等於衣物適用性、實際乾燥、照護、風水或施工核可。</text><line x1="260.0" y1="160" x2="260.0" y2="685" stroke="#c9d2c9" stroke-dasharray="4 4" /><text x="260.0" y="149" text-anchor="middle" class="small">0h</text><line x1="423.0769230769231" y1="160" x2="423.0769230769231" y2="685" stroke="#c9d2c9" stroke-dasharray="4 4" /><text x="423.0769230769231" y="149" text-anchor="middle" class="small">2h</text><line x1="586.1538461538462" y1="160" x2="586.1538461538462" y2="685" stroke="#c9d2c9" stroke-dasharray="4 4" /><text x="586.1538461538462" y="149" text-anchor="middle" class="small">4h</text><line x1="749.2307692307693" y1="160" x2="749.2307692307693" y2="685" stroke="#c9d2c9" stroke-dasharray="4 4" /><text x="749.2307692307693" y="149" text-anchor="middle" class="small">6h</text><line x1="912.3076923076924" y1="160" x2="912.3076923076924" y2="685" stroke="#c9d2c9" stroke-dasharray="4 4" /><text x="912.3076923076924" y="149" text-anchor="middle" class="small">8h</text><line x1="1075.3846153846155" y1="160" x2="1075.3846153846155" y2="685" stroke="#c9d2c9" stroke-dasharray="4 4" /><text x="1075.3846153846155" y="149" text-anchor="middle" class="small">10h</text><line x1="1238.4615384615386" y1="160" x2="1238.4615384615386" y2="685" stroke="#c9d2c9" stroke-dasharray="4 4" /><text x="1238.4615384615386" y="149" text-anchor="middle" class="small">12h</text><line x1="912.3076923076924" y1="160" x2="912.3076923076924" y2="685" stroke="#a64737" stroke-width="2" stroke-dasharray="7 4" /><text x="904.3076923076924" y="713" text-anchor="end" class="small">示例可用窗口 8小時</text><text x="35" y="230">只洗／仍待晾乾</text><rect x="260.0" y="205" width="20.384615384615387" height="40" fill="#efb76e" stroke="#fafbf8" /><rect x="280.38461538461536" y="205" width="122.3076923076923" height="40" fill="#87b2c6" stroke="#fafbf8" /><text x="341.53846153846155" y="231" text-anchor="middle" class="small">批1</text><rect x="402.69230769230774" y="205" width="20.384615384615387" height="40" fill="#efb76e" stroke="#fafbf8" /><rect x="423.0769230769231" y="205" width="20.384615384615387" height="40" fill="#efb76e" stroke="#fafbf8" /><rect x="443.46153846153845" y="205" width="122.3076923076923" height="40" fill="#87b2c6" stroke="#fafbf8" /><text x="504.61538461538464" y="231" text-anchor="middle" class="small">批2</text><rect x="565.7692307692307" y="205" width="20.384615384615387" height="40" fill="#efb76e" stroke="#fafbf8" /><rect x="586.1538461538462" y="205" width="20.384615384615387" height="40" fill="#efb76e" stroke="#fafbf8" /><rect x="606.5384615384615" y="205" width="122.3076923076923" height="40" fill="#87b2c6" stroke="#fafbf8" /><text x="667.6923076923077" y="231" text-anchor="middle" class="small">批3</text><rect x="728.8461538461538" y="205" width="20.384615384615387" height="40" fill="#efb76e" stroke="#fafbf8" /><text x="35" y="380">分機候選：洗衣</text><rect x="260.0" y="355" width="20.384615384615387" height="40" fill="#efb76e" stroke="#fafbf8" /><rect x="280.38461538461536" y="355" width="122.3076923076923" height="40" fill="#87b2c6" stroke="#fafbf8" /><text x="341.53846153846155" y="381" text-anchor="middle" class="small">批1</text><rect x="402.69230769230774" y="355" width="20.384615384615387" height="40" fill="#efb76e" stroke="#fafbf8" /><rect x="463.84615384615387" y="355" width="20.384615384615387" height="40" fill="#efb76e" stroke="#fafbf8" /><rect x="484.2307692307692" y="355" width="122.3076923076923" height="40" fill="#87b2c6" stroke="#fafbf8" /><text x="545.3846153846155" y="381" text-anchor="middle" class="small">批2</text><rect x="606.5384615384615" y="355" width="20.384615384615387" height="40" fill="#efb76e" stroke="#fafbf8" /><rect x="667.6923076923077" y="355" width="20.384615384615387" height="40" fill="#efb76e" stroke="#fafbf8" /><rect x="688.0769230769231" y="355" width="122.3076923076923" height="40" fill="#87b2c6" stroke="#fafbf8" /><text x="749.2307692307693" y="381" text-anchor="middle" class="small">批3</text><rect x="810.3846153846154" y="355" width="20.384615384615387" height="40" fill="#efb76e" stroke="#fafbf8" /><text x="35" y="480">分機候選：乾衣</text><rect x="423.0769230769231" y="455" width="163.0769230769231" height="40" fill="#87b2c6" stroke="#fafbf8" /><text x="504.61538461538464" y="481" text-anchor="middle" class="small">批1</text><rect x="586.1538461538462" y="455" width="20.384615384615387" height="40" fill="#efb76e" stroke="#fafbf8" /><rect x="626.9230769230769" y="455" width="163.0769230769231" height="40" fill="#87b2c6" stroke="#fafbf8" /><text x="708.4615384615385" y="481" text-anchor="middle" class="small">批2</text><rect x="790.0" y="455" width="20.384615384615387" height="40" fill="#efb76e" stroke="#fafbf8" /><rect x="830.7692307692308" y="455" width="163.0769230769231" height="40" fill="#87b2c6" stroke="#fafbf8" /><text x="912.3076923076924" y="481" text-anchor="middle" class="small">批3</text><rect x="993.8461538461539" y="455" width="20.384615384615387" height="40" fill="#efb76e" stroke="#fafbf8" /><text x="35" y="640">單機洗乾候選</text><rect x="260.0" y="615" width="20.384615384615387" height="40" fill="#efb76e" stroke="#fafbf8" /><rect x="280.38461538461536" y="615" width="285.3846153846154" height="40" fill="#87b2c6" stroke="#fafbf8" /><text x="423.0769230769231" y="641" text-anchor="middle" class="small">批1</text><rect x="565.7692307692307" y="615" width="20.384615384615387" height="40" fill="#efb76e" stroke="#fafbf8" /><rect x="586.1538461538462" y="615" width="20.384615384615387" height="40" fill="#efb76e" stroke="#fafbf8" /><rect x="606.5384615384615" y="615" width="285.3846153846154" height="40" fill="#87b2c6" stroke="#fafbf8" /><text x="749.2307692307693" y="641" text-anchor="middle" class="small">批2</text><rect x="891.9230769230769" y="615" width="20.384615384615387" height="40" fill="#efb76e" stroke="#fafbf8" /><rect x="912.3076923076924" y="615" width="20.384615384615387" height="40" fill="#efb76e" stroke="#fafbf8" /><rect x="932.6923076923077" y="615" width="285.3846153846154" height="40" fill="#87b2c6" stroke="#fafbf8" /><text x="1075.3846153846155" y="641" text-anchor="middle" class="small">批3</text><rect x="1218.076923076923" y="615" width="20.384615384615387" height="40" fill="#efb76e" stroke="#fafbf8" /><text x="260" y="280">只洗：6小時，乾燥時間未知</text><text x="260" y="535">分機：9小時15分，先假設一批只需一個乾衣程序</text><text x="45" y="770">三戶各一批只是示例；藍色是機器程序，橙色是人工裝／取／轉送，橙色彼此不可同時。指定固定間隔排法不是所有可能排程的最短時間。</text><text x="45" y="806">示例分鐘：洗衣裝15＋程序90＋取轉15；乾衣程序120＋取15；單機裝15＋洗乾程序210＋取15。這些不是市售型號性能，也未計三棟到達或使用者</text><text x="45" y="830">延誤。</text><text x="45" y="866">日常壓力例：三戶各一批：只洗＋晾衣6小時（只洗完）；洗衣＋獨立乾衣候選9小時15分；單台洗乾候選12小時</text><text x="45" y="902">床單集中壓力例：三戶各兩批：只洗＋晾衣12小時（只洗完）；洗衣＋獨立乾衣候選16小時45分；單台洗乾候選24小時</text><text x="45" y="938">床品適用、洗／乾kg容量不同或需分批時，以上排法必須重算；不能用洗衣機kg數代替乾衣機容量，更不能把只洗完當雨天已乾。</text></svg>
