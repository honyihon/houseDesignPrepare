<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" width="1400" height="1100" role="img" aria-labelledby="title desc"><title id="title">A01｜一樓公衛與孝親房：三案同尺寸比較</title><desc id="desc">ABC獨立深化比較，未採用。毫米局部模型座標，道路在上方；完整門組、結構及專業核對未完成。</desc><style>text{font-family:system-ui,sans-serif;font-size:17px;fill:#263e49} .title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:650}.small{font-size:14px}.tiny{font-size:12px}</style><rect x="0" y="0" width="1400" height="1100" fill="#fafbf8" /><text x="30" y="42" class="title">A01｜一樓公衛與孝親房：三案同尺寸比較</text><text x="30" y="78">深化比較／未採用｜單位mm；來源是概念模型，梁柱、完成面、商品及實際路徑待核。</text><text x="30" y="1053" class="small">來源 bc1e2175f13cff04…｜本批 dfde40d73ebcd01b…</text><text x="30" y="1077" class="small">原ABC／目前3D及正式產品回覆保留。圖上名義尺寸與方塊試排，不等於施工、照護、風水或搬運核可。</text><metadata>{"source_sha256": "bc1e2175f13cff043deeb725e190a3b59908810f58661d9efadec05efbca9a5e", "report_hash": "dfde40d73ebcd01bb0abd0839759b83ffd593a6146ef7f46ec013e53a1a69c6c", "adopted": false}</metadata><text x="30" y="117">取一樓中後段；上方接原客餐廳，左側MDF／廚房、後側工作陽台均不擴入。</text><text x="30" y="157" class="label">原控制：兩門900</text><rect x="178.48" y="204.728" width="158.72" height="198.912" fill="#e4eeee" stroke="#8fa19c" /><text x="184.88" y="223.928" class="small">公衛</text><rect x="303.28000000000003" y="209.848" width="28.8" height="38.4" fill="#b6cece" stroke="#708a8d" stroke-width="1" /><text x="305.84000000000003" y="223.928" class="tiny">盆</text><rect x="287.28000000000003" y="263.92544" width="44.800000000000004" height="28.8" fill="#b6cece" stroke="#708a8d" stroke-width="1" /><text x="289.84000000000003" y="278.00543999999996" class="tiny">WC</text><rect x="184.5216" y="321.72" width="76.79999999999997" height="76.8" fill="#b6cece" stroke="#708a8d" stroke-width="1" /><text x="187.0816" y="335.8" class="tiny">1200淋浴</text><line x1="178.48" y1="210.48796543999995" x2="178.48" y2="268.08796543999995" stroke="#397e70" stroke-width="3" /><rect x="106.8" y="403.64" width="230.4" height="241.28" fill="#edf1ec" stroke="#8fa19c" /><text x="113.2" y="422.84000000000003" class="small">孝親房</text><rect x="115.76" y="519.48" width="97.28" height="120.32000000000001" fill="#c5c5d4" stroke="#708a8d" stroke-width="1" /><text x="118.32000000000001" y="533.56" class="tiny">床</text><rect x="176.68800000000002" y="408.76" width="76.8" height="38.4" fill="#c5c5d4" stroke="#708a8d" stroke-width="1" /><text x="179.248" y="422.84000000000003" class="tiny">櫃</text><line x1="110.0000256" y1="403.64" x2="167.6000256" y2="403.64" stroke="#397e70" stroke-width="3" /><line x1="252.72" y1="644.9200000000001" x2="329.52" y2="644.9200000000001" stroke="#59a7c5" stroke-width="5" data-element-kind="candidate-window" /><rect x="91.44" y="204.728" width="87.04" height="67.072" fill="#edf1ec" stroke="#8fa19c" /><line x1="178.48" y1="210.48798822399996" x2="178.48" y2="268.08798822399996" stroke="#397e70" stroke-width="3" /><rect x="40.24" y="271.8" width="138.24" height="131.84" fill="#edf1ec" stroke="#8fa19c" /><line x1="46.0" y1="403.64" x2="103.60000000000001" y2="403.64" stroke="#397e70" stroke-width="3" /><line x1="110.00000511999998" y1="403.64" x2="167.60000512" y2="403.64" stroke="#397e70" stroke-width="3" /><text x="30" y="700" class="small">公衛／通道共邊1048；房／廳共邊1120。</text><text x="30" y="732" class="small">不能把原兩門直接標成1200。</text><text x="30" y="764" class="small">900減230假設＝670；框實品未知。</text><text x="30" y="796" class="small">床1520×1880、櫃1200×600保留。</text><text x="490" y="157" class="label">A1小改：浴1200／房1050</text><rect x="638.48" y="204.728" width="158.72" height="198.912" fill="#e4eeee" stroke="#8fa19c" /><text x="644.88" y="223.928" class="small">公衛</text><rect x="763.28" y="209.848" width="28.8" height="38.4" fill="#b6cece" stroke="#708a8d" stroke-width="1" /><text x="765.84" y="223.928" class="tiny">盆</text><rect x="747.28" y="263.92544" width="44.800000000000004" height="28.8" fill="#b6cece" stroke="#708a8d" stroke-width="1" /><text x="749.84" y="278.00543999999996" class="tiny">WC</text><rect x="715.28" y="321.72" width="76.8" height="76.8" fill="#b6cece" stroke="#708a8d" stroke-width="1" /><text x="717.84" y="335.8" class="tiny">1200淋浴</text><rect x="566.8" y="403.64" width="230.4" height="241.28" fill="#edf1ec" stroke="#8fa19c" /><text x="573.2" y="422.84000000000003" class="small">孝親房</text><rect x="575.76" y="519.48" width="97.28" height="120.32000000000001" fill="#c5c5d4" stroke="#708a8d" stroke-width="1" /><text x="578.32" y="533.56" class="tiny">床</text><rect x="636.688" y="408.76" width="76.8" height="38.4" fill="#c5c5d4" stroke="#708a8d" stroke-width="1" /><text x="639.248" y="422.84000000000003" class="tiny">櫃</text><line x1="712.72" y1="644.9200000000001" x2="789.52" y2="644.9200000000001" stroke="#59a7c5" stroke-width="5" data-element-kind="candidate-window" /><rect x="551.44" y="204.728" width="87.04" height="67.072" fill="#edf1ec" stroke="#8fa19c" /><rect x="500.24" y="271.8" width="138.24" height="131.84" fill="#edf1ec" stroke="#8fa19c" /><line x1="638.48" y1="273.08" x2="638.48" y2="349.88" stroke="#a15d26" stroke-width="4" /><line x1="568.08" y1="403.64" x2="635.28" y2="403.64" stroke="#a15d26" stroke-width="4" /><rect x="627.9200000000001" y="349.88" width="10.56" height="44.800000000000004" fill="none" stroke="#a15d26" stroke-dasharray="4 3" /><text x="490" y="700" class="small">浴室門改對後廳，1200淋浴移右。</text><text x="490" y="732" class="small">房門1050減230假設＝820，未達900。</text><text x="490" y="764" class="small">房間／浴室面積不變，床櫃不動。</text><text x="490" y="796" class="small">房門只在總扣框≤150時達900。</text><text x="950" y="157" class="label">A2優先深化：兩門1200</text><rect x="1116.4" y="204.728" width="140.8" height="198.912" fill="#e4eeee" stroke="#8fa19c" /><text x="1122.8" y="223.928" class="small">公衛</text><rect x="1221.04" y="212.088" width="28.8" height="38.4" fill="#b6cece" stroke="#708a8d" stroke-width="1" /><text x="1223.6" y="226.168" class="tiny">盆</text><rect x="1221.04" y="351.48" width="28.8" height="44.800000000000004" fill="#b6cece" stroke="#708a8d" stroke-width="1" /><text x="1223.6" y="365.56" class="tiny">WC</text><rect x="1123.76" y="319.48" width="76.8" height="76.8" fill="#b6cece" stroke="#708a8d" stroke-width="1" /><text x="1126.32" y="333.56" class="tiny">1200淋浴</text><rect x="1026.8" y="403.64" width="230.4" height="241.28" fill="#edf1ec" stroke="#8fa19c" /><text x="1033.2" y="422.84000000000003" class="small">孝親房</text><rect x="1034.8" y="519.48" width="97.28" height="120.32000000000001" fill="#c5c5d4" stroke="#708a8d" stroke-width="1" /><text x="1037.36" y="533.56" class="tiny">床</text><rect x="1211.44" y="408.76" width="38.4" height="76.8" fill="#c5c5d4" stroke="#708a8d" stroke-width="1" /><text x="1214.0" y="422.84000000000003" class="tiny">櫃</text><line x1="1172.72" y1="644.9200000000001" x2="1249.52" y2="644.9200000000001" stroke="#59a7c5" stroke-width="5" data-element-kind="candidate-window" /><rect x="1011.44" y="204.728" width="104.96000000000001" height="67.072" fill="#edf1ec" stroke="#8fa19c" /><rect x="960.24" y="271.8" width="156.16" height="131.84" fill="#edf1ec" stroke="#8fa19c" /><rect x="1033.2" y="403.64" width="76.8" height="94.08" fill="#c6deb6" fill-opacity="0.35" stroke="#709961" stroke-dasharray="4 3" /><rect x="1033.2" y="420.92" width="176.96" height="76.8" fill="#c6deb6" fill-opacity="0.35" stroke="#709961" stroke-dasharray="4 3" /><rect x="1133.3600000000001" y="420.92" width="76.8" height="158.72" fill="#c6deb6" fill-opacity="0.35" stroke="#709961" stroke-dasharray="4 3" /><circle cx="1171.76" cy="260.088" r="48.0" fill="none" stroke="#69935c" stroke-dasharray="5 3" /><circle cx="1201.84" cy="541.24" r="48.0" fill="none" stroke="#69935c" stroke-dasharray="5 3" /><rect x="1105.84" y="293.56" width="10.56" height="83.2" fill="#edd4b3" stroke="#a66a34" /><rect x="1110.0" y="408.76" width="83.2" height="10.56" fill="#edd4b3" stroke="#a66a34" /><line x1="1116.4" y1="216.76" x2="1116.4" y2="293.56" stroke="#a15d26" stroke-width="4" /><line x1="1033.2" y1="403.64" x2="1110.0" y2="403.64" stroke="#a15d26" stroke-width="4" /><text x="950" y="700" class="small">浴左界右移280：公衛少0.870㎡。</text><text x="950" y="732" class="small">房門共邊1400；兩門1200減230＝970。</text><text x="950" y="764" class="small">床左移15、櫃旋轉到右牆，容量不減。</text><text x="950" y="796" class="small">盆／迴轉、櫃／通行分時；非照護核可。</text><text x="30" y="885">A2有界試排：浴室1500轉位不碰列明器具；房內1200方塊路徑與床／櫃最近各20mm，偏緊。</text><text x="30" y="920">115mm內縮是假設；雖列明盒體未重疊，完整門框、門片／把手、壁面工差、輪椅轉向與救援仍須重核。</text><text x="30" y="955">淺藍線為原後窗候選，細分區線不另砌牆。公衛無合法外窗依據，排氣／補氣及房門床尾視線仍待核。</text></svg>
