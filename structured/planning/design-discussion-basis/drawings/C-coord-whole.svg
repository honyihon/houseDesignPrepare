<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="C一樓｜24級樓梯＋可關前室＋連續照護配置比較"><title>C一樓｜24級樓梯＋可關前室＋連續照護配置比較</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}.room{font-size:13px;font-weight:650}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">C一樓｜24級樓梯＋可關前室＋連續照護配置比較</text><text x="28" y="76">獨立完整1F比較／未採用｜原ABC、3D與上層不改；115mm完成預算，實際門組、照護及施工未核。</text><text x="28" y="1158" class="small">本批來源 bcf9de051c7600acef76f2c12a8631862cc53997edf15e4885dc086fdb51e1a1</text><text x="28" y="1182" class="small">只有指定名義幾何；不沿用舊passed，不當產品、風水、照護、救援、消防、法規或施工核可。</text><rect x="45.0" y="135.0" width="312.0" height="202.79999999999998" fill="#edf0e9" stroke="#82958f" stroke-width="0.8" stroke-dasharray="3 2" /><text x="201.0" y="236.39999999999998" text-anchor="middle" class="room">騎樓／接送</text><rect x="253.0" y="431.4" width="104.0" height="93.6" fill="#edf0e9" stroke="#82958f" stroke-width="0.8" stroke-dasharray="3 2" /><text x="305.0" y="478.2" text-anchor="middle" class="room">乾前室／鞋櫃</text><rect x="332.82" y="483.4" width="18.2" height="62.4" fill="#b9c9be" stroke="#3c6355" stroke-width="0.7" fill-opacity="1" /><rect x="45.0" y="504.2" width="124.8" height="76.96" fill="#edf0e9" stroke="#82958f" stroke-width="0.8" stroke-dasharray="3 2" /><text x="107.4" y="542.6800000000001" text-anchor="middle" class="room">客廳</text><rect x="139.38" y="479.24" width="46.8" height="93.6" fill="#b9c9be" stroke="#3c6355" stroke-width="0.7" fill-opacity="1" /><rect x="50.98" y="521.0999999999999" width="4.16" height="52.0" fill="#b9c9be" stroke="#3c6355" stroke-width="0.7" fill-opacity="0.55" /><rect x="50.98" y="539.04" width="57.199999999999996" height="31.2" fill="#b9c9be" stroke="#3c6355" stroke-width="0.7" fill-opacity="1" /><rect x="50.98" y="489.38" width="46.8" height="44.199999999999996" fill="#b9c9be" stroke="#3