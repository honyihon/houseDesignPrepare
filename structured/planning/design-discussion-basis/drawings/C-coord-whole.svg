ts="243.64,956.86 243.64,991.18 241.29999999999998,991.18 241.29999999999998,956.86 243.64,956.86" fill="#bb9474" stroke="#805534" stroke-width="0.7" /><polygon points="240.51999999999998,955.3 240.51999999999998,989.62 238.17999999999998,989.62 238.17999999999998,955.3 240.51999999999998,955.3" fill="#bb9474" stroke="#805534" stroke-width="0.7" /><polygon points="244.94,991.18 244.94,992.2199999999999 238.17999999999998,992.2199999999999 238.17999999999998,991.18 244.94,991.18" fill="#bb9474" stroke="#805534" stroke-width="0.7" /><polygon points="244.94,961.02 244.94,965.18 243.64,965.18 243.64,961.02 244.94,961.02" fill="#bb9474" stroke="#805534" stroke-width="0.7" /><line x1="45.0" y1="852.6" x2="232.2" y2="852.6" stroke="#607c73" stroke-width="1.7" /><line x1="232.2" y1="852.6" x2="232.2" y2="1008.5999999999999" stroke="#607c73" stroke-width="1.7" /><line x1="253.0" y1="431.4" x2="357.0" y2="431.4" stroke="#607c73" stroke-width="1.7" /><line x1="162.0" y1="852.6" x2="224.4" y2="852.6" stroke="#fafbf8" stroke-width="3" /><line x1="232.2" y1="892.9" x2="232.2" y2="955.3" stroke="#fafbf8" stroke-width="3" /><line x1="258.2" y1="431.4" x2="305.0" y2="431.4" stroke="#fafbf8" stroke-width="3" /><line x1="215.82" y1="291.0" x2="215.82" y2="478.2" stroke="#277c79" stroke-width="1.8" stroke-dasharray="4 3" /><line x1="215.82" y1="478.2" x2="227.0" y2="478.2" stroke="#277c79" stroke-width="1.8" stroke-dasharray="4 3" /><line x1="227.0" y1="478.2" x2="227.0" y2="611.3199999999999" stroke="#277c79" stroke-width="1.8" stroke-dasharray="4 3" /><line x1="227.0" y1="611.3199999999999" x2="201.0" y2="611.3199999999999" stroke="#277c79" stroke-width="1.8" stroke-dasharray="4 3" /><line x1="201.0" y1="611.3199999999999" x2="201.0" y2="808.4" stroke="#277c79" stroke-width="1.8" stroke-dasharray="4 3" /><line x1="201.0" y1="808.4" x2="193.2" y2="808.4" stroke="#277c79" stroke-width="1.8" stroke-dasharray="4 3" /><line x1="193.2" y1="808.4" x2="193.2" y2="894.1999999999999" stroke="#277c79" stroke-width="1.8" stroke-dasharray="4 3" /><line x1="193.2" y1="894.1999999999999" x2="182.79999999999998" y2="894.1999999999999" stroke="#277c79" stroke-width="1.8" stroke-dasharray="4 3" /><line x1="182.79999999999998" y1="894.1999999999999" x2="182.79999999999998" y2="1003.4" stroke="#277c79" stroke-width="1.8" stroke-dasharray="4 3" /><line x1="182.79999999999998" y1="1003.4" x2="182.79999999999998" y2="924.0999999999999" stroke="#277c79" stroke-width="1.8" stroke-dasharray="4 3" /><line x1="182.79999999999998" y1="924.0999999999999" x2="266.0" y2="924.0999999999999" stroke="#277c79" stroke-width="1.8" stroke-dasharray="4 3" /><line x1="227.0" y1="467.8" x2="281.6" y2="467.8" stroke="#aa7540" stroke-width="1.8" stroke-dasharray="4 3" /><line x1="281.6" y1="467.8" x2="281.6" y2="397.59999999999997" stroke="#aa7540" stroke-width="1.8" stroke-dasharray="4 3" /><line x1="281.6" y1="397.59999999999997" x2="296.41999999999996" y2="397.59999999999997" stroke="#aa7540" stroke-width="1.8" stroke-dasharray="4 3" /><text x="201.0" y="123.56" text-anchor="middle" class="small">前方／道路</text><text x="45" y="1090" class="small">6×17.63m研究框；騎樓深3.9m，非可建量簽證</text><text x="445" y="140">完整一樓同版對位；虛線區分用途，不是每條線都新增實牆。原騎樓、孝親房、套衛與後830通風帶不擴縮</text><text x="445" y="163">。</text><text x="445" y="198">原梯廳標籤17.424㎡重新分為梯段區11.616㎡、走道3.768㎡及後前室分攤2.040㎡；</text><text x="445" y="221">地面不重複相加。</text><text x="445" y="256">2200×4700梯段框、24級／270踏面、完整1000平台及上層到達維持；不是把實際樓梯縮小</text><text x="445" y="279">。</text><text x="445" y="314">900試線經新前置門後轉向，再沿1200名義走道到孝親房；與第一級名義餘150mm，實際扶手／梁</text><text x="445" y="337">板未核。</text><text x="445" y="372">四組門81態獨立核；門半開／關閉的反例保留。只有相關門全開才通指定方塊，不代表實際輪椅或門淨寬。</text><text x="445" y="407">訪客公衛不穿孝親房；900洞減230預算僅670mm。橘線為600方塊，公衛門片五金未核，沒有照</text><text x="445" y="430">護通過信用。</text><text x="445" y="465">保原18件1F家具／設備尺寸；電視轉右牆，部分物件移15～35mm、沙發10mm，完整操作帶保留</text><text x="445" y="488">。壁掛電視與低家具投影重疊不等於立體相撞。</text><text x="445" y="523">孝親房床頭靠左實牆；二／三樓浴廁投影不壓本版床體。臥室前段上方仍有浴廁，管線及完整家規未知。</text><text x="445" y="558">前後候選窗保留；廚房與梯旁無確認外側窗，不借共壁畫假窗。全熱／新風、兩衛排濕及關門補氣仍待合圖。</text><text x="445" y="593">2F唯一洗衣機、景觀洗曬、C-</text><text x="445" y="616">AC01及所有上層原樣保留。這張可討論配置，不能直接當施工或整合3D已採用。</text></svg>
