<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="D2 後熱泵：較好家務動線，後設備包絡緊"><title>D2 後熱泵：較好家務動線，後設備包絡緊</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}.room{font-size:14px;font-weight:650}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">D2 後熱泵：較好家務動線，後設備包絡緊</text><text x="28" y="76">獨立日常試排／未採用｜原24㎡目標與家規保留，原ABC／3D、RF與搬轎版本不變。未驗產品或真正梯段。</text><text x="28" y="1158" class="small">本批 885c3ea5f7d08ba72463499dcffa1e427be0c8b03453401b819534fa73b37808</text><text x="28" y="1182" class="small">指定面積、門態與方塊不是法規、風水、結構、通風、產品、輪椅或施工核可；未跑瀏覽器／WebGL。</text><rect x="45.0" y="165.0" width="900.0" height="585.0" fill="#e9efdd" stroke="#607c73" stroke-width="1.5" /><rect x="45.0" y="750.0" width="360.0" height="160.5" fill="#edf0e9" stroke="#687b80" /><rect x="405.0" y="750.0" width="540.0" height="160.5" fill="#f1ded6" stroke="#b88b7a" /><rect x="57.0" y="760.5" width="330.0" height="150.0" fill="#dae0e1" stroke="#869093" stroke-dasharray="5 3" /><rect x="237.0" y="760.5" width="150.0" height="150.0" fill="#bdcfc9" stroke="#3c7462" stroke-width="2" /><rect x="237.0" y="750.0" width="150.0" height="10.5" fill="#f0c17f" stroke="#bd834c" /><rect x="62.25" y="392.25" width="105.0" height="105.0" fill="#d3d8cf" stroke="#786749" stroke-dasharray="5 3" /><text x="114.75" y="444.75" text-anchor="middle" class="room">污氣區</text><rect x="535.5" y="182.25" width="135.0" height="202.5" fill="#d3d8cf" stroke="#786749" stroke-dasharray="5 3" /><rect x="535.5" y="182.25" width="135.0" height="52.5" fill="#9eafb2" stroke="#486650" /><text x="603.0" y="283.5" text-anchor="middle" class="room">代表槽1</text><rect x="792.75" y="182.25" width="135.0" height="202.5" fill="#d3d8cf" stroke="#786749" stroke-dasharray="5 3" /><rect x="792.75" y="182.25" width="135.0" height="52.5" fill="#9eafb2" stroke="#486650" /><text x="860.25" y="283.5" text-anchor="middle" class="room">代表槽2</text><rect x="577.5" y="423.0" width="105.0" height="270.0" fill="#d7e7ee" fill-opacity="0.75" stroke="#668b9a" stroke-dasharray="4 3" /><rect x="682.5" y="423.0" width="90.0" height="270.0" fill="#c7b99b" stroke="#796745" stroke-width="1.5" /><text x="727.5" y="558.0" text-anchor="middle" class="room">晾衣</text><rect x="62.25" y="249.75" width="180.0" height="105.0" fill="#d7e7ee" fill-opacity="0.75" stroke="#668b9a" stroke-dasharray="4 3" /><rect x="62.25" y="182.25" width="180.0" height="67.5" fill="#c7b99b" stroke="#796745" stroke-width="1.5" /><text x="152.25" y="216.0" text-anchor="middle" class="room">折衣</text><line x1="312.0" y1="840.0" x2="302.25" y2="840.0" stroke="#267f74" stroke-width="2" stroke-dasharray="5 4" /><line x1="302.25" y1="840.0" x2="302.25" y2="540.0" stroke="#267f74" stroke-width="2" stroke-dasharray="5 4" /><line x1="302.25" y1="540.0" x2="517.5" y2="540.0" stroke="#267f74" stroke-width="2" stroke-dasharray="5 4" /><line x1="517.5" y1="540.0" x2="630.0" y2="540.0" stroke="#267f74" stroke-width="2" stroke-dasharray="5 4" /><line x1="517.5" y1="540.0" x2="302.25" y2="540.0" stroke="#267f74" stroke-width="2" stroke-dasharray="5 4" /><line x1="302.25" y1="540.0" x2="302.25" y2="315.0" stroke="#267f74" stroke-width="2" stroke-dasharray="5 4" /><line x1="302.25" y1="315.0" x2="152.25" y2="315.0" stroke="#267f74" stroke-width="2" stroke-dasharray="5 4" /><polygon points="224.625,580.5 210.375,580.5 210.375,750.0 224.625,750.0 224.625,580.5" fill="#c79a73" stroke="#8a5a3b" stroke-width="1" stroke-dasharray="none" /><polygon points="342.39273522707396,635.1835364048344 332.31646359516566,625.1072647729261 212.46186418404585,744.9618641840458 222.53813581595415,755.0381358159542 342.39273522707396,635.1835364048344" fill="none" stroke="#8a5a3b" stroke-width="1" stroke-dasharray="4 3" /><polygon points="387.0,757.125 387.0,742.875 217.5,742.875 217.5,757.125 387.0,757.125" fill="none" stroke="#8a5a3b" stroke-width="1" stroke-dasharray="4 3" /><text x="45" y="135" class="small">前道路側／上方均為RF平面，不新增屋頂層</text><text x="246.0" y="889.5" class="small">保守只用右側到達平台</text><text x="472.5" y="840.0" class="room">祭祀保護投影：非日常通路</text><text x="990" y="145">原24㎡目標保留。設備／門扣除後輪廓17.1</text><text x="990" y="167">090㎡，再扣桌架機身15.4890㎡，均含</text><text x="990" y="189">共用通路，非合法淨平台。</text><text x="990" y="223">晾衣架1800×600、折衣桌1200×45</text><text x="990" y="245">0，兩案同尺寸；藍虛線區為操作預算，不當選定</text><text x="990" y="267">產品或曬被容量。</text><text x="990" y="301">原右鉸鏈全開仍卡外轉角；本輪保洞改左鉸鏈。綠</text><text x="990" y="323">虛線700mm全開才不受門阻，半開及關閉另表</text><text x="990" y="345">。</text><text x="990" y="379">1130洞扣框預算900，不等於全程900；</text><text x="990" y="401">平台與門中心偏65，指定900試線會超左側1</text><text x="990" y="423">5mm。</text><text x="990" y="457">操作分時：衣籃／衣物不得封門。D1折衣與到達</text><text x="990" y="479">共用；D2桌位較獨立，但後設備緊迫未解。</text><text x="990" y="513">黃色70mm銜接仍是假設。900若用來源22</text><text x="990" y="535">00mm全寬平台可另比容納，須確認可用平地；</text><text x="990" y="557">真實梯段、門檻與消防未核。</text><text x="40" y="1000">前平台不能直接連後曬衣；現行RF祭祀保護區只留必要巡檢。後空地、三樓天井不抵本層24㎡，也不放寬家規。</text><text x="40" y="1035">本圖只試日常平面。熱泵／冷氣熱風、污氣、香火與新風回吸、防颱固定、晾衣容量及設備拆換仍待實際資料。</text></svg>
