<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200" role="img" aria-label="P4｜保原管井、器具靠左與橫置茶水台"><title>P4｜保原管井、器具靠左與橫置茶水台</title><style>text{font:17px system-ui,sans-serif;fill:#263e49}.title{font-size:26px;font-weight:700}.small{font-size:13px}.room{font-size:13px;font-weight:650}</style><rect x="0" y="0" width="1400" height="1200" fill="#fafbf8" /><text x="28" y="40" class="title">P4｜保原管井、器具靠左與橫置茶水台</text><text x="28" y="76">P4僅2F前段獨立比較／未採用｜不改房界、井位與其他房間，不併原ABC／3D；排水及消防待核。</text><text x="28" y="1158" class="small">本批 7942e22e54fc8e0c33b7de181765634eb0ab7fa4bf52900f055cb85f73d7c4e7</text><text x="28" y="1182" class="small">指定靜態幾何／假設剖面不是法規、風水、結構、產品、照護或施工核可；未跑瀏覽器及轉圖。</text><rect x="55.0" y="155.0" width="474.15" height="287.09999999999997" fill="#dceff4" stroke="#537380" stroke-width="2" /><rect x="55.0" y="442.09999999999997" width="474.15" height="278.4" fill="#edf0df" stroke="#607c73" stroke-width="2" /><rect x="55.0" y="720.5" width="348.0" height="145.0" fill="#e4e6e0" stroke="#607c73" stroke-width="2" /><rect x="292.075" y="187.625" width="130.5" height="101.5" fill="none" stroke="#88a18c" stroke-dasharray="4 3" /><rect x="292.075" y="289.125" width="130.5" height="130.5" fill="#b9c9be" stroke="#3c6355" stroke-width="1" /><text x="357.325" y="354.375" text-anchor="middle" class="room">淋浴</text><rect x="173.175" y="171.675" width="101.5" height="101.5" fill="none" stroke="#88a18c" stroke-dasharray="4 3" /><rect x="71.675" y="171.675" width="101.5" height="65.25" fill="#b9c9be" stroke="#3c6355" stroke-width="1" /><text x="122.425" y="204.3" text-anchor="middle" class="room">馬桶</text><rect x="136.925" y="318.125" width="101.5" height="87.0" fill="none" stroke="#88a18c" stroke-dasharray="4 3" /><rect x="71.675" y="318.125" width="65.25" height="87.0" fill="#b9c9be" stroke="#3c6355" stroke-width="1" /><text x="104.3" y="361.625" text-anchor="middle" class="room">面盆</text><rect x="294.975" y="551.575" width="217.49999999999997" height="101.5" fill="none" stroke="#88a18c" stroke-dasharray="4 3" /><rect x="294.975" y="464.575" width="217.49999999999997" height="87.0" fill="#b9c9be" stroke="#3c6355" stroke-width="1" /><text x="403.72499999999997" y="508.075" text-anchor="middle" class="room">茶水槽候選</text><rect x="71.675" y="413.09999999999997" width="57.99999999999999" height="57.99999999999999" fill="#ca9d8b" stroke="#9c4634" stroke-width="1" /><rect x="71.675" y="471.09999999999997" width="101.5" height="130.5" fill="none" stroke="#945c33" stroke-width="2" stroke-dasharray="6 3" /><line x1="352.25" y1="155.0" x2="497.24999999999994" y2="155.0" stroke="#1a9ac0" stroke-width="5" /><line x1="142.0" y1="442.09999999999997" x2="305.85" y2="442.09999999999997" stroke="#fafbf8" stroke-width="5" /><rect x="313.09999999999997" y="442.09999999999997" width="95.69999999999999" height="6.5249999999999995" fill="#ad896b" stroke="#744d30" stroke-width="1" /><rect x="313.09999999999997" y="454.42499999999995" width="95.69999999999999" height="6.5249999999999995" fill="#ad896b" stroke="#744d30" stroke-width="1" /><line x1="221.75" y1="720.5" x2="385.59999999999997" y2="720.5" stroke="#fafbf8" stroke-width="5" /><rect x="118.8" y="701.65" width="95.69999999999999" height="6.5249999999999995" fill="#ad896b" stroke="#744d30" stroke-width="1" /><rect x="118.8" y="713.9749999999999" width="95.69999999999999" height="6.5249999999999995" fill="#ad896b" stroke="#744d30" stroke-width="1" /><line x1="303.67499999999995" y1="793.0" x2="303.67499999999995" y2="631.325" stroke="#286a84" stroke-width="2" stroke-dasharray="5 3" /><line x1="303.67499999999995" y1="631.325" x2="223.92499999999998" y2="631.325" stroke="#286a84" stroke-width="2" stroke-dasharray="5 3" /><line x1="223.92499999999998" y1="631.325" x2="223.92499999999998" y2="360.17499999999995" stroke="#286a84" stroke-width="2" stroke-dasharray="5 3" /><text x="55.0" y="128.9" class="small">朝街外窗候選；不能借側界開窗</text><text x="133.3" y="420.34999999999997" class="small">單一管井</text><text x="81.1" y="546.5" class="small">乾側檢修預留</text><text x="76.75" y="829.25" class="small">原梯核／平台，未改本體</text><text x="610" y="145">原900淋浴、700×450馬桶、600×450面盆及1500×600台全保尺寸；只</text><text x="610" y="168">重排2F四件座標，公衛門向左550mm。</text><text x="610" y="203">公衛5.2860、茶水5.1036㎡；保留完整門片活動後前室5.0640。主臥23.</text><text x="610" y="226">6651／後套衛6.1330㎡、兩窗方向及房界不動。</text><text x="610" y="261">單一400×400井仍x115／y1780，乾側700×900檢修原位保留；與Q3前</text><text x="610" y="284">KTV井相同投影，不移3F井或套用2F器具。</text><text x="610" y="319">900到達先繞橫台，公衛門全開後進入；五條試線另含馬桶、盆、淋浴與乾檢修。操作帶與通</text><text x="610" y="342">行分時，不當照護。</text><text x="610" y="377">公衛門活動距井35mm、疊包距台25mm；900試線離淋浴20、離茶水台40mm，成</text><text x="610" y="400">品五金與施工工差仍緊。</text><text x="610" y="435">馬桶背靠左牆，門中軸不穿本體；梁位、實際馬桶形體及全案風水未核。側牆不畫假外窗。</text><text x="610" y="470">WC／盆／茶水假排水線縮短，淋浴多710mm；最有利完整剖面僅4.4mm餘量，額外2</text><text x="610" y="493">5mm就失守，未解1F梯核落水。</text><text x="610" y="528">原12.753㎡前室內量體、井內容量、合法終端及3F匯流仍未核，P1／P2／P3與兩</text><text x="610" y="551">種搬轎版完整留，不指定門產品。</text><text x="55" y="960">五條試線皆按新配置重核，兩門全開才通900到達。</text><text x="55" y="998">茶水與檢修共享路面，維修時停止泡茶；不當同時兩人無衝突。</text><text x="55" y="1036" class="small">公衛門中軸穿馬桶本體：False；僅列明幾何，不是風水簽認。</text></svg>
