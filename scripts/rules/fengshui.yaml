      "source_doc": "傳統空間配置實務",
      "source_article": "風水條件收斂",
      "source_url": "https://example.com/fengshui-guideline"
    },
    {
      "rule_id": "FENG-002",
      "severity": "info",
      "check_type": "candidate_metric_min",
