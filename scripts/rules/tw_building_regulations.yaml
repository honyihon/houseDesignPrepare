{
  "rule_pack": "tw-building-regulations-v1",
  "domain": "building_regulation",
  "rules": [
    {
      "rule_id": "BR-TW-001",
      "severity": "critical",
      "check_type": "floor_attr_required",
      "attrs": ["data-floor-width-mm", "data-floor-depth-mm"],
      "message": "每個含平面格位的樓層應具備外框尺寸。",
      "fail_message": "樓層缺少必要的外框尺寸屬性。",
      "fix_hint": "在 .floor-plan 補上 data-floor-width-mm 與 data-floor-depth-mm。",
      "source_doc": "建築技術規則",
      "source_article": "建築設計施工編（通則）",
      "source_url": "https://law.moj.gov.tw/"
    },
    {
      "rule_id": "BR-TW-002",
      "severity": "warning",
      "check_type": "entry_per_floor",
      "message": "每層建議維持單一主入口標記。",
      "fail_message": "入口標記數量異常。",
      "fix_hint": "每層僅保留一個 data-entry=\"true\"。",
      "source_doc": "住宅設計實務",
      "source_article": "動線與出入口一致性",
      "source_url": "https://law.moj.gov.tw/"
    },
    {
      "rule_id": "BR-TW-003",
      "severity": "warning",
      "check_type": "door_width_min",
      "min_mm": 800,
      "message": "一般門寬建議不小於 800mm。",
      "fail_message": "發現門寬低於建議下限。",
      "fix_hint": "調整 data-door-mm 至合理範圍。",
      "source_doc": "建築技術規則",
      "source_article": "門廊與開口尺度",
      "source_url": "https://law.moj.gov.tw/"
    }
  ]
}
